<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>入試化学 頻出テーマ完成講座 理論編 ― 確認クイズ（全6日）</title>
<style>
  :root{
    --bg:#f4f6fa; --card:#ffffff; --ink:#1e2a3a; --sub:#5a6b80;
    --accent:#2563eb; --accent-soft:#e8eefc;
    --ok:#16a34a; --ok-soft:#e9f9ef;
    --ng:#dc2626; --ng-soft:#fdeaea;
    --border:#dde4ee;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;padding-bottom:60px;}
  header{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;padding:26px 16px 20px;text-align:center;}
  header h1{font-size:1.25rem;letter-spacing:.05em;}
  header p{font-size:.85rem;opacity:.85;margin-top:4px;}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:14px 10px;position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:1px solid var(--border);}
  .tab{border:1px solid var(--border);background:var(--card);color:var(--sub);border-radius:20px;padding:6px 14px;font-size:.85rem;cursor:pointer;transition:.15s;}
  .tab:hover{border-color:var(--accent);color:var(--accent);}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:bold;}
  .tab .badge{margin-left:5px;font-size:.75rem;}
  main{max-width:760px;margin:0 auto;padding:18px 14px;}
  .day-title{font-size:1.05rem;font-weight:bold;margin:10px 2px 4px;}
  .day-note{font-size:.82rem;color:var(--sub);margin:0 2px 14px;}
  .qcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 16px 12px;margin-bottom:14px;box-shadow:0 1px 3px rgba(30,42,58,.05);}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;}
  .qnum{font-weight:bold;color:var(--accent);font-size:.9rem;white-space:nowrap;}
  .qsrc{font-size:.72rem;color:var(--sub);text-align:right;}
  .qtext{font-size:.95rem;margin-bottom:10px;}
  .choices{display:flex;flex-direction:column;gap:7px;}
  .choice{display:flex;align-items:flex-start;gap:9px;border:1.5px solid var(--border);border-radius:9px;padding:9px 12px;cursor:pointer;font-size:.9rem;transition:.12s;background:#fff;}
  .choice:hover{border-color:var(--accent);background:var(--accent-soft);}
  .choice input{margin-top:5px;accent-color:var(--accent);flex-shrink:0;}
  .choice.selected{border-color:var(--accent);background:var(--accent-soft);}
  .graded .choice{cursor:default;pointer-events:none;}
  .choice.correct{border-color:var(--ok);background:var(--ok-soft);}
  .choice.wrong{border-color:var(--ng);background:var(--ng-soft);}
  .mark{font-size:.8rem;font-weight:bold;margin-top:6px;}
  .mark.ok{color:var(--ok);} .mark.ng{color:var(--ng);}
  .exp{margin-top:9px;background:#f8fafc;border-left:4px solid var(--accent);border-radius:0 8px 8px 0;padding:9px 12px;font-size:.85rem;color:#334155;display:none;}
  .graded .exp{display:block;}
  .exp b{color:var(--ink);}
  .actions{text-align:center;margin:22px 0 10px;}
  .btn{border:none;border-radius:26px;padding:12px 38px;font-size:1rem;font-weight:bold;cursor:pointer;transition:.15s;}
  .btn-grade{background:var(--accent);color:#fff;box-shadow:0 3px 10px rgba(37,99,235,.3);}
  .btn-grade:hover{background:#1d4ed8;}
  .btn-grade:disabled{background:#9db4dd;cursor:not-allowed;box-shadow:none;}
  .btn-reset{background:#fff;color:var(--sub);border:1px solid var(--border);margin-left:10px;padding:12px 24px;}
  .btn-reset:hover{color:var(--accent);border-color:var(--accent);}
  .result{display:none;background:var(--card);border:2px solid var(--accent);border-radius:14px;padding:18px;text-align:center;margin-bottom:18px;}
  .result.show{display:block;}
  .result .score{font-size:2rem;font-weight:bold;color:var(--accent);}
  .result .msg{font-size:.9rem;color:var(--sub);margin-top:4px;}
  .progress{font-size:.8rem;color:var(--sub);text-align:center;margin-bottom:10px;}
  sub,sup{line-height:0;}
  @media(max-width:480px){ header h1{font-size:1.05rem;} .qtext{font-size:.92rem;} }
</style>
</head>
<body>
<header>
  <h1>入試化学 頻出テーマ完成講座 理論編</h1>
  <p>確認クイズ 全6日・60問（4択）｜ 解答後に「採点する」で解説を表示</p>
</header>

<div class="tabs" id="tabs"></div>
<main id="main"></main>

<script>
// ===== 問題データ =====
// a: choices の正解インデックス（choices は表示時にシャッフル）
const DAYS = [
{
title:"第1日　反応速度",
note:"平均速度・速度式の決定・半減期・触媒と活性化エネルギー",
qs:[
{q:"過酸化水素の分解 2H<sub>2</sub>O<sub>2</sub> → 2H<sub>2</sub>O + O<sub>2</sub> で、[H<sub>2</sub>O<sub>2</sub>] が 100 秒間で 0.80 mol/L から 0.40 mol/L に減少した。この間の過酸化水素の平均の分解速度は？",
 src:"例題1 問2（岡山大 2026 改）",
 choices:["4.0×10<sup>−3</sup> mol/(L・s)","8.0×10<sup>−3</sup> mol/(L・s)","2.0×10<sup>−3</sup> mol/(L・s)","4.0×10<sup>−2</sup> mol/(L・s)"],a:0,
 exp:"v = −Δ[H<sub>2</sub>O<sub>2</sub>]/Δt = (0.80−0.40)/100 = <b>4.0×10<sup>−3</sup> mol/(L・s)</b>。"},
{q:"上の反応で v = k[H<sub>2</sub>O<sub>2</sub>] が成り立つ。反応開始から 100 秒までの平均の分解速度 4.0×10<sup>−3</sup> mol/(L・s) と、その間の濃度の平均値を用いると、速度定数 k は？",
 src:"例題1 問4（岡山大 2026 改）",
 choices:["6.7×10<sup>−3</sup> /s","5.0×10<sup>−3</sup> /s","1.0×10<sup>−2</sup> /s","6.7×10<sup>−2</sup> /s"],a:0,
 exp:"平均濃度 = (0.80+0.40)/2 = 0.60 mol/L。k = 4.0×10<sup>−3</sup>/0.60 ≒ <b>6.7×10<sup>−3</sup> /s</b>。"},
{q:"この分解反応では 100 秒ごとに濃度が半分になっていた（半減期 100 秒）。反応開始時 0.80 mol/L のとき、400 秒後の [H<sub>2</sub>O<sub>2</sub>] は？",
 src:"例題1 問5（岡山大 2026 改）",
 choices:["0.050 mol/L","0.10 mol/L","0.025 mol/L","0.20 mol/L"],a:0,
 exp:"400 秒 = 半減期4回分。0.80 → 0.40 → 0.20 → 0.10 → <b>0.050 mol/L</b>。"},
{q:"0.80 mol/L の過酸化水素水 500 mL 中の H<sub>2</sub>O<sub>2</sub> がすべて分解したとき、標準状態で発生する酸素の体積は？（2H<sub>2</sub>O<sub>2</sub> → 2H<sub>2</sub>O + O<sub>2</sub>）",
 src:"例題1 問6（岡山大 2026 改）",
 choices:["4.5 L","9.0 L","2.2 L","4.0 L"],a:0,
 exp:"H<sub>2</sub>O<sub>2</sub> = 0.80×0.500 = 0.40 mol。係数比より O<sub>2</sub> = 0.20 mol → 0.20×22.4 = <b>4.5 L</b>。"},
{q:"可逆反応 X + Y ⇌ 2Z で、正反応の速度式が v<sub>1</sub> = k<sub>1</sub>[X][Y]、逆反応が v<sub>2</sub> = k<sub>2</sub>[Z]<sup>2</sup> のとき、平衡定数 K を k<sub>1</sub>、k<sub>2</sub> で表すと？",
 src:"例題2 問2（広島大 2025 改）",
 choices:["K = k<sub>1</sub>/k<sub>2</sub>","K = k<sub>2</sub>/k<sub>1</sub>","K = k<sub>1</sub>×k<sub>2</sub>","K = k<sub>1</sub>−k<sub>2</sub>"],a:0,
 exp:"平衡時 v<sub>1</sub> = v<sub>2</sub> より k<sub>1</sub>[X][Y] = k<sub>2</sub>[Z]<sup>2</sup>。K = [Z]<sup>2</sup>/([X][Y]) = <b>k<sub>1</sub>/k<sub>2</sub></b>。"},
{q:"上の可逆反応に触媒を加えたとき、k<sub>1</sub>、k<sub>2</sub>、平衡定数 K はそれぞれどうなるか。",
 src:"例題2 問3（広島大 2025 改）",
 choices:["k<sub>1</sub>・k<sub>2</sub> は大きくなり、K は変わらない","k<sub>1</sub>・k<sub>2</sub>・K すべて大きくなる","k<sub>1</sub> のみ大きくなり、k<sub>2</sub>・K は変わらない","k<sub>1</sub>・k<sub>2</sub>・K すべて変わらない"],a:0,
 exp:"触媒は正・逆両方向の活性化エネルギーを同じだけ下げるので k<sub>1</sub> と k<sub>2</sub> は同じ割合で大きくなり、比 K = k<sub>1</sub>/k<sub>2</sub> は<b>不変</b>。"},
{q:"[A] を2倍にすると v が2倍、[B] を2倍にすると v が4倍になった。反応速度式は？",
 src:"類題1−1",
 choices:["v = k[A][B]<sup>2</sup>","v = k[A]<sup>2</sup>[B]","v = k[A][B]","v = k[A]<sup>2</sup>[B]<sup>2</sup>"],a:0,
 exp:"[A]2倍→v2倍で x = 1、[B]2倍→v4倍（2<sup>2</sup>）で y = 2。<b>v = k[A][B]<sup>2</sup></b>。次数は係数からではなく実験データから決める。"},
{q:"ある一次反応で、濃度が初濃度の 1/8 になるまでに 600 秒を要した。この反応の半減期は？",
 src:"類題1−2",
 choices:["200 秒","100 秒","300 秒","600 秒"],a:0,
 exp:"1/8 = (1/2)<sup>3</sup> なので半減期3回分 = 600 秒。半減期は <b>200 秒</b>。一次反応の半減期は濃度によらず一定。"},
{q:"温度が 10 K 上がるごとに反応速度が2倍になる反応がある。27 ℃から 57 ℃に上げると反応速度は何倍？",
 src:"類題1−3",
 choices:["8倍","6倍","4倍","16倍"],a:0,
 exp:"30 K 上昇 = 10 K×3 回 → 2<sup>3</sup> = <b>8倍</b>。「2倍が3回」であって「2×3 = 6倍」ではない点に注意。"},
{q:"反応に触媒を加えたとき、<u>変化しない</u>ものはどれか。",
 src:"第1日 頻出ポイント4",
 choices:["反応エンタルピー ΔH","活性化エネルギー","速度定数 k","反応速度"],a:0,
 exp:"触媒は活性化エネルギーの小さい別経路をつくる → E<sub>a</sub> は小さくなり k・速度は大きくなるが、反応物と生成物のエンタルピー差 <b>ΔH（と平衡定数 K）は変わらない</b>。"}
]},
{
title:"第2日　化学平衡 ― 気相平衡とルシャトリエの原理",
note:"平衡表・Kc と Kp・解離度と平均分子量・平衡移動",
qs:[
{q:"N<sub>2</sub> + 3H<sub>2</sub> ⇌ 2NH<sub>3</sub>。窒素 1.00 mol、水素 3.00 mol、アンモニア 0.60 mol を 1.00 L の容器に入れ一定温度に保つと、平衡時に NH<sub>3</sub> は 1.20 mol だった。Kc は？",
 src:"例題3 問2（茨城大 2025 改）",
 choices:["2.2×10<sup>−1</sup> L<sup>2</sup>/mol<sup>2</sup>","4.5 L<sup>2</sup>/mol<sup>2</sup>","2.2×10<sup>−1</sup> mol<sup>2</sup>/L<sup>2</sup>","1.4×10<sup>−1</sup> L<sup>2</sup>/mol<sup>2</sup>"],a:0,
 exp:"NH<sub>3</sub> が +0.60 mol → N<sub>2</sub> −0.30、H<sub>2</sub> −0.90。平衡時 [N<sub>2</sub>] = 0.70、[H<sub>2</sub>] = 2.10、[NH<sub>3</sub>] = 1.20。Kc = 1.20<sup>2</sup>/(0.70×2.10<sup>3</sup>) ≒ <b>2.2×10<sup>−1</sup> L<sup>2</sup>/mol<sup>2</sup></b>。単位は (mol/L)<sup>Δn</sup> = (mol/L)<sup>−2</sup>。"},
{q:"N<sub>2</sub> + 3H<sub>2</sub> ⇌ 2NH<sub>3</sub> について、圧平衡定数 Kp を Kc、R、T で表すと？",
 src:"例題3 問3（茨城大 2025 改）",
 choices:["Kp = Kc(RT)<sup>−2</sup>","Kp = Kc(RT)<sup>2</sup>","Kp = Kc(RT)","Kp = Kc/(RT)<sup>3</sup>"],a:0,
 exp:"Kp = Kc(RT)<sup>Δn</sup>。Δn = 2−(1+3) = −2 より <b>Kp = Kc(RT)<sup>−2</sup></b>。"},
{q:"N<sub>2</sub> + 3H<sub>2</sub> ⇌ 2NH<sub>3</sub>（発熱反応）が平衡状態にある。再び平衡に達したとき NH<sub>3</sub> が<u>増える</u>操作をすべて選ぶと？<br>(あ) 容積・温度一定で N<sub>2</sub> を注入　(い) 容積・温度一定で Ar を注入　(う) 温度一定で容積を小さくする　(え) 容積一定で温度を高くする　(お) 触媒を加える",
 src:"例題3 問4（茨城大 2025 改）",
 choices:["(あ)・(う)","(あ)・(い)・(う)","(う)・(え)","(あ)・(う)・(お)"],a:0,
 exp:"(あ) N<sub>2</sub> 追加 → 右へ。(う) 圧縮 → 分子数が減る右へ。(い) 体積一定の不活性気体添加は各濃度・分圧が変わらず<b>移動しない</b>。(え) 加熱は吸熱方向（左）へ。(お) 触媒は平衡を移動させない。"},
{q:"次のうち<u>正しい</u>記述の組合せは？<br>(ア) 平衡に達するまでの時間はあらゆる反応で同じ　(イ) 触媒を加えると平衡が移動する　(ウ) 溶質とその飽和溶液の混合物は温度一定なら溶解平衡にある　(エ) 純水の電離平衡では [H<sup>+</sup>] = [OH<sup>−</sup>]",
 src:"例題4 問1（静岡大 2024 改）",
 choices:["(ウ)・(エ)","(ア)・(ウ)","(イ)・(エ)","(ウ)のみ"],a:0,
 exp:"(ア) 平衡到達時間は反応や条件で異なる。(イ) 触媒は到達を速めるだけで平衡は移動しない。<b>(ウ)・(エ) が正しい</b>。"},
{q:"A + 3B ⇌ 2C の正反応の活性化エネルギーは 326 kJ/mol、逆反応は 418 kJ/mol。正反応の ΔH は？",
 src:"例題4 問3（静岡大 2024 改）",
 choices:["−92 kJ/mol","+92 kJ/mol","−744 kJ/mol","+744 kJ/mol"],a:0,
 exp:"ΔH = E<sub>a</sub>(正) − E<sub>a</sub>(逆) = 326 − 418 = <b>−92 kJ/mol</b>（発熱反応）。右へ動かすには温度を下げる。"},
{q:"H<sub>2</sub> 1.00 mol と I<sub>2</sub> 1.00 mol を体積一定の容器で反応させると H<sub>2</sub> + I<sub>2</sub> ⇌ 2HI の平衡に達し、HI が 1.60 mol 生成した。Kc は？",
 src:"類題2−1",
 choices:["64","8","16","32"],a:0,
 exp:"平衡時 H<sub>2</sub> = I<sub>2</sub> = 0.20 mol、HI = 1.60 mol。Kc = 1.60<sup>2</sup>/0.20<sup>2</sup> = <b>64</b>。分子数が変わらない反応なので V が消えて無単位。"},
{q:"N<sub>2</sub>O<sub>4</sub> 1.00 mol を容器に入れて 320 K に保つと N<sub>2</sub>O<sub>4</sub> ⇌ 2NO<sub>2</sub> の平衡に達し、総物質量は 1.25 mol になった。解離度 α は？",
 src:"類題2−2",
 choices:["0.25","0.20","0.50","0.125"],a:0,
 exp:"x mol 解離すると総量 = (1.00−x)+2x = 1.00+x = 1.25 → x = 0.25。<b>α = 0.25</b>。"},
{q:"上の平衡（総物質量 1.25 mol、全圧 1.0×10<sup>5</sup> Pa）における圧平衡定数 Kp は？",
 src:"類題2−2",
 choices:["2.7×10<sup>4</sup> Pa","6.4×10<sup>4</sup> Pa","1.0×10<sup>5</sup> Pa","2.7×10<sup>3</sup> Pa"],a:0,
 exp:"p(N<sub>2</sub>O<sub>4</sub>) = (0.75/1.25)×10<sup>5</sup> = 6.0×10<sup>4</sup> Pa、p(NO<sub>2</sub>) = 4.0×10<sup>4</sup> Pa。Kp = (4.0×10<sup>4</sup>)<sup>2</sup>/(6.0×10<sup>4</sup>) ≒ <b>2.7×10<sup>4</sup> Pa</b>。"},
{q:"上の平衡混合気体（N<sub>2</sub>O<sub>4</sub> = 92、総物質量 1.25 mol）の平均分子量は？",
 src:"類題2−2",
 choices:["74","92","46","84"],a:0,
 exp:"質量は 92 g のまま不変で総物質量 1.25 mol → 92/1.25 = <b>74</b>。M = M<sub>0</sub>/(1+α) でも同じ。"},
{q:"C(固) + CO<sub>2</sub>(気) ⇌ 2CO(気)（吸熱反応）の平衡について、温度一定のまま圧縮すると平衡は？",
 src:"類題2−3",
 choices:["左に移動する","右に移動する","移動しない","固体があるので判断できない"],a:0,
 exp:"圧縮 → 気体分子数が減る方向へ。気体は右辺 2 分子・左辺 1 分子（固体 C は数えない）なので<b>左へ移動</b>。なお Kp = p(CO)<sup>2</sup>/p(CO<sub>2</sub>) にも固体は含めない。"}
]},
{
title:"第3日　酸・塩基の電離平衡 ― pH・緩衝液・塩の加水分解",
note:"√(cKa) の近似・緩衝液・加水分解の3つの型で処理する",
qs:[
{q:"0.10 mol/L 酢酸水溶液（Ka = 2.7×10<sup>−5</sup> mol/L、log<sub>10</sub>2.7 = 0.43、α ≪ 1）の pH は？",
 src:"例題5 問2（茨城大 2024 改）",
 choices:["2.8","3.0","2.4","3.4"],a:0,
 exp:"[H<sup>+</sup>] = √(cKa) = √(2.7×10<sup>−6</sup>)。pH = 3 − (1/2)log2.7 = 3 − 0.215 ≒ <b>2.8</b>。"},
{q:"上の酢酸水溶液 100 mL に 0.10 mol/L NaOH 水溶液 50 mL を加えた混合溶液の pH は？",
 src:"例題5 問3（茨城大 2024 改）",
 choices:["4.6","2.8","7.0","5.6"],a:0,
 exp:"酢酸 10 mmol の半分が中和され、酢酸 5.0 mmol＋酢酸ナトリウム 5.0 mmol の緩衝液に。[H<sup>+</sup>] = Ka×(酸/塩) = 2.7×10<sup>−5</sup>。pH = 5 − 0.43 ≒ <b>4.6</b>。半分中和 → pH = pKa の典型。"},
{q:"濃度 c mol/L の弱酸で電離度 α が1に比べて十分小さいとき、Ka = cα<sup>2</sup>/(1−α) はどう近似できるか。",
 src:"例題6 問1（岡山大 2024 改）",
 choices:["Ka ≒ cα<sup>2</sup>","Ka ≒ cα","Ka ≒ c<sup>2</sup>α<sup>2</sup>","Ka ≒ α<sup>2</sup>/c"],a:0,
 exp:"α ≪ 1 なら 1−α ≒ 1 より <b>Ka ≒ cα<sup>2</sup></b>。ここから α = √(Ka/c)、[H<sup>+</sup>] = √(cKa)。導出過程自体が穴埋めで頻出。"},
{q:"酢酸水溶液に酢酸ナトリウムを溶かすと、CH<sub>3</sub>COOH ⇌ CH<sub>3</sub>COO<sup>−</sup> + H<sup>+</sup> の平衡はどうなるか。またこの現象を何というか。",
 src:"例題6 問2（岡山大 2024 改）",
 choices:["左へ移動する・共通イオン効果","右へ移動する・共通イオン効果","左へ移動する・緩衝作用","移動しない・希釈律"],a:0,

// ===== 状態 =====
let current = 0;
const state = DAYS.map(d => ({ answers: Array(d.qs.length).fill(null), order: d.qs.map(q => shuffle([...q.choices.keys()])), graded: false, score: 0 }));

function shuffle(arr){
  for(let i = arr.length-1; i > 0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

// ===== 描画 =====
const tabsEl = document.getElementById('tabs');
const mainEl = document.getElementById('main');

function renderTabs(){
  tabsEl.innerHTML = '';
  DAYS.forEach((d,i)=>{
    const b = document.createElement('button');
    b.className = 'tab' + (i===current ? ' active':'');
    const st = state[i];
    b.innerHTML = `第${i+1}日` + (st.graded ? `<span class="badge">${st.score}/${d.qs.length}</span>` : '');
    b.onclick = ()=>{ current = i; render(); window.scrollTo({top:0}); };
    tabsEl.appendChild(b);
  });
}

function answeredCount(){ return state[current].answers.filter(a=>a!==null).length; }

function render(){
  renderTabs();
  const day = DAYS[current];
  const st = state[current];
  mainEl.innerHTML = '';

  const h = document.createElement('div');
  h.innerHTML = `<div class="day-title">${day.title}</div><div class="day-note">${day.note}（全${day.qs.length}問）</div>`;
  mainEl.appendChild(h);

  const resultBox = document.createElement('div');
  resultBox.className = 'result' + (st.graded ? ' show':'');
  if(st.graded){
    const pct = Math.round(st.score/day.qs.length*100);
    const msg = pct===100 ? '満点！完璧です' : pct>=80 ? 'よくできています。間違えた問題の解説を確認しましょう' : pct>=50 ? 'もう一歩。解説を読んでから再挑戦を' : '頻出ポイント整理に戻ってから再挑戦しましょう';
    resultBox.innerHTML = `<div class="score">${st.score} / ${day.qs.length}</div><div class="msg">正答率 ${pct}%　${msg}</div>`;
  }
  mainEl.appendChild(resultBox);

  const prog = document.createElement('div');
  prog.className = 'progress';
  prog.id = 'prog';
  mainEl.appendChild(prog);

  day.qs.forEach((q,qi)=>{
    const card = document.createElement('div');
    card.className = 'qcard' + (st.graded ? ' graded':'');
    let html = `<div class="qhead"><span class="qnum">問${qi+1}</span><span class="qsrc">${q.src}</span></div><div class="qtext">${q.q}</div><div class="choices">`;
    st.order[qi].forEach(ci=>{
      const sel = st.answers[qi]===ci;
      let cls = 'choice' + (sel ? ' selected':'');
      if(st.graded){
        if(ci===q.a) cls += ' correct';
        else if(sel) cls += ' wrong';
      }
      html += `<label class="${cls}"><input type="radio" name="q${qi}" ${sel?'checked':''} ${st.graded?'disabled':''} onchange="pick(${qi},${ci})"><span>${q.choices[ci]}</span></label>`;
    });
    html += `</div>`;
    if(st.graded){
      const ok = st.answers[qi]===q.a;
      html += `<div class="mark ${ok?'ok':'ng'}">${ok?'○ 正解':'× 不正解'}</div>`;
      html += `<div class="exp"><b>解説：</b>${q.exp}</div>`;
    }
    card.innerHTML = html;
    mainEl.appendChild(card);
  });

  const act = document.createElement('div');
  act.className = 'actions';
  if(!st.graded){
    act.innerHTML = `<button class="btn btn-grade" id="gradeBtn" onclick="grade()">採点する</button>`;
  } else {
    act.innerHTML = `<button class="btn btn-grade" onclick="resetDay()">もう一度挑戦する</button>`;
  }
  mainEl.appendChild(act);
  updateProg();
}

function updateProg(){
  const el = document.getElementById('prog');
  const st = state[current];
  if(!el) return;
  if(st.graded){ el.textContent = ''; return; }
  el.textContent = `解答済み ${answeredCount()} / ${DAYS[current].qs.length} 問`;
  const btn = document.getElementById('gradeBtn');
  if(btn) btn.disabled = answeredCount() < DAYS[current].qs.length;
}

window.pick = function(qi,ci){
  state[current].answers[qi] = ci;
  document.querySelectorAll(`input[name="q${qi}"]`).forEach(inp=>{
    inp.closest('.choice').classList.toggle('selected', inp.checked);
  });
  updateProg();
};

window.grade = function(){
  const st = state[current];
  const day = DAYS[current];
  st.score = day.qs.reduce((s,q,i)=> s + (st.answers[i]===q.a ? 1:0), 0);
  st.graded = true;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
};

window.resetDay = function(){
  const day = DAYS[current];
  state[current] = { answers: Array(day.qs.length).fill(null), order: day.qs.map(q => shuffle([...q.choices.keys()])), graded:false, score:0 };
  render();
  window.scrollTo({top:0});
};

render();
</script>
