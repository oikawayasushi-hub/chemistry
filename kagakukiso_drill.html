<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>化学基礎ドリル｜共通テスト7割突破トレーニング</title>
<style>
:root{
  --y1:#ffd94d; --y2:#ffb724; --y3:#f59005; --y-soft:#fff4d6; --y-pale:#fffaee;
  --ink:#7a5200;      /* 見出し・強調（黄色の上でも読める濃茶 */
  --ink-d:#573a00;
  --ok:#2f9e44; --ok-bg:#eaf8ec;
  --ng:#e03131; --ng-bg:#fdeeee;
  --bg:#fffcf2; --card:#ffffff; --line:#f2e4c2; --tx:#3d3526; --tx2:#8a7c62;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  background:var(--bg); color:var(--tx); line-height:1.7; font-size:16px;
}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 60px}
header{background:linear-gradient(135deg,#ffe066,#ffb724 60%,#ffa011);color:var(--ink-d);padding:18px 14px 16px;margin-bottom:18px;box-shadow:0 2px 8px rgba(245,144,5,.18)}
header .inner{max-width:720px;margin:0 auto}
header h1{margin:0;font-size:19px;letter-spacing:.02em;font-weight:800}
header p{margin:4px 0 0;font-size:12px;opacity:.8;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 6px rgba(200,150,40,.09)}
h2{font-size:16px;color:var(--ink);margin:0 0 12px;padding-bottom:8px;border-bottom:3px solid var(--y2);display:flex;align-items:center;gap:8px;font-weight:800}
h3{font-size:14px;color:var(--ink);margin:16px 0 8px}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:14px 16px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;text-align:left;transition:transform .08s,box-shadow .15s}
.btn:active{transform:scale(.985)}
.btn-main{background:linear-gradient(135deg,#ffd233,#ffab14);color:var(--ink-d);box-shadow:0 3px 0 #e08c00}
.btn-sub{background:#fff;color:var(--ink);border:2.5px solid var(--y2)}
.btn-ghost{background:var(--y-soft);color:var(--ink);font-weight:700}
.btn small{display:block;font-size:11.5px;font-weight:500;opacity:.8;margin-top:3px;line-height:1.5}
.mode-grid{display:grid;gap:10px}
.cats{display:grid;grid-template-columns:1fr;gap:8px}
.catrow{display:flex;align-items:center;gap:10px;background:var(--y-pale);border:1px solid var(--line);border-radius:11px;padding:10px 12px;cursor:pointer}
.catrow:active{background:var(--y-soft)}
.catrow .nm{flex:1;font-size:13.5px;font-weight:800;color:var(--ink)}
.catrow .wt{font-size:10.5px;color:var(--tx2);font-weight:500;display:block;margin-top:1px}
.bar{width:74px;height:8px;background:#f3e9d2;border-radius:4px;overflow:hidden;flex:none}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffcf3a,#f59005);border-radius:4px;transition:width .4s}
.pct{width:44px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;color:var(--tx2);flex:none;font-weight:700}
.hud{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.chip{font-size:11.5px;background:var(--y-soft);color:var(--ink);border-radius:20px;padding:4px 11px;font-weight:800}
.chip.combo{background:linear-gradient(135deg,#ffc21a,#f76707);color:#fff}
.chip.fire{animation:pulse .5s ease}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.16)}100%{transform:scale(1)}}
.qmeta{font-size:11.5px;color:var(--tx2);margin-bottom:6px}
.qtext{font-size:16px;font-weight:700;margin:0 0 14px;line-height:1.8}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:2.5px solid var(--line);border-radius:11px;padding:12px 13px;font-size:15px;font-family:inherit;color:var(--tx);cursor:pointer;line-height:1.6}
.opt:active{background:var(--y-pale)}
.opt .no{flex:none;width:23px;height:23px;border-radius:50%;background:var(--y-soft);color:var(--ink);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .no{background:var(--ok);color:#fff}
.opt.ng{border-color:var(--ng);background:var(--ng-bg)}
.opt.ng .no{background:var(--ng);color:#fff}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;border-radius:11px;padding:13px 14px;font-size:13.5px;line-height:1.8}
.fb.ok{background:var(--ok-bg);border-left:5px solid var(--ok)}
.fb.ng{background:var(--ng-bg);border-left:5px solid var(--ng)}
.fb .hd{font-weight:800;font-size:14px;margin-bottom:5px}
.fb.ok .hd{color:var(--ok)}
.fb.ng .hd{color:var(--ng)}
.score{text-align:center;padding:8px 0 4px}
.score .big{font-size:48px;font-weight:800;color:var(--y3);line-height:1.1;font-variant-numeric:tabular-nums}
.score .big span{font-size:20px;font-weight:700;color:var(--tx2)}
.score .judge{display:inline-block;margin-top:8px;padding:6px 18px;border-radius:20px;font-size:13px;font-weight:800}
.judge.pass{background:var(--ok);color:#fff}
.judge.near{background:linear-gradient(135deg,#ffc21a,#f59005);color:var(--ink-d)}
.judge.fail{background:#efe6d2;color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
th{background:var(--y-pale);color:var(--ink);font-size:12px;font-weight:800}
td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.note{font-size:12px;color:var(--tx2);line-height:1.8}
.note b{color:var(--ink)}
.hide{display:none!important}
.rowbtns{display:grid;gap:9px;margin-top:14px}
.tag{display:inline-block;font-size:10.5px;background:var(--y-soft);color:var(--ink);border-radius:5px;padding:2px 7px;margin-right:5px;font-weight:800}
.big-timer{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink);background:var(--y-soft);border-radius:20px;padding:3px 11px}
.big-timer.over{color:#fff;background:var(--ng)}
.rvlist{font-size:13px}
.rvitem{border-bottom:1px solid var(--line);padding:10px 0}
.rvitem:last-child{border-bottom:none}
.rvq{font-weight:700;margin-bottom:3px}
.rva{color:var(--tx2);font-size:12px}
/* --- 第2問（リード文・図表） --- */
.lead{background:var(--y-pale);border:1px solid var(--line);border-left:5px solid var(--y2);border-radius:10px;padding:13px 14px;font-size:13.5px;line-height:1.9;margin-bottom:12px}
.lead b{color:var(--ink)}
.figbox{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 8px;margin:0 0 14px;overflow-x:auto;text-align:center}
.figbox svg{max-width:100%;height:auto;display:block;margin:0 auto}
.figbox table{font-size:12px}
.figbox th{white-space:nowrap;font-size:11.5px}
.figbox td{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.figbox caption{caption-side:top;text-align:center}
/* --- 見直しナビ --- */
.opt.sel{border-color:var(--y3);background:#fff6de}
.opt.sel .no{background:var(--y3);color:#fff}
.navrow{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:8px;margin-top:14px}
.navrow .btn{text-align:center;padding:11px 6px;font-size:13px}
.navrow .btn[disabled]{opacity:.4;cursor:default}
.navgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:4px}
.navcell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 2px;border-radius:10px;border:2px solid var(--line);background:#fff;cursor:pointer;font-family:inherit;color:var(--tx2)}
.navcell b{font-size:11.5px;color:var(--ink)}
.navcell span{font-size:13px;font-weight:800}
.navcell.done{border-color:var(--y2);background:var(--y-soft)}
.navcell.done span{color:var(--y3)}
.navcell.flag{border-color:#f76707;background:#fff1e2}
.revnote{margin-top:7px;font-size:12px;color:var(--tx2);border-top:1px dashed var(--line);padding-top:6px}
/* --- ホーム：3ステップ構成 --- */
.rec{background:linear-gradient(135deg,#fff8e4,#ffeec2);border:2px solid var(--y2)}
.rec-lb{font-size:11.5px;font-weight:800;color:var(--ink);letter-spacing:.08em;margin-bottom:8px}
.prog{display:grid;gap:6px;margin-top:12px}
.pill{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:#fff;color:var(--tx2);border:1.5px solid var(--line);line-height:1.4}
.pill .lb{font-size:11.5px;font-weight:800;white-space:nowrap}
.pill .vl{font-size:11.5px;font-weight:700;text-align:right}
.pill.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.pill.pre{background:#fff;color:var(--ink);border-color:var(--y3);border-style:dashed}
.prognote{font-size:10.5px;color:var(--ink);opacity:.8;margin:8px 0 0;line-height:1.6}
.stepnum{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--y2);color:var(--ink-d);font-size:13px;font-weight:800;margin-right:2px;flex:none}
.card.dim{opacity:.72}
.card.dim h2{border-bottom-color:var(--line)}
.catcard{display:flex;align-items:center;gap:10px;padding:12px 13px;border:2px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;transition:transform .08s}
.catcard:active{transform:scale(.99);background:var(--y-pale)}
.catcard.l0{border-style:dashed}
.catcard.l2{border-color:#8ed4a3;background:#f4fbf6}
.cc-main{flex:1;min-width:0}
.cc-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cc-nm{font-size:14px;font-weight:800;color:var(--ink)}
.cc-wt{font-size:10.5px;color:var(--tx2);margin:2px 0 7px}
.cc-bar{display:flex;align-items:center;gap:8px}
.cc-bar .bar{flex:1;width:auto}
.cc-n{font-size:10.5px;color:var(--tx2);flex:none;width:38px;text-align:right}
.cc-go{color:var(--y3);font-size:15px;font-weight:800;flex:none}
.badge{font-size:10px;font-weight:800;padding:2px 9px;border-radius:20px;white-space:nowrap}
.badge.b0{background:#f1ead9;color:var(--tx2)}
.badge.b1{background:var(--y-soft);color:var(--ink)}
.badge.b2{background:var(--ok);color:#fff}
.setlist{border:1px solid var(--line);border-radius:11px;overflow:hidden}
.setrow{display:flex;gap:10px;align-items:center;padding:10px 11px;border-bottom:1px solid var(--line);cursor:pointer;background:#fff}
.setrow:last-child{border-bottom:none}
.setrow:active{background:var(--y-pale)}
.setrow .n{width:23px;height:23px;border-radius:50%;background:var(--y-soft);color:var(--ink);font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.setrow.done .n{background:var(--ok);color:#fff}
.setrow .t{flex:1;font-size:13px;font-weight:700;color:var(--ink);line-height:1.5}
.setrow .r{font-size:10.5px;color:var(--tx2);flex:none;white-space:nowrap}
footer{text-align:center;font-size:11px;color:var(--tx2);padding:20px 10px 0}
</style>
</head>
<body>
<header><div class="inner">
  <h1>化学基礎ドリル</h1>
  <p>共通テスト［化学基礎］50点／7割突破トレーニング</p>
</div></header>
<div class="wrap">
  <div id="app"></div>
  <footer>共通テスト本試験 2021〜2026年度の出題傾向をもとに構成／全<span id="qcount"></span>問</footer>
</div>
<script>
const BANK = [
// 分野1 物質の構成と分離
{c:1,q:"混合物であるものはどれか。",a:["塩化ナトリウム","空気","オゾン","ダイヤモンド"],k:1,e:"空気は窒素・酸素・アルゴンなど複数の物質が混ざった混合物。他の3つはすべて純物質。"},
{c:1,q:"単体であるものはどれか。",a:["水","二酸化炭素","黒鉛","塩酸"],k:2,e:"黒鉛は炭素Cだけからなる単体。水と二酸化炭素は化合物、塩酸は塩化水素の水溶液なので混合物。"},
{c:1,q:"化合物であるものはどれか。",a:["アンモニア","硫黄","石油","鉄"],k:0,e:"アンモニアNH₃は窒素と水素の化合物。硫黄と鉄は単体、石油は混合物。"},
{c:1,q:"互いに同素体の関係にある組合せはどれか。",a:["水と氷","酸素とオゾン","塩素と塩化物イオン","水素と重水素"],k:1,e:"同素体は同じ元素からなる単体で性質が異なるもの。O₂とO₃は酸素の同素体。水と氷は状態の違い、水素と重水素は同位体。"},
{c:1,q:"同素体が存在しない元素はどれか。",a:["硫黄","炭素","リン","窒素"],k:3,e:"同素体をもつ代表元素はS・C・O・Pの4つ(スコップと覚える)。窒素は含まれない。"},
{c:1,q:"海水から純粋な水を得るのに適した操作はどれか。",a:["ろ過","蒸留","再結晶","抽出"],k:1,e:"沸点の差を利用して溶媒を気化させ、冷却して回収する操作が蒸留。"},
{c:1,q:"砂の混じったヨウ素から、ヨウ素だけを取り出す操作はどれか。",a:["昇華法","ろ過","分留","クロマトグラフィー"],k:0,e:"ヨウ素は加熱すると固体から直接気体になる(昇華する)ため、昇華法で分離できる。"},
{c:1,q:"泥水から泥の粒子を取り除く操作はどれか。",a:["蒸留","ろ過","再結晶","昇華法"],k:1,e:"液体に溶けていない固体をろ紙で分離する操作がろ過。"},
{c:1,q:"少量の塩化ナトリウムを含む硝酸カリウムから、純粋な硝酸カリウムを得る操作はどれか。",a:["抽出","ろ過","再結晶","蒸留"],k:2,e:"温度による溶解度の差を利用して、目的の物質だけを結晶として取り出す操作が再結晶。"},
{c:1,q:"茶葉に湯を加えて成分を溶かし出す操作はどれか。",a:["抽出","分留","昇華法","ろ過"],k:0,e:"適当な溶媒に溶ける成分だけを溶かし出す操作が抽出。"},
{c:1,q:"原油をガソリン・灯油・軽油などに分ける操作はどれか。",a:["再結晶","分留","抽出","ろ過"],k:1,e:"沸点の異なる複数の成分を、蒸留を繰り返して順に分ける操作が分留。"},
{c:1,q:"黒いフェルトペンのインクに含まれる色素を分けるのに適した操作はどれか。",a:["クロマトグラフィー","蒸留","昇華法","再結晶"],k:0,e:"ろ紙などへの吸着力の差を利用して成分を分離する操作がクロマトグラフィー。"},
{c:1,q:"食塩水を蒸留する実験装置と操作に関する記述として、誤りを含むものはどれか。",a:["枝付きフラスコに入れる液体は容量の半分以下にする","枝付きフラスコには沸騰石を入れる","冷却器の冷却水は上部から下部へ流す","温度計の球部は枝の付け根の高さに合わせる"],k:2,e:"冷却水は下部から入れて上部から出す。逆にすると冷却器内に水が満たされず、冷却効率が落ちる。"},
{c:1,q:"蒸留で枝付きフラスコに沸騰石を入れる理由はどれか。",a:["突沸を防ぐため","沸点を下げるため","液体を着色するため","不純物を吸着させるため"],k:0,e:"沸騰石は小さな泡の発生核となり、急激な沸騰(突沸)を防ぐ。"},
{c:1,q:"蒸留で温度計の球部を枝の付け根の高さに置く理由はどれか。",a:["フラスコ内の液体の温度を測るため","留出してくる蒸気の温度を測るため","冷却水の温度を測るため","室温を測るため"],k:1,e:"測りたいのは留出する蒸気の温度なので、球部は枝の付け根の位置に合わせる。"},
{c:1,q:"蒸留の装置で、受け器とアダプターの間を密閉しない理由はどれか。",a:["装置内の圧力が高くなるのを防ぐため","蒸気を逃がすため","冷却水が入るようにするため","空気を送り込むため"],k:0,e:"密閉すると加熱により内圧が上がり、装置が破損する危険がある。"},
{c:1,q:"ドライアイスを室内に放置すると小さくなっていく。この状態変化の名称はどれか。",a:["融解","昇華","凝縮","凝固"],k:1,e:"固体が直接気体になる変化が昇華。ドライアイス(固体のCO₂)は昇華する。"},
{c:1,q:"気体が直接液体になる状態変化の名称はどれか。",a:["蒸発","凝縮","凝固","融解"],k:1,e:"気体から液体への変化が凝縮。液体から気体は蒸発。"},
{c:1,q:"液体が固体になる状態変化の名称はどれか。",a:["融解","凝固","凝縮","昇華"],k:1,e:"液体から固体への変化が凝固。逆(固体から液体)が融解。"},
{c:1,q:"物質の三態と状態変化に関する記述として、誤りを含むものはどれか。",a:["状態変化では物質の種類そのものが変化する","気体は粒子の熱運動が最も激しい","固体では粒子が規則的に配列していることが多い","状態変化に伴って粒子の間隔が変わる"],k:0,e:"状態変化は粒子の集まり方が変わるだけの物理変化で、物質の種類は変わらない。"},
{c:1,q:"同じ物質について、粒子の熱運動が最も激しい状態はどれか。",a:["固体","液体","気体","どれも同じ"],k:2,e:"気体では粒子が自由に飛び回っており、熱運動が最も激しい。"},
{c:1,q:"ナトリウムの炎色反応の色はどれか。",a:["黄","赤紫","青緑","黄緑"],k:0,e:"Naは黄色。リアカー無きK村(Li赤・Na黄・K赤紫)で覚える。"},
{c:1,q:"カリウムの炎色反応の色はどれか。",a:["黄","赤紫","橙赤","青緑"],k:1,e:"Kは赤紫色を示す。"},
{c:1,q:"炎色反応で黄緑色を示す元素はどれか。",a:["カルシウム","ストロンチウム","バリウム","銅"],k:2,e:"Baは黄緑色。Caは橙赤色、Srは紅色、Cuは青緑色。"},
{c:1,q:"炎色反応で青緑色を示す元素はどれか。",a:["銅","鉄","リチウム","ナトリウム"],k:0,e:"Cuは青緑色を示す。"},
{c:1,q:"炎色反応で赤色(深赤色)を示す元素はどれか。",a:["リチウム","カリウム","バリウム","銅"],k:0,e:"Liは赤色を示す。"},
{c:1,q:"純物質と混合物を区別する手がかりとして最も適当なものはどれか。",a:["融点や沸点が一定の値になるかどうか","色がついているかどうか","水に溶けるかどうか","固体か液体かどうか"],k:0,e:"純物質は融点・沸点が一定。混合物は組成によって変わり、一定にならない。"},
{c:1,q:"次の記述のうち、物質としての単体を指す語が使われているものはどれか。",a:["水は水素と酸素からできている","貝殻にはカルシウムが含まれる","水を電気分解すると水素が発生する","人体の約60%は水である"],k:2,e:"実際に発生する物質H₂を指しているので単体。他は成分としての元素を指している。"},
{c:1,q:"0℃は絶対温度で表すと何Kか。",a:["0 K","100 K","273 K","373 K"],k:2,e:"絶対温度[K]=セルシウス温度[℃]+273。"},
{c:1,q:"空気中に体積の割合で最も多く含まれる気体はどれか。",a:["酸素","窒素","アルゴン","二酸化炭素"],k:1,e:"空気は窒素約78%、酸素約21%、アルゴン約0.9%。"},
{c:1,q:"物理変化であるものはどれか。",a:["氷が融けて水になる","鉄がさびる","メタンが燃える","砂糖が焦げて黒くなる"],k:0,e:"氷の融解は状態変化で物質の種類が変わらないので物理変化。他は化学変化。"},
{c:1,q:"化学変化であるものはどれか。",a:["ドライアイスが小さくなる","水が蒸発する","スチールウールが燃える","砂糖が水に溶ける"],k:2,e:"燃焼は酸素と結びつく化学変化。他はすべて物理変化。"},
{c:1,q:"単体が常温・常圧で気体である元素はどれか。",a:["硫黄","リン","塩素","ヨウ素"],k:2,e:"Cl₂は常温・常圧で気体。硫黄・リン・ヨウ素の単体は固体。臭素は液体。"},
{c:1,q:"濃硫酸を水で薄めるときの正しい操作はどれか。",a:["水に濃硫酸を少量ずつ加える","濃硫酸に水を一度に加える","濃硫酸に氷を入れる","加熱しながら水を加える"],k:0,e:"希釈時に大量の熱が出るため、多量の水に濃硫酸を少量ずつ加えてかき混ぜる。"},
{c:1,q:"メスシリンダーで液体の体積を読み取るときの正しい方法はどれか。",a:["液面の最も低い位置を真横から読む","液面の最も高い位置を上から読む","目盛りの中央を斜めから読む","容器の底の位置を読む"],k:0,e:"水の液面は中央がくぼむので、そのくぼみの最も低い位置を真横から水平に読む。"},
{c:1,q:"物質を構成する粒子の熱運動によって、物質が自然に混ざり合っていく現象の名称はどれか。",a:["拡散","昇華","蒸留","電離"],k:0,e:"熱運動により粒子が自然に散らばって均一になる現象が拡散。"},
// 分野2 原子・イオン・周期表
{c:2,q:"原子番号が表しているものはどれか。",a:["中性子の数","陽子の数","質量数","中性子と陽子の数の和"],k:1,e:"原子番号=陽子の数=電子の数(中性の原子の場合)。"},
{c:2,q:"質量数を表す式はどれか。",a:["陽子の数＋電子の数","陽子の数＋中性子の数","中性子の数−陽子の数","電子の数×2"],k:1,e:"質量数=陽子の数+中性子の数。電子の質量は極めて小さく無視できる。"},
{c:2,q:"²³Na(原子番号11)に含まれる中性子の数はどれか。",a:["10","11","12","23"],k:2,e:"中性子数=質量数23−陽子数11=12。"},
{c:2,q:"³⁵Cl(原子番号17)に含まれる中性子の数はどれか。",a:["17","18","19","35"],k:1,e:"35−17=18。"},
{c:2,q:"⁵⁶Fe(原子番号26)に含まれる中性子の数はどれか。",a:["26","28","30","56"],k:2,e:"56−26=30。"},
{c:2,q:"¹⁶Oと同じ数の中性子をもつ原子はどれか。原子番号はC=6、N=7、F=9、Mg=12である。",a:["¹²C","¹⁵N","¹⁹F","²⁴Mg"],k:1,e:"¹⁶Oの中性子数は16−8=8。¹⁵Nは15−7=8で一致する。¹²Cは6、¹⁹Fは10、²⁴Mgは12。"},
{c:2,q:"同位体に関する記述として誤りを含むものはどれか。",a:["互いに同位体である原子は、陽子の数は異なるが中性子の数は同じである","同位体どうしの化学的性質はほぼ同じである","原子核が不安定で放射線を出す同位体がある","¹⁴Cは遺跡の年代測定に利用されている"],k:0,e:"同位体は陽子の数(原子番号)が同じで中性子の数が異なる原子。記述は逆になっている。"},
{c:2,q:"遺跡や化石の年代測定に利用される放射性同位体はどれか。",a:["¹²C","¹⁴C","¹⁶O","²³Na"],k:1,e:"¹⁴Cは一定の半減期で崩壊するため、残存量から年代を推定できる。"},
{c:2,q:"原子の質量のほとんどを占めているものはどれか。",a:["電子","原子核","最外殻電子","価電子"],k:1,e:"陽子と中性子からなる原子核が質量のほぼすべてを占める。"},
{c:2,q:"電子1個の質量は陽子1個の質量の約何分の1か。",a:["約1/2","約1/10","約1/1840","約1/1000000"],k:2,e:"電子の質量は陽子の約1/1840で、原子の質量を考えるとき無視できる。"},
{c:2,q:"塩素には³⁵Clが75%、³⁷Clが25%の割合で存在する。塩素の原子量に最も近い値はどれか。",a:["35.0","35.5","36.0","37.0"],k:1,e:"35×0.75+37×0.25=26.25+9.25=35.5。"},
{c:2,q:"銅には⁶³Cuが70%、⁶⁵Cuが30%の割合で存在する。銅の原子量に最も近い値はどれか。",a:["63.0","63.6","64.0","64.4"],k:1,e:"63×0.70+65×0.30=44.1+19.5=63.6。"},
{c:2,q:"ナトリウム原子Naの電子配置として正しいものはどれか。",a:["K殻2、L殻8、M殻1","K殻2、L殻8、M殻8","K殻2、L殻9","K殻8、L殻2、M殻1"],k:0,e:"Naは原子番号11。内側から2、8、1と入る。"},
{c:2,q:"アルゴンAr原子の電子配置として正しいものはどれか。",a:["K殻2、L殻8","K殻2、L殻8、M殻8","K殻2、L殻8、M殻10","K殻2、L殻18"],k:1,e:"Arは原子番号18。2+8+8=18。"},
{c:2,q:"Na⁺と同じ電子配置をもたないイオンはどれか。",a:["F⁻","Mg²⁺","O²⁻","Cl⁻"],k:3,e:"Na⁺は電子10個でネオン型。F⁻・Mg²⁺・O²⁻も10個。Cl⁻は18個でアルゴン型。"},
{c:2,q:"価電子の数が0とされる元素はどれか。",a:["ナトリウム","塩素","ネオン","酸素"],k:2,e:"貴ガスは他の原子と結合しにくいため、価電子の数は0とする。"},
{c:2,q:"酸素原子の価電子の数はどれか。",a:["2","4","6","8"],k:2,e:"Oは原子番号8で電子配置はK2・L6。最外殻電子6個が価電子。"},
{c:2,q:"最外殻電子の数と価電子の数が一致しない元素はどれか。",a:["リチウム","炭素","硫黄","アルゴン"],k:3,e:"貴ガスのArは最外殻電子8個だが価電子は0とする。"},
{c:2,q:"第1イオン化エネルギーが最も大きい原子はどれか。",a:["水素","ヘリウム","リチウム","ネオン"],k:1,e:"He は最も電子を取り去りにくく、第1イオン化エネルギーが全元素中で最大。"},
{c:2,q:"同一周期内で原子番号が大きくなるとき、第1イオン化エネルギーはどうなる傾向があるか。",a:["大きくなる","小さくなる","変わらない","周期の中央で最小になる"],k:0,e:"右へ行くほど原子核の正電荷が大きく電子を引きつけるため、大きくなる傾向。"},
{c:2,q:"陽イオンになりやすい原子の特徴はどれか。",a:["イオン化エネルギーが小さい","イオン化エネルギーが大きい","電子親和力が大きい","最外殻電子が7個である"],k:0,e:"少ないエネルギーで電子を放出できる原子ほど陽イオンになりやすい。"},
{c:2,q:"カルシウムCaとマグネシウムMgに関する記述として、誤りを含むものはどれか。",a:["いずれも2価の陽イオンになりやすい","いずれもアルカリ金属元素である","第1イオン化エネルギーはMgよりCaの方が小さい","イオン化傾向はMgよりCaの方が大きい"],k:1,e:"CaとMgは2族元素。アルカリ金属は1族。Caはアルカリ土類金属に分類される。"},
{c:2,q:"周期表の1族元素のうち、水素を除いた元素の総称はどれか。",a:["アルカリ金属","アルカリ土類金属","ハロゲン","貴ガス"],k:0,e:"Li、Na、K、Rb、Cs などをアルカリ金属という。"},
{c:2,q:"周期表の17族元素の総称はどれか。",a:["アルカリ金属","ハロゲン","貴ガス","遷移元素"],k:1,e:"F、Cl、Br、I などをハロゲンという。1価の陰イオンになりやすい。"},
{c:2,q:"周期表の18族元素の総称はどれか。",a:["ハロゲン","貴ガス","アルカリ土類金属","典型元素の金属"],k:1,e:"He、Ne、Ar などを貴ガス(希ガス)という。単原子分子で存在する。"},
{c:2,q:"遷移元素であるものはどれか。",a:["ナトリウム","カルシウム","鉄","硫黄"],k:2,e:"3族から11族(12族を含める場合もある)が遷移元素。Feはその代表。"},
{c:2,q:"貴ガスに関する記述として誤りを含むものはどれか。",a:["常温で二原子分子として存在する","化学的に安定で反応しにくい","ヘリウムは風船や気球に使われる","アルゴンは空気中に約0.9%含まれる"],k:0,e:"貴ガスは安定なため単原子分子として存在する。"},
{c:2,q:"ハロゲンの単体の酸化力の強さの順序として正しいものはどれか。",a:["F₂＞Cl₂＞Br₂＞I₂","I₂＞Br₂＞Cl₂＞F₂","Cl₂＞F₂＞I₂＞Br₂","すべて同じ"],k:0,e:"原子番号が小さいハロゲンほど酸化力が強い。"},
{c:2,q:"陰イオンになりやすい原子の特徴はどれか。",a:["電子親和力が大きい","イオン化エネルギーが小さい","最外殻電子が1個である","金属元素である"],k:0,e:"電子を受け取るときに放出するエネルギー(電子親和力)が大きい原子ほど陰イオンになりやすい。"},
{c:2,q:"Na⁺とCl⁻のイオン半径を比べたとき、正しいものはどれか。",a:["Na⁺の方が大きい","Cl⁻の方が大きい","ほぼ同じ","比較できない"],k:1,e:"Cl⁻は電子18個でM殻まで電子が入っており、Ne型のNa⁺より大きい。"},
{c:2,q:"O²⁻、F⁻、Na⁺、Mg²⁺は同じ電子配置をもつ。イオン半径が最も小さいものはどれか。",a:["O²⁻","F⁻","Na⁺","Mg²⁺"],k:3,e:"同じ電子配置なら原子番号が大きいほど原子核の引力が強く、半径は小さくなる。"},
{c:2,q:"Al³⁺に含まれる電子の数はどれか。",a:["10","13","14","16"],k:0,e:"Alは原子番号13で電子13個。3個失って10個になる。"},
{c:2,q:"S²⁻に含まれる電子の数はどれか。",a:["14","16","18","20"],k:2,e:"Sは原子番号16で電子16個。2個受け取って18個。"},
{c:2,q:"硫酸イオンの化学式として正しいものはどれか。",a:["SO₃²⁻","SO₄²⁻","HSO₄⁻","S²⁻"],k:1,e:"硫酸イオンはSO₄²⁻。SO₃²⁻は亜硫酸イオン。"},
{c:2,q:"アンモニウムイオンの化学式として正しいものはどれか。",a:["NH₃","NH₄⁺","NO₃⁻","NH₂⁻"],k:1,e:"NH₃が H⁺ を受け取ってできる1価の陽イオンがNH₄⁺。"},
{c:2,q:"炭酸水素イオンの化学式として正しいものはどれか。",a:["CO₃²⁻","HCO₃⁻","CH₃COO⁻","OH⁻"],k:1,e:"炭酸イオンCO₃²⁻に H⁺ が1個ついた1価の陰イオンがHCO₃⁻。"},
{c:2,q:"周期表の縦の並びを表す語はどれか。",a:["周期","族","殻","群"],k:1,e:"縦の並びが族、横の並びが周期。同族元素は性質が似る。"},
// 分野3 化学結合と物質の性質
{c:3,q:"イオン結合でできている物質はどれか。",a:["塩化ナトリウム","ヨウ素","アルミニウム","二酸化炭素"],k:0,e:"金属元素の陽イオンと非金属元素の陰イオンが静電気的な力で結びつくのがイオン結合。"},
{c:3,q:"分子内の結合がすべて共有結合である物質はどれか。",a:["塩化カリウム","二酸化炭素","銅","酸化カルシウム"],k:1,e:"CO₂は非金属元素どうしが電子を共有した共有結合でできた分子。"},
{c:3,q:"金属結合でできている物質はどれか。",a:["アルミニウム","ダイヤモンド","塩化マグネシウム","アンモニア"],k:0,e:"金属原子が自由電子を共有して結びつくのが金属結合。"},
{c:3,q:"金属が電気をよく通す理由として最も適当なものはどれか。",a:["自由電子が金属中を動くため","イオンが移動するため","分子が振動するため","陽子が移動するため"],k:0,e:"金属中を自由に動ける自由電子が電気や熱を運ぶ。"},
{c:3,q:"たたくと薄く広がる展性や、引き延ばせる延性を示すのはどの結晶か。",a:["イオン結晶","分子結晶","金属結晶","共有結合の結晶"],k:2,e:"自由電子が原子の位置のずれに追随するため、金属は変形しても結合が保たれる。"},
{c:3,q:"イオン結晶の性質に関する記述として、誤りを含むものはどれか。",a:["固体の状態でも電気をよく通す","融点が比較的高い","硬いがもろい","水に溶けると電気を通す"],k:0,e:"イオン結晶の固体はイオンが動けないため電気を通さない。融解したり水に溶けると通す。"},
{c:3,q:"イオン結晶に強い力を加えたときの性質はどれか。",a:["薄く広がる","細く延びる","割れやすい","ゴムのように戻る"],k:2,e:"イオンの配列がずれると同符号のイオンが接近して反発するため、特定の面で割れる(へき開)。"},
{c:3,q:"共有結合の結晶であるものはどれか。",a:["ヨウ素","二酸化ケイ素","塩化ナトリウム","銅"],k:1,e:"SiO₂は原子が共有結合で立体的に連続した共有結合の結晶。非常に硬く融点が高い。"},
{c:3,q:"ダイヤモンドとケイ素に関する記述として、誤りを含むものはどれか。",a:["ダイヤモンドは電気をよく通す","ダイヤモンドは非常に硬い","ケイ素の単体は半導体として利用される","いずれも共有結合の結晶である"],k:0,e:"ダイヤモンドは価電子がすべて共有結合に使われており、電気を通さない。"},
{c:3,q:"黒鉛が電気を通す理由として最も適当なものはどれか。",a:["価電子のうち1個が平面構造の中を動けるため","イオンが移動できるため","自由電子をもたない金属だから","分子間力が弱いため"],k:0,e:"炭素原子4個の価電子のうち3個が共有結合に使われ、残り1個が層内を移動できる。"},
{c:3,q:"分子結晶の一般的な性質はどれか。",a:["融点が低くやわらかい","極めて硬く融点が高い","電気をよく通す","たたくと薄く広がる"],k:0,e:"分子間力は共有結合やイオン結合より弱いため、融点が低くやわらかい。"},
{c:3,q:"ヨウ素の結晶はどの種類の結晶か。",a:["イオン結晶","分子結晶","金属結晶","共有結合の結晶"],k:1,e:"I₂分子が分子間力で集まった分子結晶。昇華しやすい。"},
{c:3,q:"メタンCH₄の分子の形はどれか。",a:["正四面体形","三角錐形","折れ線形","直線形"],k:0,e:"炭素を中心に4個の水素が正四面体の頂点方向に結合している。"},
{c:3,q:"アンモニアNH₃の分子の形はどれか。",a:["正四面体形","三角錐形","折れ線形","直線形"],k:1,e:"窒素上の非共有電子対が結合を押し下げるため三角錐形になる。"},
{c:3,q:"水H₂Oの分子の形はどれか。",a:["直線形","折れ線形","正四面体形","三角形"],k:1,e:"酸素の2組の非共有電子対の影響で折れ線形(約104.5度)になる。"},
{c:3,q:"二酸化炭素CO₂の分子の形はどれか。",a:["直線形","折れ線形","三角錐形","正四面体形"],k:0,e:"O=C=Oが一直線に並ぶ。結合には極性があるが打ち消し合う。"},
{c:3,q:"無極性分子であるものはどれか。",a:["水","アンモニア","塩化水素","二酸化炭素"],k:3,e:"CO₂は直線形で結合の極性が打ち消し合うため分子全体では無極性。"},
{c:3,q:"極性分子であるものはどれか。",a:["メタン","二酸化炭素","塩素","塩化水素"],k:3,e:"HClは異なる原子の2原子分子なので必ず極性をもつ。"},
{c:3,q:"水H₂O、二酸化炭素CO₂、アンモニアNH₃について、分子全体としての極性の有無の組合せとして正しいものはどれか。",a:["水:あり CO₂:なし NH₃:あり","水:あり CO₂:あり NH₃:あり","水:あり CO₂:なし NH₃:なし","水:なし CO₂:なし NH₃:あり"],k:0,e:"H₂Oは折れ線形、NH₃は三角錐形で極性が打ち消されず極性分子。CO₂は直線形で無極性分子。"},
{c:3,q:"電気陰性度が最も大きい元素はどれか。",a:["酸素","フッ素","塩素","窒素"],k:1,e:"Fが全元素中で最大。周期表の右上ほど大きい(貴ガスは除く)。"},
{c:3,q:"電気陰性度が大きい元素は周期表のどのあたりに位置するか。",a:["左下","右上","中央","下端"],k:1,e:"貴ガスを除き、右上に向かうほど電気陰性度が大きい。"},
{c:3,q:"水の沸点が硫化水素H₂Sより著しく高い理由として最も適当なものはどれか。",a:["分子量が大きいため","水素結合を形成するため","イオン結合をもつため","分子が直線形のため"],k:1,e:"H₂O分子間に強い水素結合がはたらくため、分子量が小さいのに沸点が高い。"},
{c:3,q:"分子間に水素結合を形成しない物質はどれか。",a:["フッ化水素","水","アンモニア","メタン"],k:3,e:"水素結合はF・O・Nに結合したHが関わる。CH₄のC−H結合では生じない。"},
{c:3,q:"氷が水に浮く理由として最も適当なものはどれか。",a:["水素結合により隙間の多い構造をとり密度が小さくなるため","分子が小さくなるため","空気を含むため","結合が切れて軽くなるため"],k:0,e:"氷では水素結合により正四面体的な隙間の多い配列となり、液体の水より密度が小さい。"},
{c:3,q:"構造が似た分子どうしを比べたとき、分子量が大きいほど分子間力(ファンデルワールス力)はどうなるか。",a:["大きくなる","小さくなる","変わらない","0になる"],k:0,e:"分子量が大きいほど分子間力が強くなり、沸点も高くなる傾向がある。"},
{c:3,q:"配位結合を含むイオンはどれか。",a:["塩化物イオン","アンモニウムイオン","ナトリウムイオン","硫化物イオン"],k:1,e:"NH₃の非共有電子対に H⁺ が結合してできたNH₄⁺は配位結合を含む。"},
{c:3,q:"窒素分子N₂中の窒素原子間の結合はどれか。",a:["単結合","二重結合","三重結合","イオン結合"],k:2,e:"N原子は価電子5個で、3組の電子対を共有して三重結合をつくる。"},
{c:3,q:"水分子H₂Oがもつ非共有電子対の数はどれか。",a:["0組","1組","2組","4組"],k:2,e:"酸素の価電子6個のうち4個が2組の非共有電子対として残る。共有電子対は2組。"},
{c:3,q:"塩化カルシウムの組成式として正しいものはどれか。",a:["CaCl","CaCl₂","Ca₂Cl","Ca₂Cl₃"],k:1,e:"Ca²⁺とCl⁻が電気的に中性になる比1:2で結びつく。"},
{c:3,q:"酸化アルミニウムの組成式として正しいものはどれか。",a:["AlO","Al₂O₃","Al₃O₂","AlO₂"],k:1,e:"Al³⁺とO²⁻が2:3で結びつく。"},
{c:3,q:"硫酸アンモニウムの組成式として正しいものはどれか。",a:["NH₄SO₄","(NH₄)₂SO₄","NH₄(SO₄)₂","(NH₄)₃SO₄"],k:1,e:"NH₄⁺とSO₄²⁻が2:1で結びつく。"},
{c:3,q:"リン酸カルシウムの組成式として正しいものはどれか。",a:["CaPO₄","Ca₂(PO₄)₃","Ca₃(PO₄)₂","Ca(PO₄)₂"],k:2,e:"Ca²⁺とPO₄³⁻が3:2で結びつく。"},
{c:3,q:"ポリエチレンをつくる反応の名称はどれか。",a:["付加重合","縮合重合","中和","加水分解"],k:0,e:"エチレンの二重結合が開いて次々につながる付加重合でポリエチレンができる。"},
{c:3,q:"セラミックスに分類される材料はどれか。",a:["ガラス","ポリエチレン","ステンレス鋼","ナイロン"],k:0,e:"ガラス・陶磁器・セメントは無機物質を焼き固めたセラミックス。"},
{c:3,q:"ステンレス鋼の主な成分の組合せはどれか。",a:["鉄・クロム・ニッケル","銅・亜鉛","銅・スズ","アルミニウム・銅"],k:0,e:"鉄にCrとNiを加えた合金で、さびにくい。銅+亜鉛は黄銅、銅+スズは青銅。"},
{c:3,q:"黄銅(真鍮)の成分の組合せはどれか。",a:["銅と亜鉛","銅とスズ","鉄と炭素","アルミニウムとマグネシウム"],k:0,e:"黄銅は銅と亜鉛の合金。五円硬貨や金管楽器に使われる。"},
{c:3,q:"塩化ナトリウムを水に溶かすと電気を通すようになる。この理由として最も適当なものはどれか。",a:["ナトリウムイオンと塩化物イオンに電離して自由に動けるようになるため","分子が壊れて電子が生じるため","水が分解して水素が生じるため","自由電子が発生するため"],k:0,e:"水中でNa⁺とCl⁻に電離し、イオンが移動して電気を運ぶ。"},
{c:3,q:"同じ質量の3つの物質A・B・Cは塩化ナトリウム、スクロース、硫酸バリウムのいずれかである。水を加えるとAはほとんど溶けず、BとCは溶けた。BとCの水溶液のうちBはほとんど電気を通さず、Cはよく通した。A・B・Cの組合せはどれか。",a:["A:硫酸バリウム B:スクロース C:塩化ナトリウム","A:塩化ナトリウム B:スクロース C:硫酸バリウム","A:スクロース B:硫酸バリウム C:塩化ナトリウム","A:硫酸バリウム B:塩化ナトリウム C:スクロース"],k:0,e:"硫酸バリウムは水に溶けにくい。スクロースは分子性物質で非電解質、塩化ナトリウムは電解質。"},
// 分野4 物質量と化学反応式
{c:4,q:"アボガドロ定数の値として最も適当なものはどれか。",a:["6.0×10²³ /mol","6.0×10¹³ /mol","2.24×10²² /mol","1.0×10²⁴ /mol"],k:0,e:"1 mol の粒子の個数は約6.0×10²³個。"},
{c:4,q:"モル質量の単位として正しいものはどれか。",a:["g","g/mol","mol","mol/L"],k:1,e:"モル質量は1 mol あたりの質量なので単位は g/mol。数値は原子量・分子量・式量と一致する。"},
{c:4,q:"硫酸H₂SO₄の分子量はどれか。原子量はH=1.0、O=16、S=32とする。",a:["82","96","98","100"],k:2,e:"1.0×2+32+16×4=2+32+64=98。"},
{c:4,q:"水酸化ナトリウムNaOHの式量はどれか。原子量はH=1.0、O=16、Na=23とする。",a:["23","39","40","56"],k:2,e:"23+16+1.0=40。"},
{c:4,q:"炭酸カルシウムCaCO₃の式量はどれか。原子量はC=12、O=16、Ca=40とする。",a:["84","100","116","144"],k:1,e:"40+12+16×3=40+12+48=100。"},
{c:4,q:"水18 gは何molか。H₂Oの分子量は18とする。",a:["0.50 mol","1.0 mol","2.0 mol","18 mol"],k:1,e:"18 g ÷ 18 g/mol = 1.0 mol。"},
{c:4,q:"二酸化炭素44 gは何molか。CO₂の分子量は44とする。",a:["0.50 mol","1.0 mol","2.0 mol","44 mol"],k:1,e:"44 g ÷ 44 g/mol = 1.0 mol。"},
{c:4,q:"0.50 molの水の質量はどれか。H₂Oの分子量は18とする。",a:["4.5 g","9.0 g","18 g","36 g"],k:1,e:"0.50 mol × 18 g/mol = 9.0 g。"},
{c:4,q:"標準状態(0℃、1.013×10⁵ Pa)で気体1 molが占める体積はどれか。",a:["11.2 L","22.4 L","24.0 L","44.8 L"],k:1,e:"気体の種類によらず標準状態で1 molは22.4 L。"},
{c:4,q:"標準状態で11.2 Lの酸素は何molか。",a:["0.25 mol","0.50 mol","1.0 mol","2.0 mol"],k:1,e:"11.2 ÷ 22.4 = 0.50 mol。"},
{c:4,q:"標準状態で5.6 Lの窒素の質量はどれか。N₂の分子量は28とする。",a:["3.5 g","7.0 g","14 g","28 g"],k:1,e:"5.6÷22.4=0.25 mol、0.25×28=7.0 g。"},
{c:4,q:"水1.0 molに含まれる水素原子の数はどれか。アボガドロ定数を6.0×10²³ /molとする。",a:["6.0×10²³個","1.2×10²⁴個","3.0×10²³個","1.8×10²⁴個"],k:1,e:"H₂O 1分子中にHは2個。1.0×2×6.0×10²³=1.2×10²⁴個。"},
{c:4,q:"二酸化炭素0.20 molに含まれる酸素原子の物質量はどれか。",a:["0.10 mol","0.20 mol","0.40 mol","0.60 mol"],k:2,e:"CO₂ 1分子にOは2個。0.20×2=0.40 mol。"},
{c:4,q:"次のうち、含まれる酸素原子の物質量が最も小さいものはどれか。",a:["水1.0 mol","二酸化炭素0.40 mol","酸素0.60 mol","硫酸0.30 mol"],k:1,e:"H₂Oは1.0 mol、CO₂は0.80 mol、O₂は1.2 mol、H₂SO₄は1.2 mol。最小はCO₂の0.80 mol。"},
{c:4,q:"ケイ素原子99個に対して鉄原子1個の割合で含まれる試料がある。鉄の含有率(質量パーセント)に最も近い値はどれか。原子量はSi=28、Fe=56とする。",a:["0.50%","1.0%","2.0%","4.0%"],k:2,e:"Si 28×99=2772、Fe 56。56÷(2772+56)=56÷2828≒0.0198→約2.0%。"},
{c:4,q:"質量パーセント濃度の定義として正しいものはどれか。",a:["溶質の質量÷溶液の質量×100","溶質の質量÷溶媒の質量×100","溶質の物質量÷溶液の体積","溶質の物質量÷溶液の質量"],k:0,e:"分母は溶液全体(溶質+溶媒)の質量であることに注意。"},
{c:4,q:"質量パーセント濃度10%の食塩水200 gに含まれる塩化ナトリウムの質量はどれか。",a:["10 g","20 g","30 g","180 g"],k:1,e:"200×0.10=20 g。"},
{c:4,q:"質量パーセント濃度5.0%の食塩水200 gをつくるとき、必要な水の質量はどれか。",a:["180 g","185 g","190 g","195 g"],k:2,e:"NaCl は200×0.050=10 g。水は200−10=190 g。"},
{c:4,q:"水酸化ナトリウム4.0 gを水に溶かして500 mLの水溶液にしたとき、モル濃度はどれか。NaOHの式量は40とする。",a:["0.10 mol/L","0.20 mol/L","0.40 mol/L","0.80 mol/L"],k:1,e:"4.0÷40=0.10 mol。0.10 mol÷0.500 L=0.20 mol/L。"},
{c:4,q:"0.10 mol/Lの塩酸250 mLに含まれる塩化水素の物質量はどれか。",a:["0.010 mol","0.025 mol","0.10 mol","0.25 mol"],k:1,e:"0.10 mol/L × 0.250 L = 0.025 mol。"},
{c:4,q:"2.0 mol/Lの水溶液50 mLに水を加えて200 mLにしたとき、モル濃度はどれか。",a:["0.25 mol/L","0.50 mol/L","1.0 mol/L","4.0 mol/L"],k:1,e:"溶質は2.0×0.050=0.10 mol。0.10÷0.200=0.50 mol/L。"},
{c:4,q:"質量パーセント濃度w%、密度d g/cm³、モル質量M g/molの水溶液のモル濃度を表す式はどれか。",a:["10dw/M","dw/(10M)","dwM/10","1000M/(dw)"],k:0,e:"1 L=1000 cm³の質量は1000d g。溶質は1000dw/100=10dw g、物質量は10dw/M mol。"},
{c:4,q:"質量パーセント濃度98%、密度1.8 g/cm³の濃硫酸のモル濃度に最も近い値はどれか。H₂SO₄の分子量は98とする。",a:["1.8 mol/L","9.0 mol/L","18 mol/L","36 mol/L"],k:2,e:"10×1.8×98÷98=18 mol/L。"},
{c:4,q:"溶解度の一般的な定義として正しいものはどれか。",a:["水100 gに溶ける溶質の最大質量","水1 Lに溶ける溶質の物質量","溶液100 gに含まれる溶質の質量","溶質が溶ける速さ"],k:0,e:"溶解度はふつう水100 gに溶かすことのできる溶質の最大質量[g]で表す。"},
{c:4,q:"硝酸カリウムの溶解度は60℃で110、20℃で32(いずれも水100 gあたりのg)である。60℃の飽和水溶液210 gを20℃まで冷却したとき、析出する結晶の質量はどれか。",a:["32 g","64 g","78 g","110 g"],k:2,e:"210 gの飽和水溶液は水100 gとKNO₃110 g。20℃では32 gしか溶けないので110−32=78 g析出。"},
{c:4,q:"硝酸カリウムの20℃における溶解度は32(水100 gあたりのg)である。200 gの水に100 gの硝酸カリウムを溶かした水溶液を20℃に冷却したとき、析出する質量はどれか。",a:["18 g","36 g","64 g","68 g"],k:1,e:"水200 gには32×2=64 gまで溶ける。100−64=36 g析出。"},
{c:4,q:"プロパンの燃焼を表す化学反応式 C₃H₈ + aO₂ → bCO₂ + cH₂O において、係数aはどれか。",a:["3","4","5","7"],k:2,e:"C₃H₈+5O₂→3CO₂+4H₂O。O原子は左辺10個、右辺6+4=10個で一致。"},
{c:4,q:"化学反応式 2Al + aHCl → 2AlCl₃ + 3H₂ において、係数aはどれか。",a:["3","4","6","8"],k:2,e:"右辺のClは6個、Hは6個。よってHClは6。"},
{c:4,q:"メタンCH₄を完全燃焼させたところ、水18 gが生成した。このとき生成した二酸化炭素の物質量はどれか。H₂Oの分子量は18とする。",a:["0.25 mol","0.50 mol","1.0 mol","2.0 mol"],k:1,e:"CH₄+2O₂→CO₂+2H₂O。H₂O 1.0 molからCH₄は0.50 mol、CO₂も0.50 mol。"},
{c:4,q:"炭酸カルシウム10 gに十分な量の塩酸を加えたとき、標準状態で発生する二酸化炭素の体積はどれか。CaCO₃の式量は100とする。",a:["1.12 L","2.24 L","4.48 L","22.4 L"],k:1,e:"CaCO₃+2HCl→CaCl₂+H₂O+CO₂。0.10 molのCaCO₃からCO₂ 0.10 mol=2.24 L。"},
{c:4,q:"マグネシウム0.24 gに十分な量の塩酸を加えたとき、標準状態で発生する水素の体積はどれか。Mgの原子量は24とする。",a:["112 mL","224 mL","336 mL","448 mL"],k:1,e:"Mg+2HCl→MgCl₂+H₂。0.010 molのMgからH₂ 0.010 mol=224 mL。"},
{c:4,q:"水素0.30 molと酸素0.10 molを混合して点火した。生成する水の物質量と、反応後に残る気体はどれか。",a:["水0.20 mol、水素0.10 molが残る","水0.30 mol、残らない","水0.10 mol、酸素0.05 molが残る","水0.20 mol、酸素0.05 molが残る"],k:0,e:"2H₂+O₂→2H₂O。O₂ 0.10 molが完全に反応するとH₂は0.20 mol消費され、H₂Oは0.20 mol生成。H₂が0.10 mol残る。"},
{c:4,q:"化学変化の前後で物質全体の質量が変わらないという法則の名称はどれか。",a:["質量保存の法則","定比例の法則","気体反応の法則","アボガドロの法則"],k:0,e:"ラボアジエが確認した質量保存の法則。"},
{c:4,q:"同温・同圧で同体積の気体には同数の分子が含まれるという法則の名称はどれか。",a:["質量保存の法則","定比例の法則","アボガドロの法則","ヘンリーの法則"],k:2,e:"アボガドロの法則。気体では体積比=物質量比が成り立つ。"},
{c:4,q:"同温・同圧で、メタン1 Lを完全燃焼させるのに必要な酸素の体積はどれか。",a:["0.5 L","1 L","2 L","4 L"],k:2,e:"CH₄+2O₂→CO₂+2H₂O。物質量比=体積比なので酸素は2 L。"},
{c:4,q:"ヘリウムと窒素からなる混合気体1.00 molの質量が10.0 gであった。この混合気体に含まれるヘリウムの物質量はどれか。原子量・分子量はHe=4.0、N₂=28とする。",a:["0.25 mol","0.50 mol","0.75 mol","0.90 mol"],k:2,e:"Heをx molとすると4.0x+28(1.00−x)=10.0。−24x=−18よりx=0.75 mol。"},
{c:4,q:"空気を窒素80%、酸素20%(体積比)とみなしたときの平均分子量に最も近い値はどれか。N₂=28、O₂=32とする。",a:["28.0","28.8","30.0","32.0"],k:1,e:"28×0.80+32×0.20=22.4+6.4=28.8。"},
{c:4,q:"標準状態で1.0 Lの質量が1.25 gである純物質の気体の分子量に最も近い値はどれか。",a:["16","28","32","44"],k:1,e:"1 molは22.4 Lなので1.25×22.4=28。"},
{c:4,q:"同温・同圧で密度が最も大きい気体はどれか。",a:["水素","ヘリウム","窒素","二酸化炭素"],k:3,e:"同温同圧では分子量が大きいほど密度が大きい。CO₂の分子量44が最大。"},
{c:4,q:"同じ質量で比べたとき、物質量が最も大きい気体はどれか。",a:["水素","窒素","酸素","二酸化炭素"],k:0,e:"モル質量が最も小さい水素(2.0 g/mol)の物質量が最大になる。"},
{c:4,q:"水分子1個の質量に最も近い値はどれか。H₂Oの分子量は18、アボガドロ定数は6.0×10²³ /molとする。",a:["3.0×10⁻²³ g","1.8×10⁻²² g","6.0×10⁻²³ g","1.1×10⁻²² g"],k:0,e:"18 g/mol ÷ 6.0×10²³ /mol = 3.0×10⁻²³ g。"},
{c:4,q:"金属Mの酸化物MOにおいて、M 2.4 gが酸素1.6 gと結合していた。Mの原子量はどれか。O=16とする。",a:["12","24","27","40"],k:1,e:"O は1.6÷16=0.10 mol。MOなのでMも0.10 mol。2.4÷0.10=24。"},
{c:4,q:"リン酸水素二アンモニウム(NH₄)₂HPO₄(式量132)とリン酸二水素アンモニウムNH₄H₂PO₄(式量115)の混合物において、NH₄H₂PO₄の質量の割合が増えると、窒素NとリンPの含有率(質量パーセント)はどう変わるか。N=14、P=31とする。",a:["Nは減少、Pは増加","Nは増加、Pは減少","どちらも増加","どちらも減少"],k:0,e:"(NH₄)₂HPO₄はN 28/132≒21%、P 31/132≒23%。NH₄H₂PO₄はN 14/115≒12%、P 31/115≒27%。後者が増えるとNは減りPは増える。"},
// 分野5 酸と塩基・中和滴定
{c:5,q:"アレニウスの定義による酸とはどのような物質か。",a:["水溶液中で水素イオンH⁺を生じる物質","水溶液中で水酸化物イオンOH⁻を生じる物質","電子を受け取る物質","電子を与える物質"],k:0,e:"アレニウスの定義では、酸は水中でH⁺を、塩基はOH⁻を生じる物質。"},
{c:5,q:"ブレンステッド・ローリーの定義による塩基とはどのような物質か。",a:["H⁺を与える物質","H⁺を受け取る物質","OH⁻を受け取る物質","電子を与える物質"],k:1,e:"H⁺を相手に与えるものが酸、受け取るものが塩基。水に溶けない物質にも適用できる。"},
{c:5,q:"2価の酸であるものはどれか。",a:["塩酸","硫酸","酢酸","硝酸"],k:1,e:"H₂SO₄は H⁺ を2個放出できる2価の酸。塩酸・酢酸・硝酸は1価。"},
{c:5,q:"3価の酸であるものはどれか。",a:["硫酸","炭酸","リン酸","シュウ酸"],k:2,e:"H₃PO₄は3価。炭酸とシュウ酸は2価。"},
{c:5,q:"2価の塩基であるものはどれか。",a:["水酸化ナトリウム","水酸化カリウム","水酸化カルシウム","アンモニア"],k:2,e:"Ca(OH)₂はOH⁻を2個放出できる2価の塩基。"},
{c:5,q:"弱酸であるものはどれか。",a:["塩酸","硫酸","硝酸","酢酸"],k:3,e:"CH₃COOHは水中で一部しか電離しない弱酸。塩酸・硫酸・硝酸は強酸。"},
{c:5,q:"強塩基であるものはどれか。",a:["アンモニア","水酸化カリウム","水酸化銅(II)","水酸化アルミニウム"],k:1,e:"KOHはほぼ完全に電離する強塩基。アルカリ金属・アルカリ土類金属の水酸化物が強塩基。"},
{c:5,q:"弱塩基であるものはどれか。",a:["水酸化ナトリウム","水酸化バリウム","アンモニア","水酸化カルシウム"],k:2,e:"NH₃は水中で一部しか電離しない弱塩基。"},
{c:5,q:"強酸・弱酸・強塩基・弱塩基の組合せとして正しいものはどれか。",a:["強酸:HNO₃ 弱酸:CH₃COOH 強塩基:KOH 弱塩基:NH₃","強酸:CH₃COOH 弱酸:HNO₃ 強塩基:NH₃ 弱塩基:KOH","強酸:HNO₃ 弱酸:CH₃COOH 強塩基:NH₃ 弱塩基:KOH","強酸:CH₃COOH 弱酸:HNO₃ 強塩基:KOH 弱塩基:NH₃"],k:0,e:"硝酸は強酸、酢酸は弱酸、水酸化カリウムは強塩基、アンモニアは弱塩基。"},
{c:5,q:"酢酸水溶液を水で薄めると、酢酸の電離度はどうなるか。",a:["大きくなる","小さくなる","変わらない","0になる"],k:0,e:"弱酸は薄めるほど電離度が大きくなる。ただし[H⁺]そのものは小さくなる。"},
{c:5,q:"電離度が1に近い酸をどう分類するか。",a:["強酸","弱酸","中性","両性"],k:0,e:"電離度がほぼ1(完全に電離)なら強酸。電離度が小さいものが弱酸。"},
{c:5,q:"0.10 mol/Lの塩酸のpHはどれか。塩酸の電離度は1とする。",a:["1.0","2.0","3.0","13.0"],k:0,e:"[H⁺]=1.0×10⁻¹ mol/L なのでpH=1.0。"},
{c:5,q:"0.010 mol/Lの塩酸のpHはどれか。電離度は1とする。",a:["1.0","2.0","3.0","12.0"],k:1,e:"[H⁺]=1.0×10⁻² mol/L なのでpH=2.0。"},
{c:5,q:"pH 3.0の塩酸を水で100倍に薄めたときのpHに最も近い値はどれか。",a:["1.0","2.0","5.0","6.0"],k:2,e:"[H⁺]が1/100になるのでpHは2増えて5.0。"},
{c:5,q:"濃度0.050 mol/Lの1価の弱酸の水溶液のpHが3.0であった。この弱酸の電離度はどれか。",a:["0.010","0.020","0.050","0.10"],k:1,e:"[H⁺]=1.0×10⁻³ mol/L。電離度α=[H⁺]/c=1.0×10⁻³/0.050=0.020。"},
{c:5,q:"0.10 mol/Lの酢酸水溶液の電離度が0.010のとき、pHはどれか。",a:["1.0","2.0","3.0","4.0"],k:2,e:"[H⁺]=cα=0.10×0.010=1.0×10⁻³ mol/L。pH=3.0。"},
{c:5,q:"0.010 mol/Lの水酸化ナトリウム水溶液のpHはどれか。25℃、電離度1とする。",a:["2.0","7.0","11.0","12.0"],k:3,e:"[OH⁻]=1.0×10⁻²、水のイオン積より[H⁺]=1.0×10⁻¹² なのでpH=12.0。"},
{c:5,q:"25℃で中性の水溶液のpHはどれか。",a:["0","1","7","14"],k:2,e:"25℃では[H⁺]=[OH⁻]=1.0×10⁻⁷ mol/L でpH=7。"},
{c:5,q:"pHの値と酸性・塩基性の関係として正しいものはどれか。",a:["pHが小さいほど酸性が強い","pHが小さいほど塩基性が強い","pHは酸性の強さと無関係","pHが7より小さいと塩基性"],k:0,e:"pHが小さいほど[H⁺]が大きく、酸性が強い。"},
{c:5,q:"25℃における水のイオン積Kwの値はどれか。",a:["1.0×10⁻⁷","1.0×10⁻¹⁴","1.0×10⁷","1.0×10⁻¹"],k:1,e:"Kw=[H⁺][OH⁻]=1.0×10⁻¹⁴ (mol/L)²。"},
{c:5,q:"次の反応のうち、水H₂Oが酸としてはたらいているものはどれか。",a:["NH₃ + H₂O → NH₄⁺ + OH⁻","HCl + H₂O → H₃O⁺ + Cl⁻","CH₃COOH + H₂O → CH₃COO⁻ + H₃O⁺","H₂SO₄ + H₂O → HSO₄⁻ + H₃O⁺"],k:0,e:"H₂OがNH₃にH⁺を与えてOH⁻になっているので、H₂Oは酸としてはたらいている。他は水がH⁺を受け取り塩基。"},
{c:5,q:"中和の量的関係を表す式として正しいものはどれか。",a:["酸の価数×濃度×体積＝塩基の価数×濃度×体積","酸の濃度×体積＝塩基の濃度×体積","酸の価数×体積＝塩基の価数×体積","酸の質量＝塩基の質量"],k:0,e:"中和点ではH⁺の物質量とOH⁻の物質量が等しい。"},
{c:5,q:"0.10 mol/Lの塩酸20 mLをちょうど中和するのに必要な0.10 mol/L水酸化ナトリウム水溶液の体積はどれか。",a:["10 mL","20 mL","40 mL","5 mL"],k:1,e:"いずれも1価で同濃度なので同体積の20 mLで中和する。"},
{c:5,q:"0.050 mol/Lの硫酸10 mLをちょうど中和するのに必要な0.10 mol/L水酸化ナトリウム水溶液の体積はどれか。",a:["5.0 mL","10 mL","20 mL","40 mL"],k:1,e:"2×0.050×10=1.0、1×0.10×V=1.0よりV=10 mL。"},
{c:5,q:"濃度のわからない水酸化ナトリウム水溶液10 mLを、0.100 mol/Lの硫酸15 mLでちょうど中和した。水酸化ナトリウム水溶液の濃度はどれか。",a:["0.150 mol/L","0.200 mol/L","0.300 mol/L","0.600 mol/L"],k:2,e:"2×0.100×15=3.0、1×c×10=3.0よりc=0.300 mol/L。"},
{c:5,q:"0.10 Lの塩酸に炭酸カルシウム(式量100)を0.20 gずつ加えたところ、合計0.40 gまではすべて溶けたが、合計0.60 gでは溶け残った。塩酸の濃度cの範囲として最も適当なものはどれか。",a:["c＜0.0040 mol/L","0.0080 mol/L≦c＜0.012 mol/L","0.040 mol/L≦c＜0.060 mol/L","0.080 mol/L≦c＜0.12 mol/L"],k:3,e:"CaCO₃+2HCl→CaCl₂+H₂O+CO₂。0.40 g=0.0040 molを溶かすHClは0.0080 mol以上、0.60 g=0.0060 molは溶けきらないのでHClは0.012 mol未満。0.10 Lで割ると0.080≦c＜0.12 mol/L。"},
{c:5,q:"中和滴定で一定体積の溶液を正確にはかりとる器具はどれか。",a:["ホールピペット","ビュレット","メスフラスコ","コニカルビーカー"],k:0,e:"ホールピペットは決まった体積を正確にはかりとる器具。"},
{c:5,q:"中和滴定で滴下した溶液の体積を測る器具はどれか。",a:["ホールピペット","ビュレット","メスフラスコ","メスシリンダー"],k:1,e:"ビュレットは目盛りを読んで滴下量を求める器具。"},
{c:5,q:"正確な濃度の水溶液を一定体積調製するのに使う器具はどれか。",a:["ホールピペット","ビュレット","メスフラスコ","三角フラスコ"],k:2,e:"メスフラスコは標線まで溶媒を加えて所定体積の溶液をつくる器具。"},
{c:5,q:"中和滴定で、使用する溶液であらかじめ内部をすすぐ(共洗いする)必要がある器具はどれか。",a:["ホールピペットとビュレット","メスフラスコとコニカルビーカー","コニカルビーカーのみ","すべての器具"],k:0,e:"濃度が変わると誤差になるホールピペットとビュレットは共洗いする。"},
{c:5,q:"中和滴定に使う器具のうち、加熱して乾燥させてはいけないものはどれか。",a:["メスフラスコ","三角フラスコ","ろうと","試験管"],k:0,e:"メスフラスコは加熱すると変形して体積が変わり、正確な濃度が得られなくなる。"},
{c:5,q:"コニカルビーカーが純水でぬれていても滴定結果に影響しない理由はどれか。",a:["中に入れた溶質の物質量が変わらないため","純水が中和に関わるため","体積が変わらないため","水が蒸発するため"],k:0,e:"薄まっても中和に必要なH⁺やOH⁻の物質量は変わらないので、滴定量に影響しない。"},
{c:5,q:"フェノールフタレイン溶液の色の変化として正しいものはどれか。",a:["酸性で無色、塩基性で赤色","酸性で赤色、塩基性で黄色","酸性で黄色、塩基性で青色","常に無色"],k:0,e:"変色域は約pH8.0〜9.8で、無色から赤色に変わる。"},
{c:5,q:"メチルオレンジの変色域として最も適当なものはどれか。",a:["pH 1.0〜2.0","pH 3.1〜4.4","pH 6.0〜7.6","pH 8.0〜9.8"],k:1,e:"メチルオレンジは約pH3.1〜4.4で赤色から黄色に変わる。"},
{c:5,q:"酢酸を水酸化ナトリウム水溶液で滴定するとき、指示薬として適切なものはどれか。",a:["フェノールフタレイン","メチルオレンジ","どちらでもよい","指示薬は不要"],k:0,e:"弱酸と強塩基の中和点は塩基性側にあるため、変色域が塩基性のフェノールフタレインを使う。"},
{c:5,q:"塩化水素をアンモニア水で滴定するとき、指示薬として適切なものはどれか。",a:["フェノールフタレイン","メチルオレンジ","BTB溶液のみ","指示薬は不要"],k:1,e:"強酸と弱塩基の中和点は酸性側にあるため、変色域が酸性のメチルオレンジを使う。"},
{c:5,q:"炭酸水素ナトリウムNaHCO₃は塩の分類上どれにあたるか。",a:["正塩","酸性塩","塩基性塩","複塩"],k:1,e:"組成式中に酸のHが残っているので酸性塩。水溶液の液性とは別の分類であることに注意。"},
{c:5,q:"炭酸水素ナトリウム水溶液の液性はどれか。",a:["酸性","中性","塩基性","判断できない"],k:2,e:"NaHCO₃は酸性塩だが、弱酸と強塩基からできた塩なので水溶液は塩基性を示す。"},
{c:5,q:"硫酸水素ナトリウムNaHSO₄水溶液の液性はどれか。",a:["酸性","中性","塩基性","判断できない"],k:0,e:"強酸の硫酸由来のHが残っているため、水溶液は酸性を示す。"},
{c:5,q:"酢酸ナトリウムCH₃COONa水溶液の液性はどれか。",a:["酸性","中性","塩基性","判断できない"],k:2,e:"弱酸(酢酸)と強塩基(NaOH)からできた正塩なので、加水分解により塩基性になる。"},
{c:5,q:"塩化アンモニウムNH₄Cl水溶液の液性はどれか。",a:["酸性","中性","塩基性","判断できない"],k:0,e:"強酸(HCl)と弱塩基(NH₃)からできた塩なので酸性を示す。"},
{c:5,q:"塩化ナトリウム水溶液の液性はどれか。",a:["酸性","中性","塩基性","判断できない"],k:1,e:"強酸(HCl)と強塩基(NaOH)からできた塩なので中性。"},
{c:5,q:"中和滴定曲線において、中和点付近でpHはどのように変化するか。",a:["ほとんど変化しない","急激に大きく変化する","一定の割合で緩やかに変化する","減少し続ける"],k:1,e:"中和点付近ではわずかな滴下量でpHが大きく跳ぶ。この性質を指示薬で検出する。"},
{c:5,q:"二酸化炭素を溶かした水の液性はどれか。",a:["弱酸性","中性","弱塩基性","強塩基性"],k:0,e:"CO₂は水に溶けて炭酸H₂CO₃となり、弱酸性を示す。"},
{c:5,q:"酸と塩基および酸性・塩基性に関する記述として、誤りを含むものはどれか。",a:["酸の水溶液は必ず金属を溶かす","酸性の水溶液は青色リトマス紙を赤色に変える","塩基性の水溶液はフェノールフタレインを赤色にする","中和すると水と塩ができる"],k:0,e:"銅や銀は塩酸や希硫酸には溶けない。酸なら必ず金属を溶かすとはいえない。"},
// 分野6 酸化還元と電池
{c:6,q:"単体中の原子の酸化数はどれか。",a:["0","+1","−1","元素によって異なる"],k:0,e:"単体を構成する原子の酸化数はつねに0。"},
{c:6,q:"化合物中の水素原子の酸化数は、ふつう何になるか。",a:["0","+1","−1","+2"],k:1,e:"通常は+1。ただしNaHなど金属の水素化物では−1になる。"},
{c:6,q:"化合物中の酸素原子の酸化数は、ふつう何になるか。",a:["0","−1","−2","+2"],k:2,e:"通常は−2。ただし過酸化水素H₂O₂では−1になる。"},
{c:6,q:"過マンガン酸カリウムKMnO₄のマンガン原子の酸化数はどれか。",a:["+4","+6","+7","+8"],k:2,e:"(+1)+x+(−2)×4=0 より x=+7。"},
{c:6,q:"二クロム酸カリウムK₂Cr₂O₇のクロム原子の酸化数はどれか。",a:["+3","+6","+7","+12"],k:1,e:"(+1)×2+2x+(−2)×7=0 より 2x=+12、x=+6。"},
{c:6,q:"二酸化硫黄SO₂の硫黄原子の酸化数はどれか。",a:["+2","+4","+6","−2"],k:1,e:"x+(−2)×2=0 より x=+4。"},
{c:6,q:"硫酸H₂SO₄の硫黄原子の酸化数はどれか。",a:["+2","+4","+6","−2"],k:2,e:"(+1)×2+x+(−2)×4=0 より x=+6。"},
{c:6,q:"過酸化水素H₂O₂の酸素原子の酸化数はどれか。",a:["0","−1","−2","+1"],k:1,e:"Hが+1なので (+1)×2+2x=0 より x=−1。過酸化物では例外的に−1。"},
{c:6,q:"水素化ナトリウムNaHの水素原子の酸化数はどれか。",a:["+1","0","−1","−2"],k:2,e:"Naが+1なので H は−1。金属の水素化物では H は−1になる。"},
{c:6,q:"硝酸HNO₃の窒素原子の酸化数はどれか。",a:["+3","+4","+5","−3"],k:2,e:"(+1)+x+(−2)×3=0 より x=+5。"},
{c:6,q:"アンモニアNH₃の窒素原子の酸化数はどれか。",a:["+3","−3","+5","0"],k:1,e:"Hが+1なので x+(+1)×3=0 より x=−3。"},
{c:6,q:"次のうち、示した原子の酸化数が二酸化硫黄SO₂の硫黄原子と同じものはどれか。",a:["Na₂SO₄のS","Na₂SO₃のS","H₂SのS","硫黄の単体S"],k:1,e:"SO₂のSは+4。Na₂SO₃のSも+4。Na₂SO₄は+6、H₂Sは−2、単体は0。"},
{c:6,q:"次のうち、示した原子の酸化数が最も大きいものはどれか。",a:["KMnO₄のMn","K₂Cr₂O₇のCr","H₂SO₄のS","HNO₃のN"],k:0,e:"Mnは+7、Crは+6、Sは+6、Nは+5。最大はMnの+7。"},
{c:6,q:"ある原子が酸化されたと判断できるのはどのような場合か。",a:["酸化数が増加したとき","酸化数が減少したとき","酸化数が0のとき","電子を受け取ったとき"],k:0,e:"酸化=電子を失う=酸化数が増加する。"},
{c:6,q:"ある原子が還元されたと判断できるのはどのような場合か。",a:["電子を受け取ったとき","電子を失ったとき","酸化数が増加したとき","酸素と結びついたとき"],k:0,e:"還元=電子を受け取る=酸化数が減少する。"},
{c:6,q:"酸化剤とはどのようなはたらきをする物質か。",a:["相手を酸化し、自身は還元される","相手を還元し、自身は酸化される","どちらも酸化される","反応に関わらない"],k:0,e:"酸化剤は相手から電子を奪う。その結果、自身の酸化数は減少する。"},
{c:6,q:"過酸化水素が還元剤としてはたらくのは、次のどの物質と反応するときか。",a:["過マンガン酸カリウム","ヨウ化カリウム","二酸化硫黄","硫化水素"],k:0,e:"H₂O₂は相手によって酸化剤にも還元剤にもなる。強い酸化剤のKMnO₄に対しては還元剤としてはたらく。"},
{c:6,q:"次のうち酸化還元反応でないものはどれか。",a:["HCl + NaOH → NaCl + H₂O","2H₂ + O₂ → 2H₂O","Zn + 2HCl → ZnCl₂ + H₂","2Cu + O₂ → 2CuO"],k:0,e:"中和反応では酸化数が変化する原子がないため、酸化還元反応ではない。"},
{c:6,q:"次の反応のうち、酸化還元反応であるものはどれか。",a:["CaCO₃ + 2HCl → CaCl₂ + H₂O + CO₂","Mg + 2HCl → MgCl₂ + H₂","NaOH + HNO₃ → NaNO₃ + H₂O","AgNO₃ + NaCl → AgCl + NaNO₃"],k:1,e:"Mgは0から+2に、Hは+1から0に酸化数が変化しているので酸化還元反応。他は酸化数が変化しない。"},
{c:6,q:"二酸化硫黄SO₂の酸化剤・還元剤としてのはたらきについて、正しいものはどれか。",a:["相手によって酸化剤にも還元剤にもなる","つねに酸化剤としてはたらく","つねに還元剤としてはたらく","酸化還元反応に関わらない"],k:0,e:"Sの酸化数+4は中間の値なので、増加も減少もでき、両方のはたらきをもつ。"},
{c:6,q:"金属のイオン化傾向の並びとして正しいものはどれか。",a:["K＞Ca＞Na＞Mg＞Zn＞Fe＞Cu＞Ag","Ag＞Cu＞Fe＞Zn＞Na＞K","Cu＞Zn＞Fe＞Na＞Ca＞K","Fe＞Zn＞Cu＞Ag＞Na＞K"],k:0,e:"貸そうかな、まああてにすんな、ひどすぎる借金(K Ca Na Mg Al Zn Fe Ni Sn Pb H Cu Hg Ag Pt Au)。"},
{c:6,q:"常温の水と激しく反応して水素を発生する金属はどれか。",a:["ナトリウム","鉄","銅","銀"],k:0,e:"K・Ca・Naは常温の水と激しく反応する。"},
{c:6,q:"常温の水とは反応しないが、熱水と反応して水素を発生する金属はどれか。",a:["マグネシウム","銅","銀","金"],k:0,e:"Mgは熱水と反応する。AlやZn、Feは高温の水蒸気と反応する。"},
{c:6,q:"常温の水や熱水とは反応しないが、高温の水蒸気と反応して水素を発生する金属はどれか。",a:["鉄","銅","銀","白金"],k:0,e:"Fe・Zn・Alは高温の水蒸気と反応する。Cu以降は水と反応しない。"},
{c:6,q:"塩酸に溶けない金属はどれか。",a:["亜鉛","鉄","マグネシウム","銅"],k:3,e:"水素よりイオン化傾向が小さいCu・Hg・Ag・Pt・Auは塩酸や希硫酸に溶けない。"},
{c:6,q:"塩酸には溶けないが希硝酸には溶ける金属はどれか。",a:["銅","金","白金","マグネシウム"],k:0,e:"Cu・Hg・Agは酸化力の強い硝酸や熱濃硫酸には溶ける。"},
{c:6,q:"王水にしか溶けない金属の組合せはどれか。",a:["金と白金","銅と銀","鉄と亜鉛","鉛とスズ"],k:0,e:"AuとPtはイオン化傾向が極めて小さく、濃硝酸と濃塩酸の混合物である王水にのみ溶ける。"},
{c:6,q:"硫酸銅(II)水溶液に亜鉛板を入れたときに起こる変化はどれか。",a:["亜鉛板に銅が析出する","銅板に亜鉛が析出する","水素が発生する","変化しない"],k:0,e:"Znの方がイオン化傾向が大きいのでZnが溶けてZn²⁺となり、Cu²⁺が還元されてCuが析出する。"},
{c:6,q:"硫酸亜鉛水溶液に銅板を入れたときに起こる変化はどれか。",a:["亜鉛が析出する","銅が溶ける","水素が発生する","変化は起こらない"],k:3,e:"CuよりZnの方がイオン化傾向が大きいため、この反応は起こらない。"},
{c:6,q:"電池の負極で起こる反応はどれか。",a:["酸化反応","還元反応","中和反応","電離"],k:0,e:"負極では金属などが電子を放出する酸化反応が起こる。"},
{c:6,q:"電池の正極で起こる反応はどれか。",a:["酸化反応","還元反応","燃焼","蒸発"],k:1,e:"正極では外部回路から流れてきた電子を受け取る還元反応が起こる。"},

{c:6,q:"鉛蓄電池の分類として正しいものはどれか。",a:["一次電池","二次電池","燃料電池","太陽電池"],k:1,e:"充電して繰り返し使える電池が二次電池(蓄電池)。自動車のバッテリーに使われる。"},

{c:6,q:"水素と酸素を用いた燃料電池の全体の反応で生成する物質はどれか。",a:["水","二酸化炭素","水素","過酸化水素"],k:0,e:"2H₂+O₂→2H₂Oとなり、生成物は水だけ。二酸化炭素を出さない点が特徴。"},
{c:6,q:"スマートフォンやノートパソコンに広く使われている二次電池はどれか。",a:["リチウムイオン電池","マンガン乾電池","ボルタ電池","空気電池"],k:0,e:"リチウムイオン電池は小型・軽量で高電圧が得られる二次電池。"},
{c:6,q:"2種類の金属を電極とする電池の起電力について、正しいものはどれか。",a:["イオン化傾向の差が大きいほど起電力は大きい","イオン化傾向の差が小さいほど起電力は大きい","金属の質量で決まる","電極の色で決まる"],k:0,e:"イオン化傾向の差が大きいほど電子の移動が起こりやすく、起電力が大きくなる。"},
{c:6,q:"塩化銅(II)水溶液を炭素電極で電気分解したとき、陰極で起こる変化はどれか。",a:["銅が析出する","塩素が発生する","水素が発生する","酸素が発生する"],k:0,e:"陰極ではCu²⁺が電子を受け取って還元され、Cuが析出する。陽極では塩素が発生する。"},
{c:6,q:"水を電気分解したとき、陰極と陽極で発生する気体の体積比(同温同圧)はどれか。",a:["陰極:陽極＝1:1","陰極:陽極＝2:1","陰極:陽極＝1:2","陰極:陽極＝3:1"],k:1,e:"陰極でH₂、陽極でO₂が発生し、2H₂O→2H₂+O₂より体積比は2:1。"},
{c:6,q:"塩化ナトリウム水溶液を電気分解したとき、陽極で発生する気体はどれか。",a:["塩素","水素","酸素","窒素"],k:0,e:"陽極ではCl⁻が酸化されて塩素Cl₂が発生する。陰極では水素が発生する。"},
{c:6,q:"鉄の製錬において、鉄鉱石中の酸化鉄を還元するのに主にはたらく物質はどれか。",a:["一酸化炭素","酸素","水素","塩素"],k:0,e:"溶鉱炉でコークスから生じた一酸化炭素COが酸化鉄を還元して鉄になる。"},
{c:6,q:"アルミニウムの単体を得るための方法はどれか。",a:["溶融塩電解(融解塩電解)","一酸化炭素による還元","水溶液の電気分解","加熱による分解"],k:0,e:"Alはイオン化傾向が大きく水溶液の電気分解では得られないため、酸化アルミニウムを融解して電気分解する。"},
{c:6,q:"純度の高い銅を得るために行う操作の名称はどれか。",a:["電解精錬","溶融塩電解","分留","再結晶"],k:0,e:"粗銅を陽極、純銅を陰極として硫酸銅(II)水溶液を電気分解し、不純物を除く。"},
{c:6,q:"トタンとブリキについて、正しい組合せはどれか。",a:["トタン:鉄に亜鉛めっき ブリキ:鉄にスズめっき","トタン:鉄にスズめっき ブリキ:鉄に亜鉛めっき","どちらも銅めっき","どちらもアルミニウムめっき"],k:0,e:"トタンは亜鉛めっき鋼板、ブリキはスズめっき鋼板。トタンは傷ついても亜鉛が先に酸化されて鉄を守る。"},
{c:6,q:"鉄がさびる現象について、正しい説明はどれか。",a:["鉄が酸素や水と反応して酸化される","鉄が還元される","鉄が中和される","鉄が昇華する"],k:0,e:"さび(酸化鉄の生成)は鉄が酸化される現象。塗装やめっきで酸素・水との接触を防ぐと防止できる。"},
{c:6,q:"化学電池に関する記述として正しいものはどれか。",a:["化学エネルギーを電気エネルギーとして取り出す装置である","電気エネルギーを化学エネルギーに変える装置である","光エネルギーを電気に変える装置である","熱を電気に変える装置である"],k:0,e:"化学電池は酸化還元反応の化学エネルギーを電気エネルギーとして取り出す。逆向きが電気分解。"},
{c:6,q:"次の実験のうち、酸化還元反応が起こって気体が発生するものはどれか。",a:["亜鉛に希硫酸を加える","炭酸カルシウムに塩酸を加える","塩化アンモニウムと水酸化カルシウムを混ぜて加熱する","炭酸水素ナトリウムを加熱する"],k:0,e:"Zn+H₂SO₄→ZnSO₄+H₂ではZnが0から+2、Hが+1から0へ変化する酸化還元反応。他は酸化数が変化しない。"},
// 組合せ型（6択・8択）本試験の組合せ問題を再現
{c:2,q:"次の記述ア〜ウの正誤の組合せとして正しいものはどれか。\nア　互いに同位体である原子の化学的性質はほぼ同じである。\nイ　貴ガスの価電子の数は0とする。\nウ　第1イオン化エネルギーは、同一周期では原子番号が大きいほど小さくなる。",a:["ア正　イ正　ウ正","ア正　イ正　ウ誤","ア正　イ誤　ウ正","ア正　イ誤　ウ誤","ア誤　イ正　ウ正","ア誤　イ正　ウ誤","ア誤　イ誤　ウ正","ア誤　イ誤　ウ誤"],k:1,e:"ア正：同位体は電子配置が同じなので化学的性質はほぼ同じ。イ正：貴ガスは安定なので価電子0とする。ウ誤：同一周期では原子番号が大きいほど第1イオン化エネルギーは大きくなる。"},
{c:3,q:"次の記述ア〜ウの正誤の組合せとして正しいものはどれか。\nア　ダイヤモンドは電気をよく通す。\nイ　黒鉛は電気をよく通す。\nウ　塩化ナトリウムは固体の状態で電気をよく通す。",a:["ア正　イ正　ウ正","ア正　イ正　ウ誤","ア正　イ誤　ウ正","ア誤　イ正　ウ正","ア誤　イ正　ウ誤","ア誤　イ誤　ウ正","ア誤　イ誤　ウ誤","ア正　イ誤　ウ誤"],k:4,e:"ア誤：ダイヤモンドは価電子がすべて共有結合に使われ電気を通さない。イ正：黒鉛は層内を動ける電子があり通す。ウ誤：イオン結晶の固体はイオンが動けず通さない。"},
{c:5,q:"次の記述ア〜ウの正誤の組合せとして正しいものはどれか。\nア　酢酸は弱酸である。\nイ　水酸化バリウムは2価の塩基である。\nウ　塩化アンモニウムの水溶液は塩基性を示す。",a:["ア正　イ正　ウ正","ア正　イ正　ウ誤","ア正　イ誤　ウ正","ア正　イ誤　ウ誤","ア誤　イ正　ウ正","ア誤　イ正　ウ誤","ア誤　イ誤　ウ正","ア誤　イ誤　ウ誤"],k:1,e:"ア正：酢酸は電離度の小さい弱酸。イ正：Ba(OH)₂はOH⁻を2個出す2価の塩基。ウ誤：強酸HClと弱塩基NH₃からできた塩なので酸性。"},
{c:6,q:"次の記述ア〜ウの正誤の組合せとして正しいものはどれか。\nア　電池の負極では還元反応が起こる。\nイ　銅は塩酸に溶けない。\nウ　鉛蓄電池は充電して繰り返し使える二次電池である。",a:["ア正　イ正　ウ正","ア正　イ正　ウ誤","ア正　イ誤　ウ正","ア誤　イ正　ウ正","ア誤　イ正　ウ誤","ア誤　イ誤　ウ正","ア誤　イ誤　ウ誤","ア正　イ誤　ウ誤"],k:3,e:"ア誤：負極は電子を放出する酸化反応。イ正：Cuは水素よりイオン化傾向が小さく塩酸に溶けない。ウ正：鉛蓄電池は代表的な二次電池。"},
{c:4,q:"次の記述ア〜ウの正誤の組合せとして正しいものはどれか。\nア　標準状態で1 molの気体が占める体積は、気体の種類によらず22.4 Lである。\nイ　同じ質量で比べると、分子量が大きい気体ほど物質量が大きい。\nウ　質量パーセント濃度は、溶質の質量を溶液の質量で割って100倍した値である。",a:["ア正　イ正　ウ正","ア正　イ正　ウ誤","ア正　イ誤　ウ正","ア正　イ誤　ウ誤","ア誤　イ正　ウ正","ア誤　イ正　ウ誤","ア誤　イ誤　ウ正","ア誤　イ誤　ウ誤"],k:2,e:"ア正：アボガドロの法則。イ誤：物質量=質量÷モル質量なので、分子量が大きいほど物質量は小さい。ウ正：分母は溶液全体の質量。"},
{c:1,q:"次の記述ア〜ウの正誤の組合せとして正しいものはどれか。\nア　蒸留では、冷却器の冷却水を下部から入れて上部から出す。\nイ　再結晶は、溶解度が温度によって変化することを利用した分離操作である。\nウ　昇華法は、液体を気体に変えて分離する操作である。",a:["ア正　イ正　ウ正","ア正　イ正　ウ誤","ア正　イ誤　ウ正","ア誤　イ正　ウ正","ア誤　イ正　ウ誤","ア誤　イ誤　ウ正","ア誤　イ誤　ウ誤","ア正　イ誤　ウ誤"],k:1,e:"ア正：下から入れて上から出すと冷却器内が水で満たされる。イ正：溶解度の温度差を利用する。ウ誤：昇華法は固体が直接気体になる性質を利用する操作。"},
{c:5,q:"3種類の水溶液A・B・Cは、塩酸、水酸化ナトリウム水溶液、塩化ナトリウム水溶液のいずれかである。BTB溶液を加えるとAは黄色、Bは青色、Cは緑色になった。A・B・Cの組合せとして正しいものはどれか。",a:["A塩酸　B水酸化ナトリウム水溶液　C塩化ナトリウム水溶液","A塩酸　B塩化ナトリウム水溶液　C水酸化ナトリウム水溶液","A水酸化ナトリウム水溶液　B塩酸　C塩化ナトリウム水溶液","A水酸化ナトリウム水溶液　B塩化ナトリウム水溶液　C塩酸","A塩化ナトリウム水溶液　B塩酸　C水酸化ナトリウム水溶液","A塩化ナトリウム水溶液　B水酸化ナトリウム水溶液　C塩酸"],k:0,e:"BTB溶液は酸性で黄色、中性で緑色、塩基性で青色。よってAが塩酸、Bが水酸化ナトリウム水溶液、Cが中性の塩化ナトリウム水溶液。"},
{c:3,q:"3種類の固体A・B・Cは、ヨウ素、塩化ナトリウム、銅のいずれかである。Aは加熱すると液体にならずに気体になった。Bは固体では電気を通さないが、水に溶かすと電気を通した。Cは固体のまま電気をよく通した。A・B・Cの組合せとして正しいものはどれか。",a:["Aヨウ素　B塩化ナトリウム　C銅","Aヨウ素　B銅　C塩化ナトリウム","A塩化ナトリウム　Bヨウ素　C銅","A塩化ナトリウム　B銅　Cヨウ素","A銅　Bヨウ素　C塩化ナトリウム","A銅　B塩化ナトリウム　Cヨウ素"],k:0,e:"昇華するAは分子結晶のヨウ素。固体では通さず水溶液で通すBはイオン結晶の塩化ナトリウム。固体で通すCは金属の銅。"},
{c:6,q:"3種類の金属A・B・Cは、亜鉛、銀、銅のいずれかである。Aだけが塩酸に溶けて水素を発生した。BとCのうち、硝酸銀水溶液に入れると表面に銀が析出したのはCであった。A・B・Cの組合せとして正しいものはどれか。",a:["A亜鉛　B銀　C銅","A亜鉛　B銅　C銀","A銅　B亜鉛　C銀","A銅　B銀　C亜鉛","A銀　B亜鉛　C銅","A銀　B銅　C亜鉛"],k:0,e:"塩酸に溶けるAは水素よりイオン化傾向の大きい亜鉛。銀を析出させたCは銀よりイオン化傾向の大きい銅。残るBが銀。"},
{c:1,q:"3種類の気体A・B・Cは、水素、酸素、二酸化炭素のいずれかである。Aは同温同圧で最も密度が小さかった。Bに火のついた線香を入れると激しく燃えた。Cを石灰水に通すと白く濁った。A・B・Cの組合せとして正しいものはどれか。",a:["A水素　B酸素　C二酸化炭素","A水素　B二酸化炭素　C酸素","A酸素　B水素　C二酸化炭素","A酸素　B二酸化炭素　C水素","A二酸化炭素　B水素　C酸素","A二酸化炭素　B酸素　C水素"],k:0,e:"最も密度が小さいAは分子量2.0の水素。助燃性を示すBは酸素。石灰水を白濁させるCは二酸化炭素。"},
{c:1,q:"3種類の物質A・B・Cを白金線につけて炎の中に入れたところ、Aは黄色、Bは赤紫色、Cは青緑色の炎色反応を示した。A・B・Cに含まれる元素の組合せとして正しいものはどれか。",a:["Aナトリウム　Bカリウム　C銅","Aナトリウム　B銅　Cカリウム","Aカリウム　Bナトリウム　C銅","Aカリウム　B銅　Cナトリウム","A銅　Bナトリウム　Cカリウム","A銅　Bカリウム　Cナトリウム"],k:0,e:"黄色はナトリウム、赤紫色はカリウム、青緑色は銅。"},
{c:2,q:"ナトリウムNa、マグネシウムMg、アルゴンArの第1イオン化エネルギーを大きい順に並べたものはどれか。",a:["Ar＞Mg＞Na","Ar＞Na＞Mg","Mg＞Ar＞Na","Mg＞Na＞Ar","Na＞Mg＞Ar","Na＞Ar＞Mg"],k:0,e:"いずれも第3周期。同一周期では原子番号が大きいほど大きくなるので、Ar(18)＞Mg(12)＞Na(11)。"},
{c:3,q:"水H₂O、硫化水素H₂S、メタンCH₄の沸点を高い順に並べたものはどれか。",a:["H₂O＞H₂S＞CH₄","H₂O＞CH₄＞H₂S","H₂S＞H₂O＞CH₄","H₂S＞CH₄＞H₂O","CH₄＞H₂O＞H₂S","CH₄＞H₂S＞H₂O"],k:0,e:"H₂Oは水素結合をもつため分子量が小さいのに最も沸点が高い。残るH₂S(34)とCH₄(16)は分子量の大きいH₂Sが高い。"},
{c:6,q:"マグネシウムMg、亜鉛Zn、銅Cuをイオン化傾向の大きい順に並べたものはどれか。",a:["Mg＞Zn＞Cu","Mg＞Cu＞Zn","Zn＞Mg＞Cu","Zn＞Cu＞Mg","Cu＞Mg＞Zn","Cu＞Zn＞Mg"],k:0,e:"イオン化列 K Ca Na Mg Al Zn Fe Ni Sn Pb (H) Cu より Mg＞Zn＞Cu。"},
{c:2,q:"O²⁻、F⁻、Na⁺はいずれもネオンと同じ電子配置をもつ。これらのイオン半径を大きい順に並べたものはどれか。",a:["O²⁻＞F⁻＞Na⁺","O²⁻＞Na⁺＞F⁻","F⁻＞O²⁻＞Na⁺","F⁻＞Na⁺＞O²⁻","Na⁺＞F⁻＞O²⁻","Na⁺＞O²⁻＞F⁻"],k:0,e:"電子数が同じなら、原子核の正電荷(原子番号)が大きいほど電子を強く引きつけて小さくなる。O(8)＜F(9)＜Na(11)なので半径は逆順。"},
{c:5,q:"濃度がいずれも0.10 mol/Lである塩酸、酢酸水溶液、水酸化ナトリウム水溶液のpHを、小さい順に並べたものはどれか。",a:["塩酸＜酢酸水溶液＜水酸化ナトリウム水溶液","塩酸＜水酸化ナトリウム水溶液＜酢酸水溶液","酢酸水溶液＜塩酸＜水酸化ナトリウム水溶液","酢酸水溶液＜水酸化ナトリウム水溶液＜塩酸","水酸化ナトリウム水溶液＜塩酸＜酢酸水溶液","水酸化ナトリウム水溶液＜酢酸水溶液＜塩酸"],k:0,e:"同濃度なら強酸の塩酸が最も[H⁺]が大きくpHが小さい。次に一部しか電離しない酢酸。塩基性の水酸化ナトリウム水溶液が最大。"},

/* ===== 第2問（20点）実験・探究セット ===== */
const SETS = [
{
 title:"食酢中の酢酸の濃度を求める",
 lead:`食酢に含まれる酢酸CH₃COOHの濃度を求めるため、次の実験を行った。食酢に含まれる酸はすべて酢酸とみなす。
<br><br><b>操作Ⅰ</b>　市販の食酢10.0 mLを<b>器具X</b>で正確にはかりとり、<b>器具Y</b>に移して純水を加え、全体を100 mLにした（10倍希釈液）。

{
 title:"硝酸カリウムの再結晶",
 lead:`硝酸カリウムKNO₃に少量の塩化ナトリウムNaClが混じった試料がある。図1はKNO₃の水に対する溶解度曲線である。次の実験を行った。
<br><br><b>操作Ⅰ</b>　60℃の水100 gに、この試料110 gを加えてよくかき混ぜたところ、すべて溶けた。
<br><b>操作Ⅱ</b>　この水溶液を20℃までゆっくり冷却したところ、結晶が析出した。
<br><b>操作Ⅲ</b>　析出した結晶をろ過して取り出した。

  {lb:"問1",c:4,q:"図1から読み取れる、40℃の水100 gに溶けるKNO₃の最大質量に最も近い値はどれか。",a:["32 g","46 g","64 g","110 g"],k:2,e:"溶解度曲線の40℃の点を読むと約64 g/100g水。20℃は32、60℃は110。"},
  {lb:"問2 a",c:4,q:"操作Ⅱで析出するKNO₃の質量に最も近い値はどれか。",a:["32 g","64 g","78 g","110 g"],k:2,e:"20℃で水100 gに溶けるのは32 gまで。溶かした110 gとの差 110−32 = 78 gが析出する。"},
  {lb:"問2 b",c:4,q:"同じ試料を使い、60℃の水200 gに220 gを溶かしてから20℃まで冷却した場合、析出するKNO₃の質量に最も近い値はどれか。",a:["78 g","110 g","156 g","188 g"],k:2,e:"水が2倍なら溶解量も2倍。20℃では32×2 = 64 gしか溶けないので、220−64 = 156 gが析出する。"},
  {lb:"問3",c:4,q:"40℃におけるKNO₃の飽和水溶液の質量パーセント濃度に最も近い値はどれか。",a:["28%","39%","61%","64%"],k:1,e:"水100 gに64 g溶けた飽和水溶液の質量は164 g。64÷164×100 ≒ 39%。分母を水100 gにしないよう注意。"},
  {lb:"問4",c:4,q:"この操作でKNO₃を純度よく取り出せる理由として、最も適当なものはどれか。",a:["KNO₃は溶解度の温度変化が大きく、NaClは量が少なく冷却しても溶けたままだから","KNO₃の方がNaClより溶解度が小さいから","NaClは冷却すると分解してしまうから","KNO₃はろ紙を通り抜けないが、NaClは通り抜けるから"],k:0,e:"再結晶は、溶解度の温度変化が大きい物質だけを結晶として取り出す操作。不純物は少量で溶けたまま残るため、結晶側の純度が上がる。"}
 ]
},
{
 title:"貝殻に含まれる炭酸カルシウムの定量",
 lead:`貝殻の主成分は炭酸カルシウムCaCO₃(式量100)である。貝殻に含まれるCaCO₃の割合を調べるため、次の実験を行った。
<br><br><b>実験</b>　よく乾燥させた貝殻の粉末1.20 gに、1.00 mol/Lの塩酸を少量ずつ加え、そのつど発生した二酸化炭素の体積(標準状態に換算した値)の合計を測定して表1を得た。
<br><br>反応は次の式で表される。CaCO₃以外の成分は塩酸と反応しないものとする。
<br><b>CaCO₃ + 2HCl → CaCl₂ + H₂O + CO₂</b>`,
 fig:`<table style="max-width:460px;margin:0 auto"><caption style="font-size:11px;color:#7a5200;padding-bottom:6px">表1　加えた塩酸の体積と発生した二酸化炭素の体積</caption>
<tr><th>加えた塩酸の体積の合計〔mL〕</th><td class="n">5.0</td><td class="n">10.0</td><td class="n">15.0</td><td class="n">20.0</td><td class="n">25.0</td></tr>
<tr><th>発生したCO₂の体積の合計〔mL〕</th><td class="n">56</td><td class="n">112</td><td class="n">168</td><td class="n">224</td><td class="n">224</td></tr></table>`,
 qs:[
  {lb:"問1",c:4,q:"表1から、貝殻に含まれるCaCO₃がちょうどすべて反応したと考えられるのは、塩酸を何mL加えたときか。",a:["10.0 mL","15.0 mL","20.0 mL","25.0 mL"],k:2,e:"20.0 mLまでは塩酸に比例してCO₂が増えているが、それ以降は増えていない。20.0 mLでCaCO₃を使い切ったとわかる。"},
  {lb:"問2 a",c:4,q:"この実験で発生したCO₂の物質量の最大値に最も近い値はどれか。",a:["0.00500 mol","0.0100 mol","0.0200 mol","0.100 mol"],k:1,e:"最大体積は224 mL = 0.224 L。0.224 ÷ 22.4 = 0.0100 mol。"},
  {lb:"問2 b",c:4,q:"貝殻1.20 gに含まれていたCaCO₃の質量に最も近い値はどれか。",a:["0.500 g","1.00 g","1.12 g","1.20 g"],k:1,e:"反応式よりCaCO₃とCO₂の物質量は1:1。0.0100 mol × 100 g/mol = 1.00 g。"},
  {lb:"問3",c:4,q:"この貝殻に含まれるCaCO₃の質量パーセントに最も近い値はどれか。",a:["12%","54%","83%","100%"],k:2,e:"1.00 ÷ 1.20 × 100 ≒ 83%。分母は貝殻全体の質量1.20 g。"},
  {lb:"問4",c:4,q:"塩酸を20.0 mLより多く加えてもCO₂の体積が増えなかった理由として、最も適当なものはどれか。",a:["貝殻中のCaCO₃がすべて反応してしまったから","塩酸が薄まって反応しなくなったから","発生したCO₂が塩酸に溶けたから","反応で生じたCaCl₂が反応をさまたげたから"],k:0,e:"塩酸は十分にあるが、反応する相手のCaCO₃がなくなったため。加えた塩酸20.0 mLは0.0200 molで、CaCO₃ 0.0100 molに必要な量とちょうど一致する。"}
 ]
},

{
 title:"金属のイオン化傾向を調べる",
 lead:`3種類の金属A・B・Cは、亜鉛、銅、銀のいずれかである。これらの金属の性質を調べるため、次の実験を行い、表1の結果を得た。
<br><br><b>実験Ⅰ</b>　各金属の板を希塩酸に入れ、変化を観察した。
<br><b>実験Ⅱ</b>　各金属の板を、他の金属のイオンを含む水溶液に入れ、金属が析出するかどうかを調べた。`,
 fig:`<table style="max-width:470px;margin:0 auto;font-size:12px"><caption style="font-size:11px;color:#7a5200;padding-bottom:6px">表1　実験の結果</caption>

  {lb:"問2",c:6,q:"二酸化硫黄SO₂の硫黄原子の酸化数はどれか。",a:["+2","+4","+6","−2"],k:1,e:"酸素は−2なので x + (−2)×2 = 0 より x = +4。"},
  {lb:"問3",c:6,q:"下線部の物質Zとして最も適当なものと、そのときの硫黄原子の酸化数の組合せはどれか。",a:["SO₃・+6","SO₃・+4","H₂S・−2","S・0"],k:0,e:"SO₂が酸化されると三酸化硫黄SO₃になる。SO₃の硫黄は x + (−2)×3 = 0 より+6で、酸化数が増加している(酸化された)ことが確認できる。"},
  {lb:"問4 a",c:5,q:"硫酸H₂SO₄は何価の酸か。",a:["1価","2価","3価","4価"],k:1,e:"H₂SO₄は1分子から H⁺ を2個放出できるので2価の酸。"},
  {lb:"問4 b",c:5,q:"酸性雨によって酸性に偏った土壌を中和するためにまく物質として、最も適当なものはどれか。",a:["水酸化カルシウム(消石灰)","塩化ナトリウム","硫酸アンモニウム","希塩酸"],k:0,e:"酸を中和するには塩基を加える。Ca(OH)₂は代表的な土壌のpH調整剤。硫酸アンモニウムは強酸と弱塩基の塩で酸性、塩酸は酸なので逆効果。"}
 ]
},
{

 qs:[
  {lb:"問1",c:6,q:"この電池の負極と、そこで起こる変化の組合せとして正しいものはどれか。",a:["亜鉛板・Zn → Zn²⁺ + 2e⁻","亜鉛板・Zn²⁺ + 2e⁻ → Zn","銅板・Cu → Cu²⁺ + 2e⁻","銅板・Cu²⁺ + 2e⁻ → Cu"],k:0,e:"イオン化傾向はZn＞Cuなので、亜鉛が溶け出して電子を放出する(酸化される)。電子を放出する電極が負極。"},
  {lb:"問2",c:6,q:"導線中を電子が流れる向きとして正しいものはどれか。",a:["亜鉛板から銅板へ","銅板から亜鉛板へ","電子は導線中を流れない","電流の向きと同じ向き"],k:0,e:"負極(亜鉛板)で放出された電子が導線を通って正極(銅板)へ流れる。電流の向きは電子の流れと逆になる。"},
  {lb:"問3",c:6,q:"銅板に付着した赤色の物質として最も適当なものはどれか。",a:["銅","酸化銅(II)","亜鉛","硫黄"],k:0,e:"正極では Cu²⁺ + 2e⁻ → Cu の還元が起こり、銅が析出して銅板が太くなる。"},
  {lb:"問4 a",c:6,q:"素焼き板の役割として最も適当なものはどれか。",a:["2つの水溶液がすぐに混ざるのを防ぎつつ、イオンを通して電気的なかたよりを解消する","電子を通して電流を流す","水溶液が蒸発するのを防ぐ","銅イオンだけを完全に通さないようにする"],k:0,e:"反応が進むと負極側は陽イオンが過剰、正極側は陰イオンが過剰になる。素焼き板の細かい穴をイオンが移動することで、このかたよりが解消され電池が働き続ける。"},
  {lb:"問4 b",c:6,q:"亜鉛板と硫酸亜鉛水溶液のかわりに、マグネシウム板と硫酸マグネシウム水溶液を用いた場合、電池の起電力はどうなると考えられるか。",a:["大きくなる","小さくなる","変わらない","電流が流れなくなる"],k:0,e:"イオン化傾向はMg＞Znなので、Cuとの差がより大きくなる。起電力は2つの金属のイオン化傾向の差が大きいほど大きくなる。"}
 ]
},

{
 title:"硫酸と水酸化バリウムの反応",
 lead:`0.10 mol/Lの希硫酸50 mLをビーカーにとり、これに0.10 mol/Lの水酸化バリウム水溶液を少しずつ加えながら、水溶液に流れる電流の大きさを測定したところ、図1のようになった。
<br><br>この反応は次の式で表される。硫酸バリウムBaSO₄(式量233)は水に溶けにくく、白色の沈殿となる。
<br><br><b>H₂SO₄　+　Ba(OH)₂　→　BaSO₄　+　2H₂O</b>`,
 fig:`<svg viewBox="0 0 470 285" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="加えた水酸化バリウム水溶液の体積と電流の関係">

 qs:[
  {lb:"問1",c:5,q:"図1で電流が最小になったときに加えた水酸化バリウム水溶液の体積として、最も適当なものはどれか。",a:["25 mL","50 mL","75 mL","100 mL"],k:1,e:"グラフの谷は50 mL。硫酸は0.10 × 0.050 = 0.0050 mol、水酸化バリウムも同じ0.0050 mol必要なので0.0050 ÷ 0.10 = 0.050 L = 50 mLで一致する。"},
  {lb:"問2",c:3,q:"電流が最小になった理由として最も適当なものはどれか。",a:["水中のイオンがほとんど沈殿と水になり、イオンの数が非常に少なくなったから","水溶液の温度が下がったから","水溶液が濃くなりすぎて、イオンが動けなくなったから","電極の表面に気体が付着したから"],k:0,e:"H⁺とOH⁻は水に、Ba²⁺とSO₄²⁻はBaSO₄の沈殿になる。電流を運ぶイオンがほぼなくなるため電流が最小になる。"},
  {lb:"問3",c:5,q:"生じた白色沈殿の化学式として正しいものはどれか。",a:["BaSO₄","BaCl₂","Ba(OH)₂","BaCO₃"],k:0,e:"Ba²⁺とSO₄²⁻が結びついた硫酸バリウムBaSO₄。水に溶けにくいため沈殿する。"},
  {lb:"問4 a",c:4,q:"電流が最小になるまでに生じたBaSO₄の質量に最も近い値はどれか。式量は233とする。",a:["0.58 g","1.2 g","2.3 g","4.7 g"],k:1,e:"BaSO₄は0.0050 mol生じる。0.0050 × 233 ≒ 1.2 g。"},
  {lb:"問4 b",c:5,q:"50 mLを超えてさらに水酸化バリウム水溶液を加えると電流が大きくなる理由として、最も適当なものはどれか。",a:["余分に加えた水酸化バリウムが電離し、イオンが増えるから","沈殿が溶け出してイオンになるから","水が電離してイオンが増えるから","温度が上がってイオンの動きが速くなるから"],k:0,e:"中和しきったあとに加えた水酸化バリウムは、反応する相手がないのでBa²⁺とOH⁻としてそのまま残る。イオンが増えるので電流が回復する。"}
 ]
},
{
 title:"鉄の製錬",
 lead:`鉄は、鉄鉱石(主成分は酸化鉄(III) Fe₂O₃、式量160)を溶鉱炉に入れ、コークスCや石灰石とともに熱風を送りこんで還元することで得られる。炉内でコークスから生じた一酸化炭素COが、次の式(1)のように酸化鉄(III)を還元する。
<br><br><b>Fe₂O₃　+　3CO　→　2Fe　+　3CO₂</b>　…(1)　（Fe = 56）`,
 fig:`<svg viewBox="0 0 470 235" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="溶鉱炉の模式図">
<path d="M175 40 L295 40 L305 105 L290 175 L180 175 L165 105 Z" fill="#fff4d6" stroke="#8a7c62" stroke-width="1.8"/>

/* ---------- 分野定義（本試験6年分の実測比重） ---------- */
const CATS = {
  1:{name:"物質の構成と分離",  weight:"実測12%／分離操作・炎色反応・三態"},
  2:{name:"原子・イオン・周期表",weight:"実測18%／同位体・電子配置・イオン化エネルギー"},
  3:{name:"化学結合と物質の性質",weight:"実測15%／結晶の性質・分子の形と極性"},
  4:{name:"物質量と化学反応式",  weight:"実測18%／mol計算・濃度・溶解度"},
  5:{name:"酸と塩基・中和滴定",  weight:"実測16%／pH・電離度・滴定計算・塩の液性"},
  6:{name:"酸化還元と電池",      weight:"実測20%／酸化数・イオン化傾向・電池"}
};
/* 第1問10問の分野構成＝本試験6年分の実測比率(12/18/15/18/16/20%)を
   10問に割り付ける。端数は確率的に配分し、長期平均が実測に一致するようにする。 */
const SIM_W = {1:1.212, 2:1.818, 3:1.515, 4:1.818, 5:1.616, 6:2.020};
function simMix(){
  const cs = Object.keys(SIM_W).map(Number);
  let out = [];
  cs.forEach(c=>{ const f = Math.floor(SIM_W[c]);
    for(let i=0;i<f;i++) out.push(c);
    if(Math.random() < SIM_W[c]-f) out.push(c); });
  while(out.length > 10) out.splice(Math.floor(Math.random()*out.length),1);
  while(out.length < 10){
    let r = Math.random()*9.999, a = 0, p = 6;
    for(const c of cs){ a += SIM_W[c]; if(r < a){ p = c; break; } }
    out.push(p);
  }
  return shuffle(out);
}

/* ---------- ID付与とレジストリ ---------- */
BANK.forEach((q,i)=>{ q.id = "B"+i; q.pt = 3; });
SETS.forEach((s,si)=>{ s.id = "S"+(si+1);
  s.qs.forEach((q,qi)=>{ q.id = s.id+"-"+qi; q.set = s; q.pt = 4; }); });
const ALLQ = {};
BANK.forEach(q=>ALLQ[q.id]=q);
SETS.forEach(s=>s.qs.forEach(q=>ALLQ[q.id]=q));

/* ---------- 保存（失敗しても動く） ---------- */
const KEY = "kagakukiso_drill_v2";
let store = {stat:{}, rev:{}, best:0, sims:[], sets:{}};
try{ const r = localStorage.getItem(KEY); if(r) store = Object.assign(store, JSON.parse(r)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
function stat(c){ if(!store.stat[c]) store.stat[c] = {t:0,o:0}; return store.stat[c]; }
/* 復習キュー：誤答で登録、2回連続正解で卒業 */
const NEED = 2;
function revSize(){ return Object.keys(store.rev).filter(k=>ALLQ[k]).length; }
function markWrong(id){ store.rev[id] = 0; }
function markRight(id){
  if(store.rev[id] === undefined) return;
  store.rev[id]++;
  if(store.rev[id] >= NEED) delete store.rev[id];
}

/* ---------- 汎用 ---------- */
const $ = s => document.querySelector(s);
const app = $("#app");
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function pick(pool,n){ return shuffle(pool).slice(0,n); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function nl(s){ return esc(s).replace(/\n/g,"<br>"); }
function fmt(sec){ const m=Math.floor(sec/60), s=sec%60; return m+":"+String(s).padStart(2,"0"); }
function idx(q){ return q.a.map((_,i)=>i); }
$("#qcount").textContent = BANK.length + SETS.reduce((a,s)=>a+s.qs.length,0);

let S = null, tick = null;
function clearTick(){ if(tick){ clearInterval(tick); tick=null; } }

/* 分野の習熟段階：0=未着手 1=練習中 2=仕上がり */
function catLevel(c){
  const st = stat(c);
  if(st.t < 10) return 0;
  const p = st.o/st.t;
  return (st.t >= 20 && p >= 0.8) ? 2 : 1;
}
const BADGE = ["未着手","練習中","仕上がり"];
function setDone(s){ return store.sets[s.id] !== undefined; }

function home(){
  clearTick(); S=null;
  const cs = Object.keys(CATS).map(Number);
  const lv = {}; cs.forEach(c=>lv[c]=catLevel(c));
  const done2 = cs.filter(c=>lv[c]===2).length;
  const untouched = cs.filter(c=>lv[c]===0);

  /* --- 次にやること（1つだけ提案） --- */

  }else if(untouched.length){
    const c = untouched[0];

    const c = cs.filter(x=>lv[x]<2).sort((a,b)=>(stat(a).o/stat(a).t)-(stat(b).o/stat(b).t))[0];

  /* --- ステップ1：分野別 --- */

      </div>

  }).join("");

  /* --- ステップ2：第2問の進捗（テーマは伏せる） --- */
  const setScores = SETS.filter(setDone).map(s=>store.sets[s.id]*4);
  const setAvg = setScores.length ? Math.round(setScores.reduce((a,b)=>a+b,0)/setScores.length) : 0;

  const tot = cs.reduce((a,c)=>{a.t+=stat(c).t;a.o+=stat(c).o;return a;},{t:0,o:0});
  const rate = tot.t ? Math.round(tot.o/tot.t*100) : 0;
  const lastSim = store.sims.length ? store.sims[store.sims.length-1] : null;
  const best = store.sims.length ? Math.max.apply(null,store.sims.map(s=>s.score)) : 0;

  /* 進捗バッジ：各段階の条件を満たし、かつ前の段階も達成しているときだけ緑にする。
     条件だけ満たして順番が前後している場合は点線（達成待ち）で表示する。 */
  const m1 = done2===6, m2 = setsDone>=3, m3 = best>=35;
  const p1 = m1, p2 = p1 && m2, p3 = p2 && m3;
  const pcls = (on,met)=> "pill" + (on ? " on" : (met ? " pre" : ""));

  app.innerHTML = `
  <div class="card rec">
    <div class="rec-lb">次にやること</div>
    <button class="btn btn-main" onclick="${rec.f}">${rec.t}<small>${rec.s}</small></button>
    <div class="prog">
      <span class="${pcls(p1,m1)}"><span class="lb">${p1?"✓ ":""}① 分野別ドリル</span>

        <span class="vl">${store.sims.length?"最高 "+best+"点":"未受験"}　目標 35点</span></span>
    </div>
    ${(m1&&!p1)||(m2&&!p2)||(m3&&!p3)
      ? `<p class="prognote">点線は「条件は満たしているが、前の段階がまだ」という意味です。①→②→③の順に緑にしていきましょう。</p>` : ""}
  </div>

  <div class="card">
    <h2><span class="stepnum">1</span>分野別ドリル（まずはここから）</h2>

    <div class="cats">${catCards}</div>

      ? "分野別が仕上がってからでも構いませんが、早めに1本触れておくと第2問の雰囲気がつかめます。"
      : "リード文と図表から数値を読み取る練習です。1日1本を目安にしてください。"}全${SETS.length}本を、まだ解いていないものから順に出題します。</p>
    <div class="cc-bar" style="margin-bottom:4px">
      <div class="bar"><i style="width:${Math.round(setsDone/SETS.length*100)}%"></i></div>
      <span class="pct">${setsDone}/${SETS.length}本</span></div>
    ${setScores.length?`<p class="note" style="margin:8px 0 0">挑戦したセットの平均：<b>${setAvg} / 20点</b>（本番換算）</p>`:""}
    <div class="rowbtns"><button class="btn btn-sub" onclick="startSet()">セットを1本やる</button></div>

  <div class="card${done2<6?" dim":""}">

    ${store.sims.length?`<table>
      <tr><th>最高点</th><td class="n">${best} / 50点</td></tr>
      <tr><th>直近</th><td class="n">${lastSim.score} 点（${fmt(lastSim.sec)}）</td></tr>

    <div class="rowbtns"><button class="btn btn-sub" onclick="startSim()">${store.sims.length?"もう1回受ける":"はじめて受ける"}</button></div>

  <div class="card">
    <h2>記録</h2>

    第1問で<b>24点</b>（8問）、第2問で<b>12点</b>（3問）取れば36点で目標を超えます。<br><br>
    そのため進め方は<b>①分野別 → ②第2問 → ③模試</b>の順です。いきなり模試を受けても、どこができないのかがぼやけて対策になりません。
    まず①で第1問の土台をつくり、②で図表の読み取りに慣れ、最後に③で通しの時間配分を仕上げてください。

function resetAll(){
  if(!confirm("正答率・コンボ記録・復習キュー・模試の記録をすべて消します。よろしいですか？")) return;
  store = {stat:{}, rev:{}, best:0, sims:[], sets:{}}; save(); home();
}

/* ================= ドリル・復習 ================= */
function startDrill(cat){
  const pool = cat ? BANK.filter(q=>q.c===cat) : BANK;
  S = {mode:"drill", cat:cat, qs:pick(pool,10), i:0, ok:0, combo:0, maxCombo:0, log:[]};
  askDrill();
}
function startReview(){
  const ids = Object.keys(store.rev).filter(k=>ALLQ[k]);
  if(!ids.length){ alert("復習キューは空です。まずドリルか模試に挑戦してみましょう。"); return; }
  ids.sort((a,b)=>store.rev[a]-store.rev[b]);
  const qs = shuffle(ids.slice(0,20)).slice(0,10).map(id=>ALLQ[id]);
  S = {mode:"review", cat:0, qs:qs, i:0, ok:0, combo:0, maxCombo:0, log:[]};
  askDrill();
}
/* 第2問トレーニング：1セットを解説つきで通す
   未挑戦のセットを優先し、全部済んだら得点の低いものから出し直す */
function nextSet(){
  const fresh = SETS.filter(s=>!setDone(s));
  if(fresh.length) return fresh[Math.floor(Math.random()*fresh.length)];
  const low = Math.min.apply(null, SETS.map(s=>store.sets[s.id]));
  const cand = SETS.filter(s=>store.sets[s.id]===low);
  return cand[Math.floor(Math.random()*cand.length)];
}
function startSet(si){
  const s = (si===undefined) ? nextSet() : SETS[si];
  S = {mode:"set", set:s, qs:s.qs.slice(), i:0, ok:0, combo:0, maxCombo:0, log:[]};
  askDrill();
}

function askDrill(){
  if(S.i >= S.qs.length) return resultDrill();
  const q = S.qs[S.i];
  const order = shuffle(idx(q));
  const title = S.mode==="review" ? "まちがい復習"
              : S.mode==="set" ? "第2問トレーニング"
              : (S.cat ? CATS[S.cat].name : "ランダム10問");
  const box = S.mode==="set" ? setBox(S.set) : (q.set ? setBox(q.set) : "");
  app.innerHTML = `
  <div class="card">
    <div class="hud">
      <span class="chip">${title}</span>
      <span class="chip">${S.i+1} / ${S.qs.length}問</span>
      <span class="chip">正解 ${S.ok}</span>
      <span class="chip ${S.combo>=3?"combo":""}" id="comboChip">${S.combo>=2?"🔥 "+S.combo+"連続":"コンボ 0"}</span>
    </div>
    ${S.mode==="set"?`<h2 style="margin-top:4px">${esc(S.set.title)}</h2>`:""}
    ${box}
    <div class="qmeta">${q.lb?`<span class="tag">${esc(q.lb)}</span>`:""}<span class="tag">${CATS[q.c].name}</span>${q.a.length>4?`<span class="tag">${q.a.length}択</span>`:""}</div>
    <p class="qtext">${nl(q.q)}</p>
    <div class="opts" id="opts">
      ${order.map((oi,n)=>`<button class="opt" data-oi="${oi}" onclick="answer(${oi})">
        <span class="no">${n+1}</span><span>${nl(q.a[oi])}</span></button>`).join("")}
    </div>
    <div id="fb"></div>
  </div>`;
  window.scrollTo(0,0);
}

function answer(oi){
  const q = S.qs[S.i];
  const correct = (oi === q.k);
  document.querySelectorAll("#opts .opt").forEach(b=>{
    b.disabled = true;
    const v = Number(b.dataset.oi);
    if(v === q.k) b.classList.add("ok"); else if(v === oi) b.classList.add("ng");
  });
  const st = stat(q.c); st.t++; if(correct) st.o++;
  if(correct){
    S.ok++; S.combo++; if(S.combo>S.maxCombo) S.maxCombo=S.combo;
    if(S.combo>store.best) store.best=S.combo;
    markRight(q.id);
  }else{ S.combo = 0; markWrong(q.id); }
  S.log.push({id:q.id, correct:correct});
  save();
  const chip = $("#comboChip");
  if(chip){ chip.textContent = S.combo>=2 ? "🔥 "+S.combo+"連続" : "コンボ 0";
            chip.className = "chip"+(S.combo>=3?" combo fire":""); }
  const left = store.rev[q.id]===undefined ? 0 : NEED - store.rev[q.id];
  const bonus = correct && S.combo>=3 ? `<div style="margin-top:6px;font-weight:800;color:#e8590c">🔥 ${S.combo}連続正解！ この調子です</div>` : "";
  const revnote = correct
    ? (left>0 ? `<div class="revnote">復習キューに残っています。あと${left}回連続で正解すると卒業です。</div>` : "")
    : `<div class="revnote">この問題は復習キューに入りました。2回連続で正解すると卒業です。</div>`;
  $("#fb").innerHTML = `
    <div class="fb ${correct?"ok":"ng"}">
      <div class="hd">${correct?"正解":"不正解"}</div>
      ${nl(q.e)}${bonus}${revnote}
    </div>
    <div class="rowbtns">
      <button class="btn btn-main" onclick="nextQ()">${S.i+1>=S.qs.length?"結果を見る":"次の問題へ"}</button>
    </div>`;
}
function nextQ(){ S.i++; askDrill(); }

function resultDrill(){
  const n = S.qs.length, p = Math.round(S.ok/n*100);
  if(S.mode==="set"){
    const prev = store.sets[S.set.id];
    if(prev === undefined || S.ok > prev) store.sets[S.set.id] = S.ok;
    save();
  }
  const wrongs = S.log.filter(l=>!l.correct).map(l=>ALLQ[l.id]);
  const again = S.mode==="review" ? "startReview()" : (S.mode==="set" ? "startSet()" : "startDrill("+S.cat+")");
  app.innerHTML = `
  <div class="card">
    <h2>${S.mode==="set"?"第2問トレーニング結果":"ドリル結果"}</h2>
    ${S.mode==="set"?`<p class="note" style="margin-top:-4px">${esc(S.set.title)}　（本番換算 ${S.ok*4} / 20点）</p>`:""}
    <div class="score">
      <div class="big">${S.ok}<span> / ${n}問</span></div>
      <div style="font-size:13px;color:#8a7c62;margin-top:2px">正答率 ${p}%　最高コンボ ${S.maxCombo}連続</div>
      <div class="judge ${p>=80?"pass":(p>=60?"near":"fail")}">${p>=80?"合格ライン超え":(p>=60?"あと一歩":"要復習")}</div>
    </div>
    <p class="note" style="margin-top:14px">${
      p>=80 ? "この水準を保てれば得点源になります。本番シミュレーションで通し練習に移りましょう。"
            : "間違えた問題は復習キューに入りました。2回連続で正解すると卒業なので、日を空けてもう一度回してください。"}</p>
    <div class="rowbtns">
      <button class="btn btn-main" onclick="${again}">もう1セット</button>
      <button class="btn btn-sub" onclick="home()">メニューに戻る</button>
    </div>
  </div>
  ${wrongs.length?`<div class="card"><h2>まちがえた問題（${wrongs.length}問）</h2><div class="rvlist">${
    wrongs.map(q=>`<div class="rvitem"><div class="rvq">${q.lb?esc(q.lb)+"　":""}${nl(q.q)}</div>
      <div class="rva">正解：${nl(q.a[q.k])}<br>${nl(q.e)}</div></div>`).join("")
  }</div></div>`:""}`;
  window.scrollTo(0,0);
}

/* ================= 本番シミュレーション ================= */
function startSim(){
  const used = {}, items = [];
  simMix().forEach(c=>{
    const pool = BANK.filter(q=>q.c===c && !used[q.id]);
    const q = pool[Math.floor(Math.random()*pool.length)];
    used[q.id]=1; items.push({q:q, pt:3, sec:1});
  });
  const set = SETS[Math.floor(Math.random()*SETS.length)];
  set.qs.forEach(q=>items.push({q:q, pt:4, sec:2}));
  S = {mode:"sim", set:set, items:items, i:0,
       ans:items.map(()=>-1), flag:items.map(()=>false), elapsed:0, view:"q"};
  simTimer(); askSim();
}
function clockText(){
  const over = S.elapsed - 30*60;
  return over>0 ? "経過 "+fmt(S.elapsed)+"（目安+"+fmt(over)+"）" : "経過 "+fmt(S.elapsed);
}
function simTimer(){
  clearTick();
  tick = setInterval(()=>{
    S.elapsed++;
    const el = $("#simClock");
    if(el){ el.textContent = clockText(); el.className = "big-timer"+(S.elapsed>30*60?" over":""); }
  },1000);
}
function simHud(){
  const done = S.ans.filter(a=>a>=0).length;
  return `<div class="hud">
    <span class="chip">${S.items[S.i].sec===1?"第1問（各3点）":"第2問（各4点）"}</span>
    <span class="chip">${S.i+1} / ${S.items.length}</span>
    <span class="chip">解答済 ${done}</span>
    <span style="margin-left:auto" class="big-timer${S.elapsed>30*60?" over":""}" id="simClock">${clockText()}</span>
  </div>`;
}
function askSim(){
  S.view="q";
  const it = S.items[S.i], q = it.q;
  if(!S.orders) S.orders = S.items.map(x=>shuffle(idx(x.q)));
  const order = S.orders[S.i];
  const chosen = S.ans[S.i];
  app.innerHTML = `
  <div class="card">
    ${simHud()}
    ${it.sec===2?`<h2 style="margin-top:4px">第2問　${esc(S.set.title)}</h2>${setBox(S.set)}`:""}
    <div class="qmeta">${q.lb?`<span class="tag">${esc(q.lb)}</span>`:`<span class="tag">問${S.i+1}</span>`}${q.a.length>4?`<span class="tag">${q.a.length}択</span>`:""}${S.flag[S.i]?`<span class="tag" style="background:#ffe0b2">🚩 見直し</span>`:""}</div>
    <p class="qtext">${nl(q.q)}</p>
    <div class="opts">
      ${order.map((oi,n)=>`<button class="opt${chosen===oi?" sel":""}" onclick="simPick(${oi})">
        <span class="no">${n+1}</span><span>${nl(q.a[oi])}</span></button>`).join("")}
    </div>
    <div class="navrow">
      <button class="btn btn-ghost" onclick="simGo(${S.i-1})" ${S.i===0?"disabled":""}>← 前へ</button>
      <button class="btn btn-ghost" onclick="simFlag()">${S.flag[S.i]?"🚩 フラグを外す":"🚩 あとで見直す"}</button>
      <button class="btn btn-ghost" onclick="simGo(${S.i+1})" ${S.i>=S.items.length-1?"disabled":""}>次へ →</button>
    </div>
    <div class="rowbtns"><button class="btn btn-sub" onclick="simList()">解答一覧・採点へ</button></div>
    <p class="note" style="margin:10px 0 0">解いた順に進みますが、いつでも前後に移動して答えを変えられます。迷った問題は🚩を付けて先に進み、最後に「解答一覧」から戻ってください。</p>
  </div>`;
  window.scrollTo(0,0);
}
function simPick(oi){
  S.ans[S.i] = oi;
  if(S.i < S.items.length-1){ S.i++; askSim(); } else { simList(); }
}
function simFlag(){ S.flag[S.i] = !S.flag[S.i]; askSim(); }
function simGo(i){ if(i<0||i>=S.items.length) return; S.i=i; askSim(); }
function simList(){
  S.view="list";
  const cells = S.items.map((it,i)=>{
    const done = S.ans[i]>=0;
    const cls = "navcell"+(done?" done":"")+(S.flag[i]?" flag":"");
    return `<button class="${cls}" onclick="simGo(${i})">
      <b>${it.sec===1?i+1:"第2問 "+(i-9)}</b><span>${S.flag[i]?"🚩":(done?"✓":"未")}</span></button>`;
  }).join("");
  const un = S.ans.filter(a=>a<0).length, fl = S.flag.filter(f=>f).length;
  app.innerHTML = `
  <div class="card">
    <div class="hud">
      <span class="chip">解答一覧</span>
      <span class="chip">未解答 ${un}</span>
      <span class="chip">🚩 ${fl}</span>
      <span style="margin-left:auto" class="big-timer${S.elapsed>30*60?" over":""}" id="simClock">${clockText()}</span>
    </div>
    <div class="navgrid">${cells}</div>
    <div class="rowbtns">
      <button class="btn btn-ghost" onclick="simGo(${S.i})">問題に戻る</button>
      <button class="btn btn-main" onclick="tryGrade(${un})">採点する</button>
    </div>
    <p class="note" style="margin:10px 0 0">番号をタップするとその問題へ移動します。✓＝解答済み、未＝未解答、🚩＝見直しフラグ。</p>
  </div>`;
  window.scrollTo(0,0);
}
function tryGrade(un){
  if(un>0 && !confirm("未解答が"+un+"問あります。未解答は0点で採点されます。採点しますか？")) return;
  resultSim();
}
function resultSim(){
  clearTick();
  let score=0, ok=0; const detail=[];
  S.items.forEach((it,i)=>{
    const q=it.q, hit = S.ans[i]===q.k;
    if(hit){ score+=it.pt; ok++; }
    const st=stat(q.c); st.t++; if(hit) st.o++;
    if(hit) markRight(q.id); else if(S.ans[i]>=0) markWrong(q.id);
    detail.push({q:q, hit:hit, pt:it.pt, sec:it.sec, chosen:S.ans[i], no:i});
  });
  store.sims.push({score:score, at:Date.now(), sec:S.elapsed});
  save();
  const s1 = detail.filter(d=>d.sec===1&&d.hit).reduce((a,d)=>a+d.pt,0);
  const s2 = detail.filter(d=>d.sec===2&&d.hit).reduce((a,d)=>a+d.pt,0);
  const judge = score>=35 ? ["pass","7割達成（35点以上）"] : (score>=28 ? ["near","あと"+(35-score)+"点で7割"] : ["fail","基礎の作り直しから"]);
  const byCat={}; detail.forEach(d=>{const c=d.q.c;byCat[c]=byCat[c]||{t:0,o:0};byCat[c].t++;if(d.hit)byCat[c].o++;});
  const weak = Object.keys(byCat).filter(c=>byCat[c].o/byCat[c].t < 0.6).map(c=>CATS[c].name);
  let advice;
  if(score>=35) advice = "目標ラインを超えました。この水準を3回続けて出せれば本番でも安定します。所要時間が30分を大きく超えている場合は、次はスピードを意識してください。";
  else if(s1 < 24) advice = "まず第1問（30点）で24点を確保するのが先決です。下の弱点分野を10問ドリルで固めてください。";
  else advice = "第1問は目標水準に届いています。あとは第2問です。「第2問トレーニング」でリード文と図表の読み取りを重点的に練習してください。";

  app.innerHTML = `
  <div class="card">
    <h2>本番シミュレーション結果</h2>
    <div class="score">
      <div class="big">${score}<span> / 50点</span></div>
      <div style="font-size:13px;color:#8a7c62;margin-top:2px">第1問 ${s1}/30点　第2問 ${s2}/20点　所要 ${fmt(S.elapsed)}${S.elapsed>30*60?"（目安30分を超過）":""}</div>
      <div class="judge ${judge[0]}">${judge[1]}</div>
    </div>
    <table style="margin-top:16px">
      <tr><th>正答数</th><td class="n">${ok} / ${S.items.length}問</td></tr>
      <tr><th>得点率</th><td class="n">${Math.round(score/50*100)}%</td></tr>
      <tr><th>第2問のテーマ</th><td class="n">${esc(S.set.title)}</td></tr>
      <tr><th>これまでの最高点</th><td class="n">${Math.max.apply(null,store.sims.map(s=>s.score))} 点</td></tr>
    </table>
    <p class="note" style="margin-top:12px">${advice}${weak.length?"<br><b>今回の弱点："+weak.join("、")+"</b>":""}</p>
    <div class="rowbtns">
      ${weak.map(n=>{const c=Object.keys(CATS).find(k=>CATS[k].name===n);
        return `<button class="btn btn-main" onclick="startDrill(${c})">${n}を10問ドリルで補強</button>`;}).join("")}
      ${s2<12?`<button class="btn btn-main" onclick="startSet()">第2問トレーニングをやる</button>`:""}
      <button class="btn btn-sub" onclick="startSim()">もう1回受ける</button>
      <button class="btn btn-ghost" onclick="home()">メニューに戻る</button>
    </div>
  </div>
  <div class="card">
    <h2>解答と解説</h2>
    <div class="rvlist">
    ${detail.map(d=>`<div class="rvitem">
      <div class="rvq">${d.sec===1?"第1問 問"+(d.no+1):"第2問 "+(d.q.lb||"")}　${d.hit?"<span style='color:#2f9e44'>正解 +"+d.pt+"点</span>":"<span style='color:#e03131'>不正解</span>"}</div>
      <div class="rvq" style="font-weight:600;margin-top:4px">${nl(d.q.q)}</div>
      <div class="rva">正解：${nl(d.q.a[d.q.k])}${d.chosen>=0&&!d.hit?"　／　あなたの解答："+nl(d.q.a[d.chosen]):(d.chosen<0?"　／　未解答":"")}<br>${nl(d.q.e)}</div>
    </div>`).join("")}
    </div>
  </div>`;
  window.scrollTo(0,0);
}

home();
</script>
</body>
</html>
