 "過酸化水素水の分解 2H₂O₂ → 2H₂O + O₂ を速くするために加える触媒として適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["硫酸", "エタノール", "酸化マンガン(Ⅳ)", "塩化ナトリウム"], "ans": 2, "exp": "MnO₂(またはカタラーゼ)はH₂O₂分解の触媒。反応後もそれ自身は変化しない。"}, {"id": "9-25", "lv": 2, "q": "A(気) + B(気) ⇌ 2C(気) の平衡状態で、温度一定のまま体積を半分にして圧力を上げたとき、平衡はどうなるか。正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["右に移動する", "左に移動する", "判断できない", "移動しない"], "ans": 3, "exp": "両辺とも気体分子数が2で等しいため、圧力を変えても平衡は移動しない。"}, {"id": "9-26", "lv": 2, "q": "ある一次反応では、反応物の濃度が半分になるまでの時間(半減期)が濃度によらず10分で一定である。反応物の濃度が初めの1/4になるまでにかかる時間として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["20分", "10分", "15分", "40分"], "ans": 0, "exp": "半減期2回分。1→1/2(10分)→1/4(さらに10分)で計20分。"}, {"id": "9-27", "lv": 2, "q": "濃度 c mol/L の弱酸(電離定数Ka)の電離度αが1より十分小さいとき、αを表す式として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["α=c/Ka", "α=√(Ka/c)", "α=√(Ka・c)", "α=Ka/c"], "ans": 1, "exp": "Ka=cα²/(1−α)≒cα² より α=√(Ka/c)。薄いほどαが大きくなることも読み取れる。"}, {"id": "9-28", "lv": 2, "q": "硫酸バリウム BaSO₄ の溶解度積を Ksp=1.0×10⁻¹⁰ (mol/L)² とする。純水中のBaSO₄飽和水溶液の Ba²⁺ の濃度として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["1.0×10⁻⁵ mol/L", "1.0×10⁻¹⁰ mol/L", "1.0×10⁻²⁰ mol/L", "5.0×10⁻¹¹ mol/L"], "ans": 0, "exp": "[Ba²⁺]=[SO₄²⁻]=x とすると x²=1.0×10⁻¹⁰ より x=1.0×10⁻⁵ mol/L。"}, {"id": "9-29", "lv": 3, "q": "1.0×10⁻⁸ mol/L という非常に薄い塩酸のpHとして最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["7よりわずかに小さい", "ちょうど8", "7よりわずかに大きい", "ちょうど6"], "ans": 0, "exp": "酸を加えた水溶液が塩基性になることはない。水の電離によるH⁺が支配的で、pHは7よりわずかに小さい値になる。"}, {"id": "9-30", "lv": 3, "q": "体積一定の容器に N₂ 1.0 mol と H₂ 3.0 mol を入れて反応させたところ、N₂ + 3H₂ ⇌ 2NH₃ の平衡でNH₃が 1.0 mol 生成していた。平衡時の気体の全物質量として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["3.0 mol", "3.5 mol", "4.0 mol", "2.5 mol"], "ans": 0, "exp": "NH₃ 1.0 mol生成でN₂は0.50 mol、H₂は1.5 mol減少。全量=0.50+1.5+1.0=3.0 mol。"}, {"id": "9-31", "lv": 3, "q": "酢酸 1.0 mol とエタノール 1.0 mol を混合して反応させると、CH₃COOH + C₂H₅OH ⇌ CH₃COOC₂H₅ + H₂O の平衡に達する。この反応の平衡定数を K=4.0 とするとき、平衡時に生成している酢酸エチルの物質量として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["0.33 mol", "0.50 mol", "0.67 mol", "0.80 mol"], "ans": 2, "exp": "生成量をxとすると x²/(1.0−x)²=4.0 より x/(1.0−x)=2.0、x=2/3≒0.67 mol。平衡定数と量的関係を組み合わせる典型問題。"}, {"id": "9-32", "lv": 2, "svg": "<svg viewBox='0 0 380 250' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif' font-size='11'><line x1='40' y1='210' x2='365' y2='210' stroke='#5b6b85' stroke-width='1.5'/><line x1='40' y1='210' x2='40' y2='15' stroke='#5b6b85' stroke-width='1.5'/><text x='140' y='240' fill='#5b6b85'>時間 [秒]</text><text x='8' y='12' fill='#5b6b85'>H₂O₂の濃度 [mol/L]</text><path d='M40,40 Q120,95 190,125 Q270,155 350,168' fill='none' stroke='#4f7cff' stroke-width='2.5'/><text x='12' y='44' fill='#2b3a55' font-weight='bold'>0.80</text><line x1='40' y1='168' x2='320' y2='168' stroke='#999' stroke-dasharray='5 4'/><line x1='320' y1='168' x2='320' y2='210' stroke='#999' stroke-dasharray='5 4'/><text x='12' y='172' fill='#2b3a55' font-weight='bold'>0.20</text><text x='310' y='226' fill='#2b3a55' font-weight='bold'>40</text></svg>", "q": "図は過酸化水素の分解における H₂O₂ の濃度変化である。0〜40秒間の平均分解速度として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["0.0075 mol/(L・s)", "0.015 mol/(L・s)", "0.020 mol/(L・s)", "0.60 mol/(L・s)"], "ans": 1, "exp": "v=(0.80−0.20)/40=0.015 mol/(L・s)。グラフから濃度の減少量を読み取り、時間で割る。"}, {"id": "9-33", "lv": 3, "svg": "<svg viewBox='0 0 380 250' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif' font-size='11'><line x1='40' y1='210' x2='365' y2='210' stroke='#5b6b85' stroke-width='1.5'/><line x1='40' y1='210' x2='40' y2='15' stroke='#5b6b85' stroke-width='1.5'/><text x='140' y='240' fill='#5b6b85'>時間</text><text x='8' y='12' fill='#5b6b85'>生成物の濃度</text><path d='M40,210 Q90,80 150,62 L350,58' fill='none' stroke='#4f7cff' stroke-width='2.5'/><path d='M40,210 Q140,150 230,80 Q290,63 350,58' fill='none' stroke='#ef5b7b' stroke-width='2.5' stroke-dasharray='7 5'/><text x='95' y='52' fill='#4f7cff' font-weight='bold'>実験Ⅱ</text><text x='180' y='125' fill='#ef5b7b' font-weight='bold'>実験Ⅰ</text></svg>", "q": "ある可逆反応を同じ温度・同じ濃度条件で行ったところ、実験Ⅰ(破線)と実験Ⅱ(実線)は図のようになり、最終的な生成物の濃度は等しかった。実験Ⅱで変えた条件として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["触媒を加えた", "温度を高くした", "反応物の濃度を大きくした", "圧力を高くした"], "ans": 0, "exp": "平衡に達するまでの時間だけが短くなり、平衡時の濃度(平衡の位置)が変わっていないので触媒。温度や濃度を変えると平衡値そのものがずれる。"}, {"id": "9-34", "lv": 2, "type": "num", "q": "過酸化水素の分解反応で、H₂O₂の濃度が30秒間で 0.60 mol/L から 0.24 mol/L に減少した。この間の平均分解速度は何 mol/(L・s) か。有効数字2桁で次の形式で表すとき、ア〜ウに当てはまる数字を選べ。", "numFmt": "ア.イ×10⁻ウ mol/(L・s)", "slots": ["ア", "イ", "ウ"], "ansD": ["1", "2", "2"], "exp": "v=(0.60−0.24)/30=0.012=1.2×10⁻² mol/(L・s)。"}, {"id": "9-35", "lv": 3, "type": "multi", "pick": 2, "q": "N₂ + 3H₂ ⇌ 2NH₃(ΔH=−92 kJ)が平衡状態にある。平衡がアンモニアの生成する方向(右)に移動する操作を、次の①〜⑥のうちから二つ選べ。ただし、解答の順序は問わない。", "opts": ["温度を下げる", "温度を上げる", "全体積を小さくして加圧する", "体積一定でアルゴンを加える", "アンモニアを加える", "触媒を加える"], "ans": [0, 2], "exp": "発熱反応なので低温側で右へ。気体分子数が4→2と減る反応なので加圧で右へ。体積一定の貴ガス添加と触媒は平衡を移動させない。"}, {"id": "9-36", "lv": 3, "svg": "<svg viewBox='0 0 380 250' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif' font-size='11'><line x1='45' y1='205' x2='360' y2='205' stroke='#5b6b85' stroke-width='1.5'/><line x1='45' y1='205' x2='45' y2='18' stroke='#5b6b85' stroke-width='1.5'/><text x='150' y='236' fill='#5b6b85'>濃度 [×10⁻⁴ mol/L]</text><text x='10' y='14' fill='#5b6b85'>吸光度</text><line x1='45' y1='205' x2='330' y2='40' stroke='#4f7cff' stroke-width='2.5'/><circle cx='102' cy='172' r='3.5' fill='#4f7cff'/><circle cx='159' cy='139' r='3.5' fill='#4f7cff'/><circle cx='216' cy='106' r='3.5' fill='#4f7cff'/><circle cx='273' cy='73' r='3.5' fill='#4f7cff'/><line x1='45' y1='139' x2='159' y2='139' stroke='#ef5b7b' stroke-dasharray='5 4'/><line x1='159' y1='139' x2='159' y2='205' stroke='#ef5b7b' stroke-dasharray='5 4'/><text x='16' y='143' fill='#ef5b7b' font-weight='bold'>0.40</text><text x='150' y='222' fill='#ef5b7b' font-weight='bold'>2.0</text><text x='96' y='222' fill='#5b6b85'>1.0</text><text x='210' y='222' fill='#5b6b85'>3.0</text><text x='266' y='222' fill='#5b6b85'>4.0</text></svg>", "q": "ある色素水溶液の吸光度は濃度に比例し、図の検量線が得られた。濃度不明の試料の吸光度を同じ条件で測定したところ 0.60 であった。この試料の濃度として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["1.5×10⁻⁴ mol/L", "2.0×10⁻⁴ mol/L", "3.0×10⁻⁴ mol/L", "6.0×10⁻⁴ mol/L"], "ans": 2, "exp": "検量線より濃度2.0×10⁻⁴ mol/Lで吸光度0.40。比例関係から 0.60/0.40×2.0×10⁻⁴=3.0×10⁻⁴ mol/L。"}], "hot": true}, {"unit": 10, "name": "無機物質", "emoji": "🪨", "questions": [{"id": "10-01", "lv": 1, "q": "ハロゲンの単体のうち、酸化力が最も強いものを、次の①〜④のうちから一つ選べ。", "opts": ["F₂", "Cl₂", "Br₂", "I₂"], "ans": 0, "exp": "酸化力はF₂>Cl₂>Br₂>I₂。F₂は水とも激しく反応して酸素を発生する。"}, {"id": "10-02", "lv": 1, "q": "実験室で塩素を発生させる方法として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["酸化マンガン(Ⅳ)に濃塩酸を加えて加熱する", "塩化ナトリウムに水を加える", "亜鉛に希硫酸を加える", "塩化アンモニウムと水酸化カルシウムを加熱する"], "ans": 0, "exp": "MnO₂+4HCl→MnCl₂+2H₂O+Cl₂。発生した塩素は水・濃硫酸を通して乾燥し、下方置換で捕集する。"}, {"id": "10-03", "lv": 1, "q": "アンモニアの捕集法と乾燥剤の組合せとして最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["水上置換・塩化カルシウム", "下方置換・十酸化四リン", "下方置換・濃硫酸", "上方置換・ソーダ石灰"], "ans": 3, "exp": "NH₃は空気より軽く水に非常に溶けやすいので上方置換。酸性乾燥剤や塩化カルシウム(反応する)は使えず、ソーダ石灰を用いる。"}, {"id": "10-04", "lv": 1, "q": "硫化水素 H₂S の性質として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["赤褐色の気体である", "強い酸化剤である", "無臭の気体である", "腐卵臭があり、還元性を示す"], "ans": 3, "exp": "H₂Sは腐卵臭のある有毒な気体で、強い還元性を示す。水に少し溶けて弱酸性。"}, {"id": "10-05", "lv": 1, "q": "同素体が存在しない元素を、次の①〜④のうちから一つ選べ。", "opts": ["酸素", "硫黄", "リン", "窒素"], "ans": 3, "exp": "O(O₂とO₃)、S(斜方・単斜・ゴム状)、P(黄リン・赤リン)、C(ダイヤ・黒鉛など)に同素体がある。SCOPと覚える。"}, {"id": "10-06", "lv": 1, "q": "ナトリウムの炎色反応の色として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["緑色", "紫色", "赤色", "黄色"], "ans": 3, "exp": "Naは黄色。Li赤、K赤紫、Cu青緑、Ca橙赤、Sr紅、Ba黄緑。"}, {"id": "10-07", "lv": 1, "q": "塩酸にも水酸化ナトリウム水溶液にも溶ける金属を、次の①〜④のうちから一つ選べ。", "opts": ["銅", "鉄", "アルミニウム", "銀"], "ans": 2, "exp": "Al・Zn・Sn・Pbは両性金属で、酸とも強塩基とも反応する(ア・ア・スン・ナリと覚える)。"}, {"id": "10-08", "lv": 1, "q": "一酸化窒素 NO と二酸化窒素 NO₂ の性質の組合せとして正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["NO:無色・水に溶けにくい NO₂:赤褐色・水に溶けやすい", "NO:赤褐色・水に溶けやすい NO₂:無色・水に溶けにくい", "NO:無色・水に溶けやすい NO₂:無色・水に溶けにくい", "NO:赤褐色・水に溶けにくい NO₂:赤褐色・水に溶けやすい"], "ans": 0, "exp": "NOは無色で水に溶けにくく水上置換、NO₂は赤褐色・有毒で水に溶けやすく下方置換で捕集する。"}, {"id": "10-09", "lv": 2, "q": "接触法による硫酸の製造で、SO₂ を SO₃ に酸化するときに用いられる触媒として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["鉄", "酸化マンガン(Ⅳ)", "白金", "酸化バナジウム(Ⅴ) V₂O₅"], "ans": 3, "exp": "接触法ではV₂O₅を触媒としてSO₂を酸化し、SO₃を濃硫酸に吸収させて発煙硫酸とし、希硫酸で薄める。"}, {"id": "10-10", "lv": 2, "q": "オストワルト法による硝酸の製造の第一段階、アンモニアの酸化(NH₃→NO)で用いられる触媒として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["ニッケル", "酸化亜鉛", "酸化バナジウム(Ⅴ)", "白金"], "ans": 3, "exp": "オストワルト法では白金網を触媒として約800℃でNH₃を酸化しNOをつくる。NO→NO₂→HNO₃と続く。"}, {"id": "10-11", "lv": 2, "q": "ハーバー・ボッシュ法によるアンモニア合成の原料と触媒の組合せとして正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["N₂とH₂・鉄を主成分とする触媒", "N₂とO₂・白金触媒", "NH₄ClとCa(OH)₂・触媒なし", "NOとH₂・銅触媒"], "ans": 0, "exp": "N₂+3H₂⇌2NH₃を、四酸化三鉄を主成分とする触媒を用い高温・高圧で行う。"}, {"id": "10-12", "lv": 2, "q": "アンモニアソーダ法(ソルベー法)で炭酸ナトリウムを製造するとき、塩化ナトリウムの飽和水溶液に吹き込む気体の組合せとして正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["NH₃とCO₂", "NH₃とO₂", "Cl₂とCO₂", "H₂とN₂"], "ans": 0, "exp": "NaCl+NH₃+CO₂+H₂O→NaHCO₃+NH₄Cl。析出したNaHCO₃を熱分解してNa₂CO₃を得る。"}, {"id": "10-13", "lv": 2, "q": "Ag⁺、Cu²⁺、Fe³⁺ を含む水溶液に希塩酸を加えたときに生じる沈殿として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["白色のAgCl", "黒色のCuS", "赤褐色のFe(OH)₃", "青白色のCu(OH)₂"], "ans": 0, "exp": "塩酸で沈殿するのはAg⁺(AgCl白)とPb²⁺(PbCl₂白)。CuSはH₂S、Fe(OH)₃は塩基で沈殿する。"}, {"id": "10-14", "lv": 2, "q": "硫酸銅(Ⅱ)水溶液に過剰のアンモニア水を加えたときの変化として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["黒色沈殿が生じる", "変化しない", "青白色沈殿が生じ、そのまま残る", "青白色沈殿がいったん生じた後、溶けて深青色の溶液になる"], "ans": 3, "exp": "Cu(OH)₂の青白色沈殿が、過剰のNH₃で[Cu(NH₃)₄]²⁺(深青色)となって溶ける。"}, {"id": "10-15", "lv": 2, "q": "気体と乾燥剤の組合せとして不適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["塩素・濃硫酸", "アンモニア・ソーダ石灰", "水素・塩化カルシウム", "アンモニア・濃硫酸"], "ans": 3, "exp": "塩基性のNH₃は酸性乾燥剤の濃硫酸と反応してしまうため使えない。"}, {"id": "10-16", "lv": 3, "q": "Ag⁺、Cu²⁺、Fe³⁺、Zn²⁺ を含む水溶液から各イオンを分離する。操作の順序として、(1)希塩酸を加える→(2)酸性でH₂Sを通じる→(3)煮沸後、硝酸を加えてからアンモニア水を過剰に加える、と行ったとき、(3)で沈殿するイオンとして正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["Ag⁺", "Cu²⁺", "Fe³⁺", "Zn²⁺"], "ans": 2, "exp": "(1)でAgCl、(2)でCuSが沈殿。(3)でFe(OH)₃が沈殿する。Zn²⁺は過剰NH₃で[Zn(NH₃)₄]²⁺となり溶けたまま。"}, {"id": "10-17", "lv": 3, "q": "アルミニウムの溶融塩電解で、アルミニウム 9.0 g を得るのに必要な電気量として最も適当な数値を、次の①〜④のうちから一つ選べ。Al=27、ファラデー定数 9.65×10⁴ C/mol とする。", "opts": ["3.2×10⁴ C", "6.4×10⁴ C", "9.7×10⁴ C", "2.9×10⁵ C"], "ans": 2, "exp": "Al³⁺+3e⁻→Al。Al 9.0 g=1/3 molにe⁻ 1.0 molが必要。9.65×10⁴×1.0≒9.7×10⁴ C。"}, {"id": "10-18", "lv": 3, "q": "気体A・Bについて次のことがわかっている。\nA:刺激臭があり、湿った赤色リトマス紙を青変させる。\nB:腐卵臭があり、酢酸鉛(Ⅱ)紙を黒変させる。\nA・Bの組合せとして正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["A:NH₃ B:H₂S", "A:HCl B:SO₂", "A:NH₃ B:SO₂", "A:Cl₂ B:H₂S"], "ans": 0, "exp": "赤色リトマスを青変させる塩基性気体はNH₃。酢酸鉛紙を黒変(PbS生成)させるのはH₂S。"}, {"id": "10-19", "lv": 3, "q": "硫酸に関する次の記述のうち、誤りを含むものを、次の①〜④のうちから一つ選べ。", "opts": ["濃硫酸は吸湿性が強く、乾燥剤に用いられる", "濃硫酸には有機化合物から水素と酸素を水として奪う脱水作用がある", "熱濃硫酸には酸化作用があり、銅を溶かす", "希硫酸は酸化作用が強く、銀を溶かす"], "ans": 3, "exp": "希硫酸に酸化作用はなく、水素より イオン化傾向の小さい銀や銅は溶けない。"}, {"id": "10-20", "lv": 3, "q": "ある金属イオンを含む水溶液に少量のNaOH水溶液を加えると白色沈殿が生じ、過剰に加えると沈殿が溶けた。また、別に少量のアンモニア水で生じた白色沈殿は、過剰のアンモニア水にも溶けた。この金属イオンとして最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["Fe³⁺", "Cu²⁺", "Al³⁺", "Zn²⁺"], "ans": 3, "exp": "過剰NaOHに溶ける→両性(AlかZn)。過剰NH₃にも溶ける([Zn(NH₃)₄]²⁺)のはZn²⁺。Al(OH)₃はNH₃過剰でも溶けない。"}, {"id": "10-21", "lv": 1, "q": "貴ガス(18族)に関する記述として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["空気中にまったく含まれない", "反応性が非常に高い", "単原子分子として存在し、化合物をつくりにくい", "二原子分子として存在する"], "ans": 2, "exp": "貴ガスは価電子0で安定な電子配置をもち、単原子分子として存在する。Arは空気中に約1%含まれる。"}, {"id": "10-22", "lv": 1, "q": "常温・常圧で赤褐色の液体であるハロゲンの単体を、次の①〜④のうちから一つ選べ。", "opts": ["フッ素", "塩素", "臭素", "ヨウ素"], "ans": 2, "exp": "Br₂は常温で液体(赤褐色)。F₂・Cl₂は気体、I₂は黒紫色の固体。"}, {"id": "10-23", "lv": 1, "q": "オゾン O₃ の性質として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["無色・無臭の気体である", "強い酸化作用をもち、湿ったヨウ化カリウムデンプン紙を青変させる", "水素と同じく還元剤としてはたらく", "空気の主成分である"], "ans": 1, "exp": "O₃は淡青色・特異臭の気体で強い酸化剤。KIをI₂に酸化するためヨウ化カリウムデンプン紙が青変する。"}, {"id": "10-24", "lv": 1, "q": "一酸化炭素 CO の性質として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["赤褐色で刺激臭がある", "水によく溶けて酸性を示す", "無色・無臭で有毒であり、高温で還元剤としてはたらく", "石灰水を白濁させる"], "ans": 2, "exp": "COは無色・無臭・有毒で水に溶けにくい。製鉄で鉄鉱石の還元に使われる。石灰水を白濁させるのはCO₂。"}, {"id": "10-25", "lv": 1, "q": "酸化カルシウム(生石灰)に水を加えたときの変化として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["吸熱して温度が下がる", "水素が発生する", "変化しない", "激しく発熱して水酸化カルシウム(消石灰)になる"], "ans": 3, "exp": "CaO+H₂O→Ca(OH)₂は大きな発熱を伴う。乾燥剤や発熱材に利用される。"}, {"id": "10-26", "lv": 1, "q": "塩素を消石灰(水酸化カルシウム)に吸収させて得られる、漂白剤に用いられる物質を、次の①〜④のうちから一つ選べ。", "opts": ["ソーダ石灰", "さらし粉", "セッコウ", "石灰石"], "ans": 1, "exp": "Ca(OH)₂+Cl₂→CaCl(ClO)・H₂O(さらし粉)。次亜塩素酸イオンの酸化作用で漂白・殺菌する。"}, {"id": "10-27", "lv": 1, "q": "Fe³⁺ を含む水溶液にチオシアン酸カリウム KSCN 水溶液を加えたときの変化として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["白色沈殿が生じる", "血赤色の溶液になる", "青白色沈殿が生じる", "変化しない"], "ans": 1, "exp": "Fe³⁺はSCN⁻と反応して血赤色を呈する。Fe²⁺では呈色しないため、両イオンの区別に使う。"}, {"id": "10-28", "lv": 1, "q": "銅の性質に関する記述として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["塩酸に溶けて水素を発生する", "炎色反応は黄色を示す", "湿った空気中で緑青(ろくしょう)を生じる", "銀よりも電気伝導性が大きい"], "ans": 2, "exp": "銅は湿った空気中で緑青というさびを生じる。電気伝導性はAg>Cu、塩酸には溶けず、炎色は青緑。"}, {"id": "10-29", "lv": 2, "q": "濃硝酸を褐色びんに入れて冷暗所に保存する理由として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["空気中の酸素と反応するから", "ガラスを溶かすから", "揮発を完全に防ぐため", "光によって分解し、二酸化窒素などを生じるから"], "ans": 3, "exp": "4HNO₃→4NO₂+O₂+2H₂O の光分解を防ぐため褐色びんで保存する。"}, {"id": "10-30", "lv": 2, "q": "キップの装置が適している気体発生の条件として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["固体と液体を加熱せずに反応させ、必要なときに発生を止められる", "固体どうしを強熱する", "2種類の液体を蒸留する", "気体どうしを反応させる"], "ans": 0, "exp": "キップの装置は固体+液体・加熱不要の反応(H₂S、CO₂、H₂など)に用い、コックで発生を調節できる。"}, {"id": "10-31", "lv": 2, "q": "亜鉛を水酸化ナトリウム水溶液に加えたときに起こる変化として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["酸素を発生して溶ける", "水素を発生してテトラヒドロキシド亜鉛(Ⅱ)酸イオンを生じる", "塩素を発生して溶ける", "反応しない"], "ans": 1, "exp": "Zn+2NaOH+2H₂O→Na₂[Zn(OH)₄]+H₂。両性金属は強塩基とも反応して水素を発生する。"}, {"id": "10-32", "lv": 2, "q": "石灰水に二酸化炭素を通じ続けたときの変化として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["黄色に呈色する", "白濁したのち、さらに通じると炭酸水素カルシウムが生じて溶け、透明になる", "白濁し、その後も変化しない", "最初から何も変化しない"], "ans": 1, "exp": "CaCO₃の白濁が、過剰のCO₂でCa(HCO₃)₂となり溶解する。加熱すると再びCaCO₃が析出する。"}, {"id": "10-33", "lv": 2, "q": "黄色のクロム酸カリウム K₂CrO₄ 水溶液を硫酸で酸性にしたときの変化として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["緑色の沈殿が生じる", "変化しない", "橙赤色の二クロム酸イオンに変化する", "無色になる"], "ans": 2, "exp": "2CrO₄²⁻+2H⁺⇌Cr₂O₇²⁻+H₂O。酸性で橙赤色のCr₂O₇²⁻、塩基性で黄色のCrO₄²⁻になる。"}, {"id": "10-34", "lv": 3, "q": "ある無色・刺激臭の気体は、水に溶けて弱酸性を示し、硫酸酸性の過マンガン酸カリウム水溶液を脱色した。この気体として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["NH₃", "Cl₂", "NO₂", "SO₂"], "ans": 3, "exp": "還元性(KMnO₄脱色)をもつ無色・刺激臭・弱酸性の気体はSO₂。NH₃は塩基性、Cl₂・NO₂は有色。"}, {"id": "10-35", "lv": 3, "q": "アルミニウムの溶融塩電解で、酸化アルミニウムに氷晶石を加える理由として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["酸化アルミニウムの純度を上げるため", "融解温度を下げるため", "生成するアルミニウムを酸化から守るため", "電流を流れにくくするため"], "ans": 1, "exp": "Al₂O₃の融点は約2000℃と高いが、氷晶石の融解液に溶かすことで約1000℃で電解できる。"}, {"id": "10-36", "lv": 3, "q": "金属イオンと硫化物沈殿の色の組合せとして誤りを含むものを、次の①〜④のうちから一つ選べ。", "opts": ["CuS:黒色", "ZnS:白色", "CdS:黄色", "FeS:赤色"], "ans": 3, "exp": "FeSは黒色。CdSの黄色(カドミウムイエロー)、ZnSの白色は頻出。"}, {"id": "10-37", "lv": 1, "q": "溶鉱炉で鉄鉱石から銑鉄をつくるとき、鉄鉱石を還元する主な物質として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["水素", "アルミニウム", "石灰石", "一酸化炭素"], "ans": 3, "exp": "コークスの燃焼で生じたCOがFe₂O₃を段階的に還元する。石灰石は不純物をスラグとして除くために加える。"}, {"id": "10-38", "lv": 1, "q": "黄銅(しんちゅう)の成分の組合せとして正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["銅とスズ", "鉄とクロム", "アルミニウムと銅", "銅と亜鉛"], "ans": 3, "exp": "黄銅はCu+Zn。青銅はCu+Sn、ステンレス鋼はFe+Cr+Ni、ジュラルミンはAl合金。楽器や5円硬貨に使われる。"}, {"id": "10-39", "lv": 1, "q": "ソーダ石灰ガラスの主原料の組合せとして最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["粘土・石こう・水", "アルミナ・氷晶石・コークス", "岩塩・硫黄・木炭", "けい砂・炭酸ナトリウム・石灰石"], "ans": 3, "exp": "SiO₂(けい砂)にNa₂CO₃とCaCO₃を加えて融解したものが窓ガラスなどのソーダ石灰ガラス。セラミックスの代表例。"}, {"id": "10-40", "lv": 1, "q": "常温で無色の気体を、次の①〜④のうちから一つ選べ。", "opts": ["二酸化窒素", "塩素", "オゾン", "一酸化窒素"], "ans": 3, "exp": "NOは無色。NO₂は赤褐色、Cl₂は黄緑色、O₃は淡青色。色と臭いは気体識別の頻出ポイント。"}, {"id": "10-41", "lv": 2, "q": "二酸化ケイ素に水酸化ナトリウム水溶液を加えて加熱し、得られた固体に水を加えて加熱すると粘性の大きな液体が得られる。この液体の名称として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["王水", "石灰水", "ホルマリン", "水ガラス"], "ans": 3, "exp": "SiO₂+2NaOH→Na₂SiO₃+H₂O。ケイ酸ナトリウムの濃い水溶液が水ガラス。塩酸を加えるとケイ酸が沈殿し、乾燥させるとシリカゲルになる。"}, {"id": "10-42", "lv": 2, "q": "リンの同素体に関する記述として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["赤リンは猛毒で水中に保存する", "黄リンはマッチの側薬に使われる", "赤リンは空気中で自然発火する", "黄リンは空気中で自然発火するため水中に保存する"], "ans": 3, "exp": "黄リン(白リン)は有毒で自然発火性があり水中保存。赤リンは比較的安定で毒性が低く、マッチの側薬に使われる。"}, {"id": "10-43", "lv": 2, "q": "黄銅鉱から得られた粗銅(純度約99%)から純銅(純度99.99%)を得る方法として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["溶融塩電解", "再結晶", "蒸留", "電解精錬"], "ans": 3, "exp": "粗銅を陽極、純銅を陰極として硫酸銅(Ⅱ)水溶液中で電気分解する電解精錬。不純物のAg・Auは陽極泥になる。"}, {"id": "10-44", "lv": 2, "q": "金属の性質に関して、電気伝導性が最も大きい金属を、次の①〜⑥のうちから一つ選べ。", "opts": ["アルミニウム", "鉄", "白金", "銀", "銅", "金"], "ans": 3, "exp": "電気伝導性・熱伝導性はAg>Cu>Au>Alの順。展性・延性が最大なのはAu。"}, {"id": "10-45", "lv": 3, "q": "鉄イオンの検出に関する次の記述 a・b の正誤の組合せとして正しいものを、次の①〜④のうちから一つ選べ。\na Fe³⁺を含む水溶液にヘキサシアニド鉄(Ⅱ)酸カリウム K₄[Fe(CN)₆] 水溶液を加えると濃青色の沈殿を生じる。\nb Fe²⁺を含む水溶液にチオシアン酸カリウム KSCN 水溶液を加えると血赤色を呈する。", "opts": ["a:正 b:正", "a:誤 b:正", "a:誤 b:誤", "a:正 b:誤"], "ans": 3, "exp": "Fe³⁺+K₄[Fe(CN)₆]→濃青色沈殿(紺青)は正しい。KSCNで血赤色になるのはFe³⁺で、Fe²⁺は呈色しない。"}, {"id": "10-46", "lv": 3, "q": "Ag⁺、Cu²⁺、Fe³⁺、Zn²⁺、Ca²⁺ を含む水溶液に、(1)希塩酸を加える、(2)酸性で硫化水素を通じる、(3)煮沸・硝酸酸化後にアンモニア水を過剰に加える、(4)塩基性で硫化水素を通じる、の操作を順に行った。(1)〜(4)のいずれでも沈殿しないイオンを、次の①〜⑤のうちから一つ選べ。", "opts": ["Fe³⁺", "Cu²⁺", "Ag⁺", "Ca²⁺", "Zn²⁺"], "ans": 3, "exp": "(1)AgCl、(2)CuS、(3)Fe(OH)₃、(4)ZnSが沈殿。Ca²⁺はろ液に残り、最後に炭酸アンモニウムでCaCO₃として沈殿させるか炎色反応(橙赤)で確認する。"}, {"id": "10-47", "lv": 2, "type": "multi", "pick": 2, "q": "実験室での薬品の取扱いに関する記述として誤りを含むものを、次の①〜⑥のうちから二つ選べ。ただし、解答の順序は問わない。", "opts": ["ナトリウムは空気中の酸素や水と反応するため、灯油(石油)中に保存する", "濃硫酸を薄めるときは、濃硫酸に水を少しずつ加える", "水酸化ナトリウム水溶液が皮膚に付着したら、ただちに多量の水で洗い流す", "濃硝酸は光で分解するため、褐色びんに入れて冷暗所に保存する", "硫化水素は無害な気体なので、実験台の上で自由に扱ってよい", "固体を加熱するときは、試験管の口を人のいない方向に向ける"], "ans": [1, 4], "exp": "②は逆で、水に濃硫酸を少しずつ加える(逆にすると発熱で突沸し危険)。⑤硫化水素は有毒で、必ずドラフト内で扱う。他は正しい取扱い。"}, {"id": "10-48", "lv": 3, "q": "しょうゆに含まれる塩化ナトリウムの量を調べるため、しょうゆを希釈し、クロム酸カリウムを指示薬として硝酸銀水溶液で滴定した。終点で暗赤色の沈殿が現れる理由として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["塩化物イオンがすべて塩化銀として沈殿したのち、銀イオンがクロム酸イオンと反応してクロム酸銀を生じるから", "塩化銀が暗赤色に変色するから", "クロム酸カリウムが分解して発色するから", "しょうゆの色素が銀イオンと反応するから"], "ans": 0, "exp": "AgClの方が溶解度積が小さく先に沈殿する。Cl⁻を消費し尽くしたあとAg⁺が過剰になり、暗赤色のAg₂CrO₄が生じて終点がわかる(モール法)。"}], "hot": true}, {"unit": 11, "name": "有機化合物", "emoji": "💠", "questions": [{"id": "11-01", "lv": 1, "q": "カルボキシ基を表すものを、次の①〜④のうちから一つ選べ。", "opts": ["-OH", "-CHO", "-COOH", "-NH₂"], "ans": 2, "exp": "-COOHがカルボキシ基。-OHヒドロキシ基、-CHOホルミル(アルデヒド)基、-NH₂アミノ基。"}, {"id": "11-02", "lv": 1, "q": "メタン分子の立体構造として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["直線形", "三角錐形", "正方形", "正四面体形"], "ans": 3, "exp": "炭素原子を中心に4個のH原子が正四面体の頂点方向に位置する。結合角は約109.5°。"}, {"id": "11-03", "lv": 1, "q": "エチレン(エテン)を臭素水に通じたときの変化として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["臭素水の赤褐色が消える", "臭素水が青紫色になる", "気体が発生する", "変化しない"], "ans": 0, "exp": "C=C二重結合に臭素が付加して1,2-ジブロモエタンとなり、臭素の色が消える。不飽和結合の検出法。"}, {"id": "11-04", "lv": 1, "q": "第二級アルコールを酸化すると得られる化合物の種類として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["カルボン酸", "エーテル", "アルデヒド", "ケトン"], "ans": 3, "exp": "第二級アルコール→ケトン。第一級アルコール→アルデヒド→カルボン酸。第三級は酸化されにくい。"}, {"id": "11-05", "lv": 1, "q": "ヨードホルム反応を示す化合物を、次の①〜④のうちから一つ選べ。", "opts": ["メタノール", "エタノール", "1-プロパノール", "ギ酸"], "ans": 1, "exp": "CH₃CO-またはCH₃CH(OH)-の構造をもつ化合物が陽性。エタノールはCH₃CH(OH)Hの構造をもつ。"}, {"id": "11-06", "lv": 1, "q": "アンモニア性硝酸銀水溶液に加えて温めると、銀鏡を生じる化合物を、次の①〜④のうちから一つ選べ。", "opts": ["アセトアルデヒド", "ジエチルエーテル", "酢酸", "アセトン"], "ans": 0, "exp": "銀鏡反応はアルデヒドの還元性による。アセトアルデヒドCH₃CHOが陽性。"}, {"id": "11-07", "lv": 1, "q": "カルボン酸とアルコールから水がとれてエステルが生成する反応の名称として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["付加反応", "置換反応", "エステル化(縮合)", "けん化"], "ans": 2, "exp": "-COOHと-OHから水がとれて-COO-結合ができる縮合反応。濃硫酸を触媒とする。"}, {"id": "11-08", "lv": 1, "q": "ベンゼンの反応の特徴として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["常温で臭素水をすぐに脱色する", "容易に酸化されて開環する", "付加反応が置換反応より起こりやすい", "置換反応が付加反応より起こりやすい"], "ans": 3, "exp": "ベンゼン環は安定なため、環を保ったままの置換反応(ニトロ化・スルホン化など)が起こりやすい。"}, {"id": "11-09", "lv": 2, "q": "分子式 C₄H₁₀O で表されるアルコールの構造異性体の数として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["2", "3", "4", "5"], "ans": 2, "exp": "1-ブタノール、2-ブタノール、2-メチル-1-プロパノール、2-メチル-2-プロパノールの4種(エーテルを含めるとC₄H₁₀Oは7種)。"}, {"id": "11-10", "lv": 2, "q": "元素分析により組成式が CH₂O、分子量が60と求められた化合物の分子式として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["C₂H₄O₂", "C₃H₈O", "C₂H₆O₂", "CH₂O"], "ans": 0, "exp": "(CH₂O)ₙ=30n=60 より n=2。分子式はC₂H₄O₂(例:酢酸)。"}, {"id": "11-11", "lv": 2, "q": "アセチレンに触媒を用いて水を付加させたとき、最終的に得られる主生成物として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["酢酸", "ビニルアルコール(安定に存在)", "エタノール", "アセトアルデヒド"], "ans": 3, "exp": "付加で生じるビニルアルコールは不安定で、直ちに異性化してアセトアルデヒドになる。"}, {"id": "11-12", "lv": 2, "q": "エタノールを硫酸酸性の二クロム酸カリウムで酸化していくと、生成する化合物の順序として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["アセトアルデヒド → 酢酸", "ホルムアルデヒド → ギ酸", "ジエチルエーテル → 酢酸", "アセトン → 酢酸"], "ans": 0, "exp": "第一級アルコールのエタノールは、アセトアルデヒドを経て酢酸まで酸化される。"}, {"id": "11-13", "lv": 2, "q": "炭酸水素ナトリウム水溶液に加えると二酸化炭素を発生して溶ける化合物を、次の①〜④のうちから一つ選べ。", "opts": ["アニリン", "ニトロベンゼン", "フェノール", "安息香酸"], "ans": 3, "exp": "酸の強さは カルボン酸>炭酸>フェノール。炭酸より強い安息香酸はNaHCO₃と反応してCO₂を発生する。"}, {"id": "11-14", "lv": 2, "q": "アニリンの性質として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["さらし粉水溶液で赤紫色に呈色する", "塩化鉄(Ⅲ)水溶液で紫色に呈色する", "炭酸水素ナトリウムと反応して気体を発生する", "水によく溶ける強塩基である"], "ans": 0, "exp": "アニリンは弱塩基で、さらし粉水溶液による赤紫色の呈色が検出反応。FeCl₃で呈色するのはフェノール類。"}, {"id": "11-15", "lv": 2, "q": "サリチル酸に無水酢酸を作用させて得られる化合物として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["安息香酸", "ピクリン酸", "サリチル酸メチル", "アセチルサリチル酸"], "ans": 3, "exp": "フェノール性-OHがアセチル化されてアセチルサリチル酸(解熱鎮痛剤)となる。メタノールとのエステル化ならサリチル酸メチル(消炎剤)。"}, {"id": "11-16", "lv": 3, "q": "安息香酸、アニリン、トルエンを溶かしたジエチルエーテル溶液から各成分を分離する。まず希塩酸を加えてよく振ると、水層に移る物質として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["アニリン", "トルエン", "安息香酸とトルエン", "安息香酸"], "ans": 0, "exp": "塩基のアニリンが塩酸塩(イオン)となって水層へ移る。次にNaHCO₃水で安息香酸を水層へ、エーテル層にトルエンが残る。"}, {"id": "11-17", "lv": 3, "q": "酢酸エチル CH₃COOC₂H₅(分子量88)8.8 g を完全に加水分解(けん化)するのに必要な水酸化ナトリウムは、1.0 mol/L 水溶液で何 mL か。最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["50 mL", "100 mL", "200 mL", "880 mL"], "ans": 1, "exp": "エステル0.10 molにNaOH 0.10 molが必要。0.10/1.0=0.10 L=100 mL。"}, {"id": "11-18", "lv": 3, "q": "分子式 C₄H₈O₂ のエステルを加水分解したところ、得られたカルボン酸は銀鏡反応を示し、得られたアルコールはヨードホルム反応を示した。このエステルの構造として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["CH₃COOC₂H₅(酢酸エチル)", "HCOOCH₂CH₂CH₃(ギ酸プロピル)", "HCOOCH(CH₃)₂(ギ酸イソプロピル)", "C₂H₅COOCH₃(プロピオン酸メチル)"], "ans": 2, "exp": "銀鏡反応を示す酸はギ酸。ヨードホルム陽性のアルコールはCH₃CH(OH)-をもつ2-プロパノール。よってギ酸イソプロピル。"}, {"id": "11-19", "lv": 3, "q": "ある油脂(分子量884)8.84 g を完全にけん化するのに必要な水酸化ナトリウムの質量として最も適当な数値を、次の①〜④のうちから一つ選べ。NaOH=40 とする。", "opts": ["0.40 g", "0.80 g", "1.2 g", "2.4 g"], "ans": 2, "exp": "油脂1 molのけん化にNaOH 3 molが必要。油脂0.010 mol×3×40=1.2 g。"}, {"id": "11-20", "lv": 3, "q": "分子式 C₇H₈O で表される芳香族化合物のうち、塩化鉄(Ⅲ)水溶液で呈色するものの数として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["2", "3", "4", "5"], "ans": 1, "exp": "C₇H₈Oの芳香族はクレゾール(o,m,p)3種、ベンジルアルコール、アニソールの5種。FeCl₃で呈色するのはフェノール性-OHをもつクレゾール3種。"}, {"id": "11-21", "lv": 1, "q": "アルカンと塩素の混合気体に光を当てたときに起こる反応の種類として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["付加反応", "置換反応", "重合反応", "脱離反応"], "ans": 1, "exp": "アルカンは光照射下で塩素とHが置き換わる置換反応を起こす(例:CH₄→CH₃Cl)。"}, {"id": "11-22", "lv": 1, "q": "ヘキサン(アルカン)と1-ヘキセン(アルケン)を区別する方法として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["水に溶けるかどうかを調べる", "炎色反応を調べる", "臭素水を加えて色が消えるかどうかを調べる", "金属ナトリウムを加える"], "ans": 2, "exp": "C=Cをもつ1-ヘキセンは臭素を付加して臭素水の色を消すが、アルカンは反応しない。"}, {"id": "11-23", "lv": 1, "q": "ホルマリンとは何の水溶液か。正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["ギ酸", "メタノール", "ホルムアルデヒド", "アセトアルデヒド"], "ans": 2, "exp": "ホルムアルデヒドHCHOの約37%水溶液がホルマリン。防腐剤や樹脂原料に用いる。"}, {"id": "11-24", "lv": 1, "q": "アセトンに関する記述として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["銀鏡反応を示す", "カルボン酸の一種である", "水にまったく溶けない", "水と任意の割合で混ざり合う無色の液体である"], "ans": 3, "exp": "アセトンCH₃COCH₃は水にも有機溶媒にもよく溶ける。ケトンなので還元性はなく銀鏡反応は示さない。"}, {"id": "11-25", "lv": 1, "q": "カルボン酸でありながら還元性を示し、銀鏡反応が陽性となるものを、次の①〜④のうちから一つ選べ。", "opts": ["酢酸", "ギ酸", "プロピオン酸", "安息香酸"], "ans": 1, "exp": "ギ酸HCOOHは分子内にホルミル基の構造をもつため、カルボン酸で唯一還元性を示す。"}, {"id": "11-26", "lv": 1, "q": "乳酸 CH₃CH(OH)COOH に鏡像異性体(光学異性体)が存在する理由として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["二重結合をもつから", "不斉炭素原子をもつから", "ヒドロキシ基をもつから", "環状構造をもつから"], "ans": 1, "exp": "中央の炭素に4種の異なる原子・原子団(H、OH、CH₃、COOH)が結合した不斉炭素原子があるため。"}, {"id": "11-27", "lv": 1, "q": "セッケンに関する記述として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["水溶液は油を溶かさない", "高級脂肪酸のナトリウム塩で、水溶液は弱塩基性を示す", "強酸と強塩基の塩で、水溶液は中性である", "硬水中でもよく泡立つ"], "ans": 1, "exp": "セッケンは油脂のけん化で得られる高級脂肪酸の塩。加水分解して弱塩基性を示し、硬水中ではCa塩・Mg塩の沈殿を生じ泡立ちが悪い。"}, {"id": "11-28", "lv": 2, "q": "シス-トランス異性体(幾何異性体)が存在する化合物を、次の①〜④のうちから一つ選べ。", "opts": ["エチレン", "プロペン", "1-ブテン", "2-ブテン"], "ans": 3, "exp": "2-ブテンCH₃-CH=CH-CH₃は二重結合の両端の炭素にそれぞれ異なる原子団が結合しており、シス形とトランス形が存在する。"}, {"id": "11-29", "lv": 2, "q": "アセチレン3分子を赤熱した鉄に触れさせたときに生成する化合物として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["シクロヘキサン", "ブタジエン", "ベンゼン", "エチレン"], "ans": 2, "exp": "3C₂H₂→C₆H₆。アセチレンの三分子重合でベンゼンが生成する。"}, {"id": "11-30", "lv": 2, "q": "第三級アルコールに分類されるものを、次の①〜④のうちから一つ選べ。", "opts": ["1-ブタノール", "2-ブタノール", "2-メチル-2-プロパノール", "エタノール"], "ans": 2, "exp": "OHのついた炭素に3個の炭化水素基が結合しているものが第三級。酸化されにくいのが特徴。"}, {"id": "11-31", "lv": 2, "q": "分子量がほぼ同じエタノール(46)とジメチルエーテル(46)では、エタノールの沸点がはるかに高い。その理由として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["エタノールの方が分子が大きいから", "ジメチルエーテルはイオンからなるから", "エタノールは電離するから", "エタノール分子間に水素結合がはたらくから"], "ans": 3, "exp": "-OHをもつエタノールは分子間で水素結合を形成するため沸点が高い(78℃)。エーテルは-OHをもたない。"}, {"id": "11-32", "lv": 2, "q": "ベンゼンスルホン酸ナトリウムをアルカリ融解し、生成物を酸性にして得られる化合物として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["トルエン", "フェノール", "安息香酸", "アニリン"], "ans": 1, "exp": "スルホン酸塩のアルカリ融解はフェノールの製法の一つ。現在の工業的製法はクメン法が主流。"}, {"id": "11-33", "lv": 2, "q": "セッケンと比べたときの合成洗剤(直鎖アルキルベンゼンスルホン酸ナトリウムなど)の特徴として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["硬水中では使えない", "油を乳化する作用がない", "水溶液は中性で、硬水中でも沈殿をつくりにくい", "水溶液は強塩基性を示す"], "ans": 2, "exp": "合成洗剤は強酸と強塩基の塩なので中性。Ca²⁺・Mg²⁺と沈殿をつくりにくく硬水でも使える。"}, {"id": "11-34", "lv": 3, "q": "分子式 C₅H₁₂O で表される第三級アルコールの数として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["1", "2", "3", "4"], "ans": 0, "exp": "2-メチル-2-ブタノールの1種のみ。第三級はOHのつく炭素に3つの炭化水素基が必要で、C5では1通り。"}, {"id": "11-35", "lv": 3, "q": "分子式 C₃H₆O₂ のエステルを加水分解したところ、銀鏡反応を示す酸が得られた。このエステルとして正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["酢酸メチル CH₃COOCH₃", "プロピオン酸 C₂H₅COOH", "ギ酸メチル HCOOCH₃", "ギ酸エチル HCOOC₂H₅"], "ans": 3, "exp": "C₃H₆O₂のエステルはギ酸エチルと酢酸メチルの2種。銀鏡反応陽性の酸(ギ酸)を生じるのはギ酸エチル。"}, {"id": "11-36", "lv": 3, "q": "ある油脂 1 mol に水素を完全に付加させるのに、H₂ が 2 mol 必要であった。この油脂1分子に含まれる炭素間二重結合 C=C の数として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["1", "2", "3", "6"], "ans": 1, "exp": "C=C 1個につきH₂ 1分子が付加する。H₂ 2 molが必要なのでC=Cは2個。"}, {"id": "11-37", "lv": 2, "svg": "<svg viewBox='0 0 400 170' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif' font-size='11'><rect x='15' y='55' width='110' height='50' rx='8' fill='#eef3ff' stroke='#4f7cff' stroke-width='1.5'/><text x='26' y='76' fill='#2b3a55'>試料+酸化銅(Ⅱ)</text><text x='47' y='94' fill='#ef5b7b'>加熱・完全燃焼</text><line x1='125' y1='80' x2='155' y2='80' stroke='#5b6b85' stroke-width='2' /><polygon points='155,75 165,80 155,85' fill='#5b6b85'/><rect x='168' y='55' width='90' height='50' rx='8' fill='#fffbe8' stroke='#f5a623' stroke-width='1.5'/><text x='188' y='76' fill='#2b3a55'>吸収管A</text><text x='176' y='94' fill='#b8860b'>塩化カルシウム</text><line x1='258' y1='80' x2='288' y2='80' stroke='#5b6b85' stroke-width='2'/><polygon points='288,75 298,80 288,85' fill='#5b6b85'/><rect x='300' y='55' width='90' height='50' rx='8' fill='#e9f9f1' stroke='#22b573' stroke-width='1.5'/><text x='320' y='76' fill='#2b3a55'>吸収管B</text><text x='313' y='94' fill='#1c9e64'>ソーダ石灰</text></svg>", "q": "図は有機化合物の元素分析装置である。吸収管Aに塩化カルシウム、吸収管Bにソーダ石灰を用いるが、この順序を逆にしてはいけない理由として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["ソーダ石灰は水と二酸化炭素の両方を吸収してしまうから", "塩化カルシウムは二酸化炭素しか吸収しないから", "ソーダ石灰は加熱に弱いから", "塩化カルシウムは気体を通さないから"], "ans": 0, "exp": "A(CaCl₂)でH₂Oを、B(ソーダ石灰)でCO₂を吸収し、増加質量から各元素量を求める。ソーダ石灰を先にすると両方吸収され、H₂OとCO₂を分けられない。"}, {"id": "11-38", "lv": 1, "q": "ニトロ基を表すものを、次の①〜④のうちから一つ選べ。", "opts": ["-CN", "-SO₃H", "-NH₂", "-NO₂"], "ans": 3, "exp": "-NO₂がニトロ基。-NH₂アミノ基、-SO₃Hスルホ基。ニトロベンゼンやTNTに含まれる。"}, {"id": "11-39", "lv": 1, "q": "シクロヘキサン C₆H₁₂ の分類として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["不飽和の環式炭化水素", "芳香族炭化水素", "飽和の鎖式炭化水素", "飽和の環式炭化水素"], "ans": 3, "exp": "シクロヘキサンは単結合のみからなる環式の飽和炭化水素(シクロアルカン)。ベンゼンとは全く性質が異なる。"}, {"id": "11-40", "lv": 1, "q": "アルデヒドをフェーリング液とともに加熱したときに生じる赤色沈殿として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["酸化銅(Ⅱ) CuO", "銅 Cu", "水酸化銅(Ⅱ) Cu(OH)₂", "酸化銅(Ⅰ) Cu₂O"], "ans": 3, "exp": "アルデヒドの還元性によりCu²⁺が還元され、赤色のCu₂Oが沈殿する。銀鏡反応と並ぶホルミル基の検出法。"}, {"id": "11-41", "lv": 1, "q": "エタノールに金属ナトリウムを加えたときに発生する気体として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["酸素", "メタン", "二酸化炭素", "水素"], "ans": 3, "exp": "2C₂H₅OH+2Na→2C₂H₅ONa+H₂。ヒドロキシ基の検出に使われる反応。"}, {"id": "11-42", "lv": 2, "q": "プロペン CH₂=CH-CH₃ に臭素 Br₂ を作用させたときの主生成物として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["1,2-ジブロモプロパン", "1,3-ジブロモプロパン", "1-ブロモプロパン", "臭素は反応しない"], "ans": 0, "exp": "C=Cへの付加反応で、二重結合の両端の炭素にBrが1つずつ付く。"}, {"id": "11-43", "lv": 2, "q": "マレイン酸とフマル酸はシス-トランス異性体の関係にある。加熱すると分子内で脱水して酸無水物になるのはどちらか。正しい組合せを、次の①〜④のうちから一つ選べ。", "opts": ["マレイン酸(シス形):2つのカルボキシ基が近いため無水物になる", "フマル酸(トランス形):2つのカルボキシ基が近いため無水物になる", "両方とも容易に酸無水物になる", "どちらも酸無水物にならない"], "ans": 0, "exp": "シス形のマレイン酸は-COOHどうしが同じ側にあり、加熱で容易に無水マレイン酸になる。トランス形のフマル酸はなりにくい。"}, {"id": "11-44", "lv": 2, "q": "次の物質のうち、銀鏡反応を示すものを過不足なく含む組合せを、次の①〜⑥のうちから一つ選べ。\na ホルムアルデヒド　b アセトン　c ギ酸　d 酢酸", "opts": ["a", "a・b", "a・c", "b・c", "a・c・d", "a・b・c"], "ans": 2, "exp": "ホルミル基をもつaとc(ギ酸はHCOOHの構造中にホルミル基を含む)が陽性。ケトンのbとカルボン酸のdは陰性。"}, {"id": "11-45", "lv": 2, "q": "トルエンに濃硝酸と濃硫酸の混合物を十分に作用させて得られる、火薬に用いられる化合物として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["2,4,6-トリニトロトルエン(TNT)", "ピクリン酸", "ニトログリセリン", "ニトロベンゼン"], "ans": 0, "exp": "トルエンのニトロ化を進めるとTNTが得られる。ピクリン酸はフェノール、ニトログリセリンはグリセリンから。"}, {"id": "11-46", "lv": 3, "q": "分子式 C₄H₁₀O のアルコールのうち、酸化するとケトンを生じるものを、次の①〜④のうちから一つ選べ。", "opts": ["1-ブタノール", "2-ブタノール", "2-メチル-1-プロパノール", "2-メチル-2-プロパノール"], "ans": 1, "exp": "ケトンを生じるのは第二級アルコールの2-ブタノール(→エチルメチルケトン)。①③は第一級(→アルデヒド)、④は第三級で酸化されにくい。"}, {"id": "11-47", "lv": 3, "q": "分子式 C₈H₁₀ で表される芳香族炭化水素の構造異性体の数として正しいものを、次の①〜⑥のうちから一つ選べ。", "opts": ["2", "3", "4", "5", "6", "7"], "ans": 2, "exp": "エチルベンゼンと、キシレン(o-、m-、p-)の計4種。ベンゼン環の置換位置の数え分けが問われる頻出問題。"}, {"id": "11-48", "lv": 2, "type": "multi", "pick": 2, "q": "ヨードホルム反応を示す化合物を、次の①〜⑥のうちから二つ選べ。ただし、解答の順序は問わない。", "opts": ["メタノール", "エタノール", "1-プロパノール", "アセトン", "ジエチルエーテル", "酢酸"], "ans": [1, 3], "exp": "CH₃CO−またはCH₃CH(OH)−の構造をもつものが陽性。エタノールとアセトンが該当。メタノール・1-プロパノールは陰性。"}, {"id": "11-49", "lv": 3, "q": "アセチルサリチル酸に少量の塩化鉄(Ⅲ)水溶液を加えても呈色しなかった。この結果から確認できることとして最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["フェノール性ヒドロキシ基がアセチル化されて残っていないこと", "カルボキシ基がすべて失われていること", "分子内にベンゼン環がないこと", "エステル結合が存在しないこと"], "ans": 0, "exp": "FeCl₃の呈色はフェノール性−OHによる。呈色しないことはアセチル化が完了し−OHが残っていない証拠になる。合成の確認実験として頻出。"}], "hot": true}, {"unit": 12, "name": "高分子化合物", "emoji": "🧶", "questions": [{"id": "12-01", "lv": 1, "q": "付加重合によってつくられる高分子を、次の①〜④のうちから一つ選べ。", "opts": ["ポリエチレン", "ナイロン66", "ポリエチレンテレフタラート", "フェノール樹脂"], "ans": 0, "exp": "エチレンのC=Cが開いて次々に結合する付加重合。ナイロン66とPETは縮合重合、フェノール樹脂は付加縮合。"}, {"id": "12-02", "lv": 1, "q": "ナイロン66の原料(単量体)の組合せとして正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["ε-カプロラクタム単独", "スチレンとブタジエン", "テレフタル酸とエチレングリコール", "アジピン酸とヘキサメチレンジアミン"], "ans": 3, "exp": "アジピン酸とヘキサメチレンジアミンの縮合重合でアミド結合をつくる。ε-カプロラクタムの開環重合はナイロン6。"}, {"id": "12-03", "lv": 1, "q": "ポリエチレンテレフタラート(PET)に含まれる結合として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["エステル結合", "エーテル結合", "グリコシド結合", "アミド結合"], "ans": 0, "exp": "テレフタル酸とエチレングリコールの縮合重合により、エステル結合で連なるポリエステル。"}, {"id": "12-04", "lv": 1, "q": "デンプンとセルロースの構成単位の組合せとして正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["デンプン:α-グルコース セルロース:β-グルコース", "デンプン:β-グルコース セルロース:α-グルコース", "どちらもフルクトース", "デンプン:ガラクトース セルロース:グルコース"], "ans": 0, "exp": "デンプンはα-グルコース、セルロースはβ-グルコースが縮合重合したもの。立体構造の違いが性質の差を生む。"}, {"id": "12-05", "lv": 1, "q": "タンパク質中でアミノ酸どうしをつなぐ結合の名称として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["グリコシド結合", "水素結合のみ", "エステル結合", "ペプチド結合"], "ans": 3, "exp": "アミノ基とカルボキシ基から水がとれてできる-CO-NH-をペプチド結合という。"}, {"id": "12-06", "lv": 1, "q": "水溶液中のアミノ酸の説明として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["pHによって陽イオン・双性イオン・陰イオンの割合が変わる", "水にはまったく溶けない", "中性では必ず陰イオンになる", "常に陽イオンとして存在する"], "ans": 0, "exp": "アミノ酸は-COOHと-NH₂をもち、酸性では陽イオン、等電点付近では双性イオン、塩基性では陰イオンが主になる。"}, {"id": "12-07", "lv": 1, "q": "酵素の性質として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["高温ほどよくはたらく", "無機物質でできている", "どんな反応でも触媒する", "特定の基質にのみ作用し、最適温度をもつ"], "ans": 3, "exp": "酵素はタンパク質でできた生体触媒で、基質特異性を示し、最適温度・最適pHをもつ。高温では変性して失活する。"}, {"id": "12-08", "lv": 1, "q": "天然ゴムに数%の硫黄を加えて加熱し、弾性や強度を高める操作の名称として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["加硫", "けん化", "加水分解", "アセチル化"], "ans": 0, "exp": "硫黄原子がポリイソプレン鎖間に架橋構造をつくり、弾性・耐久性が向上する。これが加硫。"}, {"id": "12-09", "lv": 2, "q": "平均分子量 2.8×10⁴ のポリエチレン(-CH₂-CH₂-)ₙ の平均重合度 n として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["500", "1000", "2000", "28000"], "ans": 1, "exp": "繰り返し単位C₂H₄の式量は28。n=2.8×10⁴/28=1000。"}, {"id": "12-10", "lv": 2, "q": "ナイロン66に関する記述として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["アミド結合をもち、絹に似た感触をもつ", "付加重合でつくられる", "水に溶けやすい", "エステル結合をもつポリエステルである"], "ans": 0, "exp": "ナイロンはアミド結合(-CO-NH-)をもつポリアミドで、絹に似た性質を示す合成繊維。"}, {"id": "12-11", "lv": 2, "q": "デンプン水溶液にヨウ素ヨウ化カリウム水溶液を加えたときの呈色として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["黄色", "無色のまま", "赤色", "青〜青紫色"], "ans": 3, "exp": "デンプンのらせん構造にI₂が取り込まれて青〜青紫色を示す(ヨウ素デンプン反応)。加熱すると消え、冷えると再び現れる。"}, {"id": "12-12", "lv": 2, "q": "グルコースの水溶液がフェーリング液を還元する理由として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["水溶液中で鎖状構造となり、ホルミル基(アルデヒド基)を生じるから", "ヒドロキシ基を多くもつから", "水溶液が酸性だから", "六員環構造が安定だから"], "ans": 0, "exp": "グルコースは水溶液中で環状と鎖状の平衡にあり、鎖状構造のホルミル基が還元性を示す。"}, {"id": "12-13", "lv": 2, "q": "糖類に関する記述として誤りを含むものを、次の①〜④のうちから一つ選べ。", "opts": ["マルトースは還元性を示す", "スクロースは還元性を示さない", "スクロースを加水分解した転化糖は還元性を示す", "セルロースは熱水によく溶け、還元性を示す"], "ans": 3, "exp": "セルロースは水に溶けず、還元性も示さない。スクロースは還元性を示す部分どうしで結合しているため非還元糖。"}, {"id": "12-14", "lv": 2, "q": "ビニロンの製造で、ポリビニルアルコールをホルムアルデヒド水溶液で処理する操作の名称と目的の組合せとして正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["アセタール化・適度な吸湿性を残しつつ水に不溶にする", "加硫・弾性を高める", "けん化・水に溶けやすくする", "ニトロ化・燃えやすくする"], "ans": 0, "exp": "-OHの一部をアセタール化して水に不溶とする。残った-OHが吸湿性を与え、木綿に似た繊維となる。"}, {"id": "12-15", "lv": 2, "q": "スルホ基(-SO₃H)をもつ陽イオン交換樹脂に塩化ナトリウム水溶液を通したとき、流出液に含まれる主な物質として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["塩酸", "塩素", "アンモニア", "水酸化ナトリウム"], "ans": 0, "exp": "Na⁺が樹脂のH⁺と交換され、流出液は HCl を含む酸性の水溶液になる。"}, {"id": "12-16", "lv": 3, "q": "ポリエチレンテレフタラートの繰り返し単位の式量は192である。平均分子量 3.84×10⁴ のPETの平均重合度 n として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["100", "200", "400", "800"], "ans": 1, "exp": "n=3.84×10⁴/192=200。"}, {"id": "12-17", "lv": 3, "q": "3種類の異なるα-アミノ酸 A、B、C を1分子ずつ用いて鎖状のトリペプチドをつくるとき、アミノ酸の配列順序の異なるトリペプチドは何種類できるか。正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["3種類", "6種類", "9種類", "27種類"], "ans": 1, "exp": "3個の並べ方は3!=6通り。ペプチドには方向性(N末端・C末端)があるため、すべて異なる。"}, {"id": "12-18", "lv": 3, "q": "デンプン 81 g を完全に加水分解したときに得られるグルコースの質量として最も適当な数値を、次の①〜④のうちから一つ選べ。デンプンの繰り返し単位 C₆H₁₀O₅ の式量を162、グルコースの分子量を180とする。", "opts": ["81 g", "90 g", "162 g", "180 g"], "ans": 1, "exp": "繰り返し単位0.50 molから、加水(+H₂O)によりグルコース0.50 mol=90 gが得られる。"}, {"id": "12-19", "lv": 3, "q": "天然ゴム(生ゴム)の構造として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["イソプレンが付加重合した構造で、二重結合はシス形", "イソプレンが付加重合した構造で、二重結合はトランス形", "スチレンとブタジエンの共重合体", "エチレンの付加重合体"], "ans": 0, "exp": "天然ゴムはポリイソプレンでシス形。シス形のため分子が丸まりやすく弾性を示す。トランス形はグッタペルカで硬い。"}, {"id": "12-20", "lv": 3, "q": "等電点が 5.0 のアミノ酸を pH 6.0 の緩衝液中で電気泳動すると、このアミノ酸はどちらの極へ移動するか。最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["陽極へ移動する", "陰極へ移動する", "移動しない", "両方の極へ移動する"], "ans": 0, "exp": "pHが等電点より大きい溶液中ではアミノ酸は全体として負電荷をもつため、陽極側へ移動する。"}, {"id": "12-21", "lv": 1, "q": "熱可塑性樹脂の説明として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["必ず網目状の立体構造をもつ", "加熱すると軟化し、冷やすと再び固まる", "加熱すると硬化し、二度と軟化しない", "水に溶けやすい"], "ans": 1, "exp": "鎖状構造の熱可塑性樹脂(ポリエチレンなど)は加熱で軟化し成形できる。網目構造の熱硬化性樹脂は再軟化しない。"}, {"id": "12-22", "lv": 1, "q": "ポリスチレンの単量体として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["プロペン", "酢酸ビニル", "スチレン", "エチレン"], "ans": 2, "exp": "スチレンC₆H₅-CH=CH₂の付加重合体。発泡ポリスチレンは断熱材や容器に使われる。"}, {"id": "12-23", "lv": 1, "q": "絹の主成分であるタンパク質の名称として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["ケラチン", "コラーゲン", "カゼイン", "フィブロイン"], "ans": 3, "exp": "絹はカイコの繭からとれるフィブロインが主成分。羊毛はケラチン。"}, {"id": "12-24", "lv": 1, "q": "レーヨンの分類として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["再生繊維", "合成繊維", "天然繊維", "半合成繊維"], "ans": 0, "exp": "レーヨンはセルロースをいったん溶かして繊維に再生したもの。アセテートは半合成繊維、ナイロンは合成繊維。"}, {"id": "12-25", "lv": 1, "q": "マルトース(麦芽糖)を加水分解したときに得られる単糖として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["グルコース2分子", "グルコースとフルクトース", "フルクトース2分子", "ガラクトース2分子"], "ans": 0, "exp": "マルトースはα-グルコース2分子が縮合した二糖。スクロースはグルコース+フルクトース。"}, {"id": "12-26", "lv": 1, "q": "デンプンをマルトースまで加水分解する酵素として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["アミラーゼ", "マルターゼ", "リパーゼ", "ペプシン"], "ans": 0, "exp": "アミラーゼはデンプン→マルトース。マルターゼはマルトース→グルコース、リパーゼは油脂、ペプシンはタンパク質を分解する。"}, {"id": "12-27", "lv": 2, "q": "尿素樹脂の原料の組合せとして正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["尿素とホルムアルデヒド", "尿素と酢酸", "フェノールとホルムアルデヒド", "メラミンと酢酸"], "ans": 0, "exp": "尿素とホルムアルデヒドの付加縮合で得られる熱硬化性樹脂。食器や電気部品に使われる。"}, {"id": "12-28", "lv": 2, "q": "生分解性高分子として実用化されている物質を、次の①〜④のうちから一つ選べ。", "opts": ["ポリ乳酸", "ポリエチレン", "ポリ塩化ビニル", "ポリスチレン"], "ans": 0, "exp": "ポリ乳酸は微生物により分解される生分解性高分子で、植物由来原料からつくられる。"}, {"id": "12-29", "lv": 2, "q": "タンパク質の変性に関する記述として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["熱や酸、重金属イオンなどにより立体構造が壊れて性質が変わる", "ペプチド結合がすべて切断されてアミノ酸になる", "変性したタンパク質は必ず元に戻る", "変性は水溶液中では起こらない"], "ans": 0, "exp": "変性は水素結合などで保たれた高次構造(立体構造)の破壊。ペプチド結合(一次構造)は切れない。"}, {"id": "12-30", "lv": 2, "q": "陰イオン交換樹脂に塩化ナトリウム水溶液を通したとき、流出液に含まれる主な物質として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["水酸化ナトリウム", "塩酸", "塩化ナトリウム", "アンモニア"], "ans": 0, "exp": "Cl⁻が樹脂のOH⁻と交換され、NaOHを含む塩基性の水溶液が流出する。"}, {"id": "12-31", "lv": 3, "q": "アクリロニトリル(C₃H₃N=53、N原子1個を含む)とブタジエン(C₄H₆=54)の共重合体について、窒素の含有率が質量パーセントで約7.8%であった。アクリロニトリルとブタジエンの物質量の比として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["1:9", "3:7", "5:5", "7:3"], "ans": 1, "exp": "AN:BD=x:(1−x)とすると 14x/(53x+54(1−x))=0.078 より x≒0.30。よって3:7。"}, {"id": "12-32", "lv": 3, "q": "セルロース(繰り返し単位 C₆H₁₀O₅=162、単位あたり-OHを3個もつ)16.2 g のヒドロキシ基をすべてアセチル化してトリアセチルセルロースにしたときの質量として最も適当な数値を、次の①〜④のうちから一つ選べ。アセチル化1か所につき式量は42増加する。", "opts": ["20.4 g", "24.6 g", "28.8 g", "48.6 g"], "ans": 2, "exp": "繰り返し単位0.10 mol。単位の式量は162+3×42=288となるので、0.10×288=28.8 g。"}, {"id": "12-33", "lv": 3, "svg": "<svg viewBox='0 0 380 250' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif' font-size='11'><line x1='40' y1='210' x2='365' y2='210' stroke='#5b6b85' stroke-width='1.5'/><line x1='40' y1='210' x2='40' y2='15' stroke='#5b6b85' stroke-width='1.5'/><text x='80' y='240' fill='#5b6b85'>滴下した水酸化ナトリウム水溶液 [mL]</text><text x='8' y='12' fill='#5b6b85'>pH</text><path d='M40,195 Q80,185 110,178 Q140,170 150,140 L155,120 Q170,95 200,88 Q240,78 250,55 Q270,38 340,32' fill='none' stroke='#4f7cff' stroke-width='2.5'/><circle cx='158' cy='112' r='5' fill='#ef5b7b'/><text x='168' y='116' fill='#ef5b7b' font-weight='bold'>X</text><text x='50' y='176' fill='#5b6b85'>pH2付近で緩衝</text><text x='210' y='105' fill='#5b6b85'>pH9.6付近で緩衝</text></svg>", "q": "図はグリシン塩酸塩水溶液を水酸化ナトリウム水溶液で滴定したときのpH変化である。点X(pH6付近、グリシンの等電点)で最も多く存在するグリシンの状態として適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["陽イオン H₃N⁺-CH₂-COOH", "陰イオン H₂N-CH₂-COO⁻", "双性イオン H₃N⁺-CH₂-COO⁻", "分子 H₂N-CH₂-COOH"], "ans": 2, "exp": "等電点では正負の電荷をあわせもつ双性イオンが大部分を占め、全体の電荷は0になる。酸性側では陽イオン、塩基性側では陰イオンが増える。"}, {"id": "12-34", "lv": 1, "q": "DNAを構成する糖として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["グルコース", "フルクトース", "デオキシリボース", "リボース"], "ans": 2, "exp": "DNAはデオキシリボース、RNAはリボースを含む。糖・リン酸・塩基からなるヌクレオチドが構成単位。"}, {"id": "12-35", "lv": 1, "q": "核酸の構成単位であるヌクレオチドの構成要素の組合せとして正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["アミノ酸・糖・リン酸", "脂肪酸・グリセリン・リン酸", "糖・硫酸・有機塩基", "リン酸・糖・有機塩基"], "ans": 3, "exp": "ヌクレオチド=リン酸+五炭糖+有機塩基。これが縮合重合したポリヌクレオチドが核酸である。"}, {"id": "12-36", "lv": 2, "q": "DNAの二重らせん構造において、塩基対をつくる組合せとして正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["アデニンとシトシン、グアニンとチミン", "アデニンとウラシル、グアニンとシトシン", "アデニンとチミン、グアニンとシトシン", "アデニンとグアニン、チミンとシトシン"], "ans": 2, "exp": "A-T間は2本、G-C間は3本の水素結合で相補的に結合する。ウラシルはRNAの塩基。"}, {"id": "12-37", "lv": 1, "q": "紙おむつなどに使われ、自身の質量の数百倍の水を吸収できる高分子の名称として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["導電性高分子", "感光性高分子", "生分解性高分子", "高吸水性樹脂"], "ans": 3, "exp": "ポリアクリル酸ナトリウム系の高吸水性樹脂。網目構造の内部に水を取り込み保持する。"}, {"id": "12-38", "lv": 2, "q": "導電性高分子に関する記述として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["導電性高分子は金属を練り込んだ高分子である", "高分子はすべて絶縁体であり電気を通すものはない", "ポリアセチレンにヨウ素などを少量加えたものは電気を通す", "ポリエチレンは代表的な導電性高分子である"], "ans": 2, "exp": "白川英樹らが開発したポリアセチレン系の導電性高分子。ヨウ素などのドーピングで導電性が現れる。"}, {"id": "12-39", "lv": 2, "q": "繊維の分類の組合せとして正しいものを、次の①〜⑥のうちから一つ選べ。", "opts": ["木綿:天然繊維 レーヨン:合成繊維 アセテート:半合成繊維 ナイロン:再生繊維", "木綿:半合成繊維 レーヨン:再生繊維 アセテート:天然繊維 ナイロン:合成繊維", "木綿:天然繊維 レーヨン:再生繊維 アセテート:合成繊維 ナイロン:半合成繊維", "木綿:天然繊維 レーヨン:再生繊維 アセテート:半合成繊維 ナイロン:合成繊維", "木綿:再生繊維 レーヨン:天然繊維 アセテート:合成繊維 ナイロン:半合成繊維", "木綿:天然繊維 レーヨン:半合成繊維 アセテート:再生繊維 ナイロン:合成繊維"], "ans": 3, "exp": "レーヨンはセルロースを溶かして再生(再生繊維)、アセテートは-OHの一部をアセチル化(半合成繊維)、ナイロンは石油原料から合成(合成繊維)。"}, {"id": "12-40", "lv": 3, "q": "ある2本鎖DNAの塩基組成を調べたところ、アデニンが全塩基の20%を占めていた。このDNAに含まれるグアニンの割合として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["20%", "25%", "30%", "60%"], "ans": 2, "exp": "A=T=20%なので合わせて40%。残り60%がG+Cで、G=C=30%(シャルガフの規則)。"}, {"id": "12-41", "lv": 2, "type": "num", "q": "ポリエチレンテレフタラート(繰り返し単位の式量192)の平均分子量が 1.92×10⁴ のとき、平均重合度はいくらか。有効数字2桁で次の形式で表すとき、ア〜ウに当てはまる数字を選べ。", "numFmt": "ア.イ×10ウ", "slots": ["ア", "イ", "ウ"], "ansD": ["1", "0", "2"], "exp": "1.92×10⁴/192=100=1.0×10²。"}, {"id": "12-42", "lv": 2, "type": "multi", "pick": 2, "q": "縮合重合によってつくられる高分子を、次の①〜⑥のうちから二つ選べ。ただし、解答の順序は問わない。", "opts": ["ポリエチレン", "ナイロン66", "ポリスチレン", "ポリエチレンテレフタラート", "ポリ塩化ビニル", "ポリプロピレン"], "ans": [1, 3], "exp": "ナイロン66(アミド結合)とPET(エステル結合)は水がとれる縮合重合。他はC=Cの付加重合。"}, {"id": "12-43", "lv": 2, "q": "プラスチックのリサイクルに関する記述として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["PETボトルを回収して繊維や新しいボトルに再生する方法はマテリアルリサイクルとよばれる", "高分子を単量体に分解して再利用する方法をサーマルリサイクルという", "焼却して熱エネルギーを回収する方法をケミカルリサイクルという", "熱硬化性樹脂は加熱すると軟化するため再成形が容易である"], "ans": 0, "exp": "材料として再生=マテリアル、単量体などに化学分解=ケミカル、熱回収=サーマル。熱硬化性樹脂は網目構造で再成形できない。"}], "hot": true}];
const MOCKS = [{"set": 1, "name": "本番形式模試 第1回", "time": 3600, "sections": [{"dai": 1, "title": "第1問 物質の構成・状態", "questions": [{"id": "m1-01", "pts": 3, "q": "塩素の同位体 ³⁵Cl と ³⁷Cl について、中性子の数の差として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["0", "1", "2", "4"], "ans": 2, "exp": "陽子数は同じ17。中性子数は35−17=18と37−17=20で、差は2。"}, {"id": "m1-02", "pts": 3, "q": "直線形で無極性の分子を、次の①〜④のうちから一つ選べ。", "opts": ["アンモニア NH₃", "塩化水素 HCl", "水 H₂O", "二酸化炭素 CO₂"], "ans": 3, "exp": "CO₂は直線形で、2つのC=O結合の極性が打ち消し合い無極性分子となる。"}, {"id": "m1-03", "pts": 3, "q": "0℃、1.013×10⁵ Pa における密度が 1.25 g/L の気体として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["窒素 N₂", "酸素 O₂", "二酸化炭素 CO₂", "メタン CH₄"], "ans": 0, "exp": "M=1.25×22.4=28。分子量28はN₂。"}, {"id": "m1-04", "pts": 3, "q": "硝酸カリウムの溶解度(水100 gあたり)は40℃で64、20℃で32である。40℃の飽和水溶液 164 g を20℃に冷却したとき析出する結晶の質量として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["16 g", "32 g", "64 g", "96 g"], "ans": 1, "exp": "164 g=水100 g+KNO₃ 64 g。20℃では32 gまで溶けるので析出は64−32=32 g。"}, {"id": "m1-05", "pts": 4, "q": "0.050 mol/kg の塩化カルシウム CaCl₂ 水溶液の凝固点として最も適当な数値を、次の①〜④のうちから一つ選べ。水のモル凝固点降下 1.85 K・kg/mol、CaCl₂は完全に電離するものとする。", "opts": ["−0.093℃", "−0.19℃", "−0.28℃", "−0.37℃"], "ans": 2, "exp": "CaCl₂→Ca²⁺+2Cl⁻ で粒子は3倍の0.15 mol/kg。Δt=1.85×0.15≒0.28 K。"}, {"id": "m1-06", "pts": 4, "q": "ある金属は面心立方格子の結晶をつくり、単位格子の一辺は 3.6×10⁻⁸ cm、結晶の密度は 9.0 g/cm³ である。この金属の原子量として最も適当な数値を、次の①〜④のうちから一つ選べ。アボガドロ定数 6.0×10²³/mol、(3.6)³=46.7 とする。", "opts": ["27", "56", "63", "108"], "ans": 2, "exp": "M=ρ×N_A×a³/4=9.0×6.0×10²³×46.7×10⁻²⁴/4≒63。銅に相当する。"}]}, {"dai": 2, "title": "第2問 物質の変化・平衡", "questions": [{"id": "m1-07", "pts": 3, "q": "エタノールの燃焼エンタルピーは −1368 kJ/mol である。エタノール C₂H₅OH 9.2 g を完全燃焼させたときに発生する熱量として最も適当な数値を、次の①〜④のうちから一つ選べ。C₂H₅OH=46 とする。", "opts": ["68 kJ", "137 kJ", "274 kJ", "1368 kJ"], "ans": 2, "exp": "9.2/46=0.20 mol。1368×0.20≒274 kJ。"}, {"id": "m1-08", "pts": 3, "q": "硝酸銀水溶液を白金電極で電気分解し、0.20 A の電流を 9650 秒間流した。陰極に析出する銀の質量として最も適当な数値を、次の①〜④のうちから一つ選べ。Ag=108、ファラデー定数 9.65×10⁴ C/mol とする。", "opts": ["1.1 g", "2.2 g", "4.3 g", "8.6 g"], "ans": 1, "exp": "Q=0.20×9650=1930 C=0.020 mol e⁻。Ag⁺+e⁻→Agより0.020 mol=2.16≒2.2 g。"}, {"id": "m1-09", "pts": 3, "q": "2SO₂ + O₂ ⇌ 2SO₃(ΔH<0)の平衡において、SO₃の生成率を高める条件として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["高温・高圧", "高温・低圧", "低温・高圧", "低温・低圧"], "ans": 2, "exp": "発熱反応なので低温ほど、また気体分子数が減る方向なので高圧ほどSO₃側に平衡が移動する。"}, {"id": "m1-10", "pts": 3, "q": "温度が10 K上がるごとに反応速度が2倍になる反応がある。温度を30 K上げると反応速度は何倍になるか。正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["3倍", "6倍", "8倍", "16倍"], "ans": 2, "exp": "2³=8倍。"}, {"id": "m1-11", "pts": 4, "q": "H₂ + I₂ ⇌ 2HI の平衡定数はある温度で K=64 である。平衡状態で[H₂]=[I₂]=0.10 mol/L のとき、[HI]として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["0.40 mol/L", "0.64 mol/L", "0.80 mol/L", "6.4 mol/L"], "ans": 2, "exp": "[HI]²=64×0.10×0.10=0.64。[HI]=0.80 mol/L。"}, {"id": "m1-12", "pts": 4, "q": "濃度不明の過酸化水素水 10.0 mL を硫酸酸性にし、0.010 mol/L 過マンガン酸カリウム水溶液で滴定したところ 10.0 mL で赤紫色が消えなくなった。過酸化水素水の濃度として最も適当な数値を、次の①〜④のうちから一つ選べ。MnO₄⁻は5電子を受け取り、H₂O₂は2電子を放出する。", "opts": ["0.010 mol/L", "0.025 mol/L", "0.050 mol/L", "0.10 mol/L"], "ans": 1, "exp": "e⁻=0.010×0.0100×5=5.0×10⁻⁴ mol。H₂O₂=2.5×10⁻⁴ mol。2.5×10⁻⁴/0.0100=0.025 mol/L。"}]}, {"dai": 3, "title": "第3問 無機物質", "questions": [{"id": "m1-13", "pts": 3, "q": "塩素 Cl₂ に関する記述として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["水にまったく溶けない", "空気より軽い", "無色・無臭の気体である", "黄緑色で、水溶液は漂白・殺菌作用を示す"], "ans": 3, "exp": "Cl₂は黄緑色・刺激臭の有毒気体。水に溶けて次亜塩素酸HClOを生じ、漂白・殺菌作用を示す。"}, {"id": "m1-14", "pts": 3, "q": "接触法による硫酸の製造に関する記述として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["SO₂をV₂O₅触媒で酸化し、SO₃を濃硫酸に吸収させる", "黄鉄鉱を還元してSO₂をつくる", "白金触媒を用いてSO₂を酸化する", "SO₃を直接水に吸収させて硫酸とする"], "ans": 0, "exp": "SO₂をV₂O₅触媒で酸化しSO₃とし、濃硫酸に吸収させ発煙硫酸としてから希硫酸で薄める。"}, {"id": "m1-15", "pts": 3, "q": "ある金属イオンの水溶液に希塩酸を加えると白色沈殿が生じ、この沈殿は熱湯に溶けた。この金属イオンとして最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["Cu²⁺", "Fe³⁺", "Ag⁺", "Pb²⁺"], "ans": 3, "exp": "塩酸で白色沈殿をつくるのはAg⁺とPb²⁺。PbCl₂は熱湯に溶ける点でAgClと区別できる。"}, {"id": "m1-16", "pts": 3, "q": "アルカリ金属の単体に関する記述として誤りを含むものを、次の①〜④のうちから一つ選べ。", "opts": ["密度が小さく、軟らかい", "常温の水と反応して水素を発生する", "空気中で速やかに酸化されるため石油中に保存する", "反応性は Li > Na > K の順に大きい"], "ans": 3, "exp": "アルカリ金属の反応性は原子番号が大きいほど大きく、K>Na>Li。"}, {"id": "m1-17", "pts": 4, "q": "塩化銀の沈殿に過剰のアンモニア水を加えると沈殿が溶けた。このとき生成した錯イオンの化学式と形の組合せとして正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["[Ag(NH₃)₂]⁺・直線形", "[Ag(NH₃)₄]⁺・正四面体形", "[Ag(NH₃)₂]⁺・折れ線形", "[Ag(NH₃)₄]³⁺・正方形"], "ans": 0, "exp": "Ag⁺の錯イオンは配位数2で直線形の[Ag(NH₃)₂]⁺。"}, {"id": "m1-18", "pts": 4, "q": "炭酸カルシウムを90%含む石灰石 20 g に十分な量の希塩酸を加えたとき、発生する二酸化炭素の体積は標準状態で何 L か。最も適当な数値を、次の①〜④のうちから一つ選べ。CaCO₃=100 とし、不純物は反応しないものとする。", "opts": ["2.0 L", "4.0 L", "4.5 L", "22.4 L"], "ans": 1, "exp": "CaCO₃=20×0.90=18 g=0.18 mol。CO₂も0.18 molで、0.18×22.4≒4.0 L。"}]}, {"dai": 4, "title": "第4問 有機化合物", "questions": [{"id": "m1-19", "pts": 3, "q": "塩化鉄(Ⅲ)水溶液を加えると紫色に呈色する化合物を、次の①〜④のうちから一つ選べ。", "opts": ["フェノール", "トルエン", "安息香酸", "ベンゼン"], "ans": 0, "exp": "フェノール性ヒドロキシ基をもつ化合物はFeCl₃水溶液で青紫〜赤紫色に呈色する。"}, {"id": "m1-20", "pts": 3, "q": "分子式 C₅H₁₂ で表されるアルカンの構造異性体の数として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["2", "3", "4", "5"], "ans": 1, "exp": "ペンタン、2-メチルブタン、2,2-ジメチルプロパンの3種。"}, {"id": "m1-21", "pts": 3, "q": "リン酸を触媒としてエチレンに水を付加させたときに得られる化合物として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["アセトアルデヒド", "ジエチルエーテル", "メタノール", "エタノール"], "ans": 3, "exp": "CH₂=CH₂+H₂O→C₂H₅OH。エタノールの工業的製法。"}, {"id": "m1-22", "pts": 3, "q": "ベンゼンからアニリンを合成する経路として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["ベンゼン→ニトロベンゼン→(スズと塩酸で還元)→アニリン", "ベンゼン→クロロベンゼン→(加水分解)→アニリン", "ベンゼン→ベンゼンスルホン酸→(アルカリ融解)→アニリン", "ベンゼン→トルエン→(酸化)→アニリン"], "ans": 0, "exp": "濃硝酸・濃硫酸でニトロ化し、ニトロベンゼンをSnとHClで還元してアニリンを得る。"}, {"id": "m1-23", "pts": 4, "q": "炭素・水素・酸素からなる化合物 6.0 mg を完全燃焼させたところ、CO₂ 8.8 mg と H₂O 3.6 mg が生じた。この化合物の組成式として最も適当なものを、次の①〜④のうちから一つ選べ。H=1.0、C=12、O=16 とする。", "opts": ["CH₂O", "C₂H₄O", "CH₄O", "C₂H₆O"], "ans": 0, "exp": "C=8.8×12/44=2.4 mg、H=3.6×2.0/18=0.40 mg、O=6.0−2.8=3.2 mg。C:H:O=0.20:0.40:0.20=1:2:1。"}, {"id": "m1-24", "pts": 4, "q": "分子式 C₃H₈O で表される化合物のうち、金属ナトリウムと反応しないものとして正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["1-プロパノール", "2-プロパノール", "エチルメチルエーテル", "3種すべて反応する"], "ans": 2, "exp": "Naと反応するのは-OHをもつアルコール。エーテルはヒドロキシ基をもたないため反応しない。"}]}, {"dai": 5, "title": "第5問 高分子化合物・総合", "questions": [{"id": "m1-25", "pts": 3, "q": "アクリル繊維の主な単量体として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["アクリロニトリル", "スチレン", "プロペン", "塩化ビニル"], "ans": 0, "exp": "アクリル繊維はアクリロニトリル CH₂=CH-CN を主成分とする付加重合体で、羊毛に似た風合いをもつ。"}, {"id": "m1-26", "pts": 3, "q": "スクロースを加水分解したときに得られる単糖の組合せとして正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["フルクトースのみ", "グルコースのみ", "グルコースとフルクトース", "グルコースとガラクトース"], "ans": 2, "exp": "スクロースはグルコースとフルクトースが縮合した二糖。加水分解物は転化糖と呼ばれ還元性を示す。"}, {"id": "m1-27", "pts": 3, "q": "タンパク質水溶液に水酸化ナトリウム水溶液と少量の硫酸銅(Ⅱ)水溶液を加えると赤紫色になった。この反応の名称として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["ニンヒドリン反応", "ヨウ素デンプン反応", "キサントプロテイン反応", "ビウレット反応"], "ans": 3, "exp": "ビウレット反応は2個以上のペプチド結合をもつ(トリペプチド以上)化合物で起こる。"}, {"id": "m1-28", "pts": 3, "q": "熱硬化性樹脂に分類されるものを、次の①〜④のうちから一つ選べ。", "opts": ["ポリエチレン", "ポリ塩化ビニル", "フェノール樹脂", "ポリスチレン"], "ans": 2, "exp": "フェノール樹脂・尿素樹脂・メラミン樹脂は立体網目構造をもつ熱硬化性樹脂。他は熱可塑性。"}, {"id": "m1-29", "pts": 4, "q": "ポリ塩化ビニル(繰り返し単位 -CH₂-CHCl-、式量62.5)の平均分子量が 2.5×10⁴ のとき、平均重合度として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["200", "400", "800", "4000"], "ans": 1, "exp": "n=2.5×10⁴/62.5=400。"}, {"id": "m1-30", "pts": 4, "q": "ナイロン66の繰り返し単位(式量226)には2個のアミド結合が含まれる。平均分子量 2.26×10⁴ のナイロン66の1分子に含まれるアミド結合の数として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["約100", "約200", "約400", "約452"], "ans": 1, "exp": "重合度n=2.26×10⁴/226=100。1単位に2個のアミド結合があるので約200個。"}]}]}, {"set": 2, "name": "本番形式模試 第2回", "time": 3600, "sections": [{"dai": 1, "title": "第1問 物質の構成・状態", "questions": [{"id": "m2-01", "pts": 3, "q": "アルゴン原子と同じ電子配置をもつイオンを、次の①〜④のうちから一つ選べ。", "opts": ["Na⁺", "Mg²⁺", "Ca²⁺", "Al³⁺"], "ans": 2, "exp": "Arの電子数は18。Ca²⁺=20−2=18で一致。Na⁺・Mg²⁺・Al³⁺はNe型(10個)。"}, {"id": "m2-02", "pts": 3, "q": "常温・常圧で昇華しやすい物質を、次の①〜④のうちから一つ選べ。", "opts": ["ヨウ素", "硫黄", "スクロース", "塩化ナトリウム"], "ans": 0, "exp": "ヨウ素は分子結晶で昇華しやすい。ドライアイス、ナフタレンも代表例。"}, {"id": "m2-03", "pts": 3, "q": "窒素と酸素を物質量の比 3:1 で混合した気体の全圧が 1.2×10⁵ Pa のとき、酸素の分圧として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["3.0×10⁴ Pa", "4.0×10⁴ Pa", "6.0×10⁴ Pa", "9.0×10⁴ Pa"], "ans": 0, "exp": "O₂のモル分率は1/4。1.2×10⁵×1/4=3.0×10⁴ Pa。"}, {"id": "m2-04", "pts": 3, "q": "0℃、1.0×10⁵ Pa の窒素は水 1.0 L に 1.0×10⁻³ mol 溶ける。0℃、2.0×10⁵ Pa の窒素が水 2.0 L に接しているとき、溶ける窒素の物質量として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["1.0×10⁻³ mol", "2.0×10⁻³ mol", "4.0×10⁻³ mol", "8.0×10⁻³ mol"], "ans": 2, "exp": "ヘンリーの法則より圧力2倍で2倍、水量2倍で2倍。1.0×10⁻³×2×2=4.0×10⁻³ mol。"}, {"id": "m2-05", "pts": 4, "q": "コロイドに関する次の記述 a〜c の正誤の組合せとして正しいものを、次の①〜④のうちから一つ選べ。\na セロハンなどの半透膜を用いてコロイド粒子と小さい分子・イオンを分離する操作を透析という。\nb コロイド溶液に直流電圧をかけると、帯電したコロイド粒子が一方の電極へ移動する。\nc ブラウン運動は、コロイド粒子どうしが衝突するために起こる。", "opts": ["a:誤 b:正 c:正", "a:正 b:正 c:正", "a:正 b:正 c:誤", "a:正 b:誤 c:正"], "ans": 2, "exp": "ブラウン運動は熱運動する分散媒(水)分子がコロイド粒子に衝突して起こる。cのみ誤り。"}, {"id": "m2-06", "pts": 4, "q": "ある金属は体心立方格子の結晶をつくり、原子量は56、単位格子の体積は 2.4×10⁻²³ cm³ である。この結晶の密度として最も適当な数値を、次の①〜④のうちから一つ選べ。アボガドロ定数 6.0×10²³/mol とする。", "opts": ["3.9 g/cm³", "7.8 g/cm³", "12 g/cm³", "16 g/cm³"], "ans": 1, "exp": "体心立方格子は単位格子中に2原子。密度=(2×56)/(6.0×10²³×2.4×10⁻²³)=112/14.4≒7.8 g/cm³。鉄に相当。"}]}, {"dai": 2, "title": "第2問 物質の変化・平衡", "questions": [{"id": "m2-07", "pts": 3, "q": "強酸と強塩基の中和エンタルピーを −57 kJ/mol とする。0.50 mol/L の塩酸 100 mL と 0.50 mol/L の水酸化ナトリウム水溶液 100 mL を混合したときに発生する熱量として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["1.4 kJ", "2.9 kJ", "5.7 kJ", "29 kJ"], "ans": 1, "exp": "生成するH₂Oは0.050 mol。57×0.050≒2.9 kJ。"}, {"id": "m2-08", "pts": 3, "q": "C(固) + CO₂ ⇌ 2CO(ΔH>0)の平衡を右(CO生成)に移動させる操作として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["温度を上げる", "温度を下げる", "加圧する", "COを加える"], "ans": 0, "exp": "吸熱反応なので高温で右に移動。また気体分子数が増える方向なので減圧も右に移動させる。"}, {"id": "m2-09", "pts": 3, "q": "0.10 mol/L のアンモニア水(電離度 0.010)のpHとして最も適当な数値を、次の①〜④のうちから一つ選べ。水のイオン積 1.0×10⁻¹⁴ (mol/L)² とする。", "opts": ["3", "10", "11", "13"], "ans": 2, "exp": "[OH⁻]=0.10×0.010=1.0×10⁻³ mol/L。[H⁺]=1.0×10⁻¹¹ mol/L でpH=11。"}, {"id": "m2-10", "pts": 3, "q": "物質Aの分解反応で、Aの濃度を2倍にすると反応速度が4倍になった。この反応の速度式として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["v=k[A]³", "v=k(濃度によらない)", "v=k[A]", "v=k[A]²"], "ans": 3, "exp": "2²=4より、速度は[A]の2乗に比例する。"}, {"id": "m2-11", "pts": 4, "q": "結合エネルギーを N≡N 946 kJ/mol、H–H 436 kJ/mol、N–H 391 kJ/mol とするとき、N₂ + 3H₂ → 2NH₃ のΔHとして最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["−92 kJ", "+92 kJ", "−184 kJ", "−46 kJ"], "ans": 0, "exp": "ΔH=(946+3×436)−(6×391)=2254−2346=−92 kJ。"}, {"id": "m2-12", "pts": 4, "q": "鉛蓄電池を放電させ、電子 0.20 mol 分の電気量を取り出したときの正極の質量変化として最も適当な数値を、次の①〜④のうちから一つ選べ。PbO₂=239、PbSO₄=303 とする。", "opts": ["6.4 g増加", "6.4 g減少", "9.6 g増加", "変化しない"], "ans": 0, "exp": "正極 PbO₂+4H⁺+SO₄²⁻+2e⁻→PbSO₄+2H₂O。e⁻ 2 molあたり303−239=64 g増。0.20 molでは6.4 g増加。"}]}, {"dai": 3, "title": "第3問 無機物質", "questions": [{"id": "m2-13", "pts": 3, "q": "ハロゲン化銀のうち、水に溶けやすいものを、次の①〜④のうちから一つ選べ。", "opts": ["AgF", "AgCl", "AgBr", "AgI"], "ans": 0, "exp": "AgFのみ水に溶けやすい。AgCl(白)・AgBr(淡黄)・AgI(黄)は難溶で感光性をもつ。"}, {"id": "m2-14", "pts": 3, "q": "実験室でアンモニアを発生させる方法として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["塩化アンモニウムと水酸化カルシウムの混合物を加熱する", "窒素と水素を混合して点火する", "硝酸アンモニウムを水に溶かす", "アンモニア水を冷却する"], "ans": 0, "exp": "2NH₄Cl+Ca(OH)₂→CaCl₂+2H₂O+2NH₃。固体どうしの加熱なので試験管の口を少し下げて加熱する。"}, {"id": "m2-15", "pts": 3, "q": "銅の炎色反応の色として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["黄色", "赤色", "青緑色", "赤紫色"], "ans": 2, "exp": "Cuは青緑色。Na黄、Li赤、K赤紫。"}, {"id": "m2-16", "pts": 3, "q": "酸とも強塩基の水溶液とも反応する両性酸化物を、次の①〜④のうちから一つ選べ。", "opts": ["Na₂O", "MgO", "Al₂O₃", "CO₂"], "ans": 2, "exp": "Al₂O₃・ZnOなどは両性酸化物。Na₂O・MgOは塩基性酸化物、CO₂は酸性酸化物。"}, {"id": "m2-17", "pts": 4, "q": "ある金属イオンの水溶液に、酸性条件で硫化水素を通じても沈殿は生じなかったが、アンモニア水を加えて塩基性にしてから硫化水素を通じると白色の沈殿が生じた。この金属イオンとして最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["Cu²⁺", "Ag⁺", "Zn²⁺", "Pb²⁺"], "ans": 2, "exp": "ZnSは酸性では沈殿せず、中〜塩基性で白色沈殿をつくる。Cu²⁺・Ag⁺・Pb²⁺の硫化物は酸性でも沈殿する(黒色)。"}, {"id": "m2-18", "pts": 4, "q": "イオン交換膜法で塩化ナトリウム水溶液を電気分解し、電子 0.50 mol 分の電気量を流した。理論上得られる水酸化ナトリウムの質量として最も適当な数値を、次の①〜④のうちから一つ選べ。NaOH=40 とする。", "opts": ["10 g", "20 g", "40 g", "80 g"], "ans": 1, "exp": "陰極 2H₂O+2e⁻→H₂+2OH⁻ より、e⁻ 0.50 molでOH⁻ 0.50 mol。NaOH 0.50 mol=20 g。"}]}, {"dai": 4, "title": "第4問 有機化合物", "questions": [{"id": "m2-19", "pts": 3, "q": "分子式 C₄H₈ をもつ化合物として適当でないものを、次の①〜④のうちから一つ選べ。", "opts": ["1-ブテン", "2-ブテン", "シクロブタン", "ブタン"], "ans": 3, "exp": "ブタンはC₄H₁₀。C₄H₈はアルケンまたはシクロアルカン。"}, {"id": "m2-20", "pts": 3, "q": "グルコース 90 g をアルコール発酵させたとき、生成するエタノールの質量として最も適当な数値を、次の①〜④のうちから一つ選べ。C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂、C₆H₁₂O₆=180、C₂H₅OH=46 とする。", "opts": ["23 g", "46 g", "90 g", "92 g"], "ans": 1, "exp": "グルコース0.50 molからエタノール1.0 mol=46 gが生成する。"}, {"id": "m2-21", "pts": 3, "q": "酢酸に関する記述として誤りを含むものを、次の①〜④のうちから一つ選べ。", "opts": ["純粋なものは冬期に凝固し、氷酢酸と呼ばれる", "水溶液は弱酸性を示す", "炭酸水素ナトリウム水溶液と反応して二酸化炭素を発生する", "銀鏡反応を示す"], "ans": 3, "exp": "銀鏡反応を示すのはホルミル基をもつ化合物。カルボン酸ではギ酸のみが示し、酢酸は示さない。"}, {"id": "m2-22", "pts": 3, "q": "クメン法によるフェノールの製造で、フェノールとともに得られる化合物として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["アセトン", "アセトアルデヒド", "メタノール", "安息香酸"], "ans": 0, "exp": "ベンゼンとプロペンからクメンをつくり、酸化・分解してフェノールとアセトンを得る。"}, {"id": "m2-23", "pts": 4, "q": "炭化カルシウム CaC₂ 6.4 g に水を加えたときに発生するアセチレンの体積は標準状態で何 L か。最も適当な数値を、次の①〜④のうちから一つ選べ。CaC₂=64 とする。", "opts": ["1.1 L", "2.2 L", "4.5 L", "22.4 L"], "ans": 1, "exp": "CaC₂+2H₂O→Ca(OH)₂+C₂H₂。CaC₂ 0.10 molからC₂H₂ 0.10 mol=2.24≒2.2 L。"}, {"id": "m2-24", "pts": 4, "q": "分子式 C₄H₈O₂ で表されるカルボン酸の構造異性体の数として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["1", "2", "3", "4"], "ans": 1, "exp": "酪酸 CH₃CH₂CH₂COOH と 2-メチルプロパン酸 (CH₃)₂CHCOOH の2種。"}]}, {"dai": 5, "title": "第5問 高分子化合物・総合", "questions": [{"id": "m2-25", "pts": 3, "q": "ポリプロピレンの単量体として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["エチレン", "プロペン(プロピレン)", "スチレン", "塩化ビニル"], "ans": 1, "exp": "CH₂=CH-CH₃(プロペン)の付加重合体がポリプロピレン。容器や自動車部品に使われる。"}, {"id": "m2-26", "pts": 3, "q": "α-アミノ酸のうち、不斉炭素原子をもたないものを、次の①〜④のうちから一つ選べ。", "opts": ["アラニン", "グリシン", "フェニルアラニン", "システイン"], "ans": 1, "exp": "グリシン H₂N-CH₂-COOH は側鎖がHで、中心炭素に同じ置換基が2つあるため不斉炭素をもたない。"}, {"id": "m2-27", "pts": 3, "q": "塩化カルシウム CaCl₂ 0.010 mol を含む水溶液を、十分な量の陽イオン交換樹脂(H型)に通した。流出液に含まれる水素イオンの物質量として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["0.010 mol", "0.020 mol", "0.030 mol", "0.040 mol"], "ans": 1, "exp": "Ca²⁺ 1個がH⁺ 2個と交換される。0.010×2=0.020 mol。"}, {"id": "m2-28", "pts": 3, "q": "スチレン-ブタジエンゴム(SBR)の原料の組合せとして正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["スチレンと1,3-ブタジエン", "スチレンとイソプレン", "エチレンとブタジエン", "塩化ビニルとアセチレン"], "ans": 0, "exp": "SBRはスチレンと1,3-ブタジエンの共重合体で、タイヤなどに使われる合成ゴム。"}, {"id": "m2-29", "pts": 4, "q": "あるタンパク質水溶液に濃硝酸を加えて加熱すると黄色になり、冷却後アンモニア水を加えると橙黄色になった。この反応が示すものとして最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["ペプチド結合が2個以上あること", "ベンゼン環をもつアミノ酸を含むこと", "硫黄を含むアミノ酸を含むこと", "デンプンを含むこと"], "ans": 1, "exp": "キサントプロテイン反応。ベンゼン環がニトロ化されて黄色になる。硫黄の検出は酢酸鉛(Ⅱ)による黒色沈殿。"}, {"id": "m2-30", "pts": 4, "q": "デンプン 32.4 g を完全に加水分解してグルコースとし、それをすべてアルコール発酵させた。生成するエタノールの質量として最も適当な数値を、次の①〜④のうちから一つ選べ。(C₆H₁₀O₅)ₙ の繰り返し単位の式量162、C₆H₁₂O₆=180、C₂H₅OH=46 とする。", "opts": ["9.2 g", "18 g", "23 g", "37 g"], "ans": 1, "exp": "繰り返し単位0.20 mol→グルコース0.20 mol→エタノール0.40 mol=18.4≒18 g。"}]}]}, {"set": 3, "name": "本番形式模試 第3回(発展形式)", "time": 3600, "sections": [{"dai": 1, "title": "第1問 物質の構成・状態", "questions": [{"id": "m3-01", "pts": 3, "q": "分子結晶である物質の組合せとして正しいものを、次の①〜⑥のうちから一つ選べ。", "opts": ["二酸化ケイ素と銅", "塩化ナトリウムと二酸化ケイ素", "ドライアイスとヨウ素", "ドライアイスと塩化ナトリウム", "ヨウ素と二酸化ケイ素", "塩化ナトリウムと銅"], "ans": 2, "exp": "ドライアイス(CO₂)とヨウ素は分子結晶。NaClはイオン結晶、SiO₂は共有結合の結晶、Cuは金属結晶。"}, {"id": "m3-02", "pts": 3, "svg": "<svg viewBox='0 0 380 250' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif' font-size='11'><line x1='90' y1='210' x2='365' y2='210' stroke='#5b6b85' stroke-width='1.5'/><line x1='90' y1='210' x2='90' y2='15' stroke='#5b6b85' stroke-width='1.5'/><text x='200' y='240' fill='#5b6b85'>温度 [℃]</text><text x='58' y='12' fill='#5b6b85'>体積</text><line x1='130' y1='190' x2='340' y2='60' stroke='#4f7cff' stroke-width='2.5'/><line x1='130' y1='190' x2='60' y2='233' stroke='#999' stroke-dasharray='5 4' stroke-width='2'/><text x='96' y='226' fill='#2b3a55' font-weight='bold'>X</text><text x='142' y='226' fill='#5b6b85'>0</text><circle cx='60' cy='233' r='0' fill='none'/></svg>", "q": "図は圧力一定のもとで一定量の理想気体の体積を温度に対して示したものである。直線を低温側に外挿したとき、体積が0となる温度 X として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["−273℃", "−100℃", "0℃", "−373℃"], "ans": 0, "exp": "シャルルの法則より体積は絶対温度に比例し、外挿すると絶対零度−273℃で体積0となる。"}, {"id": "m3-03", "pts": 3, "q": "0℃、1.0×10⁵ Pa の窒素は水 1.0 L に 1.0×10⁻³ mol 溶ける。0℃で 2.0×10⁵ Pa の窒素が水 0.50 L に接しているとき、溶ける窒素の物質量として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["5.0×10⁻⁴ mol", "1.0×10⁻³ mol", "2.0×10⁻³ mol", "4.0×10⁻³ mol"], "ans": 1, "exp": "圧力2倍で2倍、水量1/2で1/2。1.0×10⁻³×2×0.5=1.0×10⁻³ mol。"}, {"id": "m3-04", "pts": 3, "q": "60℃の水の飽和蒸気圧を 2.0×10⁴ Pa とする。60℃で水蒸気により飽和した密閉容器内の湿った空気の全圧が 1.0×10⁵ Pa のとき、乾いた空気(水蒸気以外の成分)の分圧として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["2.0×10⁴ Pa", "5.0×10⁴ Pa", "8.0×10⁴ Pa", "1.0×10⁵ Pa"], "ans": 2, "exp": "分圧の和が全圧。空気の分圧=1.0×10⁵−2.0×10⁴=8.0×10⁴ Pa。"}, {"id": "m3-05", "pts": 4, "q": "〔リード文〕沸騰した水に塩化鉄(Ⅲ)水溶液を少量ずつ加えると、赤褐色の水酸化鉄(Ⅲ)のコロイド溶液が得られた。\n\n問5　このコロイド溶液をU字管に入れて直流電圧をかけると、コロイド粒子は陰極側に移動した。このことからわかることとして最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["コロイド粒子は正に帯電している", "コロイド粒子は負に帯電している", "コロイド粒子は帯電していない", "コロイド粒子は磁性をもつ"], "ans": 0, "exp": "陰極(負極側)に引かれるのは正電荷をもつ粒子。水酸化鉄(Ⅲ)コロイドは正コロイドの代表例。"}, {"id": "m3-06", "pts": 4, "q": "〔問5のリード文の続き〕\n問6　このコロイド溶液を最も少ない物質量で凝析させる電解質を、次の①〜⑥のうちから一つ選べ。", "opts": ["塩化ナトリウム NaCl", "硫酸ナトリウム Na₂SO₄", "リン酸ナトリウム Na₃PO₄", "塩化マグネシウム MgCl₂", "塩化アルミニウム AlCl₃", "硝酸カリウム KNO₃"], "ans": 2, "exp": "正コロイドの凝析には反対符号の陰イオンの価数が重要。PO₄³⁻(3価)をもつNa₃PO₄が最も少量で有効(問5の帯電符号の判断を使う連問)。"}]}, {"dai": 2, "title": "第2問 物質の変化・平衡", "questions": [{"id": "m3-07", "pts": 3, "q": "生成エンタルピーを CO₂(気)−394 kJ/mol、H₂O(液)−286 kJ/mol、エタノール C₂H₅OH(液)−277 kJ/mol とするとき、エタノールの燃焼エンタルピー(C₂H₅OH + 3O₂ → 2CO₂ + 3H₂O(液))として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["−957 kJ/mol", "−1369 kJ/mol", "−1646 kJ/mol", "−1923 kJ/mol"], "ans": 1, "exp": "ΔH={2×(−394)+3×(−286)}−(−277)=−1646+277=−1369 kJ/mol。"}, {"id": "m3-08", "pts": 3, "svg": "<svg viewBox='0 0 380 250' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif' font-size='11'><line x1='40' y1='210' x2='365' y2='210' stroke='#5b6b85' stroke-width='1.5'/><line x1='40' y1='210' x2='40' y2='15' stroke='#5b6b85' stroke-width='1.5'/><text x='100' y='240' fill='#5b6b85'>分子の運動エネルギー</text><text x='8' y='12' fill='#5b6b85'>分子の数の割合</text><path d='M40,208 Q95,40 150,120 Q220,195 350,207' fill='none' stroke='#4f7cff' stroke-width='2.5'/><path d='M40,209 Q125,90 195,140 Q265,185 355,203' fill='none' stroke='#ef5b7b' stroke-width='2.5' stroke-dasharray='7 5'/><line x1='250' y1='210' x2='250' y2='40' stroke='#999' stroke-dasharray='5 4'/><text x='256' y='55' fill='#5b6b85'>活性化エネルギー E</text><text x='95' y='45' fill='#4f7cff' font-weight='bold'>T₁</text><text x='195' y='105' fill='#ef5b7b' font-weight='bold'>T₂</text></svg>", "q": "図は温度 T₁ と T₂(T₁<T₂)における分子の運動エネルギー分布である。温度を上げると反応速度が著しく大きくなる理由を、この図から説明したものとして最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["活性化エネルギーE以上のエネルギーをもつ分子の割合が増えるから", "活性化エネルギーEの値自体が小さくなるから", "分子の総数が増えるから", "分布の山が高くなるから"], "ans": 0, "exp": "T₂ではEより右側の面積(割合)が大きく増える。これが有効衝突の急増、すなわち速度の増大に対応する。"}, {"id": "m3-09", "pts": 3, "q": "〔リード文〕鉛蓄電池を放電させたところ、負極の質量が 4.8 g 増加した。SO₄=96、Pb=207、ファラデー定数 9.65×10⁴ C/mol とする。\n\n問9　このとき回路に流れた電子の物質量として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["0.050 mol", "0.10 mol", "0.20 mol", "0.40 mol"], "ans": 1, "exp": "負極 Pb+SO₄²⁻→PbSO₄+2e⁻ では、e⁻ 2 molあたり質量が96 g増える。4.8/96×2=0.10 mol。"}, {"id": "m3-10", "pts": 3, "q": "〔問9の続き〕\n問10　このとき正極の質量は何 g 増加したか。最も適当な数値を、次の①〜④のうちから一つ選べ。PbO₂=239、PbSO₄=303 とする。", "opts": ["1.6 g", "3.2 g", "4.8 g", "6.4 g"], "ans": 1, "exp": "正極はPbO₂→PbSO₄で、e⁻ 2 molあたり303−239=64 g増。問9で求めた0.10 molを使い、64×0.10/2=3.2 g。前問の結果を用いる連問。"}, {"id": "m3-11", "pts": 4, "q": "体積一定の容器に水素 1.0 mol とヨウ素 1.0 mol を入れて高温に保った。H₂ + I₂ ⇌ 2HI の平衡定数を K=36 とするとき、平衡時のヨウ化水素 HI の物質量として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["0.75 mol", "1.2 mol", "1.5 mol", "1.8 mol"], "ans": 2, "exp": "反応量をyとすると (2y)²/(1.0−y)²=36 より 2y/(1.0−y)=6、y=0.75。HI=2y=1.5 mol。"}, {"id": "m3-12", "pts": 4, "q": "酢酸 0.10 mol/L と酢酸ナトリウム 0.20 mol/L を含む緩衝液のpHとして最も適当な数値を、次の①〜④のうちから一つ選べ。酢酸の電離定数を Ka=2.0×10⁻⁵ mol/L、log₁₀2=0.30 とする。", "opts": ["4.7", "5.0", "5.3", "4.0"], "ans": 1, "exp": "[H⁺]=Ka×(0.10/0.20)=1.0×10⁻⁵ mol/L。pH=5.0。"}]}, {"dai": 3, "title": "第3問 無機物質", "questions": [{"id": "m3-13", "pts": 3, "q": "水上置換で捕集するのが適当な気体の組合せを、次の①〜⑥のうちから一つ選べ。", "opts": ["H₂ と NO", "H₂ と NH₃", "NO と HCl", "NH₃ と HCl", "O₂ と NH₃", "H₂ と NO₂"], "ans": 0, "exp": "水に溶けにくいH₂・NO・O₂は水上置換。NH₃は上方置換、HCl・NO₂は下方置換。"}, {"id": "m3-14", "pts": 3, "q": "ヨウ素に関する記述として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["ヨウ化カリウム水溶液には溶けて褐色の溶液になる", "水によく溶ける", "常温で黄緑色の気体である", "デンプン水溶液を赤色に変える"], "ans": 0, "exp": "I₂は水にほとんど溶けないが、KI水溶液にはI₃⁻となって溶ける(ヨウ素ヨウ化カリウム水溶液)。デンプンとは青紫色を呈する。"}, {"id": "m3-15", "pts": 3, "q": "Ag⁺、Fe³⁺、Na⁺ を含む水溶液に、まず希塩酸を加えてろ過し、次にろ液にアンモニア水を過剰に加えてろ過した。最後までろ液に残っているイオンとして最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["Na⁺", "Ag⁺", "Fe³⁺", "3種とも沈殿する"], "ans": 0, "exp": "塩酸でAgCl、過剰アンモニア水でFe(OH)₃が沈殿。Na⁺は沈殿をつくらずろ液に残る。炎色反応(黄色)で確認できる。"}, {"id": "m3-16", "pts": 3, "q": "オストワルト法では、アンモニア中の窒素原子はすべて硝酸に変換されるとみなせる。アンモニア 1.7 kg から得られる硝酸の質量として最も適当な数値を、次の①〜④のうちから一つ選べ。NH₃=17、HNO₃=63 とする。", "opts": ["1.7 kg", "3.2 kg", "6.3 kg", "13 kg"], "ans": 2, "exp": "NH₃ 100 mol→HNO₃ 100 mol(N原子保存)。63×100=6300 g=6.3 kg。"}, {"id": "m3-17", "pts": 4, "q": "酸の水溶液とも強塩基の水溶液とも反応して水素を発生する金属の組合せとして正しいものを、次の①〜⑥のうちから一つ選べ。", "opts": ["アルミニウムと亜鉛", "アルミニウムと銅", "亜鉛と銀", "鉄と亜鉛", "鉄と銅", "銅と銀"], "ans": 0, "exp": "両性金属はAl・Zn・Sn・Pb。FeやCu・Agは強塩基水溶液とは反応しない。"}, {"id": "m3-18", "pts": 4, "q": "ステンレス鋼に関する記述として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["鉄にクロムやニッケルを加えた合金で、さびにくい", "銅と亜鉛の合金で、電気伝導性が大きい", "アルミニウムを主成分とする軽合金である", "鉄に炭素を多量に含ませたもろい合金である"], "ans": 0, "exp": "ステンレス鋼はFe-Cr-Ni合金。表面にクロムのち密な酸化被膜ができ、さびにくい。流し台や刃物に使われる。"}]}, {"dai": 4, "title": "第4問 有機化合物", "questions": [{"id": "m3-19", "pts": 3, "q": "分子式 C₄H₈O₂ で表されるエステルの構造異性体の数として正しいものを、次の①〜⑥のうちから一つ選べ。", "opts": ["2", "3", "4", "5", "6", "7"], "ans": 2, "exp": "ギ酸プロピル、ギ酸イソプロピル、酢酸エチル、プロピオン酸メチルの4種。"}, {"id": "m3-20", "pts": 3, "q": "アニリンの検出法として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["さらし粉水溶液を加えると赤紫色を呈する", "塩化鉄(Ⅲ)水溶液を加えると紫色を呈する", "臭素水を加えると色が消える", "フェーリング液を還元して赤色沈殿を生じる"], "ans": 0, "exp": "アニリンはさらし粉水溶液で赤紫色。FeCl₃で呈色するのはフェノール類。"}, {"id": "m3-21", "pts": 3, "q": "〔リード文〕分子式 C₅H₁₀O₂ のエステルAを加水分解すると、カルボン酸Bとアルコール Cが得られた。Bは炭酸水素ナトリウム水溶液と反応して気体を発生したが、銀鏡反応は示さなかった。Cはヨードホルム反応を示し、酸化するとケトンになった。\n\n問21　カルボン酸Bとして最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["プロピオン酸", "酪酸", "ギ酸", "酢酸"], "ans": 3, "exp": "銀鏡反応を示さないのでギ酸ではない。C(炭素3)とのエステルがC₅H₁₀O₂になるためには、Bは炭素2の酢酸。"}, {"id": "m3-22", "pts": 3, "q": "〔問21の続き〕\n問22　エステルAの構造として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["酢酸プロピル CH₃COOCH₂CH₂CH₃", "酢酸イソプロピル CH₃COOCH(CH₃)₂", "プロピオン酸エチル C₂H₅COOC₂H₅", "ギ酸ブチル HCOOC₄H₉"], "ans": 1, "exp": "Cはヨードホルム陽性・酸化でケトン→2-プロパノール。問21の酢酸とのエステルは酢酸イソプロピル。連問で構造を確定する。"}, {"id": "m3-23", "pts": 4, "q": "分子量 890 の油脂 8.9 g を完全にけん化するのに必要な水酸化ナトリウムの質量として最も適当な数値を、次の①〜④のうちから一つ選べ。NaOH=40 とする。", "opts": ["0.40 g", "0.80 g", "1.2 g", "3.6 g"], "ans": 2, "exp": "油脂0.010 molのけん化にNaOH 3倍の0.030 molが必要。0.030×40=1.2 g。"}, {"id": "m3-24", "pts": 4, "q": "フェノール、安息香酸、ニトロベンゼンを溶かしたジエチルエーテル溶液に炭酸水素ナトリウム水溶液を加えてよく振ったとき、水層に移る物質として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["安息香酸のみ", "フェノールのみ", "フェノールと安息香酸", "ニトロベンゼンのみ"], "ans": 0, "exp": "NaHCO₃と反応して塩になるのは炭酸より強い酸の安息香酸だけ。炭酸より弱いフェノールはエーテル層に残る。"}]}, {"dai": 5, "title": "第5問 高分子化合物・総合", "questions": [{"id": "m3-25", "pts": 3, "q": "付加重合でつくられる高分子の組合せとして正しいものを、次の①〜⑥のうちから一つ選べ。", "opts": ["ポリエチレンとポリスチレン", "ポリエチレンとナイロン66", "ポリスチレンとPET", "ナイロン66とPET", "フェノール樹脂とポリスチレン", "ナイロン66とフェノール樹脂"], "ans": 0, "exp": "ポリエチレン・ポリスチレンはC=Cの付加重合。ナイロン66とPETは縮合重合、フェノール樹脂は付加縮合。"}, {"id": "m3-26", "pts": 3, "q": "還元性を示さない糖を、次の①〜④のうちから一つ選べ。", "opts": ["グルコース", "マルトース", "スクロース", "フルクトース"], "ans": 2, "exp": "スクロースは還元性を示す構造どうしが結合しているため非還元糖。加水分解した転化糖は還元性を示す。"}, {"id": "m3-27", "pts": 3, "q": "2種類の異なるα-アミノ酸AとBを1分子ずつ用いて鎖状のジペプチドをつくるとき、できるジペプチドは何種類か。正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["1種類", "2種類", "3種類", "4種類"], "ans": 1, "exp": "ペプチドには方向性があるため、A-BとB-Aの2種類ができる。"}, {"id": "m3-28", "pts": 3, "q": "RNAには含まれず、DNAだけに含まれる塩基を、次の①〜④のうちから一つ選べ。", "opts": ["アデニン", "ウラシル", "チミン", "グアニン"], "ans": 2, "exp": "DNAはA・T・G・C、RNAはA・U・G・C。チミンはDNAのみ、ウラシルはRNAのみ。"}, {"id": "m3-29", "pts": 4, "q": "〔リード文〕デンプン 48.6 g を完全に加水分解してグルコースにし、得られたグルコースをすべてアルコール発酵させた。デンプンの繰り返し単位の式量162、C₆H₁₂O₆=180、C₂H₅OH=46 とする。\n\n問29　加水分解で得られたグルコースの質量として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["48.6 g", "54 g", "60 g", "90 g"], "ans": 1, "exp": "繰り返し単位48.6/162=0.30 mol。加水分解でグルコース0.30 mol=54 g。"}, {"id": "m3-30", "pts": 4, "q": "〔問29の続き〕\n問30　アルコール発酵(C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂)で生成するエタノールの質量として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["14 g", "23 g", "28 g", "55 g"], "ans": 2, "exp": "問29のグルコース0.30 molからエタノール0.60 mol=27.6≒28 g。前問の結果を使う連問。"}]}]}, {"set": 4, "name": "本番形式模試 第4回(共テ実戦・新形式)", "time": 3600, "sections": [{"dai": 1, "title": "第1問 物質の構成・状態", "questions": [{"id": "m4-01", "pts": 3, "q": "同素体の関係にある組合せを、次の①〜⑥のうちから一つ選べ。", "opts": ["水と過酸化水素", "一酸化炭素と二酸化炭素", "酸素とオゾン", "黒鉛とグラファイト(同一物質)", "水素と重水素", "窒素とアンモニア"], "ans": 2, "exp": "同素体は同一元素の単体で性質が異なるもの。O₂とO₃が該当。①②は化合物どうし、⑤は同位体、④は同じ物質の別名。"}, {"id": "m4-02", "pts": 3, "type": "multi", "pick": 2, "q": "次の物質のうち、水に溶かしたときに電気を通す(電解質である)ものを、次の①〜⑥のうちから二つ選べ。ただし、解答の順序は問わない。", "opts": ["グルコース", "塩化ナトリウム", "エタノール", "スクロース", "硫酸", "尿素"], "ans": [1, 4], "exp": "NaClとH₂SO₄はイオンに電離する電解質。グルコース・スクロース・エタノール・尿素は非電解質で電気を通さない。"}, {"id": "m4-03", "pts": 3, "type": "num", "q": "27℃、8.3×10⁴ Pa で 1.0 L を占める気体の物質量は何 mol か。有効数字2桁で次の形式で表すとき、ア〜ウに当てはまる数字を選べ。R=8.3×10³ Pa・L/(K・mol) とする。", "numFmt": "ア.イ×10⁻ウ mol", "slots": ["ア", "イ", "ウ"], "ansD": ["3", "3", "2"], "exp": "n=PV/RT=(8.3×10⁴×1.0)/(8.3×10³×300)=0.0333≒3.3×10⁻² mol。"}, {"id": "m4-04", "pts": 3, "svg": "<svg viewBox='0 0 380 230' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif' font-size='11'><line x1='45' y1='195' x2='362' y2='195' stroke='#5b6b85' stroke-width='1.5'/><line x1='45' y1='195' x2='45' y2='16' stroke='#5b6b85' stroke-width='1.5'/><text x='120' y='222' fill='#5b6b85'>温度 [℃]</text><text x='8' y='12' fill='#5b6b85'>溶解度 [g/100g水]</text><path d='M45,178 Q130,150 200,112 Q270,72 340,30' fill='none' stroke='#4f7cff' stroke-width='2.5'/><line x1='45' y1='112' x2='200' y2='112' stroke='#999' stroke-dasharray='5 4'/><line x1='200' y1='112' x2='200' y2='195' stroke='#999' stroke-dasharray='5 4'/><line x1='45' y1='170' x2='110' y2='170' stroke='#ef5b7b' stroke-dasharray='5 4'/><line x1='110' y1='170' x2='110' y2='195' stroke='#ef5b7b' stroke-dasharray='5 4'/><text x='16' y='116' fill='#2b3a55' font-weight='bold'>60</text><text x='16' y='174' fill='#ef5b7b' font-weight='bold'>20</text><text x='190' y='212' fill='#2b3a55' font-weight='bold'>60</text><text x='100' y='212' fill='#ef5b7b' font-weight='bold'>20</text></svg>", "q": "図はある塩の溶解度曲線である。60℃の飽和水溶液 160 g を20℃まで冷却したとき、析出する結晶の質量として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["20 g", "40 g", "60 g", "80 g"], "ans": 1, "exp": "60℃では水100 gに60 g溶けるので、160 g=水100 g+塩60 g。20℃では20 gしか溶けないので、60−20=40 gが析出する。"}, {"id": "m4-05", "pts": 4, "q": "〔リード文〕硫酸バリウムは水に溶けにくいが、硫酸ナトリウム水溶液を加えると溶解度がさらに小さくなる。\n\n問5　この現象の名称として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["共通イオン効果", "塩析", "凝析", "緩衝作用"], "ans": 0, "exp": "共通のイオン(SO₄²⁻)を加えると、溶解平衡が沈殿側に移動して溶解度が下がる。共通イオン効果という。"}, {"id": "m4-06", "pts": 4, "q": "〔問5の続き〕\n問6　硫酸バリウムの溶解度積を Ksp=1.0×10⁻¹⁰ (mol/L)² とする。0.010 mol/L の硫酸ナトリウム水溶液中で溶けることのできるバリウムイオンの濃度として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["1.0×10⁻⁵ mol/L", "1.0×10⁻⁸ mol/L", "1.0×10⁻¹⁰ mol/L", "1.0×10⁻¹² mol/L"], "ans": 1, "exp": "[Ba²⁺]=Ksp/[SO₄²⁻]=1.0×10⁻¹⁰/1.0×10⁻²=1.0×10⁻⁸ mol/L。純水中(1.0×10⁻⁵)より大幅に小さい(問5の共通イオン効果を数値で確認する連問)。"}]}, {"dai": 2, "title": "第2問 物質の変化・平衡", "questions": [{"id": "m4-07", "pts": 3, "q": "次の反応のうち、吸熱反応であるものを、次の①〜④のうちから一つ選べ。", "opts": ["硝酸アンモニウムを水に溶かす", "水酸化ナトリウムを水に溶かす", "メタンを完全燃焼させる", "塩酸と水酸化ナトリウム水溶液を中和する"], "ans": 0, "exp": "NH₄NO₃の溶解は吸熱で温度が下がる(瞬間冷却パックに利用)。他はいずれも発熱。"}, {"id": "m4-08", "pts": 3, "type": "num", "q": "メタンの燃焼エンタルピーを −891 kJ/mol とする。メタン 0.16 g を完全燃焼させたときに発生する熱量は何 kJ か。有効数字2桁で次の形式で表すとき、ア・イに当てはまる数字を選べ。CH₄=16 とする。", "numFmt": "ア.イ kJ", "slots": ["ア", "イ"], "ansD": ["8", "9"], "exp": "0.16/16=0.010 mol。891×0.010=8.91≒8.9 kJ。"}, {"id": "m4-09", "pts": 3, "svg": "<svg viewBox='0 0 380 200' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif' font-size='11'><text x='14' y='22' fill='#5b6b85' font-weight='bold'>表 反応 A + B → C の初速度</text><line x1='14' y1='32' x2='366' y2='32' stroke='#5b6b85'/><text x='30' y='52' fill='#2b3a55'>実験</text><text x='104' y='52' fill='#2b3a55'>[A] mol/L</text><text x='198' y='52' fill='#2b3a55'>[B] mol/L</text><text x='288' y='52' fill='#2b3a55'>速度(相対)</text><line x1='14' y1='60' x2='366' y2='60' stroke='#e3e9f4'/><text x='40' y='80' fill='#2b3a55'>1</text><text x='124' y='80' fill='#4f7cff'>0.10</text><text x='218' y='80' fill='#4f7cff'>0.10</text><text x='316' y='80' fill='#2b3a55'>1.0</text><text x='40' y='104' fill='#2b3a55'>2</text><text x='124' y='104' fill='#4f7cff'>0.20</text><text x='218' y='104' fill='#4f7cff'>0.10</text><text x='316' y='104' fill='#2b3a55'>2.0</text><text x='40' y='128' fill='#2b3a55'>3</text><text x='124' y='128' fill='#4f7cff'>0.10</text><text x='218' y='128' fill='#4f7cff'>0.20</text><text x='316' y='128' fill='#2b3a55'>4.0</text><line x1='14' y1='140' x2='366' y2='140' stroke='#5b6b85'/></svg>", "q": "表は反応 A + B → C の初速度を測定した結果である。この反応の速度式として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["v = k[A][B]", "v = k[A][B]²", "v = k[A]²[B]", "v = k[A]²[B]²"], "ans": 1, "exp": "実験1→2で[A]2倍→速度2倍(1次)。実験1→3で[B]2倍→速度4倍(2次)。よって v=k[A][B]²。"}, {"id": "m4-10", "pts": 3, "type": "multi", "pick": 2, "q": "触媒に関する記述として正しいものを、次の①〜⑥のうちから二つ選べ。ただし、解答の順序は問わない。", "opts": ["活性化エネルギーを小さくする", "反応エンタルピーを小さくする", "平衡定数の値を大きくする", "平衡に達するまでの時間を短くする", "反応物の濃度を大きくする", "正反応だけを速くする"], "ans": [0, 3], "exp": "触媒は活性化エネルギーを下げ、正逆両反応を同じ割合で速くするので平衡到達が早まる。ΔHや平衡定数、平衡の位置は変えない。"}, {"id": "m4-11", "pts": 4, "q": "0.20 mol/L の酢酸水溶液 100 mL に 0.20 mol/L の水酸化ナトリウム水溶液 50 mL を加えた。生じた混合溶液について最も適当なものを、次の①〜④のうちから一つ選べ。酢酸の電離定数を Ka=2.0×10⁻⁵ mol/L とする。", "opts": ["酢酸と酢酸ナトリウムがほぼ等量共存する緩衝液となり、[H⁺]は約 2.0×10⁻⁵ mol/L である", "完全に中和され、中性(pH=7)になる", "強酸性で[H⁺]は約 0.10 mol/L である", "強塩基性で[OH⁻]は約 0.10 mol/L である"], "ans": 0, "exp": "酢酸0.020 molの半分がNaOH 0.010 molで中和され、残る酢酸0.010 molと酢酸ナトリウム0.010 molが共存。[H⁺]=Ka×(1/1)=2.0×10⁻⁵ mol/L。"}, {"id": "m4-12", "pts": 4, "q": "燃料電池について、水素 0.10 mol が消費されたときに外部回路を流れる電気量として最も適当な数値を、次の①〜④のうちから一つ選べ。ファラデー定数 9.65×10⁴ C/mol とする。", "opts": ["9.65×10³ C", "1.93×10⁴ C", "3.86×10⁴ C", "9.65×10⁴ C"], "ans": 1, "exp": "H₂→2H⁺+2e⁻ より e⁻ は 0.20 mol。9.65×10⁴×0.20=1.93×10⁴ C。"}]}, {"dai": 3, "title": "第3問 無機物質・実験", "questions": [{"id": "m4-13", "pts": 3, "type": "multi", "pick": 2, "q": "実験室での操作に関する記述として誤りを含むものを、次の①〜⑥のうちから二つ選べ。ただし、解答の順序は問わない。", "opts": ["濃硫酸を希釈するときは、水に濃硫酸を少しずつ加えてかき混ぜる", "塩素は有毒なのでドラフト内で発生させる", "硫化水素の発生実験は、換気をせずに密閉した部屋で行う", "ナトリウムの小片は素手で取り扱ってよい", "加熱した試験管の口は人のいない方向に向ける", "廃液は種類ごとに分けて回収する"], "ans": [2, 3], "exp": "③硫化水素は有毒で必ず換気(ドラフト)が必要。④ナトリウムは皮膚の水分と反応するのでピンセットで扱う。他は正しい。"}, {"id": "m4-14", "pts": 3, "q": "気体の乾燥剤の選択として適当でないものを、次の①〜④のうちから一つ選べ。", "opts": ["アンモニアを濃硫酸で乾燥する", "塩素を濃硫酸で乾燥する", "二酸化炭素を十酸化四リンで乾燥する", "水素を塩化カルシウムで乾燥する"], "ans": 0, "exp": "塩基性のアンモニアは酸性乾燥剤の濃硫酸と反応してしまう。ソーダ石灰を用いる。"}, {"id": "m4-15", "pts": 3, "svg": "<svg viewBox='0 0 380 235' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif' font-size='11'><text x='14' y='22' fill='#5b6b85' font-weight='bold'>表 金属イオンの分離操作と結果</text><line x1='14' y1='32' x2='366' y2='32' stroke='#5b6b85'/><text x='28' y='52' fill='#2b3a55'>操作</text><text x='190' y='52' fill='#2b3a55'>結果</text><line x1='14' y1='60' x2='366' y2='60' stroke='#e3e9f4'/><text x='22' y='80' fill='#2b3a55'>Ⅰ 希塩酸を加える</text><text x='190' y='80' fill='#ef5b7b'>沈殿なし</text><text x='22' y='106' fill='#2b3a55'>Ⅱ 酸性でH₂Sを通じる</text><text x='190' y='106' fill='#ef5b7b'>黒色沈殿が生じた</text><text x='22' y='132' fill='#2b3a55'>Ⅲ ろ液にNH₃水を過剰に</text><text x='190' y='132' fill='#ef5b7b'>沈殿なし</text><text x='22' y='158' fill='#2b3a55'>Ⅳ 塩基性でH₂Sを通じる</text><text x='190' y='158' fill='#ef5b7b'>沈殿なし</text><line x1='14' y1='170' x2='366' y2='170' stroke='#5b6b85'/><text x='14' y='196' fill='#7a8aa5'>水溶液には2種類の金属イオンのみが含まれ、</text><text x='14' y='214' fill='#7a8aa5'>ろ液は炎色反応で黄色を示した</text></svg>", "q": "表の結果から、この水溶液に含まれる2種類の金属イオンとして最も適当な組合せを、次の①〜④のうちから一つ選べ。", "opts": ["Cu²⁺ と Zn²⁺", "Ag⁺ と Fe³⁺", "Cu²⁺ と Na⁺", "Fe³⁺ と Zn²⁺"], "ans": 2, "exp": "Ⅰで沈殿なし→Ag⁺・Pb²⁺なし。Ⅱの黒色沈殿→Cu²⁺。ⅢでNH₃過剰でも沈殿なし→Fe³⁺・Al³⁺なし。Ⅳの塩基性でも沈殿なし→Zn²⁺もなし。炎色反応の黄色からNa⁺と決まる。"}, {"id": "m4-16", "pts": 3, "q": "ハーバー・ボッシュ法とオストワルト法に共通して関わる元素を、次の①〜④のうちから一つ選べ。", "opts": ["窒素", "硫黄", "塩素", "ケイ素"], "ans": 0, "exp": "ハーバー・ボッシュ法はN₂→NH₃、オストワルト法はNH₃→HNO₃。いずれも窒素化合物の工業的製法。"}, {"id": "m4-17", "pts": 4, "type": "num", "q": "炭酸カルシウムに十分な量の塩酸を加えて完全に反応させたところ、標準状態で 1.12 L の二酸化炭素が得られた。反応した炭酸カルシウムの質量は何 g か。有効数字2桁で次の形式で表すとき、ア・イに当てはまる数字を選べ。CaCO₃=100 とする。", "numFmt": "ア.イ g", "slots": ["ア", "イ"], "ansD": ["5", "0"], "exp": "CO₂=1.12/22.4=0.050 mol。CaCO₃も0.050 molなので 0.050×100=5.0 g。"}, {"id": "m4-18", "pts": 4, "q": "アルミニウムの単体を製造する方法として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["ボーキサイトから得た酸化アルミニウムを氷晶石とともに融解し、溶融塩電解する", "酸化アルミニウムの水溶液を電気分解する", "酸化アルミニウムをコークスで還元する", "塩化アルミニウム水溶液に亜鉛を加える"], "ans": 0, "exp": "Alはイオン化傾向が大きく水溶液からは析出しない。氷晶石で融点を下げた融解液の電解(ホール・エルー法)で製造する。"}]}, {"dai": 4, "title": "第4問 有機化合物", "questions": [{"id": "m4-19", "pts": 3, "type": "multi", "pick": 2, "q": "炭酸水素ナトリウム水溶液に加えると二酸化炭素を発生する化合物を、次の①〜⑥のうちから二つ選べ。ただし、解答の順序は問わない。", "opts": ["フェノール", "酢酸", "エタノール", "安息香酸", "アニリン", "ニトロベンゼン"], "ans": [1, 3], "exp": "炭酸より強い酸(カルボン酸)がCO₂を発生させる。酢酸と安息香酸が該当。フェノールは炭酸より弱く反応しない。"}, {"id": "m4-20", "pts": 3, "q": "分子式 C₄H₁₀O で表されるエーテルの構造異性体の数として正しいものを、次の①〜⑥のうちから一つ選べ。", "opts": ["1", "2", "3", "4", "5", "6"], "ans": 2, "exp": "ジエチルエーテル、メチルプロピルエーテル、メチルイソプロピルエーテルの3種。アルコールは別に4種ある。"}, {"id": "m4-21", "pts": 3, "q": "〔リード文〕分子式 C₃H₆O₂ の化合物Aは水に溶けて弱酸性を示し、炭酸水素ナトリウム水溶液と反応して気体を発生した。また、Aは銀鏡反応を示さなかった。\n\n問21　化合物Aとして最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["プロピオン酸 C₂H₅COOH", "ギ酸エチル HCOOC₂H₅", "酢酸メチル CH₃COOCH₃", "アセトン CH₃COCH₃"], "ans": 0, "exp": "弱酸性でNaHCO₃と反応→カルボキシ基をもつ。銀鏡反応陰性なのでギ酸ではない。C₃H₆O₂のカルボン酸はプロピオン酸。"}, {"id": "m4-22", "pts": 3, "q": "〔問21の続き〕\n問22　化合物Aとメタノールを濃硫酸とともに加熱して得られる化合物として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["プロピオン酸メチル C₂H₅COOCH₃", "酢酸エチル CH₃COOC₂H₅", "ギ酸メチル HCOOCH₃", "プロパノール C₃H₇OH"], "ans": 0, "exp": "問21で決めたプロピオン酸とメタノールのエステル化により、プロピオン酸メチルが生成する。"}, {"id": "m4-23", "pts": 4, "type": "num", "q": "酢酸エチル(分子量88)を完全にけん化するのに、0.50 mol/L の水酸化ナトリウム水溶液 40 mL を要した。けん化された酢酸エチルの質量は何 g か。有効数字2桁で次の形式で表すとき、ア・イに当てはまる数字を選べ。", "numFmt": "ア.イ g", "slots": ["ア", "イ"], "ansD": ["1", "8"], "exp": "NaOH=0.50×0.040=0.020 mol。エステルも0.020 molで 0.020×88=1.76≒1.8 g。"}, {"id": "m4-24", "pts": 4, "q": "ベンゼン環をもつ化合物の分離に関する記述として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["アニリン・安息香酸・ニトロベンゼンのエーテル溶液に希塩酸を加えて振ると、アニリンが水層に移る", "3種すべてが水層に移る", "ニトロベンゼンが水層に移る", "安息香酸が塩酸と反応して水層に移る"], "ans": 0, "exp": "塩基性のアニリンだけが塩酸と塩をつくり水層へ移る。安息香酸は次にNaHCO₃水で分離、ニトロベンゼンは中性でエーテル層に残る。"}]}, {"dai": 5, "title": "第5問 高分子化合物・総合", "questions": [{"id": "m4-25", "pts": 3, "q": "デンプンとセルロースの違いに関する記述として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["デンプンはα-グルコース、セルロースはβ-グルコースが結合しており、ヒトはセルロースを消化できない", "どちらもβ-グルコースからなり、性質は同じである", "セルロースはらせん構造をとりヨウ素デンプン反応を示す", "デンプンは直線状で水に溶けない"], "ans": 0, "exp": "立体構造の違いにより、デンプンは消化酵素で分解できるがセルロースはできない。ヨウ素デンプン反応はデンプンのらせん構造による。"}, {"id": "m4-26", "pts": 3, "type": "multi", "pick": 2, "q": "次の記述のうち、正しいものを、次の①〜⑥のうちから二つ選べ。ただし、解答の順序は問わない。", "opts": ["タンパク質は熱や重金属イオンで変性し、立体構造が壊れる", "酵素は無機物質でできた触媒である", "DNAの塩基対はアデニンとチミン、グアニンとシトシンで形成される", "RNAにはチミンが含まれる", "酵素は高温にすればするほど活性が高くなる", "タンパク質の変性ではペプチド結合が切断される"], "ans": [0, 2], "exp": "②酵素はタンパク質。④RNAはチミンではなくウラシル。⑤最適温度を超えると変性で失活。⑥変性は高次構造の破壊でペプチド結合(一次構造)は切れない。"}, {"id": "m4-27", "pts": 3, "type": "num", "q": "ポリエチレン(繰り返し単位 −CH₂CH₂− の式量28)の平均分子量が 5.6×10⁴ のとき、平均重合度はいくらか。有効数字2桁で次の形式で表すとき、ア〜ウに当てはまる数字を選べ。", "numFmt": "ア.イ×10ウ", "slots": ["ア", "イ", "ウ"], "ansD": ["2", "0", "3"], "exp": "5.6×10⁴/28=2000=2.0×10³。"}, {"id": "m4-28", "pts": 3, "q": "日常生活と化学に関する記述として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["塩素系漂白剤(次亜塩素酸ナトリウム)と酸性の洗剤を混ぜると有毒な塩素が発生するため危険である", "塩素系漂白剤と酸性洗剤を混ぜると酸素だけが発生し安全である", "石けんは硬水中でよく泡立つ", "乾燥剤のシリカゲルは水と反応して溶解する"], "ans": 0, "exp": "NaClO+2HCl→NaCl+H₂O+Cl₂。「まぜるな危険」の理由。石けんは硬水でCa塩の沈殿を生じ泡立たない。シリカゲルは水を吸着するだけ。"}, {"id": "m4-29", "pts": 4, "q": "〔リード文〕グリシンの水溶液のpHを変化させると、存在するイオンの割合が変化する。グリシンの等電点は約6.0である。\n\n問29　pH 2.0 の水溶液中で最も多く存在するグリシンの状態として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["陽イオン H₃N⁺−CH₂−COOH", "双性イオン H₃N⁺−CH₂−COO⁻", "陰イオン H₂N−CH₂−COO⁻", "分子 H₂N−CH₂−COOH"], "ans": 0, "exp": "等電点より酸性側では−COOHが電離せず−NH₂がH⁺を受け取るため、陽イオンが主となる。"}, {"id": "m4-30", "pts": 4, "q": "〔問29の続き〕\n問30　このグリシン水溶液を pH 6.0 の緩衝液中で電気泳動したときの移動について最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["ほとんど移動しない", "陽極へ大きく移動する", "陰極へ大きく移動する", "両方の極へ移動する"], "ans": 0, "exp": "pHが等電点と等しいとき、正味の電荷が0の双性イオンが大部分を占めるため、電場中でもほとんど移動しない(問29の考え方の延長)。"}]}]}];
const ALLQ = UNITS.flatMap(u=>u.questions);

const MOCKQN = MOCKS.reduce((a,m)=>a+m.sections.reduce((b,s)=>b+s.questions.length,0),0);
const TOTALQ = ALLQ.length + MOCKQN;
document.getElementById("subT").textContent = `単元別${ALLQ.length}問+本番形式模試${MOCKS.length}回(計${TOTALQ}問) | 目標 70点＋`;

/* ---------- storage ---------- */
const LS = {
  get(k,d){ try{ const v = localStorage.getItem("k300_"+k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem("k300_"+k, JSON.stringify(v)); }catch(e){} }
};
function qstat(){ return LS.get("qstat",{}); }
function markQ(id, ok){
  const s = qstat(); if(!s[id]) s[id]={c:0,w:0};
  ok ? s[id].c++ : s[id].w++; LS.set("qstat",s);
}
function addHist(rec){ const h = LS.get("hist",[]); h.push(rec); LS.set("hist",h); touchStreak(); }
function touchStreak(){
  const t = new Date(); const day = t.getFullYear()+"-"+(t.getMonth()+1)+"-"+t.getDate();
  const s = LS.get("streak",{last:"",n:0});
  if(s.last===day) return;
  const y = new Date(t.getTime()-86400000);
  const yd = y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();
  s.n = (s.last===yd) ? s.n+1 : 1; s.last=day; LS.set("streak",s);
}
/* ---------- helpers ---------- */
const $ = s=>document.querySelector(s);
const app = $("#app");
const MARU = ["①","②","③","④","⑤","⑥","⑦","⑧"];
const LVN = {1:"基礎",2:"標準",3:"思考"};
const LVC = {1:"b1",2:"b2",3:"b3"};
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmt(sec){ const m=Math.floor(sec/60), s=sec%60; return m+":"+String(s).padStart(2,"0"); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function unitAcc(u){
  const s = qstat(); let c=0,t=0;
  u.questions.forEach(q=>{ const st=s[q.id]; if(st){ c+=st.c; t+=st.c+st.w; } });
  return t? Math.round(100*c/t) : null;
}
function unitTried(u){
  const s = qstat(); let n=0;
  u.questions.forEach(q=>{ if(s[q.id]) n++; }); return n;
}
let timerH = null;
function stopTimer(){ if(timerH){ clearInterval(timerH); timerH=null; } }
/* ---------- 出題形式ヘルパー(通常/複数選択/数値マーク) ---------- */
function isMulti(q){ return q.type==="multi"; }
function isNum(q){ return q.type==="num"; }
function blankResp(q){ return isNum(q) ? q.slots.map(()=>null) : (isMulti(q) ? [] : null); }
function respFilled(q, r){
  if(r===null||r===undefined) return false;
  if(isNum(q)) return r.every(d=>d!==null);
  if(isMulti(q)) return r.length===q.pick;
  return true;
}
function judge(q, r){
  if(!respFilled(q,r)) return false;
  if(isNum(q)) return q.ansD.join("")===r.join("");
  if(isMulti(q)) return [...r].sort().join(",")===[...q.ans].sort().join(",");
  return r===q.ans;
}
function ansLabel(q){
  if(isNum(q)) return q.slots.map((s,i)=>s+"="+q.ansD[i]).join("、");
  if(isMulti(q)) return q.ans.map(i=>MARU[i]).join(" と ");
  return MARU[q.ans];
}
function myLabel(q, r){
  if(!respFilled(q,r)) return "未解答";
  if(isNum(q)) return q.slots.map((s,i)=>s+"="+r[i]).join("、");
  if(isMulti(q)) return [...r].sort((a,b)=>a-b).map(i=>MARU[i]).join(" と ");
  return MARU[r];
}
function numLineHTML(q, sel){
  let h = esc(q.numFmt);
  q.slots.forEach((s,i)=>{
    h = h.replace(s, `<span class="slot${sel[i]!==null?" filled":""}">${sel[i]!==null?sel[i]:s}</span>`);
  });
  return h;
}
function padHTML(q, sel, dis){
