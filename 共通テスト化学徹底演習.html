<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>共通テスト化学 徹底演習 ⚗️</title>
<style>
:root{
  --bg:#f4f7fb; --card:#ffffff; --ink:#2b3a55; --sub:#7a8aa5;
  --main:#4f7cff; --main2:#7c5cff; --ok:#22b573; --ng:#ef5b7b;
  --soft:#eef3ff; --line:#e3e9f4; --gold:#f5a623;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif; background:var(--bg); color:var(--ink); line-height:1.65; padding-bottom:80px;}
header{background:linear-gradient(120deg,var(--main),var(--main2)); color:#fff; padding:18px 16px 14px; border-radius:0 0 22px 22px; box-shadow:0 4px 14px rgba(79,124,255,.25);}
header h1{font-size:1.25rem; letter-spacing:.5px;}
header p{font-size:.78rem; opacity:.9;}
.wrap{max-width:760px; margin:0 auto; padding:14px;}
.nav{position:fixed; bottom:0; left:0; right:0; background:#fff; display:flex; border-top:1px solid var(--line); z-index:50; box-shadow:0 -3px 12px rgba(43,58,85,.06);}
.nav button{flex:1; padding:9px 2px 10px; border:none; background:none; font-size:.68rem; color:var(--sub); cursor:pointer; font-family:inherit;}
.nav button .ic{display:block; font-size:1.25rem; margin-bottom:1px;}
.nav button.on{color:var(--main); font-weight:700;}
.card{background:var(--card); border-radius:18px; padding:16px; margin-bottom:14px; box-shadow:0 2px 10px rgba(43,58,85,.06);}
.card h2{font-size:1.02rem; margin-bottom:10px;}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.unitBtn{display:flex; align-items:center; gap:9px; background:var(--soft); border:2px solid transparent; border-radius:14px; padding:11px 10px; cursor:pointer; text-align:left; font-family:inherit; transition:.15s;}
.unitBtn:hover{border-color:var(--main);}
.unitBtn .em{font-size:1.5rem;}
.unitBtn .nm{font-size:.82rem; font-weight:700;}
.unitBtn .st{font-size:.68rem; color:var(--sub);}
.ring{width:40px;height:40px; flex-shrink:0;}
.badge{display:inline-block; font-size:.66rem; padding:2px 9px; border-radius:99px; font-weight:700; margin-right:5px;}
.b1{background:#e5f6ee; color:#1c9e64;} .b2{background:#fff3e0; color:#e08a00;} .b3{background:#fde8ef; color:#d6336c;}
.btn{display:inline-block; background:linear-gradient(120deg,var(--main),var(--main2)); color:#fff; border:none; border-radius:14px; padding:12px 22px; font-size:.95rem; font-weight:700; cursor:pointer; font-family:inherit; box-shadow:0 3px 10px rgba(79,124,255,.3); transition:.15s;}
.btn:active{transform:scale(.97);}
.btn.gray{background:#dfe6f2; color:var(--ink); box-shadow:none;}
.btn.small{padding:8px 16px; font-size:.82rem;}
.btn.ghost{background:#fff; color:var(--main); border:2px solid var(--main); box-shadow:none;}
.opt{display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left; background:#fff; border:2px solid var(--line); border-radius:14px; padding:12px 13px; margin-bottom:9px; cursor:pointer; font-size:.92rem; font-family:inherit; transition:.12s; color:var(--ink); line-height:1.55;}
.opt:hover{border-color:var(--main); background:var(--soft);}
.opt .mk{font-weight:800; color:var(--main); flex-shrink:0;}
.opt.sel{border-color:var(--main); background:var(--soft);}
.opt.correct{border-color:var(--ok); background:#e9f9f1;}
.opt.wrong{border-color:var(--ng); background:#fdeef2;}
.opt:disabled{cursor:default; opacity:1;}
.qtext{font-size:.95rem; white-space:pre-wrap; margin-bottom:14px;}
.qfig{background:#fff; border:1.5px solid var(--line); border-radius:12px; padding:8px 6px; margin-bottom:12px; text-align:center;}
.qfig svg{max-width:100%; height:auto; display:inline-block;}
.hint{font-size:.76rem; color:var(--main2); background:#f3f0ff; border-radius:10px; padding:6px 10px; margin-bottom:10px; font-weight:700;}
.numline{font-size:1.05rem; text-align:center; background:var(--soft); border-radius:12px; padding:12px 8px; margin-bottom:12px; font-weight:700; letter-spacing:.5px;}
.slot{display:inline-block; min-width:1.7em; padding:1px 5px; margin:0 1px; border-bottom:2.5px solid var(--main); color:var(--sub); background:#fff; border-radius:4px 4px 0 0; text-align:center;}
.slot.filled{color:var(--main); background:#e8efff;}
.padrow{display:flex; align-items:center; gap:3px; margin-bottom:7px;}
.padlb{width:1.6em; font-weight:800; color:var(--main2); flex-shrink:0; font-size:.9rem;}
.dbtn{flex:1; min-width:0; padding:8px 0; border:1.5px solid var(--line); background:#fff; border-radius:8px; font-size:.9rem; font-family:inherit; color:var(--ink); cursor:pointer;}
.dbtn.on{background:var(--main); color:#fff; border-color:var(--main); font-weight:800;}
.dbtn:disabled{opacity:.5; cursor:default;}
.opt.pick{border-color:var(--main2); background:#f3f0ff;}
.opt .ck{margin-left:auto; font-weight:800; color:var(--main2); flex-shrink:0;}
.meta{display:flex; justify-content:space-between; align-items:center; font-size:.75rem; color:var(--sub); margin-bottom:10px; flex-wrap:wrap; gap:6px;}
.timer{font-variant-numeric:tabular-nums; font-weight:700; color:var(--main); background:var(--soft); padding:3px 12px; border-radius:99px;}
.timer.danger{color:#fff; background:var(--ng); animation:blink 1s infinite;}
@keyframes blink{50%{opacity:.6;}}
.pbar{height:8px; background:var(--line); border-radius:99px; overflow:hidden; margin-bottom:14px;}
.pbar>div{height:100%; background:linear-gradient(90deg,var(--main),var(--main2)); border-radius:99px; transition:width .3s;}
.expl{background:#fffbe8; border:1.5px solid #f3e2a0; border-radius:14px; padding:12px 14px; font-size:.86rem; margin-top:4px;}
.expl b{color:#b8860b;}
.big{font-size:2.4rem; font-weight:800; text-align:center;}
.center{text-align:center;}
.mocknav{display:grid; grid-template-columns:repeat(10,1fr); gap:5px; margin:10px 0;}
.mocknav button{aspect-ratio:1; border-radius:9px; border:1.5px solid var(--line); background:#fff; font-size:.72rem; cursor:pointer; font-family:inherit; color:var(--sub);}
.mocknav button.done{background:var(--soft); border-color:var(--main); color:var(--main); font-weight:700;}
.mocknav button.cur{background:var(--main); color:#fff; border-color:var(--main); font-weight:700;}
.secH{font-size:.8rem; font-weight:700; color:var(--main2); margin:2px 0 8px;}
table.res{width:100%; border-collapse:collapse; font-size:.85rem; margin:10px 0;}
table.res td,table.res th{padding:7px 6px; border-bottom:1px solid var(--line); text-align:center;}
.bar{background:var(--line); border-radius:99px; height:12px; overflow:hidden;}
.bar>div{height:100%; border-radius:99px; background:linear-gradient(90deg,var(--main),var(--main2));}
.statrow{display:flex; align-items:center; gap:8px; margin-bottom:9px; font-size:.8rem;}
.statrow .lb{width:9.5em; flex-shrink:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.statrow .pc{width:3.4em; text-align:right; font-weight:700; flex-shrink:0;}
.statrow .bar{flex:1;}
.kpis{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:4px;}
.kpi{background:var(--soft); border-radius:14px; padding:12px 6px; text-align:center;}
.kpi .v{font-size:1.35rem; font-weight:800; color:var(--main);}
.kpi .l{font-size:.68rem; color:var(--sub);}
.pill{display:inline-block; background:var(--soft); color:var(--main); border-radius:99px; padding:4px 13px; font-size:.78rem; font-weight:700; margin:0 4px 8px 0; border:2px solid transparent; cursor:pointer;}
.pill.on{border-color:var(--main); background:#fff;}
.judge{font-size:1.05rem; font-weight:800; padding:10px 16px; border-radius:14px; display:inline-block; margin-top:8px;}
.j-ok{background:#e9f9f1; color:var(--ok);} .j-ng{background:#fdeef2; color:var(--ng);}
.footnote{font-size:.7rem; color:var(--sub); text-align:center; margin-top:8px;}
.review{border:1.5px solid var(--line); border-radius:14px; padding:12px; margin-bottom:10px; font-size:.85rem;}
.review .tag{font-weight:800; margin-right:6px;}
.hidden{display:none;}
.sparks{display:flex; gap:4px; align-items:flex-end; height:90px; padding:4px 0;}
.sparks .sp{flex:1; background:linear-gradient(180deg,var(--main2),var(--main)); border-radius:6px 6px 0 0; position:relative; min-width:14px;}
.sparks .sp span{position:absolute; top:-19px; left:0; right:0; text-align:center; font-size:.62rem; color:var(--sub); font-weight:700;}
@media(max-width:480px){ .grid{grid-template-columns:1fr;} .kpis{grid-template-columns:repeat(3,1fr);} }
</style>
</head>
<body>
<header>
  <h1>⚗️ 共通テスト化学 徹底演習</h1>
  <p id="subT">単元別演習+本番形式模試2回 | 目標 70点＋</p>
</header>
<div class="wrap" id="app"></div>
<nav class="nav">
  <button data-v="home" class="on"><span class="ic">🏠</span>ホーム</button>
  <button data-v="units"><span class="ic">📚</span>単元別</button>
  <button data-v="mockselect"><span class="ic">📝</span>模試</button>
  <button data-v="stats"><span class="ic">📈</span>記録</button>
</nav>
<script>
const UNITS = [{"unit": 1, "name": "物質の構成と化学結合", "emoji": "🧊", "questions": [{"id": "1-01", "lv": 1, "q": "共有結合だけからできている物質を、次の①〜④のうちから一つ選べ。", "opts": ["酸化マグネシウム MgO", "塩化アンモニウム NH₄Cl", "塩化ナトリウム NaCl", "塩化水素 HCl"], "ans": 3, "exp": "HClは非金属どうしの共有結合。NaCl・MgOはイオン結合、NH₄Clはイオン結合と共有結合(配位結合含む)の両方を含む。"}, {"id": "1-02", "lv": 1, "q": "電気陰性度が最も大きい元素を、次の①〜④のうちから一つ選べ。", "opts": ["塩素 Cl", "窒素 N", "酸素 O", "フッ素 F"], "ans": 3, "exp": "電気陰性度は貴ガスを除き周期表の右上ほど大きく、F(4.0)が全元素中最大。"}, {"id": "1-03", "lv": 1, "q": "アンモニア分子 NH₃ の形として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["直線形", "折れ線形", "三角錐形", "正四面体形"], "ans": 2, "exp": "N原子は非共有電子対1組と共有電子対3組をもち、電子対4組が四面体配置をとるため、分子は三角錐形になる。"}, {"id": "1-04", "lv": 1, "q": "極性分子であるものを、次の①〜④のうちから一つ選べ。", "opts": ["二酸化炭素 CO₂", "メタン CH₄", "水 H₂O", "四塩化炭素 CCl₄"], "ans": 2, "exp": "H₂Oは折れ線形のため結合の極性が打ち消されず、極性分子。CO₂(直線形)、CH₄・CCl₄(正四面体形)は無極性分子。"}, {"id": "1-05", "lv": 1, "q": "イオン結晶の一般的な性質として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["軟らかく展性・延性に富む", "融点が非常に低いものが多い", "固体の状態でよく電気を通す", "融解した状態では電気を通す"], "ans": 3, "exp": "イオン結晶は固体ではイオンが動けず電気を通さないが、融解または水溶液にするとイオンが動けるようになり電気を通す。"}, {"id": "1-06", "lv": 1, "q": "金属が電気や熱をよく伝える理由として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["分子間に水素結合がはたらくから", "原子どうしが共有電子対で強く結ばれているから", "陽イオンと陰イオンが規則正しく並んでいるから", "自由電子が金属中を移動できるから"], "ans": 3, "exp": "金属結合では価電子が特定の原子に属さず自由電子として結晶中を動き回り、電気・熱をよく伝える。"}, {"id": "1-07", "lv": 1, "q": "配位結合を含むイオンを、次の①〜④のうちから一つ選べ。", "opts": ["塩化物イオン Cl⁻", "ナトリウムイオン Na⁺", "水酸化物イオン OH⁻", "アンモニウムイオン NH₄⁺"], "ans": 3, "exp": "NH₄⁺はNH₃の非共有電子対がH⁺に提供されてできる配位結合を含む。ただし4本のN–H結合は区別できない。"}, {"id": "1-08", "lv": 1, "q": "ドライアイス(固体のCO₂)の結晶の種類として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["イオン結晶", "共有結合の結晶", "分子結晶", "金属結晶"], "ans": 2, "exp": "ドライアイスはCO₂分子が弱い分子間力で集まった分子結晶。昇華しやすく融点が低い。"}, {"id": "1-09", "lv": 2, "q": "水素結合を形成しない物質を、次の①〜④のうちから一つ選べ。", "opts": ["フッ化水素 HF", "アンモニア NH₃", "メタン CH₄", "水 H₂O"], "ans": 2, "exp": "水素結合は電気陰性度の大きいF・O・NとHの間で形成される。CH₄のC–H結合は極性が小さく水素結合をつくらない。"}, {"id": "1-10", "lv": 2, "q": "ハロゲン化水素 HF、HCl、HBr、HI のうち、沸点が最も低いものを、次の①〜④のうちから一つ選べ。", "opts": ["HF", "HCl", "HBr", "HI"], "ans": 1, "exp": "HFは水素結合のため異常に高い。残りは分子量が大きいほどファンデルワールス力が強く沸点が高いので、最も低いのはHCl。"}, {"id": "1-11", "lv": 2, "q": "ナトリウムの結晶は体心立方格子である。単位格子中に含まれる原子の数 a と配位数 b の組合せとして正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["a=2、b=8", "a=2、b=12", "a=4、b=8", "a=4、b=12"], "ans": 0, "exp": "体心立方格子は頂点8×1/8+中心1=2個、配位数は8。面心立方格子なら4個・12。"}, {"id": "1-12", "lv": 2, "q": "面心立方格子の単位格子に含まれる原子の数として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["2個", "4個", "6個", "8個"], "ans": 1, "exp": "頂点8×1/8+面の中心6×1/2=1+3=4個。"}, {"id": "1-13", "lv": 2, "q": "体心立方格子の単位格子の一辺の長さを a とするとき、原子半径 r を表す式として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["r = (√2/4)a", "r = (√3/4)a", "r = (1/2)a", "r = (√3/2)a"], "ans": 1, "exp": "体心立方格子では立方体の対角線(√3a)上で原子が接し、4r=√3a より r=(√3/4)a。面心なら4r=√2a。"}, {"id": "1-14", "lv": 2, "q": "塩化ナトリウム型の結晶構造について、Na⁺の配位数 a と、単位格子中に含まれるNa⁺の数 b の組合せとして正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["a=6、b=4", "a=6、b=8", "a=8、b=4", "a=8、b=8"], "ans": 0, "exp": "NaCl型ではNa⁺は6個のCl⁻に囲まれる(配位数6)。単位格子中にはNa⁺、Cl⁻とも4個ずつ含まれる。"}, {"id": "1-15", "lv": 2, "q": "金属結晶の面心立方格子(立方最密構造)と六方最密構造に共通する充填率として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["52%", "68%", "74%", "80%"], "ans": 2, "exp": "どちらも最密構造で充填率は約74%。体心立方格子は約68%。"}, {"id": "1-16", "lv": 3, "q": "アルミニウムは面心立方格子の結晶をつくり、単位格子の一辺は 4.05×10⁻⁸ cm である。アルミニウムの結晶の密度は何 g/cm³ か。最も適当な数値を、次の①〜④のうちから一つ選べ。Al=27、アボガドロ定数 6.0×10²³/mol、(4.05)³=66.4 とする。", "opts": ["1.4 g/cm³", "2.7 g/cm³", "5.4 g/cm³", "8.1 g/cm³"], "ans": 1, "exp": "単位格子中に4原子。密度=(4×27)/(6.0×10²³×66.4×10⁻²⁴)=108/39.8≒2.7 g/cm³。"}, {"id": "1-17", "lv": 3, "q": "鉄は体心立方格子の結晶をつくり、単位格子の一辺は 2.9×10⁻⁸ cm である。鉄原子の半径は何 cm か。最も適当な数値を、次の①〜④のうちから一つ選べ。√3=1.73 とする。", "opts": ["1.0×10⁻⁸ cm", "1.3×10⁻⁸ cm", "1.5×10⁻⁸ cm", "2.5×10⁻⁸ cm"], "ans": 1, "exp": "r=(√3/4)a=(1.73/4)×2.9×10⁻⁸≒1.25×10⁻⁸≒1.3×10⁻⁸ cm。"}, {"id": "1-18", "lv": 3, "q": "塩化ナトリウムの結晶(NaCl型、式量58.5)の単位格子の一辺は 5.6×10⁻⁸ cm である。この結晶の密度は何 g/cm³ か。最も適当な数値を、次の①〜④のうちから一つ選べ。アボガドロ定数 6.0×10²³/mol、(5.6)³=176 とする。", "opts": ["1.1 g/cm³", "2.2 g/cm³", "3.3 g/cm³", "4.4 g/cm³"], "ans": 1, "exp": "単位格子中にNaCl 4組。密度=(4×58.5)/(6.0×10²³×176×10⁻²⁴)=234/105.6≒2.2 g/cm³。"}, {"id": "1-19", "lv": 3, "q": "黒鉛に関する次の記述 a〜c について、正誤の組合せとして正しいものを、次の①〜④のうちから一つ選べ。\na 各炭素原子は4個の価電子すべてを共有結合に使っている。\nb 平面層状の構造をもち、層と層の間は弱い分子間力で結ばれている。\nc 電気をよく通す。", "opts": ["a:正 b:誤 c:正", "a:誤 b:誤 c:正", "a:正 b:正 c:誤", "a:誤 b:正 c:正"], "ans": 3, "exp": "黒鉛は価電子4個のうち3個で共有結合し、残り1個が層内を動けるため電気を通す。aのみ誤り。"}, {"id": "1-20", "lv": 3, "q": "融点や電気伝導性を調べたところ、固体A〜Cは次の性質を示した。\nA:融点が非常に高く、固体でも液体でも電気を通さず、水に溶けない。\nB:融点が高く、固体では電気を通さないが、融解すると電気を通す。\nC:融点が低く、固体でも液体でも電気を通さない。\nA〜Cの結晶の種類の組合せとして最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["A:共有結合の結晶 B:イオン結晶 C:分子結晶", "A:イオン結晶 B:共有結合の結晶 C:分子結晶", "A:共有結合の結晶 B:分子結晶 C:イオン結晶", "A:分子結晶 B:イオン結晶 C:共有結合の結晶"], "ans": 0, "exp": "融解しても電気を通さず超高融点→共有結合の結晶。融解すると通す→イオン結晶。低融点で不導体→分子結晶。"}, {"id": "1-21", "lv": 2, "svg": "<svg viewBox='0 0 380 250' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif' font-size='11'><line x1='40' y1='220' x2='365' y2='220' stroke='#5b6b85' stroke-width='1.5'/><line x1='40' y1='220' x2='40' y2='15' stroke='#5b6b85' stroke-width='1.5'/><text x='185' y='243' fill='#5b6b85'>分子量</text><text x='8' y='12' fill='#5b6b85'>沸点/℃</text><polyline points='118,174 225,157 337,122' fill='none' stroke='#4f7cff' stroke-width='2'/><line x1='118' y1='174' x2='81' y2='30' stroke='#4f7cff' stroke-width='2'/><line x1='118' y1='174' x2='70' y2='196' stroke='#999' stroke-dasharray='5 4' stroke-width='1.5'/><circle cx='81' cy='30' r='4' fill='#ef5b7b'/><circle cx='118' cy='174' r='4' fill='#4f7cff'/><circle cx='225' cy='157' r='4' fill='#4f7cff'/><circle cx='337' cy='122' r='4' fill='#4f7cff'/><text x='90' y='28' fill='#ef5b7b' font-weight='bold'>H₂O</text><text x='108' y='192' fill='#2b3a55'>H₂S</text><text x='213' y='150' fill='#2b3a55'>H₂Se</text><text x='320' y='115' fill='#2b3a55'>H₂Te</text></svg>", "q": "図は16族元素の水素化合物の沸点を分子量に対して示したものである。H₂Oの沸点が破線で示される傾向から予想される値より著しく高い理由として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["H₂Oの分子量が最も小さいから", "H₂Oは電離してイオンを生じるから", "H₂O分子間に水素結合がはたらくから", "H₂O分子は直線形だから"], "ans": 2, "exp": "H₂S以降は分子量が大きいほどファンデルワールス力が強く沸点が上がる。H₂Oだけは強い水素結合のため、傾向から外れて沸点が著しく高い。"}, {"id": "1-22", "lv": 2, "type": "multi", "pick": 2, "q": "分子間に水素結合がはたらくために、分子量から予想される値より沸点が著しく高くなっている物質を、次の①〜⑥のうちから二つ選べ。ただし、解答の順序は問わない。", "opts": ["メタン CH₄", "水 H₂O", "硫化水素 H₂S", "フッ化水素 HF", "二酸化炭素 CO₂", "アルゴン Ar"], "ans": [1, 3], "exp": "F・O・NとHの間に水素結合が生じる。H₂OとHFは同族の水素化合物と比べて沸点が異常に高い。H₂Sは水素結合をつくらない。"}], "hot": false}, {"unit": 2, "name": "物質量と化学反応式", "emoji": "⚖️", "questions": [{"id": "2-01", "lv": 1, "q": "水 H₂O 0.50 mol に含まれる水分子の数として最も適当なものを、次の①〜④のうちから一つ選べ。アボガドロ定数 6.0×10²³/mol とする。", "opts": ["1.5×10²³ 個", "3.0×10²³ 個", "6.0×10²³ 個", "1.2×10²⁴ 個"], "ans": 1, "exp": "0.50 mol×6.0×10²³/mol=3.0×10²³ 個。"}, {"id": "2-02", "lv": 1, "q": "二酸化炭素 CO₂ 22 g の物質量として最も適当なものを、次の①〜④のうちから一つ選べ。C=12、O=16 とする。", "opts": ["0.25 mol", "0.50 mol", "1.0 mol", "2.0 mol"], "ans": 1, "exp": "CO₂のモル質量は44 g/mol。22/44=0.50 mol。"}, {"id": "2-03", "lv": 1, "q": "0℃、1.013×10⁵ Pa(標準状態)で 11.2 L を占める酸素 O₂ の物質量として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["0.25 mol", "0.50 mol", "1.0 mol", "2.0 mol"], "ans": 1, "exp": "標準状態の気体のモル体積は22.4 L/mol。11.2/22.4=0.50 mol。"}, {"id": "2-04", "lv": 1, "q": "0.20 mol/L の水酸化ナトリウム水溶液 500 mL に含まれる NaOH の物質量として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["0.010 mol", "0.10 mol", "0.20 mol", "0.40 mol"], "ans": 1, "exp": "0.20 mol/L×0.500 L=0.10 mol。"}, {"id": "2-05", "lv": 1, "q": "グルコース C₆H₁₂O₆ のモル質量として正しいものを、次の①〜④のうちから一つ選べ。H=1.0、C=12、O=16 とする。", "opts": ["90 g/mol", "162 g/mol", "180 g/mol", "342 g/mol"], "ans": 2, "exp": "12×6+1.0×12+16×6=72+12+96=180 g/mol。"}, {"id": "2-06", "lv": 1, "q": "プロパンの完全燃焼 C₃H₈ + aO₂ → 3CO₂ + 4H₂O の係数 a として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["3", "4", "5", "7"], "ans": 2, "exp": "右辺のO原子は3×2+4×1=10個なので、O₂は5分子。a=5。"}, {"id": "2-07", "lv": 1, "q": "質量パーセント濃度 10% の食塩水 200 g に含まれる塩化ナトリウムの質量として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["10 g", "20 g", "22 g", "180 g"], "ans": 1, "exp": "200 g×0.10=20 g。"}, {"id": "2-08", "lv": 1, "q": "同温・同圧で、同体積の気体に含まれる分子の数について正しく述べたものを、次の①〜④のうちから一つ選べ。", "opts": ["分子量が大きい気体ほど多い", "分子量が小さい気体ほど多い", "気体の種類によらず同じである", "極性分子の気体ほど多い"], "ans": 2, "exp": "アボガドロの法則:同温・同圧・同体積の気体は、種類によらず同数の分子を含む。"}, {"id": "2-09", "lv": 2, "q": "密度 1.2 g/cm³、質量パーセント濃度 36.5% の濃塩酸のモル濃度は何 mol/L か。最も適当な数値を、次の①〜④のうちから一つ選べ。HCl=36.5 とする。", "opts": ["6.0 mol/L", "10 mol/L", "12 mol/L", "15 mol/L"], "ans": 2, "exp": "溶液1 L=1200 g中のHClは1200×0.365=438 g。438/36.5=12 mol。よって12 mol/L。"}, {"id": "2-10", "lv": 2, "q": "アルミニウム 5.4 g を十分な量の塩酸と反応させた。2Al + 6HCl → 2AlCl₃ + 3H₂ より、発生する水素の体積は標準状態で何 L か。最も適当な数値を、次の①〜④のうちから一つ選べ。Al=27 とする。", "opts": ["2.2 L", "4.5 L", "6.7 L", "11 L"], "ans": 2, "exp": "Alは5.4/27=0.20 mol。H₂は0.20×3/2=0.30 mol。0.30×22.4=6.72≒6.7 L。"}, {"id": "2-11", "lv": 2, "q": "炭酸水素ナトリウム 8.4 g を完全に熱分解した。2NaHCO₃ → Na₂CO₃ + H₂O + CO₂ より、発生する CO₂ は標準状態で何 L か。最も適当な数値を、次の①〜④のうちから一つ選べ。NaHCO₃=84 とする。", "opts": ["1.1 L", "2.2 L", "3.4 L", "4.5 L"], "ans": 0, "exp": "NaHCO₃は0.10 mol。CO₂は0.10×1/2=0.050 mol。0.050×22.4=1.12≒1.1 L。"}, {"id": "2-12", "lv": 2, "q": "窒素 1.0 mol と水素 2.0 mol を反応させ、水素がすべて反応したとすると、N₂ + 3H₂ → 2NH₃ より生成するアンモニアの物質量として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["0.67 mol", "1.3 mol", "2.0 mol", "3.0 mol"], "ans": 1, "exp": "H₂ 2.0 molからNH₃は2.0×2/3≒1.3 mol生成する(N₂は過剰)。"}, {"id": "2-13", "lv": 2, "q": "ある有機化合物の元素分析値は、質量パーセントで炭素 40.0%、水素 6.7%、酸素 53.3% であった。この化合物の組成式として最も適当なものを、次の①〜④のうちから一つ選べ。H=1.0、C=12、O=16 とする。", "opts": ["C₂H₄O", "CH₃O", "CHO", "CH₂O"], "ans": 3, "exp": "C:H:O=40/12:6.7/1.0:53.3/16=3.3:6.7:3.3=1:2:1。組成式はCH₂O。"}, {"id": "2-14", "lv": 2, "q": "硫酸銅(Ⅱ)五水和物 CuSO₄・5H₂O 25 g を水に溶かして 500 mL とした水溶液の CuSO₄ のモル濃度として最も適当なものを、次の①〜④のうちから一つ選べ。CuSO₄・5H₂O=250 とする。", "opts": ["0.10 mol/L", "0.20 mol/L", "0.40 mol/L", "0.50 mol/L"], "ans": 1, "exp": "25/250=0.10 mol のCuSO₄を含む。0.10 mol÷0.500 L=0.20 mol/L。"}, {"id": "2-15", "lv": 2, "q": "ある気体の密度は、同温・同圧の酸素 O₂ の密度のちょうど2倍であった。この気体として最も適当なものを、次の①〜④のうちから一つ選べ。H=1.0、C=12、N=14、O=16、S=32 とする。", "opts": ["プロパン C₃H₈", "二酸化窒素 NO₂", "二酸化炭素 CO₂", "二酸化硫黄 SO₂"], "ans": 3, "exp": "同温・同圧で密度比=分子量比。分子量は32×2=64なのでSO₂(64)。"}, {"id": "2-16", "lv": 3, "q": "メタン CH₄ とエタン C₂H₆ の混合気体 1.0 mol を完全燃焼させたところ、CO₂ が 1.4 mol 生成した。混合気体中のメタンの物質量として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["0.40 mol", "0.50 mol", "0.60 mol", "0.70 mol"], "ans": 2, "exp": "CH₄をx molとすると x+2(1.0−x)=1.4 より x=0.60 mol。"}, {"id": "2-17", "lv": 3, "q": "質量パーセント濃度 60% の硫酸(H₂SO₄=98)を水で薄めて、3.0 mol/L の希硫酸 500 mL をつくりたい。必要な60%硫酸の質量として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["147 g", "196 g", "245 g", "294 g"], "ans": 2, "exp": "必要なH₂SO₄は3.0×0.500=1.5 mol=147 g。60%溶液では147/0.60=245 g。"}, {"id": "2-18", "lv": 3, "q": "ある金属 M 2.7 g を空気中で完全に酸化したところ、酸化物 M₂O₃ が 5.1 g 得られた。M の原子量として最も適当なものを、次の①〜④のうちから一つ選べ。O=16 とする。", "opts": ["24", "27", "52", "56"], "ans": 1, "exp": "化合したOは2.4 g=0.15 mol。M₂O₃よりM:O=2:3なのでMは0.10 mol。2.7/0.10=27。"}, {"id": "2-19", "lv": 3, "q": "モル濃度 c mol/L、密度 d g/cm³ の水溶液がある。溶質のモル質量を M g/mol とするとき、この溶液の質量パーセント濃度を表す式として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["cM/(10d) %", "10cM/d %", "cM/(1000d) %", "1000d/(cM) %"], "ans": 0, "exp": "溶液1 L=1000d g中に溶質cM gを含むから、(cM/1000d)×100=cM/(10d) %。"}, {"id": "2-20", "lv": 3, "q": "ステアリン酸をヘキサンに溶かして水面に滴下すると、ステアリン酸分子が水面に隙間なく一層に並んだ単分子膜ができる。この実験でアボガドロ定数を求めるために、単分子膜の面積のほかに必要な量の組合せとして最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["滴下したステアリン酸の物質量と、分子1個の断面積", "ステアリン酸の融点と、分子1個の質量", "滴下した溶液の体積と、水の密度", "ステアリン酸の分子量と、水面の温度"], "ans": 0, "exp": "膜面積÷分子1個の断面積=分子数。これを滴下した物質量で割ればアボガドロ定数が得られる。"}, {"id": "2-21", "lv": 3, "q": "窒素とメタンの混合気体の平均分子量は 25.6 であった。この混合気体中の窒素の物質量の割合として最も適当な数値を、次の①〜④のうちから一つ選べ。N₂=28、CH₄=16 とする。", "opts": ["20%", "40%", "60%", "80%"], "ans": 3, "exp": "N₂の割合をxとすると 28x+16(1−x)=25.6 より 12x=9.6、x=0.80。二段構え(平均分子量の式→方程式)の複合問題。"}, {"id": "2-22", "lv": 3, "svg": "<svg viewBox='0 0 380 250' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif' font-size='11'><line x1='40' y1='210' x2='365' y2='210' stroke='#5b6b85' stroke-width='1.5'/><line x1='40' y1='210' x2='40' y2='15' stroke='#5b6b85' stroke-width='1.5'/><text x='110' y='240' fill='#5b6b85'>加えたマグネシウムの質量 [g]</text><text x='8' y='12' fill='#5b6b85'>発生した水素の体積(標準状態) [L]</text><polyline points='40,210 232,74 360,74' fill='none' stroke='#4f7cff' stroke-width='2.5'/><line x1='40' y1='74' x2='232' y2='74' stroke='#999' stroke-dasharray='5 4'/><line x1='232' y1='74' x2='232' y2='210' stroke='#999' stroke-dasharray='5 4'/><text x='6' y='78' fill='#2b3a55' font-weight='bold'>1.12</text><text x='222' y='226' fill='#2b3a55' font-weight='bold'>1.2</text></svg>", "q": "一定量の希塩酸にマグネシウムを少しずつ加えたところ、発生した水素の体積は図のように変化し、1.12 L(標準状態)で頭打ちになった。この希塩酸に含まれていた塩化水素 HCl の物質量として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["0.050 mol", "0.10 mol", "0.15 mol", "0.20 mol"], "ans": 1, "exp": "頭打ちはHClがすべて反応したことを示す。Mg+2HCl→MgCl₂+H₂より、H₂ 0.050 molに対しHCl=0.10 mol。グラフの折れ点=過不足の切り替わり。"}, {"id": "2-23", "lv": 2, "type": "num", "q": "標準状態(0℃、1.013×10⁵ Pa)で 0.56 L を占める酸素の物質量は何 mol か。有効数字2桁で次の形式で表すとき、ア〜ウに当てはまる数字を選べ。", "numFmt": "ア.イ×10⁻ウ mol", "slots": ["ア", "イ", "ウ"], "ansD": ["2", "5", "2"], "exp": "標準状態のモル体積は22.4 L/mol。0.56/22.4=0.025=2.5×10⁻² mol。"}, {"id": "2-24", "lv": 2, "q": "0.100 mol/L の塩化ナトリウム標準溶液 100 mL を正確に調製する操作の順序として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["塩化ナトリウムを電子てんびんで正確にはかりとる → 少量の純水で溶かす → 100 mL メスフラスコに移し、洗い込む → 標線まで純水を加える", "100 mL メスフラスコに標線まで純水を入れる → 塩化ナトリウムを加えて溶かす", "塩化ナトリウムをメスシリンダーではかりとる → 100 mL の純水を加える", "塩化ナトリウムをろ紙上で溶かす → メスフラスコに移す"], "ans": 0, "exp": "溶質を先に溶かしてからメスフラスコへ移し、ビーカーを洗い込んだうえで標線まで加える。先に水を標線まで入れると全体積が変わり濃度がずれる。"}], "hot": false}, {"unit": 3, "name": "物質の三態と気体", "emoji": "💨", "questions": [{"id": "3-01", "lv": 1, "q": "固体が液体を経ずに直接気体になる状態変化の名称として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["蒸発", "融解", "昇華", "凝縮"], "ans": 2, "exp": "固体→気体は昇華。ドライアイスやヨウ素、ナフタレンで見られる。"}, {"id": "3-02", "lv": 1, "q": "液体が沸騰する条件として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["液体の温度が100℃に達したとき", "液体の蒸気圧が外圧と等しくなったとき", "液体の表面からのみ蒸発が起こったとき", "液体の密度が最大になったとき"], "ans": 1, "exp": "沸騰は蒸気圧=外圧となり液体内部からも気泡が発生する現象。沸点は外圧によって変わる。"}, {"id": "3-03", "lv": 1, "q": "一定温度で密閉容器内の液体とその蒸気が気液平衡にあるとき、飽和蒸気圧について正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["液体の量が多いほど大きくなる", "気体の種類によらず一定である", "容器の体積を大きくすると小さくなる", "容器の体積によらず一定である"], "ans": 3, "exp": "飽和蒸気圧は温度だけで決まり、液体が共存する限り体積や液量には無関係。"}, {"id": "3-04", "lv": 1, "q": "27℃を絶対温度で表すと何 K か。正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["246 K", "273 K", "300 K", "327 K"], "ans": 2, "exp": "T=273+27=300 K。"}, {"id": "3-05", "lv": 1, "q": "温度一定で、一定量の気体の圧力を2倍にすると、体積はどうなるか。正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["2倍になる", "1/2倍になる", "4倍になる", "変化しない"], "ans": 1, "exp": "ボイルの法則 PV=一定 より、圧力2倍で体積は1/2倍。"}, {"id": "3-06", "lv": 1, "q": "圧力一定で、一定量の気体の温度を 300 K から 600 K にすると、体積は何倍になるか。正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["1/2倍", "√2倍", "2倍", "4倍"], "ans": 2, "exp": "シャルルの法則 V/T=一定 より、絶対温度2倍で体積も2倍。"}, {"id": "3-07", "lv": 1, "q": "状態図(圧力-温度図)における三重点の説明として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["固体・液体・気体の三つの状態が共存する点", "液体と気体の区別がなくなる点", "蒸気圧が外圧と等しくなる点", "密度が最大になる点"], "ans": 0, "exp": "三重点では固・液・気の三態が共存する。液体と気体の区別がなくなるのは臨界点。"}, {"id": "3-08", "lv": 1, "q": "実在気体が理想気体に最も近いふるまいをする条件として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["低温・高圧", "低温・低圧", "高温・高圧", "高温・低圧"], "ans": 3, "exp": "高温では分子間力の影響が、低圧では分子自身の体積の影響が小さくなり、理想気体に近づく。"}, {"id": "3-09", "lv": 2, "q": "27℃、8.3×10⁴ Pa で 3.0 L を占める気体の物質量は何 mol か。最も適当な数値を、次の①〜④のうちから一つ選べ。気体定数 R=8.3×10³ Pa・L/(K・mol) とする。", "opts": ["0.010 mol", "0.10 mol", "0.30 mol", "1.0 mol"], "ans": 1, "exp": "n=PV/RT=(8.3×10⁴×3.0)/(8.3×10³×300)=0.10 mol。"}, {"id": "3-10", "lv": 2, "q": "ある気体 0.50 g は、27℃、1.0×10⁵ Pa で 415 mL を占めた。この気体の分子量として最も適当な数値を、次の①〜④のうちから一つ選べ。R=8.3×10³ Pa・L/(K・mol) とする。", "opts": ["28", "30", "44", "64"], "ans": 1, "exp": "n=PV/RT=(1.0×10⁵×0.415)/(8.3×10³×300)=1/60 mol。M=0.50÷(1/60)=30。"}, {"id": "3-11", "lv": 2, "q": "窒素 0.60 mol と酸素 0.40 mol の混合気体の全圧が 1.0×10⁵ Pa のとき、酸素の分圧として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["2.0×10⁴ Pa", "4.0×10⁴ Pa", "6.0×10⁴ Pa", "8.0×10⁴ Pa"], "ans": 1, "exp": "分圧=全圧×モル分率=1.0×10⁵×0.40=4.0×10⁴ Pa。"}, {"id": "3-12", "lv": 2, "q": "空気を窒素と酸素の体積比 4:1 の混合気体とすると、空気の平均分子量として最も適当な数値を、次の①〜④のうちから一つ選べ。N₂=28、O₂=32 とする。", "opts": ["28.0", "28.8", "30.0", "31.2"], "ans": 1, "exp": "28×0.80+32×0.20=22.4+6.4=28.8。"}, {"id": "3-13", "lv": 2, "q": "標高の高い山の上では、水が100℃より低い温度で沸騰する。この理由として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["山頂では水の分子間力が弱くなるから", "山頂では水の比熱が小さくなるから", "山頂では水の蒸気圧が高くなるから", "山頂では大気圧が低く、より低い温度で蒸気圧が外圧に達するから"], "ans": 3, "exp": "沸騰の条件は蒸気圧=外圧。外圧(大気圧)が低いほど低温で条件を満たす。"}, {"id": "3-14", "lv": 2, "q": "水素を水上置換で捕集したところ、27℃で全圧が 1.00×10⁵ Pa であった。27℃の水の飽和蒸気圧を 4.0×10³ Pa とすると、水素の分圧として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["9.6×10⁴ Pa", "1.00×10⁵ Pa", "1.04×10⁵ Pa", "4.0×10³ Pa"], "ans": 0, "exp": "捕集気体は水蒸気との混合気体。水素の分圧=1.00×10⁵−4.0×10³=9.6×10⁴ Pa。"}, {"id": "3-15", "lv": 2, "q": "27℃、1.0×10⁵ Pa で 6.0 L の気体を、127℃、2.0×10⁵ Pa にすると体積は何 L になるか。最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["2.0 L", "3.0 L", "4.0 L", "9.0 L"], "ans": 2, "exp": "ボイル・シャルルの法則より V=6.0×(400/300)×(1.0×10⁵/2.0×10⁵)=4.0 L。"}, {"id": "3-16", "lv": 3, "q": "27℃で内容積 8.3 L の真空容器に水 0.10 mol を入れた。27℃の水の飽和蒸気圧を 3.5×10³ Pa とするとき、容器内の圧力として最も適当な数値を、次の①〜④のうちから一つ選べ。R=8.3×10³ Pa・L/(K・mol) とする。", "opts": ["3.5×10³ Pa", "3.0×10⁴ Pa", "1.0×10⁵ Pa", "3.5×10⁴ Pa"], "ans": 0, "exp": "全て気体と仮定すると P=nRT/V=3.0×10⁴ Pa となり飽和蒸気圧を超える。よって一部凝縮し、圧力は飽和蒸気圧 3.5×10³ Pa になる。"}, {"id": "3-17", "lv": 3, "q": "実在気体では、Z=PV/nRT の値が理想気体の値(Z=1)からずれる。そのずれの主な原因について、正しい組合せを、次の①〜④のうちから一つ選べ。", "opts": ["高圧でZ>1となるのは分子自身の体積のため、Z<1となるのは分子間力のため", "高圧でZ>1となるのは分子間力のため、Z<1となるのは分子自身の体積のため", "ZのずれはすべてBrown運動のためである", "Zのずれはすべて分子の衝突回数の増加のためである"], "ans": 0, "exp": "分子自身の体積は体積を大きく見せZ>1に、分子間力は圧力を小さくしZ<1に働く。"}, {"id": "3-18", "lv": 3, "q": "内容積 2.0 L の容器Aに窒素が 1.0×10⁵ Pa、内容積 3.0 L の容器Bに酸素が 5.0×10⁴ Pa で入っている。温度一定でコックを開いて両容器を連結したときの全圧として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["5.0×10⁴ Pa", "7.0×10⁴ Pa", "7.5×10⁴ Pa", "1.5×10⁵ Pa"], "ans": 1, "exp": "P=(1.0×10⁵×2.0+5.0×10⁴×3.0)/5.0=(2.0×10⁵+1.5×10⁵)/5.0=7.0×10⁴ Pa。"}, {"id": "3-19", "lv": 3, "q": "炭酸カルシウムに十分な量の塩酸を加えたところ、発生した二酸化炭素は 27℃、1.0×10⁵ Pa で 2.49 L であった。反応した炭酸カルシウムの質量として最も適当な数値を、次の①〜④のうちから一つ選べ。CaCO₃=100、R=8.3×10³ Pa・L/(K・mol) とする。", "opts": ["5.0 g", "10 g", "15 g", "20 g"], "ans": 1, "exp": "n=PV/RT=(1.0×10⁵×2.49)/(8.3×10³×300)=0.10 mol。CaCO₃→CO₂は1:1なので0.10 mol=10 g。"}, {"id": "3-20", "lv": 3, "q": "密閉容器内で液体の水と水蒸気が気液平衡にある。次の記述 a〜c の正誤の組合せとして正しいものを、次の①〜④のうちから一つ選べ。\na 平衡状態では蒸発も凝縮も起こっていない。\nb 温度を上げると容器内の圧力は大きくなる。\nc 温度一定で容器の体積を半分にしても、液体が残っていれば圧力は変わらない。", "opts": ["a:正 b:誤 c:正", "a:誤 b:誤 c:正", "a:正 b:正 c:誤", "a:誤 b:正 c:正"], "ans": 3, "exp": "気液平衡では蒸発と凝縮が同じ速さで起こり続けている(aは誤)。蒸気圧は温度だけで決まる(b・cは正)。"}, {"id": "3-21", "lv": 3, "q": "27℃で内容積 8.3 L の真空容器に、窒素 0.10 mol と水 0.10 mol を入れた。液体の水が残っているとき、容器内の全圧として最も適当な数値を、次の①〜④のうちから一つ選べ。27℃の水の飽和蒸気圧 3.5×10³ Pa、R=8.3×10³ Pa・L/(K・mol) とする。", "opts": ["3.0×10⁴ Pa", "3.4×10⁴ Pa", "3.5×10³ Pa", "6.5×10⁴ Pa"], "ans": 1, "exp": "N₂の分圧=nRT/V=3.0×10⁴ Pa。液体が残るので水蒸気の分圧は飽和蒸気圧3.5×10³ Pa。全圧=3.0×10⁴+3.5×10³≒3.4×10⁴ Pa。"}, {"id": "3-22", "lv": 3, "q": "プロパン C₃H₈ 4.4 g を完全燃焼させ、生じた二酸化炭素をすべて 27℃、1.0×10⁵ Pa で捕集した。その体積として最も適当な数値を、次の①〜④のうちから一つ選べ。C₃H₈=44、R=8.3×10³ Pa・L/(K・mol) とする。", "opts": ["2.5 L", "6.7 L", "7.5 L", "22 L"], "ans": 2, "exp": "C₃H₈ 0.10 molからCO₂ 0.30 mol。V=nRT/P=0.30×8.3×10³×300/(1.0×10⁵)≒7.5 L。化学反応式と状態方程式の2段階。"}, {"id": "3-23", "lv": 2, "svg": "<svg viewBox='0 0 380 250' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif' font-size='11'><line x1='40' y1='210' x2='365' y2='210' stroke='#5b6b85' stroke-width='1.5'/><line x1='40' y1='210' x2='40' y2='15' stroke='#5b6b85' stroke-width='1.5'/><text x='150' y='240' fill='#5b6b85'>温度 [℃]</text><text x='8' y='12' fill='#5b6b85'>蒸気圧 [Pa]</text><line x1='40' y1='60' x2='365' y2='60' stroke='#999' stroke-dasharray='6 4'/><text x='300' y='52' fill='#5b6b85'>1.0×10⁵ Pa</text><path d='M40,205 Q100,190 130,60' fill='none' stroke='#ef5b7b' stroke-width='2'/><path d='M70,207 Q180,195 235,60' fill='none' stroke='#4f7cff' stroke-width='2'/><path d='M100,208 Q240,198 300,60' fill='none' stroke='#22b573' stroke-width='2'/><text x='112' y='90' fill='#ef5b7b' font-weight='bold'>A</text><text x='218' y='90' fill='#4f7cff' font-weight='bold'>B</text><text x='283' y='90' fill='#22b573' font-weight='bold'>C</text></svg>", "q": "図は液体A〜Cの蒸気圧曲線である。外圧 1.0×10⁵ Pa のもとでの沸点が最も高い液体と、その理由の組合せとして最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["A:最も低い温度で蒸気圧が外圧に達するから", "B:曲線が中央にあるから", "C:蒸気圧が外圧に達するのに最も高い温度が必要だから", "C:蒸気圧が常に最も大きいから"], "ans": 2, "exp": "沸点は蒸気圧=外圧となる温度。Cの曲線は最も右で1.0×10⁵ Paに達し、沸点最高。同じ温度で比べた蒸気圧は最も小さく、分子間力が最も強い液体である。"}, {"id": "3-24", "lv": 2, "svg": "<svg viewBox='0 0 380 250' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif' font-size='11'><line x1='40' y1='210' x2='365' y2='210' stroke='#5b6b85' stroke-width='1.5'/><line x1='40' y1='210' x2='40' y2='15' stroke='#5b6b85' stroke-width='1.5'/><text x='160' y='240' fill='#5b6b85'>温度</text><text x='8' y='12' fill='#5b6b85'>圧力</text><path d='M55,203 Q95,190 120,160' fill='none' stroke='#4f7cff' stroke-width='2'/><path d='M120,160 Q220,110 320,55' fill='none' stroke='#4f7cff' stroke-width='2'/><path d='M120,160 L100,25' fill='none' stroke='#ef5b7b' stroke-width='2'/><circle cx='120' cy='160' r='4' fill='#2b3a55'/><text x='128' y='172' fill='#2b3a55'>三重点</text><text x='62' y='70' fill='#5b6b85' font-weight='bold'>固体</text><text x='200' y='60' fill='#5b6b85' font-weight='bold'>液体</text><text x='260' y='185' fill='#5b6b85' font-weight='bold'>気体</text></svg>", "q": "図は水の状態図(模式図)である。固体と液体の境界線(融解曲線)が左上がり(負の傾き)であることからわかることとして最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["圧力を高くすると氷の融点は低くなる", "圧力を高くすると氷の融点は高くなる", "氷は圧力に関係なく0℃で融解する", "高圧では氷は昇華しやすくなる"], "ans": 0, "exp": "融解曲線が左に傾いているため、加圧すると固体→液体の境界温度(融点)が下がる。氷が水より密度が小さいことに対応する水の特徴。"}, {"id": "3-25", "lv": 2, "type": "num", "q": "27℃、1.0×10⁵ Pa で 0.83 L を占める気体の物質量は何 mol か。有効数字2桁で次の形式で表すとき、ア〜ウに当てはまる数字を選べ。気体定数 R=8.3×10³ Pa・L/(K・mol) とする。", "numFmt": "ア.イ×10⁻ウ mol", "slots": ["ア", "イ", "ウ"], "ansD": ["3", "3", "2"], "exp": "n=PV/RT=(1.0×10⁵×0.83)/(8.3×10³×300)=0.0333≒3.3×10⁻² mol。"}, {"id": "3-26", "lv": 3, "svg": "<svg viewBox='0 0 380 210' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif' font-size='11'><text x='14' y='24' fill='#5b6b85' font-weight='bold'>表 0℃における気体のPV/(nRT)の値</text><line x1='14' y1='36' x2='366' y2='36' stroke='#5b6b85'/><text x='24' y='56' fill='#2b3a55'>圧力 [×10⁵ Pa]</text><text x='176' y='56' fill='#2b3a55'>気体A</text><text x='266' y='56' fill='#2b3a55'>気体B</text><line x1='14' y1='64' x2='366' y2='64' stroke='#e3e9f4'/><text x='60' y='84' fill='#2b3a55'>1</text><text x='186' y='84' fill='#4f7cff'>1.00</text><text x='276' y='84' fill='#ef5b7b'>0.99</text><text x='56' y='108' fill='#2b3a55'>50</text><text x='186' y='108' fill='#4f7cff'>1.02</text><text x='276' y='108' fill='#ef5b7b'>0.85</text><text x='52' y='132' fill='#2b3a55'>200</text><text x='186' y='132' fill='#4f7cff'>1.08</text><text x='276' y='132' fill='#ef5b7b'>0.72</text><text x='52' y='156' fill='#2b3a55'>600</text><text x='186' y='156' fill='#4f7cff'>1.35</text><text x='276' y='156' fill='#ef5b7b'>1.10</text><line x1='14' y1='168' x2='366' y2='168' stroke='#5b6b85'/><text x='14' y='192' fill='#7a8aa5'>(理想気体では、どの圧力でも 1.00)</text></svg>", "q": "表は0℃における2種類の実在気体A・Bについて、PV/(nRT) の値を圧力に対して示したものである。この表から読み取れることとして最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["Aは全圧力範囲で分子自身の体積の影響が現れており、Bは中程度の圧力では分子間力の影響が大きい", "Aは分子間力が非常に強く、Bには分子間力がはたらかない", "どちらの気体も理想気体としてふるまっている", "高圧ではどちらの気体もPV/(nRT)が1より小さくなる"], "ans": 0, "exp": "PV/(nRT)>1は分子自身の体積の影響、<1は分子間力の影響を示す。Aは常に1以上、Bは中圧で1未満、超高圧では体積の影響が勝って1を超える。"}], "hot": false}, {"unit": 4, "name": "溶液の性質", "emoji": "💧", "questions": [{"id": "4-01", "lv": 1, "q": "塩化ナトリウムが水によく溶ける理由として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["Na⁺やCl⁻が水分子に囲まれて水和されるから", "NaClが水と化学反応して新しい物質になるから", "NaClの結晶が水より密度が大きいから", "水分子が無極性分子だから"], "ans": 0, "exp": "極性分子である水がイオンを取り囲み水和することで、イオンが安定化して溶解する。"}, {"id": "4-02", "lv": 1, "q": "温度と溶解度の関係について、一般的な傾向として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["固体は温度が低いほど、気体は温度が高いほど水に溶けやすい", "固体も気体も温度が低いほど水に溶けやすい", "固体も気体も温度が高いほど水に溶けやすい", "固体は温度が高いほど、気体は温度が低いほど水に溶けやすい"], "ans": 3, "exp": "多くの固体の溶解度は高温ほど大きく、気体の溶解度は高温ほど小さくなる。"}, {"id": "4-03", "lv": 1, "q": "温度による溶解度の差を利用して、少量の不純物を含む固体から純粋な結晶を得る操作の名称として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["蒸留", "昇華法", "再結晶", "抽出"], "ans": 2, "exp": "高温で飽和溶液をつくり冷却すると、溶解度の差により純粋な結晶が析出する。これが再結晶。"}, {"id": "4-04", "lv": 1, "q": "コロイド溶液に横から強い光を当てると、光の通路が輝いて見える。この現象の名称として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["電気泳動", "透析", "ブラウン運動", "チンダル現象"], "ans": 3, "exp": "コロイド粒子が光を散乱するために光の通路が見える。これがチンダル現象。"}, {"id": "4-05", "lv": 1, "q": "疎水コロイドに少量の電解質を加えると沈殿が生じる現象の名称として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["乳化", "透析", "塩析", "凝析"], "ans": 3, "exp": "疎水コロイドは少量の電解質で電荷が中和され凝析する。親水コロイドを多量の電解質で沈殿させるのは塩析。"}, {"id": "4-06", "lv": 1, "q": "疎水コロイドに加えることで凝析しにくくする親水コロイドの名称として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["保護コロイド", "会合コロイド", "分子コロイド", "ゲル"], "ans": 0, "exp": "墨汁のにかわのように、疎水コロイドを取り囲んで凝析を防ぐ親水コロイドを保護コロイドという。"}, {"id": "4-07", "lv": 1, "q": "水に不揮発性の溶質を溶かした溶液の性質として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["蒸気圧も沸点も変化しない", "蒸気圧が低くなり、沸点も低くなる", "蒸気圧が高くなり、沸点が低くなる", "蒸気圧が低くなり、沸点が高くなる"], "ans": 3, "exp": "蒸気圧降下により、外圧と等しい蒸気圧に達するにはより高温が必要になる(沸点上昇)。"}, {"id": "4-08", "lv": 1, "q": "温度一定のとき、水に溶ける気体の物質量と気体の圧力の関係(溶解度が小さい気体)を表す法則として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["ボイルの法則", "ヘスの法則", "ヘンリーの法則", "アボガドロの法則"], "ans": 2, "exp": "ヘンリーの法則:溶解する気体の物質量はその気体の分圧に比例する。"}, {"id": "4-09", "lv": 2, "q": "硝酸カリウムの溶解度(水100 gに溶ける質量)は60℃で110、20℃で32である。60℃の飽和水溶液 210 g を20℃まで冷却したとき、析出する硝酸カリウムの質量として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["32 g", "64 g", "78 g", "110 g"], "ans": 2, "exp": "210 gは水100 g+KNO₃ 110 g。20℃では32 gまでしか溶けないので、110−32=78 gが析出。"}, {"id": "4-10", "lv": 2, "q": "グルコース(分子量180)18 g を水 500 g に溶かした水溶液の質量モル濃度として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["0.10 mol/kg", "0.20 mol/kg", "0.36 mol/kg", "0.50 mol/kg"], "ans": 1, "exp": "18/180=0.10 mol。0.10 mol÷0.500 kg=0.20 mol/kg。"}, {"id": "4-11", "lv": 2, "q": "0.20 mol/kg のグルコース水溶液の凝固点として最も適当な数値を、次の①〜④のうちから一つ選べ。水のモル凝固点降下を 1.85 K・kg/mol とする。", "opts": ["−0.19℃", "−0.37℃", "−0.56℃", "−0.74℃"], "ans": 1, "exp": "Δt=1.85×0.20=0.37 K。凝固点は0℃−0.37 K=−0.37℃。"}, {"id": "4-12", "lv": 2, "q": "いずれも 0.10 mol/kg のグルコース、塩化ナトリウム、塩化カルシウム水溶液のうち、沸点が最も高いものと、その理由の組合せとして最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["グルコース:分子量が最も大きいから", "塩化ナトリウム:2個のイオンに電離するから", "塩化カルシウム:3個のイオンに電離するから", "すべて同じ:質量モル濃度が等しいから"], "ans": 2, "exp": "沸点上昇は溶質粒子の総数に比例する。CaCl₂→Ca²⁺+2Cl⁻で粒子数3倍となり最大。"}, {"id": "4-13", "lv": 2, "q": "0.10 mol/L のグルコース水溶液の27℃における浸透圧として最も適当な数値を、次の①〜④のうちから一つ選べ。R=8.3×10³ Pa・L/(K・mol) とする。", "opts": ["2.5×10⁴ Pa", "1.0×10⁵ Pa", "2.5×10⁵ Pa", "5.0×10⁵ Pa"], "ans": 2, "exp": "Π=cRT=0.10×8.3×10³×300=2.49×10⁵≒2.5×10⁵ Pa。"}, {"id": "4-14", "lv": 2, "q": "0℃、1.0×10⁵ Pa の酸素は水 1.0 L に 2.2×10⁻³ mol 溶ける。0℃で酸素の圧力を 3.0×10⁵ Pa にしたとき、水 1.0 L に溶ける酸素の物質量として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["2.2×10⁻³ mol", "4.4×10⁻³ mol", "6.6×10⁻³ mol", "7.3×10⁻⁴ mol"], "ans": 2, "exp": "ヘンリーの法則より溶解量は圧力に比例。2.2×10⁻³×3=6.6×10⁻³ mol。"}, {"id": "4-15", "lv": 2, "q": "水酸化鉄(Ⅲ)のコロイドは正に帯電している。このコロイドを最も少量で凝析させる電解質として適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["NaCl", "Na₂SO₄", "Na₃PO₄", "KNO₃"], "ans": 2, "exp": "正コロイドの凝析には反対符号(陰イオン)の価数が大きいものほど有効。PO₄³⁻をもつNa₃PO₄が最も少量で凝析させる。"}, {"id": "4-16", "lv": 3, "q": "ある非電解質 2.4 g を水 100 g に溶かした水溶液の凝固点は −0.37℃ であった。この物質の分子量として最も適当な数値を、次の①〜④のうちから一つ選べ。水のモル凝固点降下を 1.85 K・kg/mol とする。", "opts": ["60", "120", "180", "240"], "ans": 1, "exp": "質量モル濃度=0.37/1.85=0.20 mol/kg。水100 g中の溶質は0.020 mol。M=2.4/0.020=120。"}, {"id": "4-17", "lv": 3, "q": "あるタンパク質 1.0 g を水に溶かして 100 mL とした水溶液の27℃における浸透圧は 2.49×10² Pa であった。このタンパク質の分子量として最も適当な数値を、次の①〜④のうちから一つ選べ。R=8.3×10³ Pa・L/(K・mol) とする。", "opts": ["1.0×10⁴", "5.0×10⁴", "1.0×10⁵", "2.0×10⁵"], "ans": 2, "exp": "c=Π/RT=249/(8.3×10³×300)=1.0×10⁻⁴ mol/L。100 mL中は1.0×10⁻⁵ mol。M=1.0/(1.0×10⁻⁵)=1.0×10⁵。"}, {"id": "4-18", "lv": 3, "q": "次の水溶液のうち、凝固点が最も低いものを、次の①〜④のうちから一つ選べ。いずれも電解質は完全に電離するものとする。", "opts": ["0.10 mol/kg グルコース水溶液", "0.10 mol/kg 塩化ナトリウム水溶液", "0.050 mol/kg 塩化カルシウム水溶液", "0.15 mol/kg 尿素水溶液"], "ans": 1, "exp": "溶質粒子の質量モル濃度は①0.10、②0.20、③0.15、④0.15。粒子濃度最大のNaCl水溶液が最も凝固点が低い。"}, {"id": "4-19", "lv": 3, "q": "希薄溶液を冷却していくと、凝固点以下でも凝固しないことがある(過冷却)。その後凝固が始まり温度が上がってから、溶液の温度は純溶媒と異なり徐々に下がり続ける。溶液の凝固中に温度が下がり続ける理由として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["溶質も一緒に凝固して結晶の純度が下がるから", "過冷却によって溶液の比熱が大きくなるから", "凝固熱が徐々に小さくなるから", "溶媒だけが先に凝固し、残った溶液の濃度が高くなって凝固点降下が大きくなるから"], "ans": 3, "exp": "凝固するのはほぼ溶媒のみ。残る溶液は濃縮されて凝固点降下が進み、凝固点が下がり続ける。"}, {"id": "4-20", "lv": 3, "q": "0℃、1.0×10⁵ Pa の空気(体積比 N₂:O₂=4:1)が水に接している。0℃、1.0×10⁵ Pa の酸素は水 1.0 L に 2.2×10⁻³ mol 溶けるとすると、この空気と接した水 1.0 L に溶けている酸素の物質量として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["2.2×10⁻³ mol", "1.1×10⁻³ mol", "4.4×10⁻⁴ mol", "8.8×10⁻⁴ mol"], "ans": 2, "exp": "酸素の分圧は1.0×10⁵×0.20=2.0×10⁴ Pa。ヘンリーの法則より2.2×10⁻³×0.20=4.4×10⁻⁴ mol。"}, {"id": "4-21", "lv": 3, "q": "0.10 mol/kg の酢酸水溶液(電離度 0.020)の凝固点降下度として最も適当な数値を、次の①〜④のうちから一つ選べ。水のモル凝固点降下 1.85 K・kg/mol とする。", "opts": ["0.185 K", "0.19 K", "0.37 K", "0.093 K"], "ans": 1, "exp": "電離により粒子は0.10×(1+0.020)=0.102 mol/kg。Δt=1.85×0.102≒0.19 K。電離度を粒子数に反映させるのがポイント。"}, {"id": "4-22", "lv": 3, "q": "塩化ナトリウム NaCl 0.585 g を水に溶かして 1.0 L とした水溶液の27℃における浸透圧として最も適当な数値を、次の①〜④のうちから一つ選べ。NaCl=58.5、完全に電離するものとし、R=8.3×10³ Pa・L/(K・mol) とする。", "opts": ["2.5×10⁴ Pa", "5.0×10⁴ Pa", "1.0×10⁵ Pa", "2.5×10⁵ Pa"], "ans": 1, "exp": "NaCl 0.010 molは電離して粒子0.020 mol。Π=0.020×8.3×10³×300≒5.0×10⁴ Pa。質量→mol→電離→浸透圧の3段階。"}, {"id": "4-23", "lv": 2, "svg": "<svg viewBox='0 0 380 250' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif' font-size='11'><line x1='40' y1='210' x2='365' y2='210' stroke='#5b6b85' stroke-width='1.5'/><line x1='40' y1='210' x2='40' y2='15' stroke='#5b6b85' stroke-width='1.5'/><text x='90' y='240' fill='#5b6b85'>温度 [℃]</text><text x='8' y='12' fill='#5b6b85'>溶解度 [g/100g水]</text><path d='M40,194 Q140,165 200,132 Q260,95 330,35' fill='none' stroke='#4f7cff' stroke-width='2.5'/><path d='M40,167 L360,160' fill='none' stroke='#ef5b7b' stroke-width='2.5'/><text x='250' y='55' fill='#4f7cff' font-weight='bold'>硝酸カリウム</text><text x='250' y='150' fill='#ef5b7b' font-weight='bold'>塩化ナトリウム</text></svg>", "q": "図は硝酸カリウムと塩化ナトリウムの溶解度曲線である。それぞれの60℃の飽和水溶液を20℃まで冷却したときの違いと、その理由として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["硝酸カリウムは多量に析出するが、塩化ナトリウムはほとんど析出しない。温度による溶解度の差が大きく異なるから", "どちらも同じ量だけ析出する。飽和溶液だったから", "塩化ナトリウムだけが析出する。密度が大きいから", "どちらも析出しない。冷却では析出は起こらないから"], "ans": 0, "exp": "析出量は溶解度の差で決まる。KNO₃は曲線の傾きが急で差が大きいため多量に析出し、再結晶に適する。NaClはほぼ水平で析出はごくわずか。"}, {"id": "4-24", "lv": 2, "svg": "<svg viewBox='0 0 380 250' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif' font-size='11'><line x1='40' y1='210' x2='365' y2='210' stroke='#5b6b85' stroke-width='1.5'/><line x1='40' y1='210' x2='40' y2='15' stroke='#5b6b85' stroke-width='1.5'/><text x='160' y='240' fill='#5b6b85'>時間</text><text x='8' y='12' fill='#5b6b85'>温度</text><path d='M60,35 Q120,90 168,148 L182,163 Q190,168 196,158 L200,152' fill='none' stroke='#4f7cff' stroke-width='2.5'/><path d='M200,152 L310,168' fill='none' stroke='#4f7cff' stroke-width='2.5'/><path d='M310,168 Q330,185 340,205' fill='none' stroke='#4f7cff' stroke-width='2.5'/><line x1='200' y1='152' x2='128' y2='142' stroke='#ef5b7b' stroke-dasharray='5 4' stroke-width='2'/><circle cx='182' cy='163' r='4' fill='#2b3a55'/><text x='176' y='182' font-weight='bold' fill='#2b3a55'>a</text><circle cx='128' cy='142' r='4' fill='#ef5b7b'/><text x='118' y='134' font-weight='bold' fill='#ef5b7b'>b</text><circle cx='260' cy='161' r='4' fill='#2b3a55'/><text x='256' y='150' font-weight='bold' fill='#2b3a55'>c</text></svg>", "q": "図はある水溶液の冷却曲線である。a は過冷却ののち凝固が始まった点、破線は凝固が進む部分の直線を冷却曲線と交わるまで外挿したものである。この水溶液の凝固点を示す点として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["a", "b", "c", "aとcの中間の点"], "ans": 1, "exp": "過冷却がなかったとした場合に凝固が始まる温度が凝固点。凝固中の直線部を外挿した交点bを読む。凝固が進むと濃度が上がりcのように温度は下がり続ける。"}, {"id": "4-25", "lv": 2, "type": "num", "q": "0.020 mol/kg のスクロース水溶液の凝固点降下度は何 K か。有効数字2桁で次の形式で表すとき、ア〜ウに当てはまる数字を選べ。水のモル凝固点降下を 1.85 K・kg/mol とする。", "numFmt": "ア.イ×10⁻ウ K", "slots": ["ア", "イ", "ウ"], "ansD": ["3", "7", "2"], "exp": "Δt=1.85×0.020=0.037=3.7×10⁻² K。スクロースは非電解質なので粒子数は変わらない。"}], "hot": false}, {"unit": 5, "name": "化学反応とエンタルピー", "emoji": "🔥", "questions": [{"id": "5-01", "lv": 1, "q": "発熱反応におけるエンタルピー変化 ΔH について正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["ΔH>0 である", "ΔH<0 である", "ΔH=0 である", "反応によって符号は決まらない"], "ans": 1, "exp": "発熱反応では系のエンタルピーが減少するので ΔH<0。吸熱反応では ΔH>0。"}, {"id": "5-02", "lv": 1, "q": "燃焼エンタルピーの定義として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["物質 1 mol が完全燃焼するときのエンタルピー変化", "物質 1 g が完全燃焼するときのエンタルピー変化", "酸素 1 mol が消費されるときのエンタルピー変化", "燃焼で水 1 mol が生成するときのエンタルピー変化"], "ans": 0, "exp": "燃焼エンタルピーは物質1 molが完全燃焼するときのΔH(負の値)。"}, {"id": "5-03", "lv": 1, "q": "希塩酸と水酸化ナトリウム水溶液など、強酸と強塩基の中和エンタルピーが酸・塩基の種類によらずほぼ一定(約 −57 kJ/mol)である理由として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["どの中和でも実質的な反応は H⁺ + OH⁻ → H₂O だから", "どの酸・塩基も分子量がほぼ等しいから", "中和では熱が発生しないから", "生成する塩の種類が同じだから"], "ans": 0, "exp": "強酸・強塩基は完全電離しており、中和の実質はH⁺+OH⁻→H₂Oで共通。"}, {"id": "5-04", "lv": 1, "q": "融解エンタルピーと蒸発エンタルピーの符号について正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["どちらも負", "融解は正、蒸発は負", "融解は負、蒸発は正", "どちらも正"], "ans": 3, "exp": "融解・蒸発はいずれも粒子間の結びつきを切るため吸熱で、ΔH>0。"}, {"id": "5-05", "lv": 1, "q": "生成エンタルピーの定義として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["化合物 1 mol がその成分元素の単体から生成するときのエンタルピー変化", "化合物 1 mol が完全燃焼するときのエンタルピー変化", "化合物 1 g が単体に分解するときのエンタルピー変化", "化合物 1 mol が水に溶けるときのエンタルピー変化"], "ans": 0, "exp": "生成エンタルピーは、成分元素の最も安定な単体から化合物1 molが生成するときのΔH。"}, {"id": "5-06", "lv": 1, "q": "「反応エンタルピーは、反応の経路によらず、反応の初めと終わりの状態だけで決まる」という法則の名称として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["ファラデーの法則", "ルシャトリエの原理", "ヘンリーの法則", "ヘスの法則"], "ans": 3, "exp": "ヘスの法則(総熱量保存の法則)。エンタルピーが状態量であることに基づく。"}, {"id": "5-07", "lv": 1, "q": "硝酸アンモニウムを水に溶かすと温度が下がる。これを利用した製品と、溶解エンタルピーの符号の組合せとして正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["携帯用カイロ:ΔH<0", "携帯用カイロ:ΔH>0", "瞬間冷却パック:ΔH>0", "瞬間冷却パック:ΔH<0"], "ans": 2, "exp": "温度が下がる=吸熱(ΔH>0)。冷却パックに利用される。カイロは鉄の酸化(発熱)。"}, {"id": "5-08", "lv": 1, "q": "結合エネルギーについて正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["結合を切断するときに放出されるエネルギーである", "結合エネルギーが大きい結合ほど切れやすい", "気体分子内の共有結合 1 mol を切断するのに必要なエネルギーである", "結合エネルギーは常に負の値をとる"], "ans": 2, "exp": "結合エネルギーは気体状態で結合1 molを切るのに必要なエネルギー(正の値)。大きいほど強い結合。"}, {"id": "5-09", "lv": 2, "q": "次の2つの反応エンタルピーから、C(黒鉛) + 1/2 O₂ → CO のΔHとして最も適当な数値を、次の①〜④のうちから一つ選べ。\nC(黒鉛) + O₂ → CO₂  ΔH=−394 kJ\nCO + 1/2 O₂ → CO₂  ΔH=−283 kJ", "opts": ["−677 kJ", "−111 kJ", "+111 kJ", "+677 kJ"], "ans": 1, "exp": "ヘスの法則より (−394)−(−283)=−111 kJ。"}, {"id": "5-10", "lv": 2, "q": "メタンの燃焼エンタルピーは −891 kJ/mol である。メタン 4.0 g を完全燃焼させたときに発生する熱量として最も適当な数値を、次の①〜④のうちから一つ選べ。CH₄=16 とする。", "opts": ["56 kJ", "111 kJ", "223 kJ", "891 kJ"], "ans": 2, "exp": "4.0/16=0.25 mol。891×0.25≒223 kJ。"}, {"id": "5-11", "lv": 2, "q": "生成エンタルピーを CO₂(気)−394 kJ/mol、H₂O(液)−286 kJ/mol、C₃H₈(気)−105 kJ/mol とするとき、プロパンの燃焼エンタルピー(C₃H₈ + 5O₂ → 3CO₂ + 4H₂O(液))として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["−1301 kJ/mol", "−2221 kJ/mol", "−2326 kJ/mol", "−2431 kJ/mol"], "ans": 1, "exp": "ΔH=(生成物の生成エンタルピー和)−(反応物の和)={3×(−394)+4×(−286)}−(−105)=−2326+105=−2221 kJ/mol。"}, {"id": "5-12", "lv": 2, "q": "結合エネルギーを H–H 436 kJ/mol、Cl–Cl 243 kJ/mol、H–Cl 432 kJ/mol とするとき、H₂ + Cl₂ → 2HCl のΔHとして最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["−185 kJ", "+185 kJ", "−247 kJ", "+247 kJ"], "ans": 0, "exp": "ΔH=(切る結合の和)−(できる結合の和)=(436+243)−2×432=679−864=−185 kJ。"}, {"id": "5-13", "lv": 2, "q": "1.0 mol/L の塩酸 100 mL と 1.0 mol/L の水酸化ナトリウム水溶液 100 mL を混合した。中和エンタルピーを −57 kJ/mol とするとき、発生する熱量として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["2.9 kJ", "5.7 kJ", "11 kJ", "57 kJ"], "ans": 1, "exp": "中和されるH⁺は0.10 mol。57×0.10=5.7 kJ。"}, {"id": "5-14", "lv": 2, "q": "発熱反応のエネルギー図(縦軸:エンタルピー)について正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["反応物と生成物のエンタルピーは等しい", "エネルギー図からは判断できない", "生成物のエンタルピーは反応物より高い", "生成物のエンタルピーは反応物より低い"], "ans": 3, "exp": "発熱反応(ΔH<0)では生成物のエンタルピーが反応物より低く、その差が放出される。"}, {"id": "5-15", "lv": 2, "q": "断熱容器中の水 100 g の温度が反応熱により 5.0 K 上昇した。水の比熱を 4.2 J/(g・K) とするとき、水が得た熱量として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["0.21 kJ", "1.05 kJ", "2.1 kJ", "4.2 kJ"], "ans": 2, "exp": "Q=mcΔt=100×4.2×5.0=2100 J=2.1 kJ。"}, {"id": "5-16", "lv": 3, "q": "黒鉛とダイヤモンドの燃焼エンタルピーはそれぞれ −394 kJ/mol、−396 kJ/mol である。C(黒鉛) → C(ダイヤモンド) のΔHと、両者のエネルギーの高低の組合せとして正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["ΔH=+2 kJ:ダイヤモンドの方が高エネルギー", "ΔH=−2 kJ:ダイヤモンドの方が低エネルギー", "ΔH=+790 kJ:ダイヤモンドの方が高エネルギー", "ΔH=−790 kJ:ダイヤモンドの方が低エネルギー"], "ans": 0, "exp": "ΔH=(−394)−(−396)=+2 kJ。吸熱なのでダイヤモンドの方がエンタルピーが高く、黒鉛の方が安定。"}, {"id": "5-17", "lv": 3, "q": "CH₄(気) → C(気) + 4H(気) のΔHは +1664 kJ である。C–H結合の結合エネルギー(平均値)として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["208 kJ/mol", "416 kJ/mol", "832 kJ/mol", "1664 kJ/mol"], "ans": 1, "exp": "メタン1分子にC–H結合は4本。1664/4=416 kJ/mol。"}, {"id": "5-18", "lv": 3, "q": "溶解エンタルピーの測定実験で、溶解後の温度は最高値に達したのち徐々に下がっていく。真の最高温度を求める方法として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["溶解前後の温度の平均値を用いる", "温度が一定になったときの値を用いる", "実測された最高温度をそのまま用いる", "温度が下がり始めてからのグラフを溶解開始時刻まで外挿して求める"], "ans": 3, "exp": "外部への放熱で最高温度は低く観測される。冷却部分の直線を混合時刻に外挿して補正する。"}, {"id": "5-19", "lv": 3, "q": "メタン(燃焼エンタルピー −891 kJ/mol)とプロパン(同 −2219 kJ/mol)の混合気体 1.0 mol を完全燃焼させたところ、1422 kJ の熱が発生した。混合気体中のメタンの物質量として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["0.40 mol", "0.50 mol", "0.60 mol", "0.70 mol"], "ans": 2, "exp": "CH₄をx molとすると 891x+2219(1.0−x)=1422 より 1328x=797、x≒0.60 mol。"}, {"id": "5-20", "lv": 3, "q": "水素の燃焼エンタルピー(液体の水が生成)は −286 kJ/mol、水の蒸発エンタルピーは +44 kJ/mol である。H₂ + 1/2 O₂ → H₂O(気) のΔHとして最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["−330 kJ", "−286 kJ", "−242 kJ", "+242 kJ"], "ans": 2, "exp": "ΔH=−286+44=−242 kJ。生成する水が気体だと放出熱は蒸発分だけ小さくなる。"}, {"id": "5-21", "lv": 3, "q": "水酸化ナトリウム 2.0 g を水 98 g に溶かしたところ、すべて溶けて溶液の温度が上昇した。NaOHの溶解エンタルピーを −42 kJ/mol、溶液の質量を 100 g、比熱を 4.2 J/(g・K) とするとき、温度上昇として最も適当な数値を、次の①〜④のうちから一つ選べ。NaOH=40 とする。", "opts": ["2.5 K", "5.0 K", "10 K", "21 K"], "ans": 1, "exp": "NaOH 0.050 molの溶解で42×0.050=2.1 kJ発生。Δt=2100/(100×4.2)=5.0 K。熱量計算と比熱計算の複合。"}, {"id": "5-22", "lv": 2, "svg": "<svg viewBox='0 0 380 250' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif' font-size='11'><line x1='40' y1='220' x2='365' y2='220' stroke='#5b6b85' stroke-width='1.5'/><line x1='40' y1='220' x2='40' y2='15' stroke='#5b6b85' stroke-width='1.5'/><text x='130' y='243' fill='#5b6b85'>反応の進行度</text><text x='8' y='12' fill='#5b6b85'>エンタルピー</text><line x1='55' y1='120' x2='125' y2='120' stroke='#2b3a55' stroke-width='2.5'/><text x='60' y='112' fill='#2b3a55'>反応物</text><path d='M125,120 Q195,30 265,170' fill='none' stroke='#4f7cff' stroke-width='2'/><line x1='265' y1='170' x2='340' y2='170' stroke='#2b3a55' stroke-width='2.5'/><text x='280' y='190' fill='#2b3a55'>生成物</text><line x1='195' y1='53' x2='195' y2='120' stroke='#ef5b7b' stroke-width='1.5' marker-end='none'/><text x='200' y='95' fill='#ef5b7b' font-weight='bold'>E₁</text><line x1='330' y1='120' x2='330' y2='170' stroke='#f5a623' stroke-width='1.5'/><text x='336' y='150' fill='#f5a623' font-weight='bold'>ΔH</text><line x1='40' y1='120' x2='330' y2='120' stroke='#ccc' stroke-dasharray='4 4'/></svg>", "q": "図はある発熱反応のエネルギー図で、E₁ は活性化エネルギー、ΔH は反応エンタルピーである。この反応に適切な触媒を加えたときの E₁ と ΔH の変化の組合せとして最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["E₁:変化しない ΔH:小さくなる", "E₁:大きくなる ΔH:変化しない", "E₁:小さくなる ΔH:小さくなる", "E₁:小さくなる ΔH:変化しない"], "ans": 3, "exp": "触媒は活性化エネルギーの小さい経路を提供するのでE₁は小さくなるが、反応物と生成物のエンタルピー差ΔHは変わらない。"}, {"id": "5-23", "lv": 2, "q": "都市ガスの主成分メタン(燃焼エンタルピー −891 kJ/mol)とプロパン(同 −2219 kJ/mol)を、同じ質量あたりで比べたときの発熱量について正しいものを、次の①〜④のうちから一つ選べ。CH₄=16、C₃H₈=44 とする。", "opts": ["メタンの方が大きい(1 gあたり約56 kJ に対し約50 kJ)", "プロパンの方が大きい(1 gあたり約50 kJ に対し約56 kJ)", "どちらも同じである", "計算に必要な情報が不足している"], "ans": 0, "exp": "1 gあたりは 891/16≒56 kJ、2219/44≒50 kJ。メタンの方が大きい。1 molあたりと1 gあたりで大小が逆になる点が問われやすい。"}], "hot": false}, {"unit": 6, "name": "酸と塩基", "emoji": "🧪", "questions": [{"id": "6-01", "lv": 1, "q": "反応 NH₃ + H₂O ⇌ NH₄⁺ + OH⁻ において、ブレンステッド・ローリーの定義で酸としてはたらいているものを、次の①〜④のうちから一つ選べ。", "opts": ["NH₄⁺とH₂O", "OH⁻", "NH₃", "H₂O"], "ans": 3, "exp": "H₂OはH⁺をNH₃に与えているので酸。NH₃はH⁺を受け取る塩基。"}, {"id": "6-02", "lv": 1, "q": "0.010 mol/L の塩酸のpHとして最も適当な数値を、次の①〜④のうちから一つ選べ。塩酸は完全に電離するものとする。", "opts": ["1", "2", "3", "4"], "ans": 1, "exp": "[H⁺]=1.0×10⁻² mol/L なので pH=2。"}, {"id": "6-03", "lv": 1, "q": "弱酸に分類されるものを、次の①〜④のうちから一つ選べ。", "opts": ["塩酸 HCl", "硫酸 H₂SO₄", "酢酸 CH₃COOH", "硝酸 HNO₃"], "ans": 2, "exp": "酢酸は電離度が小さい弱酸。HCl・H₂SO₄・HNO₃は強酸。"}, {"id": "6-04", "lv": 1, "q": "硫酸 H₂SO₄ 0.10 mol を過不足なく中和するのに必要な水酸化ナトリウム NaOH の物質量として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["0.050 mol", "0.10 mol", "0.20 mol", "0.40 mol"], "ans": 2, "exp": "H₂SO₄は2価の酸。H⁺ 0.20 molを中和するのにNaOH 0.20 molが必要。"}, {"id": "6-05", "lv": 1, "q": "水溶液が酸性を示す塩を、次の①〜④のうちから一つ選べ。", "opts": ["NaCl", "CH₃COONa", "NH₄Cl", "NaHCO₃"], "ans": 2, "exp": "NH₄Clは強酸+弱塩基の塩で、NH₄⁺の加水分解により酸性。CH₃COONa・NaHCO₃は塩基性、NaClは中性。"}, {"id": "6-06", "lv": 1, "q": "強酸を弱塩基で滴定するとき、中和点の判定に用いる指示薬として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["ヨウ素デンプン", "BTB以外は使えない", "フェノールフタレイン", "メチルオレンジ"], "ans": 3, "exp": "中和点が酸性側に偏るため、変色域が酸性側にあるメチルオレンジが適する。"}, {"id": "6-07", "lv": 1, "q": "酢酸水溶液を水で薄めていくと、電離度はどうなるか。正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["大きくなる", "小さくなる", "変化しない", "0になる"], "ans": 0, "exp": "薄めるほど電離平衡が電離の方向へ移動し、電離度は大きくなる(オストワルトの希釈律)。"}, {"id": "6-08", "lv": 1, "q": "pH 2 の塩酸を水で10倍に薄めた水溶液のpHとして最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["1", "2", "3", "4"], "ans": 2, "exp": "[H⁺]が1/10になるのでpHは2→3へ1大きくなる。"}, {"id": "6-09", "lv": 2, "q": "0.050 mol/L のシュウ酸 (COOH)₂ 水溶液 10.0 mL を中和するのに、水酸化ナトリウム水溶液 20.0 mL を要した。この水酸化ナトリウム水溶液の濃度として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["0.025 mol/L", "0.050 mol/L", "0.075 mol/L", "0.10 mol/L"], "ans": 1, "exp": "シュウ酸は2価。2×0.050×10.0=1×c×20.0 より c=0.050 mol/L。"}, {"id": "6-10", "lv": 2, "q": "発生したアンモニアを 0.50 mol/L の硫酸 20.0 mL に完全に吸収させ、残った硫酸を 0.50 mol/L の水酸化ナトリウム水溶液で中和したところ 16.0 mL を要した。吸収されたアンモニアの物質量として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["4.0×10⁻³ mol", "8.0×10⁻³ mol", "1.2×10⁻² mol", "2.0×10⁻² mol"], "ans": 2, "exp": "H⁺総量=2×0.50×0.020=0.020 mol。NaOHが中和した分=0.50×0.016=0.0080 mol。NH₃=0.020−0.0080=0.012 mol。"}, {"id": "6-11", "lv": 2, "q": "0.10 mol/L の酢酸水溶液(電離度 0.010)のpHとして最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["1", "2", "3", "5"], "ans": 2, "exp": "[H⁺]=0.10×0.010=1.0×10⁻³ mol/L。pH=3。"}, {"id": "6-12", "lv": 2, "q": "弱酸を強塩基で滴定するときの中和点と指示薬について正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["中和点は中性で、どちらの指示薬でもよい", "中和点は塩基性側にあり、メチルオレンジを用いる", "中和点は酸性側にあり、メチルオレンジを用いる", "中和点は塩基性側にあり、フェノールフタレインを用いる"], "ans": 3, "exp": "生成する塩(弱酸+強塩基)の加水分解で中和点は塩基性側。変色域が塩基性側のフェノールフタレインを使う。"}, {"id": "6-13", "lv": 2, "q": "中和滴定に用いる器具のうち、純水でぬれたまま使用してよいものの組合せとして正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["ホールピペットとメスフラスコ", "ビュレットとコニカルビーカー", "ホールピペットとビュレット", "メスフラスコとコニカルビーカー"], "ans": 3, "exp": "メスフラスコ(後で水を加える)とコニカルビーカー(溶質の物質量が変わらない)は水ぬれ可。ホールピペット・ビュレットは共洗いする。"}, {"id": "6-14", "lv": 2, "q": "0.10 mol/L の水酸化カルシウム Ca(OH)₂ 水溶液 10.0 mL を中和するのに必要な 0.20 mol/L 塩酸の体積として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["5.0 mL", "10.0 mL", "20.0 mL", "40.0 mL"], "ans": 1, "exp": "OH⁻=2×0.10×10.0/1000=2.0×10⁻³ mol。0.20×V=2.0×10⁻³ より V=10.0 mL。"}, {"id": "6-15", "lv": 2, "q": "0.10 mol/L 塩酸 100 mL と 0.10 mol/L 水酸化ナトリウム水溶液 80 mL を混合した水溶液のpHとして最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["約1", "約2", "約7", "約12"], "ans": 1, "exp": "残るH⁺=0.010−0.0080=0.0020 mol。全体積180 mLより[H⁺]≒1.1×10⁻² mol/L でpH≒2。"}, {"id": "6-16", "lv": 3, "q": "食酢 10.0 mL をメスフラスコで正確に10倍に薄め、その 10.0 mL を 0.10 mol/L 水酸化ナトリウム水溶液で滴定したところ 7.2 mL を要した。もとの食酢中の酢酸のモル濃度として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["0.072 mol/L", "0.36 mol/L", "0.72 mol/L", "7.2 mol/L"], "ans": 2, "exp": "薄めた酢酸の濃度c:c×10.0=0.10×7.2 より c=0.072 mol/L。原液はその10倍で0.72 mol/L。"}, {"id": "6-17", "lv": 3, "q": "NaOHとNa₂CO₃の混合水溶液を塩酸で滴定すると、フェノールフタレインの変色(第1中和点)までに a mL、続いてメチルオレンジの変色(第2中和点)までにさらに b mL を要した。Na₂CO₃の物質量に比例する量として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["a+b", "a−b", "a", "b"], "ans": 3, "exp": "第1中和点まででNaOH全部とNa₂CO₃→NaHCO₃が進み、第2区間はNaHCO₃→CO₂のみ。bがNa₂CO₃の物質量に対応する。"}, {"id": "6-18", "lv": 3, "q": "0.050 mol/L の水酸化バリウム Ba(OH)₂ 水溶液のpHとして最も適当な数値を、次の①〜④のうちから一つ選べ。水のイオン積を 1.0×10⁻¹⁴ (mol/L)² とし、完全に電離するものとする。", "opts": ["1", "7", "12", "13"], "ans": 3, "exp": "[OH⁻]=2×0.050=0.10 mol/L。[H⁺]=10⁻¹⁴/0.10=1.0×10⁻¹³ mol/L でpH=13。"}, {"id": "6-19", "lv": 3, "q": "酢酸ナトリウム水溶液が塩基性を示す理由として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["CH₃COO⁻が電離してH⁺を放出するから", "酢酸ナトリウムが水に溶けにくいから", "Na⁺が水と反応してNaOHを生じるから", "CH₃COO⁻の一部が水からH⁺を受け取り、OH⁻が生じるから"], "ans": 3, "exp": "CH₃COO⁻+H₂O⇌CH₃COOH+OH⁻の加水分解によりOH⁻が増えて塩基性になる。"}, {"id": "6-20", "lv": 3, "q": "酢酸水溶液を水で薄めたときの変化に関する次の記述 a〜c の正誤の組合せとして正しいものを、次の①〜④のうちから一つ選べ。\na 電離度は大きくなる。\nb 水素イオン濃度[H⁺]は小さくなる。\nc pHは小さくなる。", "opts": ["a:正 b:正 c:誤", "a:正 b:誤 c:正", "a:誤 b:正 c:正", "a:正 b:正 c:正"], "ans": 0, "exp": "希釈で電離度は増すが、濃度低下の効果が上回り[H⁺]は減少、pHは大きくなる(7に近づく)。cのみ誤り。"}, {"id": "6-21", "lv": 3, "q": "標準状態で 1.12 L のアンモニアを、0.25 mol/L の硫酸 200 mL に完全に吸収させた。残った硫酸を中和するのに必要な 0.50 mol/L 水酸化ナトリウム水溶液の体積として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["50 mL", "100 mL", "150 mL", "200 mL"], "ans": 1, "exp": "H⁺=2×0.25×0.200=0.10 mol。NH₃=1.12/22.4=0.050 mol。残り0.050 molの中和に0.050/0.50=0.10 L=100 mL。気体計算と逆滴定の複合。"}, {"id": "6-22", "lv": 3, "q": "0.20 mol/L の塩酸 100 mL と 0.20 mol/L の水酸化ナトリウム水溶液 300 mL を混合した水溶液のpHとして最も適当な数値を、次の①〜④のうちから一つ選べ。水のイオン積 1.0×10⁻¹⁴ (mol/L)² とする。", "opts": ["1", "7", "12", "13"], "ans": 3, "exp": "OH⁻の過剰分=0.060−0.020=0.040 mol。全体積400 mLより[OH⁻]=0.10 mol/L。[H⁺]=10⁻¹³でpH=13。中和の過不足+イオン積の複合。"}, {"id": "6-23", "lv": 3, "svg": "<svg viewBox='0 0 380 250' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif' font-size='11'><line x1='40' y1='210' x2='365' y2='210' stroke='#5b6b85' stroke-width='1.5'/><line x1='40' y1='210' x2='40' y2='15' stroke='#5b6b85' stroke-width='1.5'/><text x='90' y='240' fill='#5b6b85'>滴下した水酸化ナトリウム水溶液 [mL]</text><text x='8' y='12' fill='#5b6b85'>pH</text><text x='24' y='178' fill='#5b6b85'>3</text><text x='24' y='105' fill='#5b6b85'>7</text><text x='20' y='45' fill='#5b6b85'>12</text><path d='M40,174 Q120,160 180,140 Q205,130 210,110 L214,60 Q225,42 300,35 L360,33' fill='none' stroke='#4f7cff' stroke-width='2.5'/><line x1='212' y1='210' x2='212' y2='60' stroke='#999' stroke-dasharray='5 4'/><text x='202' y='226' fill='#2b3a55' font-weight='bold'>10</text></svg>", "q": "図はある酸を水酸化ナトリウム水溶液で滴定したときの滴定曲線である。滴定の組合せと、中和点の判定に適した指示薬として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["強酸と強塩基・どちらの指示薬でもよい", "弱酸と強塩基・フェノールフタレイン", "弱酸と強塩基・メチルオレンジ", "強酸と弱塩基・メチルオレンジ"], "ans": 1, "exp": "始点がpH3付近(弱酸)で、pHジャンプが塩基性側(約7〜11)に偏っている。変色域(8.0〜9.8)がジャンプ内に入るフェノールフタレインを使う。"}, {"id": "6-24", "lv": 3, "svg": "<svg viewBox='0 0 380 250' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif' font-size='11'><line x1='40' y1='210' x2='365' y2='210' stroke='#5b6b85' stroke-width='1.5'/><line x1='40' y1='210' x2='40' y2='15' stroke='#5b6b85' stroke-width='1.5'/><text x='110' y='240' fill='#5b6b85'>滴下した塩酸 [mL]</text><text x='8' y='12' fill='#5b6b85'>pH</text><path d='M40,45 Q90,55 130,70 L148,95 Q160,110 200,120 L258,140 L268,175 Q290,192 350,198' fill='none' stroke='#4f7cff' stroke-width='2.5'/><line x1='146' y1='210' x2='146' y2='85' stroke='#999' stroke-dasharray='5 4'/><line x1='264' y1='210' x2='264' y2='155' stroke='#999' stroke-dasharray='5 4'/><text x='134' y='226' fill='#2b3a55' font-weight='bold'>10.0</text><text x='252' y='226' fill='#2b3a55' font-weight='bold'>20.0</text><text x='108' y='78' fill='#2b3a55'>第1中和点</text><text x='226' y='132' fill='#2b3a55'>第2中和点</text></svg>", "q": "炭酸ナトリウム水溶液を 0.10 mol/L の塩酸で滴定すると、図のように2段階の中和が起こり、第1中和点は 10.0 mL であった。この水溶液に含まれていた炭酸ナトリウムの物質量として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["1.0×10⁻³ mol", "2.0×10⁻³ mol", "5.0×10⁻⁴ mol", "1.0×10⁻² mol"], "ans": 0, "exp": "第1段階はNa₂CO₃+HCl→NaHCO₃+NaClで1:1。0.10×10.0/1000=1.0×10⁻³ mol。第2中和点までの区間(10.0 mL)も同量になることも確認できる。"}, {"id": "6-25", "lv": 2, "type": "num", "q": "0.10 mol/L の酢酸水溶液の電離度が 0.015 のとき、水素イオン濃度は何 mol/L か。有効数字2桁で次の形式で表すとき、ア〜ウに当てはまる数字を選べ。", "numFmt": "ア.イ×10⁻ウ mol/L", "slots": ["ア", "イ", "ウ"], "ansD": ["1", "5", "3"], "exp": "[H⁺]=cα=0.10×0.015=1.5×10⁻³ mol/L。"}, {"id": "6-26", "lv": 3, "svg": "<svg viewBox='0 0 380 200' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif' font-size='11'><text x='14' y='22' fill='#5b6b85' font-weight='bold'>表 食酢の中和滴定(3回の測定)</text><line x1='14' y1='32' x2='366' y2='32' stroke='#5b6b85'/><text x='30' y='52' fill='#2b3a55'>回</text><text x='110' y='52' fill='#2b3a55'>滴下量 [mL]</text><text x='250' y='52' fill='#2b3a55'>備考</text><line x1='14' y1='60' x2='366' y2='60' stroke='#e3e9f4'/><text x='36' y='80' fill='#2b3a55'>1</text><text x='130' y='80' fill='#4f7cff'>7.85</text><text x='236' y='80' fill='#7a8aa5'>—</text><text x='36' y='104' fill='#2b3a55'>2</text><text x='130' y='104' fill='#4f7cff'>7.83</text><text x='236' y='104' fill='#7a8aa5'>—</text><text x='36' y='128' fill='#2b3a55'>3</text><text x='130' y='128' fill='#ef5b7b'>9.20</text><text x='214' y='128' fill='#ef5b7b'>終点を見落とした</text><line x1='14' y1='140' x2='366' y2='140' stroke='#5b6b85'/><text x='14' y='166' fill='#7a8aa5'>0.10 mol/L NaOH 水溶液を用い、10.0 mL の</text><text x='14' y='184' fill='#7a8aa5'>希釈した食酢を滴定した</text></svg>", "q": "表は同じ試料に対する3回の滴定結果である。滴下量の代表値の求め方として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["終点を見落とした3回目を除き、1・2回目の平均 7.84 mL を用いる", "3回すべての平均 8.29 mL を用いる", "最も大きい 9.20 mL を用いる", "最も小さい 7.83 mL のみを用いる"], "ans": 0, "exp": "操作上の失敗が明らかな測定値は除外し、残りの測定値を平均する。単純に全平均をとると系統的に大きくずれる。"}], "hot": false}, {"unit": 7, "name": "酸化還元反応", "emoji": "🔄", "questions": [{"id": "7-01", "lv": 1, "q": "過マンガン酸カリウム KMnO₄ 中のマンガン原子の酸化数として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["+2", "+4", "+6", "+7"], "ans": 3, "exp": "K:+1、O:−2×4=−8。+1+x−8=0 より x=+7。"}, {"id": "7-02", "lv": 1, "q": "反応 Cu + Cl₂ → CuCl₂ における銅について正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["酸化された", "還元された", "酸化も還元もされていない", "塩素に電子を与えられた"], "ans": 0, "exp": "Cuの酸化数は0→+2に増加しており、電子を失って酸化された。"}, {"id": "7-03", "lv": 1, "q": "酸化剤のはたらきとして正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["相手に水素を与える", "自らの酸化数が増加する", "相手に電子を与え、自らは酸化される", "相手から電子を奪い、自らは還元される"], "ans": 3, "exp": "酸化剤は相手を酸化する物質で、自身は電子を受け取って還元される(酸化数減少)。"}, {"id": "7-04", "lv": 1, "q": "過酸化水素 H₂O₂ について正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["常に酸化剤としてのみはたらく", "常に還元剤としてのみはたらく", "相手により酸化剤にも還元剤にもなる", "酸化還元反応には関与しない"], "ans": 2, "exp": "H₂O₂は通常は酸化剤だが、KMnO₄のような強い酸化剤に対しては還元剤としてはたらきO₂を発生する。"}, {"id": "7-05", "lv": 1, "q": "亜鉛板を硫酸銅(Ⅱ)水溶液に浸したときに起こる変化として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["亜鉛板に銅が析出する", "亜鉛板が厚くなる", "水溶液の青色が濃くなる", "何も変化しない"], "ans": 0, "exp": "イオン化傾向 Zn>Cu より Zn+Cu²⁺→Zn²⁺+Cu が起こり、銅が析出し青色は薄くなる。"}, {"id": "7-06", "lv": 1, "q": "二酸化硫黄 SO₂ 中の硫黄原子の酸化数として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["+2", "+4", "+6", "−2"], "ans": 1, "exp": "O:−2×2=−4。x−4=0 より x=+4。"}, {"id": "7-07", "lv": 1, "q": "銅は塩酸には溶けないが硝酸には溶ける。この理由として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["銅は硝酸イオンと錯イオンをつくるから", "塩酸中の塩化物イオンが銅を保護するから", "硝酸は塩酸より強い酸だから", "硝酸には強い酸化作用があるから"], "ans": 3, "exp": "Cuは水素よりイオン化傾向が小さくH⁺では溶けないが、酸化力のある硝酸・熱濃硫酸には溶ける。"}, {"id": "7-08", "lv": 1, "q": "酸化還元反応でないものを、次の①〜④のうちから一つ選べ。", "opts": ["2H₂ + O₂ → 2H₂O", "Zn + 2HCl → ZnCl₂ + H₂", "NaOH + HCl → NaCl + H₂O", "2Na + Cl₂ → 2NaCl"], "ans": 2, "exp": "中和反応では各原子の酸化数が変化しないので酸化還元反応ではない。"}, {"id": "7-09", "lv": 2, "q": "硫酸酸性の 0.020 mol/L 過マンガン酸カリウム水溶液 20.0 mL と過不足なく反応する過酸化水素の物質量として最も適当な数値を、次の①〜④のうちから一つ選べ。MnO₄⁻は5電子、H₂O₂は2電子の授受を行う。", "opts": ["4.0×10⁻⁴ mol", "1.0×10⁻³ mol", "2.0×10⁻³ mol", "5.0×10⁻³ mol"], "ans": 1, "exp": "e⁻の物質量=0.020×0.0200×5=2.0×10⁻³ mol。H₂O₂=2.0×10⁻³/2=1.0×10⁻³ mol。"}, {"id": "7-10", "lv": 2, "q": "二酸化硫黄 SO₂ が還元剤としてではなく、酸化剤としてはたらく反応を、次の①〜④のうちから一つ選べ。", "opts": ["SO₂ + I₂ + 2H₂O → H₂SO₄ + 2HI", "SO₂ + 2H₂S → 3S + 2H₂O", "5SO₂ + 2KMnO₄ + 2H₂O → K₂SO₄ + 2MnSO₄ + 2H₂SO₄", "SO₂ + H₂O → H₂SO₃"], "ans": 1, "exp": "H₂S(Sの酸化数−2)に対してはSO₂(+4)が酸化剤となり、どちらも単体のS(0)になる。"}, {"id": "7-11", "lv": 2, "q": "硫酸酸性でのMnO₄⁻の反応 MnO₄⁻ + 8H⁺ + 5e⁻ → Mn²⁺ + 4H₂O におけるマンガンの酸化数変化として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["+7 → +2", "+7 → +4", "+6 → +2", "+4 → +2"], "ans": 0, "exp": "MnO₄⁻中のMnは+7で、Mn²⁺の+2へ5減少する(受け取る電子5個に対応)。"}, {"id": "7-12", "lv": 2, "q": "常温の水と激しく反応して水素を発生する金属を、次の①〜④のうちから一つ選べ。", "opts": ["マグネシウム", "亜鉛", "ナトリウム", "鉄"], "ans": 2, "exp": "イオン化傾向の大きいLi・K・Ca・Naは常温の水と反応する。Mgは熱水、Zn・Feは高温の水蒸気と反応する。"}, {"id": "7-13", "lv": 2, "q": "鉄やアルミニウムを濃硝酸に入れても溶けない理由として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["濃硝酸には酸化力がないから", "水素過電圧が大きいから", "イオン化傾向が水素より小さいから", "表面にち密な酸化被膜ができる(不動態)から"], "ans": 3, "exp": "Fe・Al・Niは濃硝酸中で表面にち密な酸化被膜を形成し(不動態)、内部が保護される。"}, {"id": "7-14", "lv": 2, "q": "鉄板に亜鉛をめっきしたトタンについて正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["亜鉛はイオン化傾向が鉄より小さい", "スズをめっきしたブリキより傷に弱い", "傷がつくと亜鉛より先に鉄が溶け出す", "傷がついても亜鉛が先に酸化されるため鉄がさびにくい"], "ans": 3, "exp": "イオン化傾向 Zn>Fe のため、傷がついてもZnが先に酸化されFeを守る。ブリキ(Sn)は傷つくとFeが先にさびる。"}, {"id": "7-15", "lv": 2, "q": "銅と希硝酸の反応 3Cu + 8HNO₃ → 3Cu(NO₃)₂ + 4H₂O + 2X における気体Xとして正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["N₂", "H₂", "NO₂", "NO"], "ans": 3, "exp": "希硝酸では無色のNOが発生する。濃硝酸なら赤褐色のNO₂。"}, {"id": "7-16", "lv": 3, "q": "濃度不明の過マンガン酸カリウム水溶液の濃度を求めるため、硫酸酸性で 0.0500 mol/L シュウ酸水溶液 10.0 mL を滴定したところ 8.00 mL を要した。KMnO₄水溶液の濃度として最も適当な数値を、次の①〜④のうちから一つ選べ。MnO₄⁻は5電子を受け取り、(COOH)₂は2電子を放出する。", "opts": ["0.0125 mol/L", "0.0250 mol/L", "0.0500 mol/L", "0.100 mol/L"], "ans": 1, "exp": "e⁻=0.0500×0.0100×2=1.00×10⁻³ mol。c×0.00800×5=1.00×10⁻³ より c=0.0250 mol/L。"}, {"id": "7-17", "lv": 3, "q": "ヨウ素 I₂ をチオ硫酸ナトリウム水溶液で滴定した。I₂ + 2Na₂S₂O₃ → 2NaI + Na₂S₄O₆ の反応で、0.10 mol/L チオ硫酸ナトリウム水溶液 16.0 mL を要したとき、ヨウ素の物質量として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["4.0×10⁻⁴ mol", "8.0×10⁻⁴ mol", "1.6×10⁻³ mol", "3.2×10⁻³ mol"], "ans": 1, "exp": "Na₂S₂O₃=0.10×0.0160=1.6×10⁻³ mol。I₂はその1/2で8.0×10⁻⁴ mol。"}, {"id": "7-18", "lv": 3, "q": "臭化カリウム水溶液に塩素水を加えると溶液が褐色になり、ヨウ化カリウム水溶液に臭素水を加えると褐色になった。ハロゲン単体の酸化力の強い順として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["Cl₂ > Br₂ > I₂", "I₂ > Br₂ > Cl₂", "Br₂ > Cl₂ > I₂", "Cl₂ > I₂ > Br₂"], "ans": 0, "exp": "Cl₂はBr⁻を酸化してBr₂を遊離、Br₂はI⁻を酸化してI₂を遊離。よって酸化力はCl₂>Br₂>I₂。"}, {"id": "7-19", "lv": 3, "q": "金属A〜Cについて次の結果を得た。\n・Aのイオンを含む水溶液にBを入れるとAが析出した。\n・Bのイオンを含む水溶液にCを入れるとBが析出した。\nイオン化傾向の大きい順として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["B > C > A", "A > C > B", "A > B > C", "C > B > A"], "ans": 3, "exp": "BがAを析出させる→B>A。CがBを析出させる→C>B。よってC>B>A。"}, {"id": "7-20", "lv": 3, "q": "Sn²⁺ 0.10 mol をすべて Sn⁴⁺ に酸化するのに必要な 0.10 mol/L 過マンガン酸カリウム水溶液(硫酸酸性)の体積として最も適当な数値を、次の①〜④のうちから一つ選べ。MnO₄⁻は5電子を受け取る。", "opts": ["100 mL", "200 mL", "400 mL", "500 mL"], "ans": 2, "exp": "放出されるe⁻=0.10×2=0.20 mol。KMnO₄=0.20/5=0.040 mol。0.040/0.10=0.40 L=400 mL。"}, {"id": "7-21", "lv": 3, "q": "シュウ酸二水和物 (COOH)₂・2H₂O(式量126)x g を水に溶かして 100 mL とし、その 10.0 mL を硫酸酸性で 0.020 mol/L 過マンガン酸カリウム水溶液で滴定したところ 8.0 mL を要した。x として最も適当な数値を、次の①〜④のうちから一つ選べ。MnO₄⁻は5電子を受け取り、(COOH)₂は2電子を放出する。", "opts": ["0.25 g", "0.50 g", "1.0 g", "5.0 g"], "ans": 1, "exp": "e⁻=0.020×0.0080×5=8.0×10⁻⁴ mol。シュウ酸は10 mL中4.0×10⁻⁴ mol、全体で4.0×10⁻³ mol。x=4.0×10⁻³×126≒0.50 g。滴定+希釈+式量の3段階。"}, {"id": "7-22", "lv": 3, "type": "num", "q": "硫酸酸性の過酸化水素水を 0.020 mol/L 過マンガン酸カリウム水溶液で滴定したところ、12.0 mL を要した。反応した過酸化水素の物質量は何 mol か。有効数字2桁で次の形式で表すとき、ア〜ウに当てはまる数字を選べ。MnO₄⁻は5電子を受け取り、H₂O₂は2電子を放出する。", "numFmt": "ア.イ×10⁻ウ mol", "slots": ["ア", "イ", "ウ"], "ansD": ["6", "0", "4"], "exp": "e⁻=0.020×0.0120×5=1.2×10⁻³ mol。H₂O₂=1.2×10⁻³/2=6.0×10⁻⁴ mol。"}, {"id": "7-23", "lv": 3, "type": "multi", "pick": 2, "q": "酸化還元に関する次の記述のうち、誤りを含むものを、次の①〜⑥のうちから二つ選べ。ただし、解答の順序は問わない。", "opts": ["酸化剤は相手を酸化し、自身は還元される", "単体中の原子の酸化数は0である", "酸化剤としてはたらいた物質の酸化数は増加する", "過酸化水素は相手により還元剤としてもはたらく", "化合物中の水素原子の酸化数は、原則として−1である", "中和反応では原子の酸化数は変化しない"], "ans": [2, 4], "exp": "③酸化剤は電子を受け取るので酸化数は減少する。⑤化合物中のHは原則+1(金属水素化物のみ−1)。他は正しい。"}, {"id": "7-24", "lv": 2, "q": "硫酸酸性で過マンガン酸カリウム水溶液を用いる滴定に関する記述として誤りを含むものを、次の①〜④のうちから一つ選べ。", "opts": ["酸性にするために塩酸を用いるとよい", "終点は加えた赤紫色が消えなくなった点とする", "過マンガン酸カリウム水溶液はビュレットに入れる", "水溶液が濃い色のため液面は上端(上のふち)を読む"], "ans": 0, "exp": "塩酸を用いるとCl⁻がMnO₄⁻に酸化されてCl₂が発生し、正しく定量できない。硫酸を用いる。"}], "hot": false}, {"unit": 8, "name": "電池と電気分解", "emoji": "🔋", "questions": [{"id": "8-01", "lv": 1, "q": "ダニエル電池の負極で起こる反応として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["Zn → Zn²⁺ + 2e⁻", "Cu → Cu²⁺ + 2e⁻", "Cu²⁺ + 2e⁻ → Cu", "Zn²⁺ + 2e⁻ → Zn"], "ans": 0, "exp": "イオン化傾向の大きいZnが負極で酸化され溶け出す。正極ではCu²⁺+2e⁻→Cu。"}, {"id": "8-02", "lv": 1, "q": "電池の負極で起こる反応の種類として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["中和反応", "加水分解反応", "還元反応", "酸化反応"], "ans": 3, "exp": "負極では電子を放出する酸化反応、正極では電子を受け取る還元反応が起こる。"}, {"id": "8-03", "lv": 1, "q": "鉛蓄電池について正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["放電すると両極とも硫酸鉛(Ⅱ)PbSO₄になる", "放電すると電解液の硫酸の濃度が大きくなる", "充電できない一次電池である", "負極活物質はPbO₂である"], "ans": 0, "exp": "放電で負極Pb、正極PbO₂がいずれもPbSO₄になり、硫酸は消費され濃度は下がる。充電可能な二次電池。"}, {"id": "8-04", "lv": 1, "q": "水素と酸素を用いる燃料電池の放電で生成する物質として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["水", "過酸化水素", "オゾン", "水酸化ナトリウム"], "ans": 0, "exp": "全体の反応は 2H₂+O₂→2H₂O。生成物が水だけでクリーンな電池。"}, {"id": "8-05", "lv": 1, "q": "充電して繰り返し使える二次電池を、次の①〜④のうちから一つ選べ。", "opts": ["マンガン乾電池", "アルカリマンガン乾電池", "リチウムイオン電池", "ダニエル電池"], "ans": 2, "exp": "リチウムイオン電池は代表的な二次電池で、スマートフォンなどに使われる。"}, {"id": "8-06", "lv": 1, "q": "電気分解において陰極で起こる反応の種類として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["中和反応", "脱水反応", "酸化反応", "還元反応"], "ans": 3, "exp": "陰極は電源の負極につながれ、電子を受け取る還元反応が起こる。"}, {"id": "8-07", "lv": 1, "q": "塩化ナトリウム水溶液を炭素電極で電気分解したとき、陽極と陰極で発生する気体の組合せとして正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["陽極:H₂ 陰極:Cl₂", "陽極:Cl₂ 陰極:O₂", "陽極:O₂ 陰極:H₂", "陽極:Cl₂ 陰極:H₂"], "ans": 3, "exp": "陽極ではCl⁻が酸化されてCl₂、陰極では水が還元されてH₂が発生する(Na⁺は析出しない)。"}, {"id": "8-08", "lv": 1, "q": "ファラデー定数 9.65×10⁴ C/mol が表すものとして正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["電子 1 個がもつ電気量", "電子 1 mol がもつ電気量の大きさ", "1 A の電流が 1 秒間に運ぶ電気量", "気体 1 mol の体積"], "ans": 1, "exp": "ファラデー定数は電子1 mol分の電気量の大きさ。電気量(C)=電流(A)×時間(s)。"}, {"id": "8-09", "lv": 2, "q": "5.0 A の電流を 1930 秒間流したときに流れる電子の物質量として最も適当な数値を、次の①〜④のうちから一つ選べ。ファラデー定数 9.65×10⁴ C/mol とする。", "opts": ["0.010 mol", "0.050 mol", "0.10 mol", "0.50 mol"], "ans": 2, "exp": "Q=5.0×1930=9650 C。9650/9.65×10⁴=0.10 mol。"}, {"id": "8-10", "lv": 2, "q": "硫酸銅(Ⅱ)水溶液を白金電極で電気分解し、電子 0.10 mol 分の電気量を流した。陰極に析出する銅の質量として最も適当な数値を、次の①〜④のうちから一つ選べ。Cu=64 とする。", "opts": ["1.6 g", "3.2 g", "6.4 g", "13 g"], "ans": 1, "exp": "Cu²⁺+2e⁻→Cu より Cu=0.10/2=0.050 mol。0.050×64=3.2 g。"}, {"id": "8-11", "lv": 2, "q": "希硫酸を白金電極で電気分解し、電子 0.10 mol 分の電気量を流した。陽極で発生する酸素の体積は標準状態で何 L か。最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["0.56 L", "1.1 L", "2.2 L", "5.6 L"], "ans": 0, "exp": "2H₂O→O₂+4H⁺+4e⁻ より O₂=0.10/4=0.025 mol。0.025×22.4=0.56 L。"}, {"id": "8-12", "lv": 2, "q": "鉛蓄電池を放電させ、電子 0.10 mol 分の電気量を取り出した。負極の質量変化として最も適当な数値を、次の①〜④のうちから一つ選べ。SO₄=96 とする。", "opts": ["4.8 g減少する", "4.8 g増加する", "9.6 g増加する", "変化しない"], "ans": 1, "exp": "負極 Pb+SO₄²⁻→PbSO₄+2e⁻。e⁻ 2 molあたりSO₄(96 g)が付く。0.10 molでは96×0.10/2=4.8 g増加。"}, {"id": "8-13", "lv": 2, "q": "ダニエル電池の素焼き板の役割として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["電子を通過させる", "2つの水溶液の混合を防ぎつつイオンを移動させる", "亜鉛イオンの移動を完全に防ぐ", "水溶液を完全に絶縁する"], "ans": 1, "exp": "素焼き板は溶液が急に混ざるのを防ぎながら、イオンを通して電気的中性を保つ。"}, {"id": "8-14", "lv": 2, "q": "硫酸銅(Ⅱ)水溶液を、粗銅を陽極、純銅を陰極として電気分解する銅の電解精錬について正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["陰極では水素が発生する", "銅よりイオン化傾向の大きい不純物も陽極泥になる", "陽極では酸素が発生する", "銅よりイオン化傾向の小さい銀や金は陽極泥として沈殿する"], "ans": 3, "exp": "陽極では粗銅が溶解し、Ag・Auなどイオン化傾向の小さい金属は溶けずに陽極泥となる。"}, {"id": "8-15", "lv": 2, "q": "アルミニウムの製錬が水溶液の電気分解ではなく、溶融塩電解(融解塩電解)で行われる理由として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["水溶液中ではAl³⁺の代わりに水が還元されて水素が発生してしまうから", "Al³⁺が水に溶けないから", "融解した方が電気を通しにくいから", "水溶液ではAlがすぐに酸化されるから"], "ans": 0, "exp": "イオン化傾向の大きいAlは水溶液からは析出せず、H₂が発生する。そのため氷晶石を用いた溶融塩電解を行う。"}, {"id": "8-16", "lv": 3, "q": "硫酸銅(Ⅱ)水溶液と硝酸銀水溶液の電解槽を直列につないで電気分解したところ、銅が 0.64 g 析出した。同時に析出する銀の質量として最も適当な数値を、次の①〜④のうちから一つ選べ。Cu=64、Ag=108 とする。", "opts": ["1.1 g", "2.2 g", "4.3 g", "0.54 g"], "ans": 1, "exp": "Cu 0.010 molの析出にe⁻ 0.020 mol。直列なので同じ電気量が流れ、Ag⁺+e⁻→Ag より Ag=0.020 mol=2.16≒2.2 g。"}, {"id": "8-17", "lv": 3, "q": "硫酸銅(Ⅱ)水溶液を 0.50 A の電流で電気分解して銅 0.32 g を析出させるのに必要な時間として最も適当な数値を、次の①〜④のうちから一つ選べ。Cu=64、ファラデー定数 9.65×10⁴ C/mol とする。", "opts": ["965 秒", "1930 秒", "3860 秒", "9650 秒"], "ans": 1, "exp": "Cu=0.0050 mol、e⁻=0.010 mol、Q=965 C。t=965/0.50=1930 秒(約32分)。"}, {"id": "8-18", "lv": 3, "q": "水素-酸素燃料電池で水素 1.0 mol が消費されたとき、外部回路に流れる電気量として最も適当な数値を、次の①〜④のうちから一つ選べ。ファラデー定数 9.65×10⁴ C/mol とする。", "opts": ["9.65×10⁴ C", "1.93×10⁵ C", "3.86×10⁵ C", "4.83×10⁴ C"], "ans": 1, "exp": "負極 H₂→2H⁺+2e⁻ より H₂ 1.0 molでe⁻ 2.0 mol。9.65×10⁴×2.0=1.93×10⁵ C。"}, {"id": "8-19", "lv": 3, "q": "イオン交換膜法による水酸化ナトリウムの製造では、陽極側に塩化ナトリウム水溶液、陰極側に水を入れ、陽イオン交換膜で仕切って電気分解する。陰極側で水酸化ナトリウムが濃縮される仕組みとして最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["陰極側でOH⁻が生成し、陽極側からNa⁺が膜を通って移動してくるから", "陰極側でNa⁺が生成し、陽極側からOH⁻が移動してくるから", "膜がNaOHだけを選択的に通すから", "陰極側でCl⁻が酸化されるから"], "ans": 0, "exp": "陰極で2H₂O+2e⁻→H₂+2OH⁻。陽イオン交換膜はNa⁺のみを通すので、陰極側にNaOHが濃縮される。"}, {"id": "8-20", "lv": 3, "q": "金属A、B、Cと、それらのイオンを含む水溶液で電池をつくった。AとBの組合せではAが負極、BとCの組合せではBが負極になり、起電力はAとCの組合せが最も大きかった。イオン化傾向の大きい順として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["A > C > B", "C > A > B", "A > B > C", "B > A > C"], "ans": 2, "exp": "負極になるのはイオン化傾向の大きい方。A>B、B>Cより A>B>C。イオン化傾向の差が最大のA-C間で起電力最大となり、矛盾しない。"}, {"id": "8-21", "lv": 1, "q": "マンガン乾電池の負極活物質と正極活物質の組合せとして正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["負極:酸化マンガン(Ⅳ) 正極:亜鉛", "負極:鉛 正極:二酸化鉛", "負極:水素 正極:酸素", "負極:亜鉛 正極:酸化マンガン(Ⅳ)"], "ans": 3, "exp": "マンガン乾電池はZnが負極、MnO₂が正極活物質。電解液は塩化亜鉛などを含む。"}, {"id": "8-22", "lv": 1, "q": "2種類の金属を電極として電池をつくるとき、起電力が大きくなる条件として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["イオン化傾向の差が大きい金属を組み合わせる", "イオン化傾向の差が小さい金属を組み合わせる", "同じ金属を2枚使う", "密度の差が大きい金属を組み合わせる"], "ans": 0, "exp": "イオン化傾向の差が大きいほど電子を押し出す力の差が大きく、起電力が大きくなる。"}, {"id": "8-23", "lv": 1, "q": "次の電池のうち、二次電池でないものを、次の①〜④のうちから一つ選べ。", "opts": ["鉛蓄電池", "リチウムイオン電池", "ニッケル水素電池", "マンガン乾電池"], "ans": 3, "exp": "マンガン乾電池は充電できない一次電池。他は充電して繰り返し使える二次電池。"}, {"id": "8-24", "lv": 1, "q": "スプーンに銀めっきをするとき、電気分解の電極とめっきする製品の配置として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["製品(スプーン)を陽極、銀板を陰極にする", "両方とも陽極にする", "電極はどちらでもよい", "製品(スプーン)を陰極、銀板を陽極にする"], "ans": 3, "exp": "めっきしたい製品を陰極にするとAg⁺+e⁻→Agで銀が析出する。陽極の銀板は溶けて銀を補給する。"}, {"id": "8-25", "lv": 2, "q": "塩化銅(Ⅱ)水溶液を炭素電極で電気分解したとき、陰極と陽極で起こる変化の組合せとして正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["陰極:塩素が発生 陽極:銅が析出", "陰極:銅が析出 陽極:酸素が発生", "陰極:銅が析出 陽極:塩素が発生", "陰極:水素が発生 陽極:酸素が発生"], "ans": 2, "exp": "陰極 Cu²⁺+2e⁻→Cu、陽極 2Cl⁻→Cl₂+2e⁻。Cuは水素よりイオン化傾向が小さいので析出する。"}, {"id": "8-26", "lv": 2, "q": "同じ電気量を流したとき、陰極に析出する金属の物質量が最も多いものを、次の①〜④のうちから一つ選べ。", "opts": ["硫酸銅(Ⅱ)水溶液(Cu²⁺)", "塩化金(Ⅲ)酸水溶液(Au³⁺)", "どれも同じ", "硝酸銀水溶液(Ag⁺)"], "ans": 3, "exp": "析出する物質量は(電子の物質量)/(イオンの価数)。1価のAg⁺が最も多く析出する。"}, {"id": "8-27", "lv": 2, "q": "リン酸形燃料電池の負極で起こる反応として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["H₂ → 2H⁺ + 2e⁻", "O₂ + 4H⁺ + 4e⁻ → 2H₂O", "H₂ + 2OH⁻ → 2H₂O + 2e⁻ 以外は起こらない", "Pb + SO₄²⁻ → PbSO₄ + 2e⁻"], "ans": 0, "exp": "負極では水素が酸化されてH⁺と電子を生じる。正極では酸素が還元されて水が生成する。"}, {"id": "8-28", "lv": 3, "q": "硫酸銅(Ⅱ)水溶液を 2.0 A の電流で 1930 秒間電気分解したとき、陰極に析出する銅の質量として最も適当な数値を、次の①〜④のうちから一つ選べ。Cu=64、ファラデー定数 9.65×10⁴ C/mol とする。", "opts": ["1.3 g", "2.6 g", "0.64 g", "5.1 g"], "ans": 0, "exp": "Q=2.0×1930=3860 C=0.040 mol e⁻。Cu=0.040/2=0.020 mol=1.28≒1.3 g。"}, {"id": "8-29", "lv": 3, "q": "希硫酸を白金電極で、5.0 A の電流で 1930 秒間電気分解した。両極で発生する気体の合計体積は標準状態で何 L か。最も適当な数値を、次の①〜④のうちから一つ選べ。ファラデー定数 9.65×10⁴ C/mol とする。", "opts": ["1.1 L", "1.7 L", "2.2 L", "3.4 L"], "ans": 1, "exp": "e⁻=5.0×1930/9.65×10⁴=0.10 mol。H₂=0.050 mol、O₂=0.025 mol、計0.075 mol。0.075×22.4=1.68≒1.7 L。両極同時の物質量計算。"}, {"id": "8-30", "lv": 3, "q": "0.50 mol/L の硫酸銅(Ⅱ)水溶液 200 mL を白金電極で電気分解し、電子 0.10 mol 分の電気量を流した。電気分解後の Cu²⁺ の濃度として最も適当な数値を、次の①〜④のうちから一つ選べ。水溶液の体積変化はないものとする。", "opts": ["0.10 mol/L", "0.25 mol/L", "0.40 mol/L", "0.50 mol/L"], "ans": 1, "exp": "はじめCu²⁺は0.10 mol。e⁻ 0.10 molでCu 0.050 molが析出し、残り0.050 mol。0.050/0.200=0.25 mol/L。析出量と濃度変化の複合。"}, {"id": "8-31", "lv": 3, "svg": "<svg viewBox='0 0 380 250' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif' font-size='11'><line x1='40' y1='210' x2='365' y2='210' stroke='#5b6b85' stroke-width='1.5'/><line x1='40' y1='210' x2='40' y2='15' stroke='#5b6b85' stroke-width='1.5'/><text x='130' y='240' fill='#5b6b85'>流した電気量 [C]</text><text x='8' y='12' fill='#5b6b85'>析出した金属の質量 [g]</text><line x1='40' y1='210' x2='340' y2='58' stroke='#4f7cff' stroke-width='2.5'/><line x1='40' y1='74' x2='308' y2='74' stroke='#999' stroke-dasharray='5 4'/><line x1='308' y1='74' x2='308' y2='210' stroke='#999' stroke-dasharray='5 4'/><text x='10' y='78' fill='#2b3a55' font-weight='bold'>3.2</text><text x='282' y='226' fill='#2b3a55' font-weight='bold'>9650</text></svg>", "q": "ある金属イオンを含む水溶液を電気分解したところ、陰極に析出した金属の質量は流した電気量に比例し、9650 C のとき 3.2 g であった。この金属イオンとして最も適当なものを、次の①〜④のうちから一つ選べ。Cu=64、Ag=108、Fe=56、Na=23、ファラデー定数 9.65×10⁴ C/mol とする。", "opts": ["Ag⁺", "Cu²⁺", "Fe³⁺", "Na⁺"], "ans": 1, "exp": "9650 C=0.10 mol e⁻で3.2 g。e⁻ 1 molあたり32 g=M/n。Cu²⁺なら64/2=32で一致する。グラフの傾きからM/nを求めるのがポイント。"}, {"id": "8-32", "lv": 2, "type": "num", "q": "0.20 A の電流を 965 秒間流したときに流れた電子の物質量は何 mol か。有効数字2桁で次の形式で表すとき、ア〜ウに当てはまる数字を選べ。ファラデー定数 9.65×10⁴ C/mol とする。", "numFmt": "ア.イ×10⁻ウ mol", "slots": ["ア", "イ", "ウ"], "ansD": ["2", "0", "3"], "exp": "Q=0.20×965=193 C。193/9.65×10⁴=2.0×10⁻³ mol。"}, {"id": "8-33", "lv": 3, "type": "multi", "pick": 2, "q": "硝酸銀水溶液に白金電極を、塩化ナトリウム水溶液に炭素電極を入れ、二つの電解槽を直列に接続して電気分解した。この結果に関する記述として誤りを含むものを、次の①〜⑥のうちから二つ選べ。ただし、解答の順序は問わない。", "opts": ["硝酸銀水溶液側の陰極に銀が析出する", "硝酸銀水溶液側の陽極では酸素が発生する", "塩化ナトリウム水溶液側の陰極にナトリウムが析出する", "塩化ナトリウム水溶液側の陽極では塩素が発生する", "塩化ナトリウム水溶液側は陰極付近が塩基性になる", "硝酸銀水溶液側の陽極付近は塩基性になる"], "ans": [2, 5], "exp": "③Naはイオン化傾向が大きく水溶液からは析出せず、水が還元されてH₂が発生する。⑥陽極では2H₂O→O₂+4H⁺+4e⁻でH⁺が生じ酸性になる。"}], "hot": true}, {"unit": 9, "name": "反応速度と化学平衡", "emoji": "⏱️", "questions": [{"id": "9-01", "lv": 1, "q": "一般に化学反応の速度を大きくする条件として誤りを含むものを、次の①〜④のうちから一つ選べ。", "opts": ["反応物の濃度を大きくする", "温度を高くする", "適切な触媒を加える", "反応物の粒子を大きな塊にする"], "ans": 3, "exp": "固体は細かくして表面積を大きくするほど反応が速くなる。塊にすると遅くなる。"}, {"id": "9-02", "lv": 1, "q": "触媒のはたらきとして正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["活性化エネルギーを小さくして反応を速くする", "反応エンタルピーを小さくする", "平衡を生成物側に移動させる", "反応物の濃度を大きくする"], "ans": 0, "exp": "触媒は活性化エネルギーの小さい別経路を提供する。反応エンタルピーや平衡の位置は変えない。"}, {"id": "9-03", "lv": 1, "q": "温度を上げると反応速度が著しく大きくなる主な理由として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["活性化エネルギー自体が小さくなるから", "反応エンタルピーが大きくなるから", "分子の衝突回数がわずかに増えるから", "活性化エネルギー以上のエネルギーをもつ分子の割合が急激に増えるから"], "ans": 3, "exp": "温度上昇で高エネルギー分子の割合が指数関数的に増え、有効衝突が急増する。"}, {"id": "9-04", "lv": 1, "q": "可逆反応が平衡状態にあるときの説明として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["反応物がすべて生成物に変わっている", "反応物と生成物の濃度が必ず等しい", "正反応も逆反応も完全に停止している", "正反応と逆反応の速さが等しく、見かけ上変化が止まっている"], "ans": 3, "exp": "平衡状態では正逆両反応が同じ速さで進行し続けており、濃度が一定に保たれる(動的平衡)。"}, {"id": "9-05", "lv": 1, "q": "N₂ + 3H₂ ⇌ 2NH₃(ΔH<0)の平衡状態で、温度一定のまま圧力を高くすると平衡はどうなるか。正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["右(NH₃生成)に移動する", "左(NH₃分解)に移動する", "移動しない", "温度によって決まらない"], "ans": 0, "exp": "加圧すると気体分子数が減る方向(左辺4分子→右辺2分子)へ移動する。"}, {"id": "9-06", "lv": 1, "q": "発熱反応(ΔH<0)が平衡状態にあるとき、温度を上げると平衡はどうなるか。正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["移動しない", "圧力によって決まる", "発熱方向(右)に移動する", "吸熱方向(左)に移動する"], "ans": 3, "exp": "温度を上げると、その影響を和らげる吸熱方向へ平衡が移動する(ルシャトリエの原理)。"}, {"id": "9-07", "lv": 1, "q": "平衡状態にある反応に触媒を加えたときの変化として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["平衡が生成物側に移動する", "平衡が反応物側に移動する", "平衡は移動しないが、平衡に達するまでの時間が短くなる", "何の影響もない"], "ans": 2, "exp": "触媒は正逆両反応を同じ割合で速くするため、平衡の位置は変えず到達を速める。"}, {"id": "9-08", "lv": 1, "q": "反応 N₂ + 3H₂ ⇌ 2NH₃ の濃度平衡定数Kの表式として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["K=[NH₃]²/([N₂][H₂]³)", "K=[N₂][H₂]³/[NH₃]²", "K=[NH₃]/([N₂][H₂])", "K=2[NH₃]/([N₂]+3[H₂])"], "ans": 0, "exp": "平衡定数は(生成物の濃度の係数乗の積)/(反応物の濃度の係数乗の積)。"}, {"id": "9-09", "lv": 2, "q": "過酸化水素の分解反応で、H₂O₂の濃度が10秒間で 0.80 mol/L から 0.60 mol/L に減少した。この間の平均分解速度として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["0.0020 mol/(L・s)", "0.020 mol/(L・s)", "0.20 mol/(L・s)", "2.0 mol/(L・s)"], "ans": 1, "exp": "v=(0.80−0.60)/10=0.020 mol/(L・s)。"}, {"id": "9-10", "lv": 2, "q": "ある反応の速度式が v=k[A][B]² で表されるとき、[A]と[B]をともに2倍にすると反応速度は何倍になるか。正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["2倍", "4倍", "6倍", "8倍"], "ans": 3, "exp": "2×2²=8倍。"}, {"id": "9-11", "lv": 2, "q": "一定容積の容器にH₂とI₂を 1.0 mol ずつ入れて高温に保ったところ、H₂ + I₂ ⇌ 2HI の平衡でHIが 1.6 mol 生成していた。この温度での平衡定数Kとして最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["4", "16", "64", "256"], "ans": 2, "exp": "H₂=I₂=1.0−0.80=0.20 mol。K=(1.6)²/(0.20×0.20)=64(体積は約分される)。"}, {"id": "9-12", "lv": 2, "q": "体積一定の容器内で N₂ + 3H₂ ⇌ 2NH₃ が平衡にある。温度一定でアルゴンを加えて全圧を上げたとき、平衡はどうなるか。正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["右に移動する", "左に移動する", "移動しない", "判断できない"], "ans": 2, "exp": "体積一定で貴ガスを加えても各成分の濃度(分圧)は変わらないので、平衡は移動しない。"}, {"id": "9-13", "lv": 2, "q": "0.10 mol/L の酢酸水溶液のpHとして最も適当な数値を、次の①〜④のうちから一つ選べ。酢酸の電離定数を Ka=1.0×10⁻⁵ mol/L とし、電離度は1より十分小さいものとする。", "opts": ["2.0", "3.0", "4.0", "5.0"], "ans": 1, "exp": "[H⁺]=√(cKa)=√(0.10×1.0×10⁻⁵)=1.0×10⁻³ mol/L。pH=3.0。"}, {"id": "9-14", "lv": 2, "q": "酢酸と酢酸ナトリウムの混合水溶液に少量の塩酸を加えてもpHがほとんど変化しない理由として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["加えたH⁺がCH₃COO⁻と反応して酢酸になるから", "加えたH⁺がNa⁺と反応するから", "塩酸が酢酸に溶けないから", "混合溶液中に水が多いから"], "ans": 0, "exp": "緩衝液では、加えたH⁺は多量にあるCH₃COO⁻に吸収され、[H⁺]の変化が抑えられる。"}, {"id": "9-15", "lv": 2, "q": "塩化銀AgClの溶解度積を Ksp=1.8×10⁻¹⁰ (mol/L)² とする。[Cl⁻]=1.8×10⁻² mol/L の水溶液中で溶けることができるAg⁺の濃度として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["1.0×10⁻⁶ mol/L", "1.0×10⁻⁸ mol/L", "1.8×10⁻⁸ mol/L", "1.0×10⁻¹⁰ mol/L"], "ans": 1, "exp": "[Ag⁺]=Ksp/[Cl⁻]=1.8×10⁻¹⁰/1.8×10⁻²=1.0×10⁻⁸ mol/L。"}, {"id": "9-16", "lv": 3, "q": "容器にN₂O₄を 1.0 mol 入れたところ、N₂O₄ ⇌ 2NO₂ の平衡に達し、N₂O₄の20%が解離した。平衡時の気体の全物質量として最も適当な数値を、次の①〜④のうちから一つ選べ。", "opts": ["1.0 mol", "1.1 mol", "1.2 mol", "1.4 mol"], "ans": 2, "exp": "解離したN₂O₄は0.20 mol、生成NO₂は0.40 mol。全量=0.80+0.40=1.2 mol。"}, {"id": "9-17", "lv": 3, "q": "温度T₁とそれより高い温度T₂における分子の運動エネルギー分布を比べたときの記述として最も適当なものを、次の①〜④のうちから一つ選べ。", "opts": ["T₂では活性化エネルギー以上のエネルギーをもつ分子の割合が大きい", "T₂では分布曲線の山が高く、低エネルギー側に寄る", "温度によらず分布は変わらない", "T₂では活性化エネルギーの値そのものが小さくなる"], "ans": 0, "exp": "高温では分布が高エネルギー側に広がり、活性化エネルギーを超える分子の割合が増える。山は低く広くなる。"}, {"id": "9-18", "lv": 3, "q": "アンモニア合成 N₂ + 3H₂ ⇌ 2NH₃(ΔH=−92 kJ)に関する次の記述 a〜c の正誤の組合せとして正しいものを、次の①〜④のうちから一つ選べ。\na 低温ほど平衡時のNH₃の生成率は大きい。\nb 低温ほど平衡に達するまでの時間は短い。\nc 工業的には触媒を用い、適度な高温・高圧で反応させる。", "opts": ["a:誤 b:正 c:誤", "a:誤 b:誤 c:正", "a:正 b:正 c:正", "a:正 b:誤 c:正"], "ans": 3, "exp": "発熱反応なので低温ほど生成率は大きい(a正)が、反応速度は遅くなる(b誤)。実際は触媒(Fe)と適度な温度・高圧で妥協する(c正)。"}, {"id": "9-19", "lv": 3, "q": "酢酸 0.20 mol/L と酢酸ナトリウム 0.10 mol/L を含む緩衝液の水素イオン濃度として最も適当な数値を、次の①〜④のうちから一つ選べ。酢酸の電離定数を Ka=2.0×10⁻⁵ mol/L とする。", "opts": ["1.0×10⁻⁵ mol/L", "2.0×10⁻⁵ mol/L", "4.0×10⁻⁵ mol/L", "8.0×10⁻⁵ mol/L"], "ans": 2, "exp": "[H⁺]=Ka×[CH₃COOH]/[CH₃COO⁻]=2.0×10⁻⁵×(0.20/0.10)=4.0×10⁻⁵ mol/L。"}, {"id": "9-20", "lv": 3, "q": "AgClの溶解度積を Ksp=1.8×10⁻¹⁰ (mol/L)² とする。[Ag⁺]=1.0×10⁻⁵ mol/L と [Cl⁻]=1.0×10⁻⁴ mol/L になるように2つの水溶液を混合したとき(混合による濃度変化は考えない)、沈殿の生成について正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["[Ag⁺][Cl⁻]がKspより大きいので沈殿が生じる", "[Ag⁺][Cl⁻]がKspより小さいので沈殿は生じない", "[Ag⁺][Cl⁻]とKspが等しいので飽和している", "溶解度積からは判断できない"], "ans": 0, "exp": "[Ag⁺][Cl⁻]=1.0×10⁻⁹>Ksp=1.8×10⁻¹⁰ なので、Kspを満たすまでAgClが沈殿する。"}, {"id": "9-21", "lv": 1, "q": "平衡定数Kの値を変化させる条件として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["触媒を加える", "圧力を変える", "温度を変える", "濃度を変える"], "ans": 2, "exp": "平衡定数は温度だけで決まる。濃度や圧力を変えると平衡は移動するがKの値は変わらない。"}, {"id": "9-22", "lv": 1, "q": "ある発熱反応(ΔH<0)について、正反応の活性化エネルギーを E₁、逆反応の活性化エネルギーを E₂ とするとき、正しい関係を、次の①〜④のうちから一つ選べ。", "opts": ["E₁ > E₂", "E₁ = E₂", "反応によって決まらない", "E₁ < E₂"], "ans": 3, "exp": "発熱反応では生成物のエンタルピーが低いため、逆反応の山(E₂)の方が高い。E₂−E₁=|ΔH|。"}, {"id": "9-23", "lv": 1, "q": "25℃の純水に関する記述として正しいものを、次の①〜④のうちから一つ選べ。", "opts": ["[H⁺]=[OH⁻]=1.0×10⁻⁷ mol/L である", "[H⁺]=0 である", "[H⁺][OH⁻]=1.0×10⁻⁷ (mol/L)² である", "pH=14 である"], "ans": 0, "exp": "水はわずかに電離しており、25℃では[H⁺]=[OH⁻]=10⁻⁷ mol/L、Kw=10⁻¹⁴ (mol/L)²。"}, {"id": "9-24", "lv": 1, "q":
